tion-colors",children:"← Back"})}const RT=JSON.stringify({title:"Business English: Meetings & Negotiations",description:"A comprehensive lesson on professional communication for B2 learners",sections:[{title:"Foundations",colour:"#58CC02",xpReward:120,slides:[{heading:"Meeting Vocabulary",body:"In business meetings, precision and politeness are essential. Key phrases include: 'to table an item' (UK: to postpone; US: to put forward), 'to take the minutes', 'to reach a consensus', and 'to adjourn a meeting'.",example:"Shall we table this item until next week?"},{heading:"Grammar: Modal Verbs for Proposals",body:"Use modal verbs to make polite suggestions and proposals. 'Could you...?', 'Would it be possible to...?', 'We might consider...' are all softer than direct imperatives.",example:"Could you send the report by Friday?"},{heading:"Pronunciation: Word Stress",body:"Correct word stress changes meaning. 'REcord' (noun) vs 're-CORD' (verb). In meetings, stress key words to emphasise your point clearly.",example:"We need to reCORD the minutes accurately."}],activities:[{type:"matching",title:"Meeting Vocabulary Match",skillLabel:"Vocabulary",skillIcon:"📚",mode:"in-class",content:JSON.stringify([{word:"Agenda",definition:"A list of items to be discussed at a meeting",feedback:"An 'agenda' comes from Latin meaning 'things to be done'. Always circulate the agenda before a meeting so participants can prepare."},{word:"Minutes",definition:"The official written record of a meeting",feedback:"'Minutes' in this context has nothing to do with time. It comes from Latin 'minuta scriptura' (small writing). The secretary usually takes the minutes."},{word:"Adjourn",definition:"To officially end or pause a meeting until a later time",feedback:"'Adjourn' means to suspend proceedings. 'The meeting was adjourned until Tuesday' means it will continue on Tuesday, not that it ended permanently."},{word:"Consensus",definition:"General agreement reached by a group",feedback:"Consensus does NOT mean unanimous — it means most people agree. 'We reached a consensus' is stronger than 'some people agreed'."},{word:"Quorum",definition:"The minimum number of members needed to conduct business",feedback:"'Without a quorum, the vote is invalid.' Quorum comes from Latin and is essential in formal meetings and board decisions."},{word:"Action point",definition:"A task assigned to a person with a deadline",feedback:"Action points are the practical outcomes of meetings. Each one should have a responsible person and a deadline: 'Maria to send report by Friday.'"}])},{type:"scramble",title:"Unscramble Meeting Phrases",skillLabel:"Grammar",skillIcon:"✏️",mode:"in-class",content:JSON.stringify([{chunks:["Could we","move on to","the next item","on the agenda?"],answer:"Could we move on to the next item on the agenda?",feedback:"'Could we + infinitive' is a polite way to make suggestions in meetings. It is less direct than 'Let's move on' and more professional."},{chunks:["I'd like to","draw your attention to","the figures","in section three."],answer:"I'd like to draw your attention to the figures in section three.",feedback:"'Draw your attention to' is a formal presentation phrase. It signals that important information follows and invites the listener to focus."},{chunks:["As far as I'm concerned,","the deadline","should be","extended by two weeks."],answer:"As far as I'm concerned, the deadline should be extended by two weeks.",feedback:"'As far as I'm concerned' expresses a personal opinion diplomatically. It is softer than 'I think' and signals that others may disagree."},{chunks:["We need to","reach a consensus","before we","can proceed."],answer:"We need to reach a consensus before we can proceed.",feedback:"'Reach a consensus' is a fixed collocation. Notice 'reach' not 'make' or 'get'. This phrase is common in formal business contexts."},{chunks:["The meeting","will be adjourned","until","Thursday morning."],answer:"The meeting will be adjourned until Thursday morning.",feedback:"'Adjourn until' uses the passive voice with 'will be'. This formal structure is typical in official minutes and board meetings."},{chunks:["I move that","we accept","the proposal","as presented."],answer:"I move that we accept the proposal as presented.",feedback:"'I move that' is a formal parliamentary phrase used to propose a motion for vote. It must be seconded before discussion begins."}])},{type:"pronunciation",title:"Business Pronunciation Practice",skillLabel:"Pronunciation",skillIcon:"🎤",mode:"in-class",content:JSON.stringify([{sentence:"Could we schedule a follow-up meeting for next Wednesday?",phonetic:"/kʊd wiː ˈʃedjuːl ə ˈfɒləʊ ʌp ˈmiːtɪŋ fər nekst ˈwenzdeɪ/",tip:"Stress 'schedule' on the first syllable: SCHED-ule. British English: /ˈʃedjuːl/; American: /ˈskedʒuːl/.",feedback:"In connected speech, 'Could we' often sounds like /kʊdwi/. Practice linking words together for natural flow."},{sentence:"The quarterly results exceeded our projections significantly.",phonetic:"/ðə ˈkwɔːtəli rɪˈzʌlts ɪkˈsiːdɪd aʊə prəˈdʒekʃənz sɪɡˈnɪfɪkəntli/",tip:"Stress 'ex-CEED-ed' and 'sig-NIF-i-cant-ly'. These are high-frequency business words worth practising.",feedback:"'Quarterly' means every three months (Q1, Q2, Q3, Q4). Stress is on the first syllable: QUA-rt-erly."},{sentence:"I'd like to table the discussion on the merger for now.",phonetic:"/aɪd laɪk tə ˈteɪbl̩ ðə dɪˈskʌʃn̩ ɒn ðə ˈmɜːdʒər fər naʊ/",tip:"Note the contracted form 'I'd like' = 'I would like'. Practice the schwa /ə/ in unstressed syllables.",feedback:"'Table' has opposite meanings in UK vs US English! UK: postpone. US: bring forward for discussion. Know your audience!"},{sentence:"We should prioritise the most urgent action points first.",phonetic:"/wiː ʃʊd praɪˈɒrɪtaɪz ðə məʊst ˈɜːdʒənt ˈækʃən pɔɪnts fɜːst/",tip:"British spelling: 'prioritise'. American: 'prioritize'. Both pronunciations are identical. Stress: pri-OR-i-tise.",feedback:"'Prioritise' means to decide the order of importance. In meetings, prioritising action points ensures the most critical tasks are addressed first."},{sentence:"The stakeholders have approved the new strategic initiative.",phonetic:"/ðə ˈsteɪkhəʊldərz həv əˈpruːvd ðə njuː strəˈtiːdʒɪk ɪˈnɪʃɪətɪv/",tip:"'Strategic' is stressed on the second syllable: stra-TE-gic. 'Initiative' has five syllables: i-NI-ti-a-tive.",feedback:"'Stakeholders' are all people with an interest in the business outcome — staff, investors, clients. This is key B2 business vocabulary."},{sentence:"Let's ensure all deliverables are completed by the deadline.",phonetic:"/lets ɪnˈʃʊər ɔːl dɪˈlɪvərəblz ər kəmˈpliːtɪd baɪ ðə ˈdedlaɪn/",tip:"'Deliverables' — stress the second syllable: de-LIV-er-ables. This is a key project management term.",feedback:"'Deliverables' are the specific outputs or results that must be produced. Using this word shows C1 professional vocabulary."}])},{type:"true_false",title:"Listening Comprehension",skillLabel:"Listening",skillIcon:"👂",mode:"homework",content:JSON.stringify([{statement:"In UK English, 'to table an item' means to bring it forward for immediate discussion.",isTrue:!1,audioScript:"In UK English, to table an item means to postpone it for a later date, whereas in American English, tabling an item means to bring it forward for discussion. This is a common source of confusion in international meetings.",feedback:"FALSE. This is a classic British vs American English difference. In UK English: 'table' = postpone. In US English: 'table' = discuss now. Always clarify which convention you are using in international meetings."},{statement:"A quorum is the minimum number of members required for a meeting to be valid.",isTrue:!0,audioScript:"A quorum is the minimum number of members who must be present at a meeting for the proceedings to be officially valid and for decisions to be legally binding. Without a quorum, any votes taken are not considered official.",feedback:"TRUE. Quorum requirements vary by organisation. Board meetings often require a majority of directors present. This term comes from Latin: 'of whom' — referring to specific required members."},{statement:"Action points should always be vague to allow flexibility.",isTrue:!1,audioScript:"Effective action points must be specific, measurable, and time-bound. A good action point includes who is responsible, exactly what needs to be done, and a clear deadline. Vague action points lead to confusion and missed deadlines.",feedback:"FALSE. Effective action points follow the SMART principle: Specific, Measurable, Achievable, Relevant, Time-bound. Example: 'John to send budget report to all directors by Friday 5pm' — not 'John to sort out the money stuff'."},{statement:"The minutes of a meeting are typically written by the chairperson.",isTrue:!1,audioScript:"The minutes of a meeting are usually taken and written by the secretary or a designated minute-taker, not the chairperson. The chairperson's role is to facilitate discussion and ensure the agenda is followed, while the secretary records the proceedings.",feedback:"FALSE. The chairperson facilitates the meeting. The secretary (or minute-taker) records the minutes. This separation allows the chairperson to focus entirely on managing the discussion."},{statement:"Consensus means that every single person must agree completely.",isTrue:!1,audioScript:"Consensus does not require unanimous agreement. It means that a general agreement has been reached that most members can accept and support, even if it is not everyone's first preference. It is about finding common ground rather than total unanimity.",feedback:"FALSE. Consensus ≠ unanimous. Unanimity means everyone agrees. Consensus means general agreement, often involving compromise. 'We reached a consensus' implies most people support the decision, though some may have reservations."},{statement:"To adjourn a meeting means to formally end or suspend it.",isTrue:!0,audioScript:"To adjourn a meeting means to officially suspend or end the meeting, either permanently or temporarily until a specified future date. The chairperson typically adjourns the meeting once all agenda items have been covered or time has run out.",feedback:"TRUE. 'The meeting is adjourned' = officially ended/paused. If adjourned to a specific time, it resumes then. 'Sine die' (Latin) means adjourned with no future date set — essentially ended permanently."}])},{type:"multiple_choice",title:"Reading Comprehension",skillLabel:"Reading",skillIcon:"📖",mode:"homework",content:JSON.stringify([{question:"According to the passage, what is the primary purpose of circulating an agenda before a meeting?",context:"An agenda is a structured list of items to be discussed during a meeting. Effective meeting management requires that the agenda be distributed to all participants at least 24 hours in advance. This preparation time allows attendees to gather relevant information, formulate their positions, and contribute meaningfully to the discussion. Without a pre-circulated agenda, meetings tend to lack focus, run over time, and produce fewer actionable outcomes. The chairperson uses the agenda as a roadmap to keep discussions on track and ensure all important matters are addressed within the allocated time.",options:["To give participants time to prepare","To limit the number of attendees","To replace the need for minutes","To set the meeting duration"],answer:"To give participants time to prepare",feedback:"The passage clearly states that distribution 'allows attendees to gather relevant information, formulate their positions, and contribute meaningfully.' Reading comprehension tip: always look for explicit cause-and-effect language like 'allows', 'enables', 'leads to'."},{question:"What does the passage suggest about meetings held without a pre-circulated agenda?",context:"Research into meeting effectiveness consistently shows that unplanned meetings — those held without a distributed agenda — result in significantly lower productivity. Participants arrive unprepared, discussions frequently digress from the core issues, and the absence of a clear framework means that action points are often poorly defined. A study of 500 managers found that 67% considered unplanned meetings to be the biggest time-waster in their working week. In contrast, well-structured meetings with clear agendas were rated as highly valuable by 89% of participants.",options:["They are more creative and flexible","They waste time and produce poor outcomes","They are preferred by senior managers","They lead to better consensus"],answer:"They waste time and produce poor outcomes",feedback:"The passage states meetings without agendas 'tend to lack focus, run over time, and produce fewer actionable outcomes.' Reading tip: Questions asking what the passage 'suggests' may require inference, but here the answer is directly stated."},{question:"Which phrase best describes the role of a chairperson according to the passage?",context:"The chairperson holds a unique position of authority and responsibility within a meeting. Their primary function is not to dominate discussion but to facilitate it — ensuring all voices are heard, keeping debate focused on agenda items, and moving the meeting forward when discussions become repetitive or unproductive. A skilled chairperson remains impartial, summarises key points, manages time effectively, and ensures that decisions are clearly communicated before moving to the next item. They also have the authority to adjourn the meeting when necessary.",options:["To record all decisions in writing","To make all final decisions alone","To facilitate and manage the meeting","To represent only senior management"],answer:"To facilitate and manage the meeting",feedback:"The passage explicitly says the chairperson's role is 'to facilitate it'. Key reading strategy: identify the main verb or descriptor used in the passage for the subject in question. Here: 'facilitate' is the keyword."},{question:"In the passage, what does 'sine die' mean?",context:"When a meeting is adjourned 'sine die', it is suspended without any specified future date for resumption. This Latin phrase, meaning 'without day', is used in formal and legal contexts to indicate that proceedings have been indefinitely suspended. Unlike a standard adjournment — which might specify 'adjourned until next Tuesday' — a sine die adjournment carries no expectation of continuation. Parliaments may be prorogued sine die, and legal cases may be dismissed sine die when no further proceedings are planned.",options:["Adjourned until tomorrow","Ended with a fixed future date","Suspended indefinitely with no future date","Cancelled due to lack of quorum"],answer:"Suspended indefinitely with no future date",feedback:"'Sine die' is defined in the passage as 'without day' — meaning no future date is set. Vocabulary strategy: context clues are provided ('suspended without any specified future date'). Use context definitions when you encounter Latin or technical terms."},{question:"What percentage of managers in the study found unplanned meetings to be the biggest time-waster?",context:"Research into meeting effectiveness consistently shows that unplanned meetings — those held without a distributed agenda — result in significantly lower productivity. Participants arrive unprepared, discussions frequently digress from the core issues, and the absence of a clear framework means that action points are often poorly defined. A study of 500 managers found that 67% considered unplanned meetings to be the biggest time-waster in their working week. In contrast, well-structured meetings with clear agendas were rated as highly valuable by 89% of participants.",options:["45%","67%","89%","72%"],answer:"67%",feedback:"The passage clearly states '67% considered unplanned meetings to be the biggest time-waster.' Reading tip: For percentage/number questions, scan (move your eyes quickly) for numerals. Note the contrast: 67% dislike unplanned meetings; 89% value well-structured ones."},{question:"Which word in the passage is closest in meaning to 'digress'?",context:"Participants arrive unprepared, discussions frequently digress from the core issues, and the absence of a clear framework means that action points are often poorly defined. Effective chairpersons prevent this by refocusing discussions and redirecting conversation back to the agenda. Skilled facilitators use phrases like 'That's an interesting point — let's add it to any other business' to acknowledge a comment without allowing it to derail the main discussion.",options:["Focus","Stray off-topic","Accelerate","Conclude"],answer:"Stray off-topic",feedback:"To 'digress' means to stray from the main topic. The context clue is that discussions 'digress from the core issues' — they move away from the important subjects. Opposite: to 'stay on track', 'remain focused'."}])},{type:"dictation",title:"Business Dictation",skillLabel:"Writing",skillIcon:"✍️",mode:"homework",content:JSON.stringify([{audioScript:"Could we please move on to the next item on the agenda?",answer:"Could we please move on to the next item on the agenda?",feedback:"This is a polite meeting phrase using 'Could we' for suggestions. Notice the comma is not needed here. The phrase 'move on to' is a phrasal verb meaning 'proceed to'. Alternative: 'Shall we turn to the next point?'"},{audioScript:"The meeting was adjourned until the following Tuesday at ten o'clock.",answer:"The meeting was adjourned until the following Tuesday at ten o'clock.",feedback:"Passive voice: 'was adjourned' — the meeting is the subject receiving the action. 'Until' + time expression. Note: 'the following Tuesday' (not 'next') is used in formal minutes to avoid ambiguity."},{audioScript:"All action points must be completed before the deadline.",answer:"All action points must be completed before the deadline.",feedback:"Modal verb 'must' expresses strong obligation. Passive infinitive: 'be completed'. 'Before the deadline' is a time clause. In formal writing, 'must be completed' is preferred over 'need to be done'."},{audioScript:"I would like to draw your attention to the figures in section three.",answer:"I would like to draw your attention to the figures in section three.",feedback:"'I would like to' is more formal than 'I want to'. 'Draw your attention to' is a fixed phrase. Note the number 'three' is written as a word in formal text, though numerals (3) are also acceptable in business writing."},{audioScript:"We need to reach a consensus before we can proceed with the vote.",answer:"We need to reach a consensus before we can proceed with the vote.",feedback:"'Reach a consensus' — 'reach' is the correct verb (not 'make' or 'get'). 'Before we can proceed' uses the present tense after 'before' to refer to a future condition. 'The vote' uses the definite article because it refers to a specific vote."},{audioScript:"The stakeholders have approved the new initiative unanimously.",answer:"The stakeholders have approved the new initiative unanimously.",feedback:"Present perfect: 'have approved' — recent completion with current relevance. 'Unanimously' means everyone agreed without exception. Adverb placement: at the end of the clause for natural flow in formal English."}])}]},{title:"Integrated Skills",colour:"#1CB0F6",xpReward:150,slides:[{heading:"Negotiation Language",body:"Successful negotiators use hedging language to soften positions and create room for compromise. Key phrases: 'We could perhaps consider...', 'Would you be open to...?', 'That might be difficult, however...'",example:"Would you be open to a three-month trial period?"},{heading:"Connecting Ideas",body:"Use discourse markers to signal your intentions: 'However' (contrast), 'Moreover' (addition), 'Nevertheless' (concession), 'As a result' (consequence).",example:"The budget is tight; however, we could phase the implementation."}],activities:[{type:"audio_matching",title:"Listen & Match Definitions",skillLabel:"Vocabulary + Listening",skillIcon:"🎧",mode:"in-class",content:JSON.stringify([{word:"Deadlock",audioScript:"A deadlock occurs when two parties in a negotiation are unable to reach an agreement because neither side is willing to compromise.",definition:"A situation where no progress can be made",feedback:"'Deadlock' is a compound noun. In business: a negotiation deadlock means talks have stalled. Synonym: 'impasse'. To 'break the deadlock' means to find a solution that moves things forward."},{word:"Concession",audioScript:"Making a concession means giving up something you want in order to reach an agreement with the other party.",definition:"Something given up to reach an agreement",feedback:"'Concession' comes from Latin 'concedere' (to yield). In negotiations: 'We made a concession on price in exchange for a longer contract.' Plural: 'concessions'. Not the same as 'confession'!"},{word:"Leverage",audioScript:"Leverage in a business context refers to the power or advantage you have in a negotiation that helps you achieve a better outcome.",definition:"Power or advantage used in negotiations",feedback:"'Leverage' (noun/verb) is used metaphorically from physics (a lever multiplies force). 'We used our large order as leverage to negotiate a discount.' Business collocation: 'negotiating leverage', 'to leverage an advantage'."},{word:"Counter-offer",audioScript:"When you receive an offer you are not happy with, you make a counter-offer, which is a new proposal in response to the original one.",definition:"A new proposal made in response to a previous offer",feedback:"Counter-offer follows a predictable negotiation pattern: offer → counter-offer → (counter-counter-offer) → agreement. The prefix 'counter-' means 'in response to' or 'opposing'. Other examples: counter-argument, counter-proposal."},{word:"Bottom line",audioScript:"The bottom line is the minimum acceptable outcome or the final financial result. If someone says that's their bottom line, they will not go lower.",definition:"The minimum acceptable condition or final outcome",feedback:"'Bottom line' has two meanings: (1) financial: the net profit/loss figure at the bottom of a financial statement; (2) negotiation: the absolute minimum you will accept. 'That's my bottom line' = 'I won't go any further than this'."},{word:"Win-win",audioScript:"A win-win outcome is one where both parties in a negotiation feel satisfied with the result, as both sides have gained something of value.",definition:"An outcome where both parties benefit",feedback:"'Win-win' contrasts with 'win-lose' (zero-sum) or 'lose-lose' outcomes. Modern negotiation theory (Fisher & Ury's 'Getting to Yes') emphasises finding win-win solutions through interest-based bargaining."}])},{type:"cloze",title:"Fill in the Negotiation Gaps",skillLabel:"Grammar + Writing",skillIcon:"✏️",mode:"homework",content:JSON.stringify([{sentence:"We've reached a ___ on the price, so let's take a short break.",blanks:["deadlock"],context:"Two companies have been negotiating a contract for two hours. Neither side has moved from their initial position on the budget.",feedback:"'Reached a deadlock' is the correct collocation — not 'got a deadlock' or 'arrived at a blockage'. Deadlock = situation where no agreement is possible. Synonym: impasse. The meeting continues after the break with new proposals."},{sentence:"If you can ___ on delivery time, we can meet your price.",blanks:["concede"],context:"A buyer is negotiating with a supplier. The supplier wants a higher price; the buyer wants faster delivery. They are looking for a compromise.",feedback:"'Concede' (verb) = to give up something in negotiations. 'Concession' is the noun form. 'If you can concede on X, we can offer Y' is a classic conditional bargaining structure using the first conditional (If + present, can + infinitive)."},{sentence:"Our large order gives us considerable ___ in this negotiation.",blanks:["leverage"],context:"A company is ordering 10,000 units from a supplier for the first time. Their procurement manager is negotiating price and terms.",feedback:"'Leverage' as a noun (uncountable here) = negotiating power. 'Considerable leverage' = significant power. The large order size is their bargaining chip — a 'bargaining chip' is something you offer or threaten to withhold to gain advantage."},{sentence:"Their offer was too low, so we made a ___.",blanks:["counter-offer"],context:"A freelance consultant has received an offer of £200/day from a client. The consultant believes the rate is below market value for their expertise.",feedback:"'Made a counter-offer' is the correct verb collocation (not 'did' or 'gave'). A counter-offer is a response to an unsatisfactory offer. Pattern: receive offer → evaluate → make counter-offer. The hyphen in 'counter-offer' is standard in British English."},{sentence:"We've been very flexible, but reducing costs by 30% is our ___.",blanks:["bottom line"],context:"A company is negotiating a cost-reduction agreement with a contractor. They have already agreed to extend the timeline and reduce scope, but need to cut costs significantly.",feedback:"'Bottom line' here means the absolute minimum requirement. Grammar note: 'is our bottom line' uses the predicative position. You can also say 'our bottom line is...' This idiom originates from accounting, where the bottom line of a financial statement shows net profit/loss."},{sentence:"The final agreement was a ___ — both companies got what they needed.",blanks:["win-win"],context:"After three rounds of negotiation, Company A agreed to a bulk discount, and Company B agreed to a 12-month exclusivity clause. Both sides felt satisfied with the outcome.",feedback:"'Win-win' is a compound adjective used predicatively ('was a win-win') or attributively ('a win-win outcome/situation/deal'). Contrast with 'zero-sum' (one side's gain = other's loss). Win-win solutions require creativity and understanding both parties' interests."}])},{type:"true_false",title:"Reading + Listening Check",skillLabel:"Reading + Listening",skillIcon:"👁️",mode:"homework",content:JSON.stringify([{statement:"A win-win negotiation outcome means one party gets everything they wanted.",isTrue:!1,context:"Win-win negotiations, also known as integrative bargaining, aim to create value for all parties involved. Unlike distributive (win-lose) bargaining where one party's gain is another's loss, integrative approaches seek creative solutions that satisfy the core interests of both sides. This requires open communication, trust, and a willingness to understand the other party's underlying needs rather than just their stated positions.",audioScript:"A win-win outcome in negotiation does not mean one party gets everything. It means both parties feel satisfied with the result, having each gained something of value through compromise and creative problem-solving.",feedback:"FALSE. 'Win-win' means BOTH parties benefit. The passage states it aims to 'create value for all parties involved'. The opposite — where one party gets everything — is called 'win-lose' or 'zero-sum' bargaining."},{statement:"Leverage refers to the power or advantage a party holds in a negotiation.",isTrue:!0,context:"In business negotiations, leverage refers to any advantage that strengthens your bargaining position. This could include the size of your order, alternative options available to you, time pressure on the other party, specialised knowledge, or a strong relationship. The party with more leverage typically achieves better outcomes, though skilled negotiators can often compensate for less leverage through creativity and relationship-building.",audioScript:"Leverage in negotiations is the power or advantage that one party holds over another. A company that is the sole supplier of a critical component, for example, has significant leverage over its buyers.",feedback:"TRUE. The passage defines leverage as 'any advantage that strengthens your bargaining position.' Examples include order size, alternatives, time pressure, and specialist knowledge. Understanding leverage helps you assess your negotiating strength realistically."},{statement:"In integrative bargaining, parties focus only on their stated positions.",isTrue:!1,context:"Integrative bargaining, the foundation of win-win negotiation, requires looking beyond stated positions to understand underlying interests. A position is what someone says they want; an interest is why they want it. For example, a position might be 'I need a 20% discount', but the underlying interest might be 'I need to stay within budget'. Understanding this distinction allows negotiators to find creative solutions that address actual needs.",audioScript:"Integrative bargaining requires negotiators to focus on underlying interests rather than stated positions. A position is what you say you want; an interest is why you want it. Understanding this distinction is the key to finding win-win solutions.",feedback:"FALSE. Integrative bargaining explicitly looks BEYOND stated positions to 'underlying interests'. This is the key concept from Fisher & Ury's 'Getting to Yes'. Position: 'I want X'. Interest: 'I need X because...' — understanding 'because' enables creative solutions."},{statement:"A counter-offer is made when you are satisfied with an initial offer.",isTrue:!1,context:"A counter-offer is a response to an initial offer that proposes different terms, typically because the recipient finds the original offer unsatisfactory. Making a counter-offer keeps negotiations alive without outright rejection. Skilled negotiators always aim to counter rather than simply reject, as rejection closes doors while counter-offers maintain dialogue and signal continued interest in reaching an agreement.",audioScript:"A counter-offer is made when you are NOT satisfied with an initial offer. Rather than simply rejecting the offer, you propose different terms. This keeps the negotiation moving forward and shows that you are still interested in reaching a deal.",feedback:"FALSE. Counter-offers are made specifically when you are DISSATISFIED with an offer. The passage says it's 'because the recipient finds the original offer unsatisfactory.' Counter-offering is strategically smarter than rejecting outright because it keeps dialogue alive."},{statement:"Breaking a deadlock often requires creative thinking and new proposals.",isTrue:!0,context:"When negotiations reach a deadlock, experienced negotiators know that continuing to push the same positions will not help. Breaking a deadlock typically requires introducing new variables, changing the scope of the negotiation, bringing in a mediator, or taking a break to allow emotions to cool. Creativity and flexibility are essential: sometimes a completely different package — changing payment terms, timelines, or deliverables — can unlock a previously impossible situation.",audioScript:"Breaking a deadlock in negotiations typically requires creative thinking, introducing new variables, or changing the scope of what's being negotiated. Simply restating your original position more forcefully rarely breaks a deadlock.",feedback:"TRUE. The passage confirms that breaking deadlocks 'typically requires introducing new variables, changing the scope... Creativity and flexibility are essential.' Grammar note: 'breaking a deadlock' = gerund as subject, describing the general action."},{statement:"A party's 'bottom line' represents their maximum acceptable offer.",isTrue:!1,context:"In negotiation terminology, the 'bottom line' refers to the minimum acceptable outcome — the point below which a deal is not worthwhile. It is the worst acceptable agreement, sometimes called the BATNA boundary (Best Alternative To a Negotiated Agreement). If any offer falls below your bottom line, it is better to walk away than to accept. Knowing your bottom line before entering negotiations is essential for effective decision-making under pressure.",audioScript:"The bottom line in negotiation is the minimum acceptable outcome, not the maximum. It is the lowest point you will go to. If an offer goes below your bottom line, it is better to walk away from the deal entirely.",feedback:"FALSE. Bottom line = MINIMUM, not maximum. The passage: 'the minimum acceptable outcome — the point below which a deal is not worthwhile.' BATNA (Best Alternative To a Negotiated Agreement) is the related concept — your best option if talks fail."}])},{type:"multiple_choice",title:"Speaking: Choose the Best Response",skillLabel:"Speaking",skillIcon:"💬",mode:"in-class",content:JSON.stringify([{question:"Your colleague says: 'I'm afraid that deadline is simply impossible.' How do you best respond professionally?",audioScript:"I'm afraid that deadline is simply impossible for our team. We have three other projects running simultaneously, and we cannot commit to delivering by the end of this month.",options:["'That's your problem, not mine.'","'I understand your concern. Could we perhaps discuss a phased delivery approach?'","'Fine, forget the deadline then.'","'You're wrong, it's completely possible.'"],answer:"'I understand your concern. Could we perhaps discuss a phased delivery approach?'",feedback:"The correct response acknowledges the concern ('I understand') and proposes a constructive alternative ('phased delivery'). In professional communication, always validate before proposing solutions. The other options are dismissive, defeatist, or confrontational — none suitable for a professional context."},{question:"Your manager asks: 'Can you give us an update on the Henderson account?' You are not fully prepared. What do you say?",audioScript:"Could you give us an update on the Henderson account at today's meeting? We have the client calling us this afternoon and I want to be fully briefed.",options:["'I haven't had time to look at it.'","'I'll have a full update ready — can I send it to you by eleven so you have it before the call?'","'Why didn't you tell me earlier?'","'Henderson is fine. Everything's under control.'"],answer:"'I'll have a full update ready — can I send it to you by eleven so you have it before the call?'",feedback:"The best answer is proactive and solution-focused. It commits to a specific action and time ('by eleven') and connects it to the manager's need ('before the call'). Avoid vague reassurances ('everything's under control') or blame-shifting — these damage trust in professional settings."},{question:"A client says: 'Your competitor is offering the same service for 20% less.' How do you respond?",audioScript:"We've had a meeting with your competitors this morning, and they are offering what appears to be the same service package for twenty percent below your current price. We need to justify the difference or we'll have to consider switching.",options:["'Then go with them if you want.'","'Our price is fixed and non-negotiable.'","'I appreciate you sharing that. Could we look at the full value package together — including our after-sales support and guaranteed response times?'","'Their quality is much worse, trust me.'"],answer:"'I appreciate you sharing that. Could we look at the full value package together — including our after-sales support and guaranteed response times?'",feedback:"This response uses three key techniques: (1) acknowledgement ('I appreciate'), (2) value-based selling (shifting from price to total value), (3) collaborative framing ('together'). Never dismiss competitors rudely — focus on differentiating through value, not attacking the competition."},{question:"In a meeting, someone makes a point you strongly disagree with. What is the most professional way to respond?",audioScript:"I believe we should cut the marketing budget entirely and focus all resources on product development. Marketing hasn't shown a clear return on investment this quarter.",options:["'That's completely wrong and shows poor understanding.'","'I take your point, though I'd like to suggest that the data shows marketing ROI over 12 months, not single quarters. Could we look at the annual figures?'","'Whatever, let's just vote on it.'","'I agree completely.' (even though you don't)"],answer:"'I take your point, though I'd like to suggest that the data shows marketing ROI over 12 months, not single quarters. Could we look at the annual figures?'",feedback:"The model answer uses 'I take your point' (acknowledgement) + 'though' (soft contrast) + evidence ('the data shows') + a question (collaborative). This is the DESC technique: Describe, Express, Specify, Consequences. Never agree when you disagree — it damages your credibility. Never attack personally."},{question:"You want to propose that the project deadline be extended by two weeks. How do you phrase this most effectively?",audioScript:"We need to discuss the project timeline. The current deadline is creating significant pressure on the team, and I want to propose an adjustment. How would you like me to proceed?",options:["'The deadline needs to change. Two more weeks.'","'I was wondering if we might explore the possibility of extending the deadline by two weeks to ensure quality delivery?'","'Can we delay everything?'","'The deadline is unrealistic. Someone made a mistake.'"],answer:"'I was wondering if we might explore the possibility of extending the deadline by two weeks to ensure quality delivery?'",feedback:"This response uses maximum hedging: 'I was wondering' (tentative past continuous), 'if we might' (conditional modal), 'explore the possibility' (open-ended framing). The justification ('to ensure quality delivery') is client-focused, not team-focused. B2 tip: the more hedged, the more professional the request sounds in formal contexts."},{question:"A colleague interrupts you while you are presenting. How do you politely reclaim the floor?",audioScript:"Sorry to interrupt, but I think there's an important point here about the figures. The numbers you're showing don't match what was in the report we received last week.",options:["'Be quiet, I'm talking!'","'If I could just finish this point, and then I'd be very happy to address your question?'","'OK fine, you speak instead.'","'I don't care about your point.'"],answer:"'If I could just finish this point, and then I'd be very happy to address your question?'",feedback:"'If I could just finish this point' is a polite but firm way to reclaim the floor. The second part ('I'd be very happy to address your question') shows respect and willingness to engage — it's not a rejection, it's a deferral. This is essential presentation and meeting etiquette at B2+."}])},{type:"scramble",title:"Advanced Sentence Scramble",skillLabel:"Grammar + Syntax",skillIcon:"🔀",mode:"homework",content:JSON.stringify([{chunks:["Although the initial offer","was below our expectations,","we were able to","negotiate a satisfactory outcome."],answer:"Although the initial offer was below our expectations, we were able to negotiate a satisfactory outcome.",feedback:"'Although' introduces a concessive clause (unexpected contrast). Structure: Although + clause, main clause. Note the comma before the main clause. Synonym: 'Even though'. This is a complex sentence typical of B2 formal writing."},{chunks:["Had we known","about the competitor's offer earlier,","we would have","adjusted our pricing strategy."],answer:"Had we known about the competitor's offer earlier, we would have adjusted our pricing strategy.",feedback:"This is the third conditional (inverted/formal). 'Had we known' = 'If we had known'. Inversion of 'had' is formal and common in business writing. Result: 'would have + past participle'. This structure expresses regret about a past situation."},{chunks:["Not only did the team","meet the deadline,","but they also","exceeded the quality targets."],answer:"Not only did the team meet the deadline, but they also exceeded the quality targets.",feedback:"'Not only...but also' is a correlative conjunction. When 'Not only' begins a sentence, the subject-verb order inverts: 'did the team' (not 'the team did'). This inversion makes the sentence more emphatic and formal — typical of B2+ presentations."},{chunks:["The proposal,","which had been drafted","over three weeks,","was rejected at the last minute."],answer:"The proposal, which had been drafted over three weeks, was rejected at the last minute.",feedback:"This contains a non-defining relative clause ('which had been drafted over three weeks') set off by commas. 'Which' (not 'that') is used in non-defining clauses. Past perfect passive: 'had been drafted' — the drafting happened before the rejection."},{chunks:["Provided that both parties","agree to the terms,","the contract will be","signed on Friday."],answer:"Provided that both parties agree to the terms, the contract will be signed on Friday.",feedback:"'Provided that' = 'on condition that' — a formal conditional connector. First conditional structure: present tense in condition clause, future in result clause. 'Provided that' is more formal than 'if' and implies a specific condition is necessary."},{chunks:["Despite the tight budget,","the marketing team","managed to deliver","an impressive campaign."],answer:"Despite the tight budget, the marketing team managed to deliver an impressive campaign.",feedback:"'Despite' + noun phrase (no verb). Compare: 'Despite the budget being tight' or 'Although the budget was tight'. 'Managed to' implies success despite difficulty — it carries a sense of achievement that 'was able to' sometimes lacks."}])}]},{title:"Complex Integration",colour:"#FF9600",xpReward:180,slides:[{heading:"Complex Discourse",body:"At B2-C1 level, you must integrate reading, listening, and writing skills simultaneously. Complex texts require you to identify main ideas, infer meaning, and respond critically.",example:"The author implies (not states) that remote work reduces productivity."},{heading:"Advanced Grammar: Inversion",body:"Formal English uses inverted structures for emphasis. 'Never have I seen such dedication.' 'Not only did we win, but we also set a record.'",example:"Rarely does a candidate impress us this much."}],activities:[{type:"cloze",title:"Integrated Skills Gap Fill",skillLabel:"Integrated Skills",skillIcon:"🧩",mode:"in-class",content:JSON.stringify([{sentence:"The chairperson called for a ___ vote, and the motion was carried ___.",blanks:["show-of-hands","unanimously"],context:"During the annual general meeting, the shareholders needed to vote on whether to approve the new dividend policy. The chairperson chose the simplest voting method before announcing the result.",audioScript:"The chairperson called for a show-of-hands vote on the dividend proposal. Every single shareholder raised their hand in favour, and the motion was carried unanimously without a single dissenting vote.",feedback:"'Show of hands' is a compound noun (hyphenated as adjective: 'show-of-hands vote'). 'Carried unanimously' means the motion passed with 100% agreement. In formal meetings: 'The motion is carried' = the proposal is approved; 'The motion is lost' = rejected."},{sentence:"___ that the negotiations had stalled, the CEO flew in personally to ___ the deadlock.",blanks:["Realising","break"],context:"Two companies had been in talks for six weeks with no progress. The deal was critical for both parties, and senior leadership decided that intervention was necessary.",audioScript:"Realising that the negotiations had stalled and that time was running out, the CEO of the larger company flew in from New York personally to try to break the deadlock with a new package of proposals.",feedback:"'Realising' is a participle clause replacing 'Because she realised that...'. This is a formal, condensed structure. 'Break the deadlock' is a fixed collocation — the only correct verb. 'Resolve' or 'end' would not collocate correctly here."},{sentence:"The ___ of the merger was a concern for ___, particularly the marketing team.",blanks:["implications","stakeholders"],context:"A large corporation announced it was acquiring a smaller competitor. The announcement had far-reaching consequences for employees, suppliers, clients, and investors alike.",audioScript:"The implications of the merger were far-reaching and caused significant concern among all stakeholders, particularly members of the marketing team who feared their department would be restructured.",feedback:"'Implications' (plural noun) = consequences or effects that are not immediately obvious. 'Stakeholders' = all parties with an interest in the outcome. Note: 'implication' can also mean an indirect suggestion. Here it means 'potential consequences'."},{sentence:"We would welcome the ___ to present our proposal to the ___.",blanks:["opportunity","board"],context:"A startup company has been in informal talks with a large investor group. They are formally requesting a meeting to present their business plan and funding requirements.",audioScript:"We would very much welcome the opportunity to present our full proposal to the board of directors at a time that is convenient for them. We are confident that our projections will meet your investment criteria.",feedback:"'Welcome the opportunity' is a formal fixed phrase. 'The board' (short for 'board of directors') uses the definite article when referring to a specific company's board. 'Would welcome' is the polite conditional, more formal than 'want'."},{sentence:"The report ___ that staff morale had declined ___ the restructuring.",blanks:["indicated","following"],context:"An internal HR audit was conducted six months after the company completed a major reorganisation. The report summarised findings from 200 staff surveys and 15 management interviews.",audioScript:"The HR report clearly indicated that staff morale had declined significantly in the period following the restructuring, with 68% of respondents reporting increased stress and reduced job satisfaction.",feedback:"'Indicated' (formal verb) is used for reports and data — more formal than 'showed' or 'said'. 'Following' (preposition) = after. Compare: 'after the restructuring' (informal) vs 'following the restructuring' (formal/written English). The past perfect 'had declined' shows it happened before the report was written."},{sentence:"Despite ___ three times, the supplier ___ to meet the agreed specifications.",blanks:["being warned","failed"],context:"A company had a quality agreement with a component supplier. After multiple quality failures and formal warnings, the company is now considering terminating the contract.",audioScript:"Despite having been warned on three separate occasions about quality standards, the supplier continued to fail to meet the agreed specifications, leaving the company with no choice but to initiate termination proceedings.",feedback:"'Despite being warned' — 'despite' is followed by a gerund or noun phrase, NOT 'that + clause'. Passive gerund: 'being warned' = someone warned them. 'Failed to meet' is the correct collocation (not 'failed at meeting' or 'didn't succeed in meeting')."}])},{type:"multiple_choice",title:"Complex Listening Comprehension",skillLabel:"Listening + Speaking",skillIcon:"🎯",mode:"in-class",content:JSON.stringify([{question:"What is the speaker's main point?",context:"The speaker is a senior manager addressing their team after a failed product launch. The tone is measured but honest, focusing on lessons learned rather than assigning blame.",audioScript:"We didn't hit our targets this quarter, and I think we all know why. The product wasn't ready, and we launched anyway because of external pressure. That was my call, and I take full responsibility. What I need from each of you now is not recrimination, but reflection — what did we learn, and how do we do better next time?",options:["The manager blames the team for failure","The manager takes responsibility and focuses on improvement","The manager is resigning from the position","The manager is planning to delay future launches indefinitely"],answer:"The manager takes responsibility and focuses on improvement",feedback:"The speaker explicitly says 'That was my call, and I take full responsibility' and calls for 'reflection' not 'recrimination'. Listening strategy: identify the speaker's ATTITUDE — is it defensive, accusatory, constructive? Here: constructive. 'Recrimination' = mutual blame. 'Reflection' = thoughtful analysis."},{question:"What does the speaker want the team to do?",context:"A team leader is addressing staff after reviewing quarterly performance data. Several projects came in over budget, and client satisfaction scores dropped by 12%.",audioScript:"I've reviewed the quarterly data with the senior team, and while the numbers aren't where we need them to be, I don't want us to dwell on what went wrong. Instead, I'd like each team to come to Friday's meeting with three concrete recommendations for improving client communication and one proposal for reducing costs by at least five percent without affecting deliverable quality.",options:["Resign and find new jobs","Come to Friday's meeting with specific improvement proposals","Ignore the data and focus on next quarter","Reduce the team size immediately"],answer:"Come to Friday's meeting with specific improvement proposals",feedback:"The speaker explicitly says 'I'd like each team to come to Friday's meeting with three concrete recommendations.' Listening for instructions: watch for 'I'd like you to', 'could you', 'please ensure' — these signal action items. 'Concrete' = specific and practical (not vague)."},{question:"Which best describes the tone of the passage?",context:"A board of directors is receiving a presentation on the company's environmental, social, and governance (ESG) performance. The presenter is the Chief Sustainability Officer.",audioScript:"Our ESG metrics this year tell a story of genuine progress, but also of where we still have significant work to do. Emissions are down fourteen percent, which is excellent news. However, our supply chain audit revealed that two of our key suppliers do not yet meet our ethical sourcing standards, and that is unacceptable. We have issued formal notices and given them ninety days to comply or face contract termination.",options:["Dismissive and unconcerned","Balanced — acknowledging success while addressing problems","Entirely negative and pessimistic","Celebratory and self-congratulatory"],answer:"Balanced — acknowledging success while addressing problems",feedback:"The speaker acknowledges good news ('emissions are down 14%... excellent') AND problems ('that is unacceptable'). Tone analysis: look for evaluative language. 'Excellent' = positive. 'Unacceptable' = negative. Both = balanced. This 'credit-and-concern' structure is typical of formal CSR/ESG reporting."},{question:"What action has the company taken regarding non-compliant suppliers?",context:"During an annual supplier review, the procurement director disclosed findings from a third-party ethical sourcing audit that identified several suppliers failing to meet contracted labour and environmental standards.",audioScript:"Following the findings of our independent supply chain audit, we have issued formal compliance notices to four suppliers who were found to be in breach of our ethical sourcing policy. These suppliers have been given a ninety-day remediation window to bring their practices into line with our standards. Failure to comply will result in immediate contract termination and will be reported in our annual sustainability report.",options:["Immediately terminated all contracts","Given suppliers 90 days to comply or face termination","Ignored the audit findings","Hired new suppliers immediately"],answer:"Given suppliers 90 days to comply or face termination",feedback:"The passage: 'Given a ninety-day remediation window to bring their practices into line.' Listening for specifics: numbers (90 days), actions (formal notices), consequences (termination). 'Remediation window' = time allowed to fix problems. Contrast: immediate termination was NOT the first step — it's the consequence of non-compliance."},{question:"What does the speaker suggest about the relationship between speed and quality?",context:"A product development director is presenting lessons learned from three product launches to the senior leadership team. Two launched on time but had significant quality issues; one launched late but received excellent client feedback.",audioScript:"What the data tells us very clearly is that when we rush to meet an arbitrary deadline, we consistently compromise quality in ways that cost us far more in the long run — through client complaints, rework, and reputation damage — than the cost of a short delay would have been. The most expensive decision we make is launching something that isn't ready.",options:["Speed always leads to better quality","Delays are always unacceptable","Rushing often costs more than a short delay","Quality and speed are not related"],answer:"Rushing often costs more than a short delay",feedback:"The speaker: 'rushing...cost us far more in the long run than the cost of a short delay would have been.' This is a classic business argument: short-term gain (on-time launch) vs long-term cost (quality failures, reputation). 'Arbitrary deadline' = a deadline not based on genuine need. B2 inference: the speaker IMPLIES quality > speed, though not stated that simply."},{question:"What is the speaker's attitude towards the 90-day compliance window given to suppliers?",context:"The Chief Procurement Officer is updating the board on the outcome of an ethical sourcing audit and explaining the company's response to identified violations of the supplier code of conduct.",audioScript:"I want to be absolutely clear: the ninety-day window is not a sign of leniency. It is a structured remediation process with mandatory checkpoints at thirty and sixty days. Any supplier who fails the thirty-day checkpoint will receive an immediate show-cause notice. We are serious about this, and our suppliers understand that.",options:["It shows the company is lenient with suppliers","It is a strict, structured process with checkpoints and consequences","It gives suppliers unlimited time to improve","It will be extended if suppliers ask nicely"],answer:"It is a strict, structured process with checkpoints and consequences",feedback:"The speaker explicitly says 'is NOT a sign of leniency' and describes mandatory checkpoints with escalating consequences. Listening tip: when a speaker directly refutes an interpretation ('This is NOT X, it is Y'), that contrast is often the exam question. 'Show-cause notice' = a formal demand for an explanation before disciplinary action."}])},{type:"matching",title:"Synonyms & Antonyms",skillLabel:"Advanced Vocabulary",skillIcon:"🔤",mode:"homework",content:JSON.stringify([{word:"Remuneration",definition:"Payment or compensation received for work or services (synonym of salary/wages at formal register)",feedback:"'Remuneration' is the most formal term for payment. Register ladder: pay (informal) → salary/wages → compensation → remuneration (most formal). Use 'remuneration package' in job negotiations: 'We offer a competitive remuneration package including base salary, bonus, and benefits.'"},{word:"Expedite",definition:"To speed up or accelerate a process (antonym: delay, hinder)",feedback:"'Expedite' (formal verb) = to make something happen more quickly. 'Could you expedite the approval process?' = 'Can you speed this up?' Business collocations: 'expedite delivery', 'expedite processing', 'expedite a request'. More formal than 'speed up' or 'hurry'."},{word:"Mitigate",definition:"To reduce the severity or impact of something negative (antonym: exacerbate/worsen)",feedback:"'Mitigate risks' is a key business phrase. Risk management uses: 'identify → assess → mitigate → monitor'. 'Mitigating circumstances' in law means factors that reduce blame. Antonym: 'exacerbate' (make worse). 'Aggravate' is similar but often implies intentional worsening."},{word:"Proliferate",definition:"To grow or increase rapidly in number (antonym: dwindle/decline)",feedback:"'Proliferate' (intransitive verb) — the subject itself grows. 'Remote working has proliferated since 2020.' Cannot say 'proliferate something' — use 'increase' transitively. Noun: 'proliferation'. Related: 'nuclear proliferation' (spread of nuclear weapons) — same concept applied to business growth."},{word:"Superfluous",definition:"More than what is necessary; unnecessary (antonym: essential/indispensable)",feedback:"'Superfluous' (adjective) = extra, not needed. 'The report contained superfluous details that obscured the key findings.' Synonym: 'redundant' (though 'redundant' also means 'made unemployed' in British English — careful with context!). Antonym: 'indispensable' = absolutely necessary."},{word:"Ambiguous",definition:"Open to more than one interpretation; unclear (antonym: unambiguous/clear/explicit)",feedback:"'Ambiguous' vs 'ambivalent': ambiguous = the MESSAGE is unclear; ambivalent = the PERSON has mixed feelings. 'The contract clause was ambiguous, leading to a dispute.' In writing: always aim to be unambiguous. Antonym: 'unequivocal' = perfectly clear, admitting no doubt — very strong."}])},{type:"dictation",title:"Advanced Dictation",skillLabel:"Listening + Writing",skillIcon:"✍️",mode:"homework",content:JSON.stringify([{audioScript:"Despite having reached a preliminary agreement, both parties were advised to consult their legal teams before signing.",answer:"Despite having reached a preliminary agreement, both parties were advised to consult their legal teams before signing.",feedback:"'Despite having reached' = perfect gerund after 'despite' (not 'despite reaching' — though both are possible, the perfect form emphasises completion). 'Were advised to' = passive modal. 'Preliminary agreement' = initial/tentative agreement before the final contract. Lawyers are always consulted before signing!"},{audioScript:"The board unanimously agreed that the strategic initiative should be postponed pending further market analysis.",answer:"The board unanimously agreed that the strategic initiative should be postponed pending further market analysis.",feedback:"'Unanimously agreed that' — note the reporting verb structure: agreed + that-clause. 'Should be postponed' = passive subjunctive in reported speech (formal). 'Pending' (preposition) = while waiting for. 'Pending further analysis' is a key business/legal phrase meaning 'until the analysis is complete'."},{audioScript:"It has come to our attention that the deliverables outlined in section four have not been met within the stipulated timeframe.",answer:"It has come to our attention that the deliverables outlined in section four have not been met within the stipulated timeframe.",feedback:"'It has come to our attention that' is a formal epistolary phrase for raising a problem. 'Have not been met' = present perfect passive. 'Stipulated' = formally specified in a contract. This sentence structure is typical of formal complaint letters and contract dispute correspondence."},{audioScript:"Notwithstanding the challenges encountered, the project was completed on time and within budget.",answer:"Notwithstanding the challenges encountered, the project was completed on time and within budget.",feedback:"'Notwithstanding' = despite (formal/legal register). Can also follow the noun: 'the challenges notwithstanding'. 'Encountered' is a formal participle modifying 'challenges'. 'On time and within budget' — two key project success metrics always mentioned together. This is C1 level vocabulary."},{audioScript:"We would be grateful if you could confirm your availability for a meeting at your earliest convenience.",answer:"We would be grateful if you could confirm your availability for a meeting at your earliest convenience.",feedback:"'Would be grateful if you could' = ultra-polite double conditional. More formal than 'please confirm'. 'At your earliest convenience' = as soon as possible (without imposing urgency). This is essential formal email vocabulary. British business correspondence relies heavily on these polite indirect structures."},{audioScript:"The acquisition, which had been under negotiation for eighteen months, was finally completed last Friday.",answer:"The acquisition, which had been under negotiation for eighteen months, was finally completed last Friday.",feedback:"Non-defining relative clause: 'which had been under negotiation for eighteen months' — commas essential (it adds extra info, not defining info). Past perfect passive: 'had been under negotiation' — the negotiation preceded the completion. 'Acquisition' = buying another company. 'Finally completed' shows relief/culmination after a long process."}])}]},{title:"Mastery",colour:"#CE82FF",xpReward:220,slides:[{heading:"Mastery: Critical Thinking",body:"At mastery level, you must evaluate information critically, detect bias, and make sophisticated arguments. Go beyond the literal meaning to what is implied, assumed, or omitted.",example:"The report states sales 'increased' — but by how much? Compared to what baseline?"},{heading:"Sophisticated Communication",body:"Master communicators use hedging, precision, and register awareness simultaneously. They know when to be direct, when to be diplomatic, and how to structure complex arguments coherently.",example:"While the data is broadly encouraging, certain anomalies warrant closer scrutiny."}],activities:[{type:"multiple_choice",title:"Mastery Simulation",skillLabel:"Critical Thinking + Communication",skillIcon:"🧠",mode:"in-class",content:JSON.stringify([{question:"A junior colleague has made an error in a client report that has already been sent. What is the most professionally intelligent course of action?",context:"The error is factual — a revenue figure is incorrect by 15%. The client has not yet noticed. Your colleague is junior and new to the company. You are the senior account manager.",audioScript:"You have just discovered that a report sent to a key client contains a revenue figure that is 15 percent too high. The report was sent this morning. Your junior colleague, who has only been with the company for three months, prepared it. The client has not yet acknowledged receipt.",options:["Ignore it and hope the client doesn't notice","Send an immediate correction with an apology and brief explanation, after informing your manager","Blame your colleague publicly in the next team meeting","Tell the client it was intentional to test them"],answer:"Send an immediate correction with an apology and brief explanation, after informing your manager",feedback:"The correct professional response prioritises: (1) transparency with the client, (2) protecting company credibility, (3) informing your manager before acting, (4) not publicly shaming the junior colleague. Proactive error correction before the client notices actually builds trust. Delayed or hidden errors devastate relationships. Note: 'after informing your manager' — always escalate before correcting client communications."},{question:"A competitor has released a product that appears to directly copy your company's design. Your CEO asks for your recommendation at short notice. What do you advise?",context:"You are the head of product strategy. The competing product launched yesterday. Legal, marketing, and sales are all awaiting direction. You have limited information.",audioScript:"The CEO has called an emergency strategy meeting. A competitor launched a product yesterday that appears to replicate key features of your flagship product. Social media is beginning to react. Legal, marketing, and sales teams are all present waiting for strategic direction. The CEO turns to you for an initial recommendation.",options:["Launch an aggressive social media attack on the competitor immediately","Recommend a three-track response: immediate legal review, PR messaging focusing on your brand's originality, and acceleration of your next product innovation","Do nothing and wait to see what happens","Immediately reduce your product price by 50%"],answer:"Recommend a three-track response: immediate legal review, PR messaging focusing on your brand's originality, and acceleration of your next product innovation",feedback:"The three-track response demonstrates strategic thinking: (1) legal (protect IP), (2) PR (control narrative), (3) innovation (competitive advantage). Attacking on social media is reputationally risky without evidence. Doing nothing cedes ground. Price reduction alone devalues your brand. C1 strategy tip: complex problems require multi-axis responses, not single-lever solutions."},{question:"During a presentation, a board member asks a question you genuinely cannot answer. What is the best response?",context:"You are presenting quarterly results. The board member's question involves a specific regulatory detail you are not certain about. Giving a wrong answer could have legal implications.",audioScript:"Midway through your quarterly results presentation to the board, a non-executive director asks a highly specific question about the regulatory implications of a new accounting standard on your deferred tax liability position. You know the topic broadly but are not certain of the specific regulatory detail.",options:["Make up a convincing-sounding answer","'That's an excellent and important question. I want to give you a precise answer rather than speculate — may I follow up with you in writing by close of business today?'","'I have no idea.'","Change the subject quickly"],answer:"'That's an excellent and important question. I want to give you a precise answer rather than speculate — may I follow up in writing by close of business today?'",feedback:"The model answer demonstrates intellectual integrity: acknowledging the question positively, being honest about uncertainty (without appearing incompetent), and committing to a specific follow-up. In high-stakes settings (legal/financial), guessing is dangerous. 'By close of business' = by the end of the working day. This response actually builds credibility rather than damaging it."},{question:"Your team disagrees fundamentally on a strategic direction. Two senior colleagues both present strong cases. As team leader, what do you do?",context:"Option A: Enter a new market aggressively with high investment. Option B: Consolidate the existing market with lower risk. Both have valid supporting data. A decision must be made today.",audioScript:"Two of your most senior and respected team members have presented diametrically opposed strategies with equally compelling data. Half the team supports each position. The deadline for the board submission is at five o'clock today. As team leader, you must make a final recommendation.",options:["Choose the option presented by the more senior person","Toss a coin — both options are equally valid","Synthesise both views, clearly articulate the trade-offs and assumptions, make a decision with a clear rationale, and commit to defined review metrics","Avoid making a decision and present both options to the board without a recommendation"],answer:"Synthesise both views, clearly articulate the trade-offs and assumptions, make a decision with a clear rationale, and commit to defined review metrics",feedback:"Leadership tip: good leaders don't avoid decisions — they make them with clear rationale and accountability mechanisms ('defined review metrics'). Presenting without a recommendation abdicates leadership responsibility. 'Synthesise' = combine multiple perspectives into a coherent whole. The board expects a recommendation, not a menu of options without leadership endorsement."},{question:"A client emails to say they are 'somewhat disappointed' with the last deliverable. What does this likely mean and how do you respond?",context:"Your company completed a consulting project for a long-term client. The project was delivered on time but feedback has been received. The phrasing is typically British — indirect and understated.",audioScript:"You receive an email from your most important client. They write: 'We have reviewed the final report and, while there is much to admire, we are somewhat disappointed that certain key recommendations lack the depth of analysis we had anticipated, particularly regarding the regulatory environment section.'",options:["Reply: 'We're glad most of it was admired!'","Ignore the email as they said there was 'much to admire'","Read the understatement: they are significantly unhappy. Respond with genuine acknowledgement, specific remediation offer, and a call to discuss their expectations in detail","Forward it to your junior colleague without reading it properly"],answer:"Read the understatement: they are significantly unhappy. Respond with genuine acknowledgement, specific remediation offer, and a call to discuss their expectations in detail",feedback:"British English understatement alert: 'somewhat disappointed' = significantly unhappy. 'Lacks depth' = inadequate. 'We had anticipated' = you failed to meet expectations. Culturally sophisticated reading is a C1+ skill. Never focus only on the positive framing ('much to admire') when the actual message is a complaint. Immediate, specific remediation builds long-term relationships."},{question:"You are writing an executive summary for a report with mixed results. Which opening is most appropriate?",context:"The annual report shows: revenue +8% (good), costs +15% (bad), customer satisfaction -5% (concerning), employee engagement +12% (positive). You must present this to the board in one paragraph.",audioScript:"You must write an opening sentence for an executive summary that honestly and professionally represents a set of mixed annual results to the board. The company achieved revenue growth but experienced rising costs, declining customer satisfaction, and improving employee engagement.",options:["'Another outstanding year for the company across all metrics!'","'The year was a complete disaster for the company.'","'The financial year delivered encouraging revenue growth while also revealing areas requiring immediate strategic attention, particularly in cost management and customer experience.'","'We don't know how to summarise this year.'"],answer:"'The financial year delivered encouraging revenue growth while also revealing areas requiring immediate strategic attention, particularly in cost management and customer experience.'",feedback:"The model sentence balances honesty with professionalism. Technique: lead with positive ('encouraging revenue growth'), acknowledge negatives without catastrophising ('areas requiring strategic attention'), be specific ('cost management and customer experience'). Executive summaries must be accurate, balanced, and solution-oriented. Overpromising = losing credibility. Catastrophising = losing confidence."}])},{type:"dictation",title:"Expert Dictation",skillLabel:"Advanced Listening + Writing",skillIcon:"✍️",mode:"homework",content:JSON.stringify([{audioScript:"Notwithstanding the considerable progress achieved in the first half of the fiscal year, the board remains cautiously optimistic about the outlook for the remainder of the period.",answer:"Notwithstanding the considerable progress achieved in the first half of the fiscal year, the board remains cautiously optimistic about the outlook for the remainder of the period.",feedback:"'Notwithstanding' = despite (formal). 'Fiscal year' = financial year (formal/accounting term). 'Cautiously optimistic' = a very common board-level phrase meaning positive but aware of risks. 'Remainder of the period' = the rest of the year. This sentence exemplifies the measured, hedged tone of formal financial communications."},{audioScript:"The due diligence process, which encompassed a thorough review of financial statements, legal obligations, and operational procedures, was completed satisfactorily.",answer:"The due diligence process, which encompassed a thorough review of financial statements, legal obligations, and operational procedures, was completed satisfactorily.",feedback:"'Due diligence' = thorough investigation before a major transaction (acquisition, investment). 'Encompassed' = included comprehensively (more formal than 'included'). Non-defining relative clause with commas. Passive: 'was completed satisfactorily' — impersonal formal style. This is M&A (Mergers & Acquisitions) vocabulary."},{audioScript:"It is the recommendation of the executive committee that all non-essential capital expenditure be deferred until the macroeconomic environment stabilises.",answer:"It has come to our attention that all non-essential capital expenditure should be deferred until the macroeconomic environment stabilises.",feedback:"'It is the recommendation of...' is a formal structure for institutional recommendations. 'Capital expenditure' (CapEx) = spending on assets like equipment and property. 'Be deferred' = subjunctive mood in formal recommendations (also: 'should be deferred'). 'Macroeconomic environment' = broader economic conditions (interest rates, inflation, GDP growth)."},{audioScript:"The arbitration panel concluded that the contractual obligations had been materially breached by the defendant, entitling the claimant to substantial damages.",answer:"The arbitration panel concluded that the contractual obligations had been materially breached by the defendant, entitling the claimant to substantial damages.",feedback:"'Arbitration' = dispute resolution outside the courts by an independent panel. 'Materially breached' = significantly violated (not a minor technicality). 'Entitling the claimant to damages' = the breach gives the injured party the right to financial compensation. This is essential legal English vocabulary for B2-C1 business contexts."},{audioScript:"We are pleased to advise that, following the successful completion of all regulatory approvals, the transaction has now been unconditionally completed.",answer:"We are pleased to advise that, following the successful completion of all regulatory approvals, the transaction has now been unconditionally completed.",feedback:"'We are pleased to advise that' = formal epistolary phrase announcing good news. 'Following the successful completion of' = after (formal). 'Regulatory approvals' = clearances from government bodies (e.g., Competition Authority). 'Unconditionally completed' = the deal is finished with no remaining conditions — a legal milestone."},{audioScript:"The whistleblower's disclosure precipitated an immediate independent investigation into alleged financial irregularities at the highest level of the organisation.",answer:"The whistleblower's disclosure precipitated an immediate independent investigation into alleged financial irregularities at the highest level of the organisation.",feedback:"'Whistleblower' = someone who reports wrongdoing internally or to authorities. 'Precipitated' = caused suddenly (formal/literary). 'Alleged' = claimed but not yet proven (legally important — protects from libel). 'Financial irregularities' = accounting problems or fraud. This vocabulary appears in financial journalism and corporate governance contexts."}])},{type:"true_false",title:"Critical Thinking Challenge",skillLabel:"Evaluation + Reasoning",skillIcon:"🔍",mode:"homework",content:JSON.stringify([{statement:"A speaker who says 'we are cautiously optimistic' is expressing complete confidence in future results.",isTrue:!1,context:"Cautious optimism is a frequently used phrase in financial and corporate communications, particularly in quarterly earnings calls and annual reports. It signals a positive outlook tempered by awareness of risks and uncertainties. Analysts and investors pay close attention to the specific language used by executives, as phrases like 'cautiously optimistic' versus 'highly confident' carry different signals about the company's actual internal assessment of future performance.",audioScript:"When an executive says the company is cautiously optimistic, this is deliberate hedging language. It signals positivity but with awareness of ongoing risks. Complete confidence would be expressed differently — perhaps as 'we are highly confident' or 'we expect strong results'. Cautious optimism is actually a warning that risks remain.",feedback:"FALSE. 'Cautiously optimistic' is deliberately hedged language. It signals positivity WITH awareness of risk. 'Complete confidence' would be 'we are certain' or 'we are highly confident'. In financial communication, word choice is precise and intentional. 'Cautiously' modifies and weakens 'optimistic' — it is not absolute confidence."},{statement:"In British English understatement, 'I'm not entirely sure this is the right approach' likely means the speaker has strong doubts.",isTrue:!0,context:"British understatement is a defining feature of formal UK communication. In British professional culture, direct criticism is often considered impolite, and speakers instead employ understatement, hedging, and irony to convey their true meaning. 'Not entirely sure' can be a significant understatement of deep reservations. Understanding this cultural code is essential for effective communication in UK business and academic environments. A similar understatement is 'this could perhaps be improved' meaning 'this is not good enough'.",audioScript:"In British professional culture, understatement is routinely used to convey criticism politely. 'I'm not entirely sure this is the right approach' often means the speaker has serious reservations or even believes the approach is wrong. This is a culturally specific communication style that non-native speakers must learn to decode accurately.",feedback:"TRUE. British understatement often inverts scale. 'Not entirely sure' = probably quite uncertain or even strongly opposed. Classic examples: 'interesting' can mean 'terrible'; 'quite good' means 'mediocre'; 'we have some concerns' means 'we are deeply worried'. This cultural literacy is C1-C2 level."},{statement:"An executive summary should include every detail from the full report for maximum completeness.",isTrue:!1,context:"An executive summary is by definition a condensed overview of the key findings, recommendations, and conclusions of a longer document. Its purpose is to allow senior decision-makers — who may not have time to read the full report — to understand the essential points and make informed decisions. An effective executive summary is typically 5-10% of the total report length and focuses exclusively on the most critical information, omitting methodological details, raw data tables, and supplementary analysis.",audioScript:"An executive summary is not a complete replication of the full report — it is a selective, condensed version. Including every detail defeats its purpose entirely. Senior executives need to grasp key findings and recommendations quickly. The skill lies in choosing what to include and what to omit, always prioritising decisions and outcomes over process and methodology.",feedback:"FALSE. An executive summary is intentionally condensed — typically 5-10% of the full report. It omits methodology, raw data, and supplementary material, focusing only on key findings, conclusions, and recommendations. The word 'executive' implies it is for busy decision-makers who need the essence, not the detail."},{statement:"Making a proactive error correction before a client notices typically damages trust more than staying silent.",isTrue:!1,context:"Research in client relationship management consistently demonstrates that proactive transparency when errors occur builds stronger long-term trust than either staying silent or waiting for clients to discover problems independently. The reasoning is that proactive correction demonstrates integrity, competence (you caught it yourself), and respect for the client. Silent errors, when eventually discovered, are per
