ceived as deliberate concealment, which is far more damaging to relationships than the original mistake.",audioScript:"Research shows that proactively admitting and correcting an error before the client discovers it actually strengthens trust in most professional relationships. It demonstrates integrity and shows that you have strong quality control processes. Clients are far more forgiving of honest mistakes that are immediately corrected than of errors that were concealed, even inadvertently.",feedback:"FALSE. Proactive transparency builds trust — it demonstrates integrity and self-monitoring capability. The passage states this 'builds stronger long-term trust than... staying silent'. Clients perceive silent errors (when later discovered) as concealment, which is far more damaging. Error management tip: own it fast, fix it comprehensively, explain what you've done to prevent recurrence."},{statement:"In complex negotiations, a decision-maker should always avoid making a recommendation to preserve neutrality.",isTrue:!1,context:"The role of a decision-maker or leader in negotiations and strategic discussions is precisely to make decisions — not to remain perpetually neutral. While gathering balanced information and considering multiple perspectives is essential preparation, indefinite neutrality at the decision-making stage is itself a form of leadership failure. Effective leaders synthesise available information, make explicit trade-off decisions, communicate their rationale clearly, and establish metrics to evaluate outcomes. Neutrality without action is abdication, not fairness.",audioScript:"Leaders are expected to make decisions, not avoid them. Presenting multiple options to the board without a recommendation is often perceived as a failure of leadership. The decision-maker's job is to synthesise perspectives, weigh trade-offs, make a clear recommendation with a stated rationale, and be accountable for the outcome.",feedback:"FALSE. Decision-makers MUST make recommendations — that is their function. Perpetual neutrality is called 'decision paralysis' or 'abdicating responsibility'. The passage: 'Neutrality without action is abdication, not fairness.' Good leaders make decisions with clear rationale and accountability, not endless equivocation. 'Synthesise' = bring together; 'equivocate' = avoid committing."},{statement:"The term 'material breach' in a contract context means any minor or technical violation of the agreement.",isTrue:!1,context:"In contract law and business English, a 'material breach' is a fundamental violation of the contract that goes to the heart of the agreement — one that defeats the purpose of the contract or causes significant harm to the non-breaching party. It is distinguished from a 'minor breach' or 'technical breach', which involves a small failure that does not substantially impair the contract's value. Only a material breach typically entitles the non-breaching party to terminate the contract and seek damages.",audioScript:"A material breach in contract law is a significant, fundamental violation — not a minor or technical one. For example, failing to deliver goods at all is a material breach; delivering them one day late might be only a minor breach. The distinction matters because only a material breach gives the other party the right to terminate the entire contract.",feedback:"FALSE. 'Material breach' = fundamental/significant violation, not minor. The passage: 'a fundamental violation... that defeats the purpose of the contract'. 'Material' in legal language means 'significant' or 'substantial'. Contrast: a 'technical breach' is minor and usually does not entitle termination. This distinction is critical in contract disputes."}])}]}]},null,2),OT=/[\u{1F300}-\u{1F9FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{1F000}-\u{1F02F}\u{1F0A0}-\u{1F0FF}\u{1F100}-\u{1F1FF}\u{1F200}-\u{1F2FF}\u{1F004}\u{1F0CF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}\u{231A}-\u{231B}\u{23E9}-\u{23F3}\u{23F8}-\u{23FA}\u{25AA}
