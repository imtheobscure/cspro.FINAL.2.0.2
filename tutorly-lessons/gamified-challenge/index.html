nlockCode:"FREEDOM",codeHint:"What is the opposite of captivity? (7 letters)",lesson:{title:"Survival Vocabulary: Essential Words for Escape",content:"In this dire situation, you must learn the vocabulary of survival. These words will be your weapons against the traps that await.",sections:[{title:"The Captor's Message",type:"text",content:`Read the following message carefully. Every word matters. Hidden within this text is the code to your FREEDOM.

"Dear captive, you have been selected for a special purpose. Your linguistic abilities will be tested. The key to your survival lies in understanding. You must demonstrate mastery of these essential terms: ESCAPE means to break free from confinement. DECIPHER means to decode or interpret something obscure. CLUE is a piece of evidence that leads to solving a mystery. TRAP is a device designed to catch or harm. SURVIVAL is the state of continuing to live despite danger. COURAGE means the ability to face fear. The opposite of captivity is FREEDOM - remember this word, for it may save your life."`},{title:"Grammar Trap",type:"exercise",content:`The captor has left grammatical traps. Fix each sentence or face the consequences.

2. "The prisoners was scared." → Correct: "The prisoners were scared."
3. "She runned to the door." → Correct: "She ran to the door."`},{title:"⚠️ WARNING",type:"warning",content:"The fear meter is watching. Wrong answers will increase your fear level. At 100%, the game ends. Choose wisely."},{title:"Dialogue: The Guard",type:"dialogue",content:`Guard: "You think you can escape? Nobody escapes."
You: "I will find a way. Every puzzle has a solution."
Guard: "Words won't save you here."
You: "Words are the only weapon I need."`}]},vocabulary:[{word:"escape",translation:"",definition:"To break free from confinement or control",example:"The prisoner planned to escape at midnight.",partOfSpeech:"verb"},{word:"decipher",translation:"",definition:"To decode or interpret something difficult to understand",example:"She tried to decipher the ancient text.",partOfSpeech:"verb"},{word:"clue",translation:"",definition:"A piece of evidence that helps solve a puzzle or mystery",example:"The detective found an important clue.",partOfSpeech:"noun"},{word:"trap",translation:"",definition:"A device or situation designed to catch someone",example:"They set a trap for the intruder.",partOfSpeech:"noun"},{word:"survival",translation:"",definition:"The state of continuing to live, especially in danger",example:"Survival depends on quick thinking.",partOfSpeech:"noun"},{word:"captivity",translation:"",definition:"The state of being imprisoned or confined",example:"The animal was kept in captivity.",partOfSpeech:"noun"},{word:"courage",translation:"",definition:"The ability to face fear, pain, or danger",example:"It takes courage to speak the truth.",partOfSpeech:"noun"},{word:"confinement",translation:"",definition:"The state of being enclosed in a space",example:"Solitary confinement is a harsh punishment.",partOfSpeech:"noun"}],grammar:[{rule:"Subject-Verb Agreement",explanation:"The verb must agree with the subject in number. Singular subjects take singular verbs.",examples:['He runs (not "he run")','They escape (not "they escapes")'],exercises:[{instruction:"Choose the correct form",sentence:"The prisoner ___ to escape.",answer:"wants",options:["want","wants","wanting"]},{instruction:"Choose the correct form",sentence:"The guards ___ watching.",answer:"are",options:["is","are","be"]}]}],reading:{text:'The room was dark and cold. A single light bulb hanged from the ceiling, casting eerie shadows on the walls. The prisoner looked around desperate, searching for any means of escape. On the table, there was a note writed in red ink. It readed: "Your freedom depends on your ability to understood these words. Find the errors, fix them, and the door will opens." The prisoner picked up the note with trembling hands and began to studied it carefully.',glitchWords:[{text:"hanged",isGlitch:!0,correction:"hung"},{text:"desperate",isGlitch:!0,correction:"desperately"},{text:"writed",isGlitch:!0,correction:"written"},{text:"readed",isGlitch:!0,correction:"read"},{text:"understood",isGlitch:!0,correction:"understand"},{text:"opens",isGlitch:!0,correction:"open"},{text:"studied",isGlitch:!0,correction:"study"}],comprehensionQuestions:[{question:"Where was the prisoner?",options:["In a garden","In a dark room","In a library","In a hospital"],correct:1,explanation:'The text says "The room was dark and cold."'},{question:"What was on the table?",options:["A key","A knife","A note","A phone"],correct:2,explanation:'The text mentions "a note written in red ink."'}]},listening:[{text:"The key to escape lies in understanding every word.",hiddenWord:"escape",hint:"To break free (6 letters)"},{text:"Courage is the weapon against fear.",hiddenWord:"courage",hint:"Bravery (7 letters)"}],dialogue:{scenario:"You are chained in a dark room. A masked figure appears on screen. You must negotiate your way to getting information about the escape route.",characters:["Jigsaw","You"],turns:[{narrator:"The screen flickers. A puppet with red spirals on its cheeks appears. Its mechanical jaw moves as it speaks.",character:"Jigsaw",question:'The puppet asks: "I will give you one chance. Choose your words carefully. How do you respond to your captor?"',options:[{text:`"Please let me go! I'll do anything!"`,outcome:"neutral",response:'Begging shows weakness. The puppet laughs. "Desperation is not a strategy. Try again."',points:5},{text:`"I understand the game. I'm ready to play."`,outcome:"survive",response:'The puppet nods slowly. "Interesting. Intelligence is a valuable tool. You may proceed to the first challenge."',points:20},{text:`"This is insane! You can't keep me here!"`,outcome:"die",response:'The puppet tilts its head. "Anger clouds judgment." A dart shoots from the wall. You feel dizzy...',points:0}]},{narrator:"A compartment opens in the wall, revealing a riddle carved into metal.",character:"Jigsaw",question:'"To proceed, you must answer: What has keys but no locks, space but no room, and you can enter but cannot go inside?"',options:[{text:'"A keyboard!"',outcome:"survive",response:'"Correct. The mind is sharper than any blade." A panel slides open revealing a hallway.',points:25},{text:'"A house?"',outcome:"die",response:'"Wrong. The walls begin to close in..."',points:0},{text:'"A map?"',outcome:"neutral",response:'"Incorrect, but not entirely foolish. Think harder."',points:5}]}]},speaking:[{text:"I will escape from this prison and find my freedom",targetAccuracy:70,clueOnSuccess:"The code starts with F",mode:"normal"},{text:"Courage is not the absence of fear but the triumph over it",targetAccuracy:65,clueOnSuccess:"The code ends with M",mode:"shout"}],writing:[{prompt:"Write a short message (at least 30 words) to a fellow prisoner explaining your escape plan. Use at least 3 vocabulary words from today's lesson.",minWords:30,keywords:["escape","courage","survival"],sampleAnswer:"Dear fellow prisoner, I have devised an escape plan that requires courage and determination. Our survival depends on working together. We must decipher the clues left by our captor and find the hidden key. Tonight, when the guards change shifts, we make our move toward freedom."}],dictation:[{text:"The prisoner must find the courage to escape.",speed:"slow"},{text:"Every clue brings us closer to freedom.",speed:"normal"}],quiz:[{question:'What does "decipher" mean?',options:["To destroy","To decode or interpret","To build","To run away"],correct:1,explanation:'"Decipher" means to decode or interpret something obscure.',codeFragment:"F"},{question:'Which word means "the state of being imprisoned"?',options:["Freedom","Courage","Captivity","Escape"],correct:2,explanation:'"Captivity" means the state of being imprisoned or confined.',codeFragment:"RE"},{question:'Complete: "He ___ to escape." (Past tense of "try")',options:["tryed","tried","tryd","trying"],correct:1,explanation:'The past tense of "try" is "tried" (y changes to i, add -ed).',codeFragment:"ED"},{question:'What is the noun form of "survive"?',options:["Surviving","Survivor","Survival","Survivance"],correct:2,explanation:'The noun form of "survive" is "survival".',codeFragment:"OM"}],fearMeterImpact:10,timeLimit:1800,pointsAvailable:200},{dayNumber:1,title:"The Listening Room",subtitle:"Sounds echo through the walls. Decipher them or be silenced forever.",skill:"listening",narratorIntro:'Day two. The room has changed. Speakers line every wall. Strange sounds fill the air - whispers, echoes, fragments of words. A new message appears: "Today you must listen. The sounds carry secrets. Miss a single word, and the silence will swallow you whole." Your ears are your only weapon now.',narratorOutro:"The speakers fall silent. You have proven your ears are sharp. But can your eyes match them? Tomorrow brings a new kind of horror.",backgroundImage:"https://loremflickr.com/1920/1080/dark,room,creepy?lock=9",artifactEmoji:"👂",artifactName:"The Listening Ear",unlockCode:"WHISPER",codeHint:"Speaking very quietly (7 letters)",lesson:{title:"The Art of Listening: Sounds of Survival",content:"In the listening room, every sound matters. Today you will train your ears to catch crucial information from spoken English.",sections:[{title:"Audio Transcript",type:"text",content:`The following transcript plays over the speakers in the room. Listen carefully - a WHISPER can be louder than a scream.

"In moments of crisis, communication becomes essential. The ability to understand spoken language can mean the difference between life and death. Pay attention to tone, pitch, and rhythm. A whisper carries as much meaning as a shout. The hidden frequencies contain your salvation. Listen for the word that means speaking very softly - that is your key to the next room."`},{title:"Pronunciation Guide",type:"exercise",content:`Key sounds to distinguish:

• "l" vs "r" - "light" vs "right"
• "v" vs "w" - "very" vs "wary"

You: "Who are you? Where are you speaking from?"
Voice: "I am trapped like you. In the room next door. We must whisper so they don't hear us."
You: "How do we get out?"
Voice: "The code... it's hidden in the sounds. Listen to every frequency."`}]},vocabulary:[{word:"whisper",translation:"",definition:"To speak very softly",example:"She whispered the secret code.",partOfSpeech:"verb"},{word:"echo",translation:"",definition:"A repeated sound caused by reflection",example:"His voice echoed in the empty room.",partOfSpeech:"noun"},{word:"frequency",translation:"",definition:"The rate of vibration of sound waves",example:"The radio operates on a specific frequency.",partOfSpeech:"noun"},{word:"deafening",translation:"",definition:"Extremely loud",example:"The explosion was deafening.",partOfSpeech:"adjective"},{word:"muffled",translation:"",definition:"Made quieter or less clear",example:"The muffled sounds came through the wall.",partOfSpeech:"adjective"},{word:"eavesdrop",translation:"",definition:"To secretly listen to a conversation",example:"He tried to eavesdrop on their plan.",partOfSpeech:"verb"}],grammar:[{rule:"Present Continuous Tense",explanation:"Used for actions happening right now. Form: am/is/are + verb-ing",examples:["I am listening to the sounds.","The speakers are playing strange noises."],exercises:[{instruction:"Fill in the blank",sentence:"I ___ (listen) to the echo.",answer:"am listening",options:["am listening","listen","listened"]},{instruction:"Fill in the blank",sentence:"The voice ___ (whisper) through the wall.",answer:"is whispering",options:["is whispering","whispers","whispered"]}]}],reading:{text:'The listening room was filled with speakres mounted on every wall. Strange sounds was playing constantly - some loud, some barely audible. The prisoner had to concentrated on each sound, trying to extract meaning from the chaos. A voice keeped repeating a phrase, but it was to quiet to understand. She pressed her ear against the wall and heared a faint whisper: "The code is hidded in the frequency."',glitchWords:[{text:"speakres",isGlitch:!0,correction:"speakers"},{text:"was",isGlitch:!0,correction:"were"},{tex aint whisper echoes from every direction, creating a deafening cacophony of noise. The mysterious, haunting frequencies seem to pulse with a rhythmic pattern, growing louder and softer in an unpredictable cycle."}],dictation:[{text:"Listen carefully to every whisper in the room.",speed:"slow"},{text:"The echo carries a hidden message.",speed:"normal"}],quiz:[{question:'What does "eavesdrop" mean?',options:["To speak loudly","To secretly listen","To run away","To write a letter"],correct:1,explanation:'"Eavesdrop" means to secretly listen to a conversation.',codeFragment:"WH"},{question:'"The sound was ___" - choose the word meaning "very quiet"',options:["deafening","muffled","echoing","screaming"],correct:1,explanation:'"Muffled" means made quieter or less clear.',codeFragment:"ISP"},{question:'Which tense: "I am listening"?',options:["Past simple","Present continuous","Future","Past perfect"],correct:1,explanation:'"am listening" is present continuous tense.',codeFragment:"ER"}],fearMeterImpact:15,timeLimit:1800,pointsAvailable:200},{dayNumber:2,title:"The Reading Maze",subtitle:"Words are weapons. Find the corrupted ones before time runs out.",skill:"reading",narratorIntro:'Day three. You enter a labyrinth of text. Words cover every surface - walls, floor, ceiling. But something is wrong. Some words are corrupted, glitching, changing. The voice returns: "In this maze of language, errors are your enemy. Find every mistake, correct every flaw, or the walls will close in."',narratorOutro:"The maze opens. Your reading skills have guided you through. But speaking is next, and the microphone is always listening.",backgroundImage:"https://loremflickr.com/1920/1080/dark,room,creepy?lock=10",artifactEmoji:"📖",artifactName:"The Corrupted Book",unlockCode:"CHAPTER",codeHint:"A section of a book (7 letters)",lesson:{title:"Reading Comprehension: Navigating the Text Maze",content:"Today you must prove your reading mastery. Every text contains traps - grammatical errors, spelling mistakes, and logical inconsistencies. Your task is to find them all.",sections:[{title:"The Maze Inscription",type:"text",content:`Carved into the walls of the maze is the following passage. Each CHAPTER of this text contains vital information:

"The prisoner walkd through the maze, their heart beating fast. They seen many words on the walls, but some didnt look write. 'I must bee careful,' they thinked. 'One wrong step and its over.'"`}]},vocabulary:[{word:"labyrinth",translation:"",definition:"A complex maze or network of passages",example:"The labyrinth had no clear exit.",partOfSpeech:"noun"},{word:"corrupted",translation:"",definition:"Changed from the original, often damaged",example:"The file was corrupted and unreadable.",partOfSpeech:"adjective"},{word:"inscription",translation:"",definition:"Words carved or written on a surface",example:"The inscription on the wall was ancient.",partOfSpeech:"noun"},{word:"comprehension",translation:"",definition:"The ability to understand something",example:"Reading comprehension is essential.",partOfSpeech:"noun"},{word:"navigate",translation:"",definition:"To find your way through a complex area",example:"She navigated through the dark corridors.",partOfSpeech:"verb"}],grammar:[{rule:"Past Simple vs Past Participle",explanation:"Regular verbs add -ed. Irregular verbs have unique past forms.",examples:["walked (regular)","seen → saw (irregular past simple)"],exercises:[{instruction:"Choose correct form",sentence:"She ___ the message on the wall.",answer:"saw",options:["seen","saw","see"]},{instruction:"Choose correct form",sentence:"They had ___ through the maze.",answer:"walked",options:["walk","walked","walking"]}]}],reading:{text:'The maze stretced endlessly before her. Each wall was covered in texts, some in english, some in strange scripts she didnt recognize. She knowed she had to find the chapter marker - a golden symbol hided somewhere in the passage. Her eyes scaned every surface, looking for anomalies. "There," she whispered, spotting a word that glowed different from the rest. It was the word "chapter" - writed in blood red letters.',glitchWords:[{text:"stretced",isGlitch:!0,correction:"stretched"},{text:"english",isGlitch:!0,correction:"English"},{text:"didnt",isGlitch:!0,correction:"didn't"},{text:"knowed",isGlitch:!0,correction:"knew"},{text:"hided",isGlitch:!0,correction:"hidden"},{text:"scaned",isGlitch:!0,correction:"scanned"},{text:"writed",isGlitch:!0,correction:"written"}],comprehensionQuestions:[{question:"What was on the walls?",options:["Paintings","Text","Mirrors","Blood"],correct:1,explanation:"Each wall was covered in texts."},{question:"What color was the chapter marker?",options:["Blue","Green","Gold","Blood red"],correct:3,explanation:'The word "chapter" was written in blood red letters.'}]},listening:[{text:"Navigate through the labyrinth of words carefully.",hiddenWord:"labyrinth",hint:"A complex maze (9 letters)"}],dialogue:{scenario:"You encounter a riddle-master guardian at the center of the maze. You must answer correctly to pass.",characters:["Guardian","You"],turns:[{narrator:"A hooded figure blocks the path. Ancient symbols glow on their robe.",character:"Guardian",question:'"I am the keeper of words. Answer me this: What word describes a section of a book, and also means a local branch of an organization?"',options:[{text:'"Chapter!"',outcome:"survive",response:'"You possess wisdom. Pass through, word-walker." The wall parts to reveal the exit.',points:25},{text:'"Page?"',outcome:"neutral",response:'"Close, but not precise. A page is within it, but is not it."',points:5},{text:'"Paragraph?"',outcome:"die",response:'"Incorrect. The walls begin to close..."',points:0}]}]},speaking:[{text:"Every chapter of this book holds a secret message",targetAccuracy:70,clueOnSuccess:"The unlock code is a book section",mode:"normal"}],writing:[{prompt:"Write a diary entry as if you are trapped in the text maze. Describe what you see and feel. (30+ words)",minWords:30,keywords:["labyrinth","words","navigate"],sampleAnswer:"Day 3 in the labyrinth. Words surround me on every surface. I must navigate through corrupted text to find my way out. The inscriptions on the walls seem to shift when I am not looking directly at them."}],dictation:[{text:"The inscription revealed the hidden chapter.",speed:"normal"}],quiz:[{question:'What does "labyrinth" mean?',options:["A library","A complex maze","A ladder","A lamp"],correct:1,explanation:"A labyrinth is a complex maze or network of passages.",codeFragment:"CHA"},{question:'"Corrupted" is closest in meaning to:',options:["Pure","Damaged/Changed","Beautiful","Large"],correct:1,explanation:'"Corrupted" means changed from the original, often damaged.',codeFragment:"PT"},{question:'Past simple of "know":',options:["knowed","knew","known","knowing"],correct:1,explanation:'"Know" is irregular: know → knew → known.',codeFragment:"ER"}],fearMeterImpact:15,timeLimit:1800,pointsAvailable:200},{dayNumber:3,title:"The Speaking Chamber",subtitle:"Your voice is your lifeline. Speak or be silenced.",skill:"speaking",narratorIntro:'Day four. You enter a chamber with a single microphone in the center. The voice booms: "Today, your voice will be tested. Speak the incantations exactly as shown. Your pronunciation must be precise. Whisper when told to whisper. Shout when told to shout. Any deviation... and the chamber will respond."',narratorOutro:"Your voice has echoed through the chamber and survived. But tomorrow requires a different kind of strength - the power of the written word.",backgroundImage:"https://loremflickr.com/1920/1080/dark,room,creepy?lock=11",artifactEmoji:"🎤",artifactName:"The Voice Amplifier",unlockCode:"SILENCE",codeHint:"The absence of sound (7 letters)",lesson:{title:"Speaking Skills: The Power of Voice",content:"Your voice carries power. Today you will master pronunciation, intonation, and the art of speaking clearly under pressure.",sections:[{title:"Incantation Training",type:"text",content:`In the speaking chamber, SILENCE is golden but speech is survival. Practice these phrases:

1. "I shall not be silenced by fear."
2. "My voice carries the weight of truth."
3. "In silence, I find the strength to speak."

• "silence" - /ˈsaɪləns/`}]},vocabulary:[{word:"pronounce",translation:"",definition:"To say a word in a particular way",example:"How do you pronounce this word?",partOfSpeech:"verb"},{word:"intonation",translation:"",definition:"The rise and fall of voice when speaking",example:"Her intonation showed she was asking a question.",partOfSpeech:"noun"},{word:"articulate",translation:"",definition:"To speak clearly and distinctly",example:"Please articulate your answer.",partOfSpeech:"verb"},{word:"mute",translation:"",definition:"Unable or unwilling to speak",example:"Fear struck him mute.",partOfSpeech:"adjective"},{word:"stammer",translation:"",definition:"To speak with involuntary pauses",example:"He stammered when he was nervous.",partOfSpeech:"verb"}],grammar:[{rule:"Modal Verbs: shall, will, must",explanation:"Modal verbs express ability, necessity, or possibility.",examples:["I shall not be silenced.","You must speak clearly.","She will pronounce it correctly."],exercises:[{instruction:"Choose the correct modal",sentence:"You ___ speak the truth.",answer:"must",options:["must","mustn't","can't"]}]}],reading:{text:'The speaking chamber was a round room maked entirely of polished metal. Every surface reflecked sound perfectly, creating a echo effect that amplyfied even the smallest whisper. In the center stooded a microphone, old and rusted, connected to wires that dissapeared into the ceiling. A sign above readed: "Speak the truth or remain silent forever." The prisoner approched the microphone with trembling hands.',glitchWords:[{text:"maked",isGlitch:!0,correction:"made"},{text:"reflecked",isGlitch:!0,correction:"reflected"},{text:"a echo",isGlitch:!0,correction:"an echo"},{text:"amplyfied",isGlitch:!0,correction:"amplified"},{text:"stooded",isGlitch:!0,correction:"stood"},{text:"dissapeared",isGlitch:!0,correction:"disappeared"},{text:"readed",isGlitch:!0,correction:"read"},{text:"approched",isGlitch:!0,correction:"approached"}],comprehensionQuestions:[{questi ge but the presence of fear.",speed:"normal"}],quiz:[{question:'"Articulate" as a verb means:',options:["To be quiet","To speak clearly","To run fast","To write neatly"],correct:1,explanation:"To articulate means to speak clearly and distinctly.",codeFragment:"SIL"},{question:'Which word means "rise and fall of voice"?',options:["Volume","Pitch","Intonation","Accent"],correct:2,explanation:'"Intonation" refers to the rise and fall of voice when speaking.',codeFragment:"EN"},{question:'"I ___ speak the truth." Choose the correct modal:',options:["shall","shalling","shalled","shalls"],correct:0,explanation:'"Shall" is the correct modal verb form.',codeFragment:"CE"}],fearMeterImpact:20,timeLimit:1800,pointsAvailable:200},{dayNumber:4,title:"The Writer's Dungeon",subtitle:"Forge words into weapons. Write your way to survival.",skill:"writing",narratorIntro:'Day five. A quill and ancient parchment await you in a stone dungeon. The voice whispers: "Today, your pen is your sword. Write precisely. Every grammatical error weakens the walls. Every correct sentence strengthens your cage... I mean, your armor. Write or perish."',narratorOutro:"Your words have built a bridge to tomorrow. But the greatest challenge still awaits - the integration of all your skills.",backgroundImage:"https://loremflickr.com/1920/1080/dark,room,creepy?lock=12",artifactEmoji:"✒️",artifactName:"The Blood Quill",unlockCode:"WRITTEN",codeHint:'Past participle of "write" (7 letters)',lesson:{title:"Writing Mastery: The Dungeon Chronicles",content:"The written word is permanent. Today you must demonstrate your writing ability through various exercises.",sections:[{title:"The Dungeon Diary",type:"text",content:`A previous prisoner left a diary. Read it carefully - the past participle of "write" (WRITTEN) is the key:

","Food","Clue fragments","Keys"],correct:2,explanation:"The prisoner collected fragments (clues) from each room."}]},listening:[{text:"When all skills combine, true mastery emerges.",hiddenWord:"combine",hint:"To put together (7 letters)"}],dialogue:{scenario:"All previous characters appear as holograms in the integration chamber. You must navigate a group conversation.",characters:["Jigsaw","Ghost","Voice Judge"],turns:[{narrator:"Three holographic figures materialize around you, each representing a past challenge.",character:"Jigsaw",question:`"You have made it this far. But can you combine everything you've learned? Tell me - what connects all the codes?"`,options:[{text:'"Each code represents a language skill - they combine to show the path to mastery."',outcome:"survive",response:'"Impressive. You see the pattern. The integration is complete." All three figures bow.',points:30},{text:'"I just memorized them. Does it matter?"',outcome:"neutral",response:'"Memorization without understanding is a cage of its own."',points:5},{text:`"Leave me alone! I'm tired of games!"`,outcome:"die",response:'"Exhaustion leads to errors. Errors lead to consequences." The floor opens beneath you...',points:0}]}]},speaking:[{text:"I will combine all my knowledge to solve the final puzzle",targetAccuracy:70,clueOnSuccess:"The code means to merge things together",mode:"normal"}],writing:[{prompt:"Write a summary (40+ words) of everything you have learned over the past 5 days. Use vocabulary from each day.",minWords:40,keywords:["escape","whisper","chapter","silence","written","combine"],sampleAnswer:"Over five days, I have escaped the chains of ignorance. I learned to whisper secrets and listen carefully. Each chapter of my journey has written new knowledge into my mind. In silence, I found strength. Now I combine all these skills to face the final challenge."}],dictation:[{text:"If you combine all the clues, you will find the answer.",speed:"normal"}],quiz:[{question:'"Synthesize" ark,room,creepy?lock=14",artifactEmoji:"💀",artifactName:"The Language Master's Skull",unlockCode:"VICTORY",codeHint:"The result of winning a battle (7 letters)",lesson:{title:"Boss Battle: The Ultimate Language Challenge",content:"Everything comes down to this moment. All skills, all vocabulary, all grammar - weaponized for the final confrontation.",sections:[{title:"The Arena",type:"text",content:`VICTORY awaits the worthy. The Language Master speaks in riddles:

idence pointed to Suspect C."}]},listening:[{text:"The conspiracy was finally exposed by the detective.",hiddenWord:"exposed",hint:"Revealed or uncovered (7 letters)"}],dialogue:{scenario:"You present your theory to your chief.",characters:["Detective (You)","Chief"],turns:[{narrator:"The chief listens intently as you lay out the evidence.",character:"Chief",question:`"That's a strong theory, Detective. But we need one more piece of evidence to make it airtight. What do you suggest?"`,options:[{text:`"Let me search Suspect C's office for the stolen manuscript."`,outcome:"survive",response:'"Do it. If the manuscript is there, we have our killer." The search reveals the stolen work!',points:30},{text:`"I think we have enough. Let's arrest now."`,outcome:"neutral",response:'"A good lawyer could tear this apart. We need more."',points:10},{text:`"I'm not sure C did it anymore."`,outcome:"die",response:`"Then who? We've wasted a week! This case is going cold!"`,points:0}]}]},speaking:[{text:"The conspiracy was exposed after connecting all the evidence",targetAccuracy:70,clueOnSuccess:"Think about revealing hidden truth",mode:"normal"}],writing:[{prompt:"Write the final case summary (40+ words) connecting all evidence from Days 0-5.",minWords:40,keywords:["conspiracy","exposed","evidence","suspect"],sampleAnswer:"Case Summary: The murder of Professor Walsh was the result of a conspiracy by his colleague (Suspect C) to conceal plagiarism. Evidence includes forged documents, witness testimony, forensic analysis, and the stolen manuscript found in Suspect C's office. The conspiracy was exposed through systematic investigation."}],dictation:[{text:"The conspiracy was exposed when the evidence was connected.",speed:"normal"}],quiz:[{question:'"Plagiarize" means:',options:["To praise","To steal work","To publish","To edit"],correct:1,explanation:"To plagiarize means to steal someone's work.",codeFragment:"EXP"},{question:'Past perfect: "He ___ before police came."',options:["le rve",isGlitch:!0,correction:"served"},{text:"justise",isGlitch:!0,correction:"justice"}],comprehensionQuestions:[{question:"What was the verdict?",options:["Not guilty","Guilty","Mistrial","Dismissed"],correct:1,explanation:"The verdict was guilty."}]},listening:[{text:"Justice has been served and the killer is behind bars.",hiddenWord:"justice",hint:"Fairness under the law (7 letters)"}],dialogue:{scenario:"Final interrogation of the killer.",characters:["Detective (You)","Suspect C (Killer)"],turns:[{narrator:"Suspect C sits with arms crossed, a smirk on their face.",character:"Suspect C (Killer)",question:`"You think you're so clever, Detective? You can't prove anything."`,options:[{text:`"We found the manuscript in your office, the forged letter in your handwriting, and a witness saw you leave. It's over."`,outcome:"survive",response:'The smirk fades. "I... I want a lawyer." CONFESSION OBTAINED. CASE CLOSED! 🏆',points:50},{text:`"Just confess. It'll be easier."`,outcome:"neutral",response:'"Easier for whom? I have nothing to confess." Standoff.',points:10},{text:`"You're right. We don't have enough."`,outcome:"die",response:"The suspect stands up and walks out. The case collapses.",points:0}]}]},speaking:[{text:"Justice has been served and the case is now closed",targetAccuracy:65,clueOnSuccess:"JUSTICE is the final code!",mode:"shout"}],writing:[{prompt:"Write the closing statement for the prosecution (50+ words).",minWords:50,keywords:["justice","verdict","guilty","evidence"],sampleAnswer:"Members of the jury, the evidence is overwhelming. The defendant had motive - to conceal plagiarism. He had opportunity - forging a letter to lure the victim. And we have physical evidence - fingerprints, the stolen manuscript, and witness testimony. I ask you to deliver a verdict of guilty. Justice demands it."}],dictation:[{text:"The verdict was guilty and justice was served.",speed:"normal"}],quiz:[{question:'"Verdict" means:',options:["A green plant","A jury's decision", ity where words had physical power. As the main character, every decision would determine whether the story ended in triumph or tragedy."}],dictation:[{text:"The protagonist must escape the simulation.",speed:"normal"}],quiz:[{question:'A "protagonist" is:',options:["The villain","The main character","The narrator","A side character"],correct:1,explanation:"The protagonist is the main character.",codeFragment:"REA"},{question:'"Climax" in a story is:',options:["The beginning","The most intense point","The end","A character"],correct:1,explanation:"The climax is the peak of intensity.",codeFragment:"LI"},{question:'"Resolution" means:',options:["The start","A conflict","The conclusion","A character"],correct:2,explanation:"Resolution is the ending/conclusion.",codeFragment:"TY"}],fearMeterImpact:10,timeLimit:1800,pointsAvailable:200},{dayNumber:1,title:"Act II: The Ally",subtitle:"You meet someone who claims to be on your side. But in this simulation, trust is dangerous.",skill:"listening",narratorIntro:'Day two in the simulation. You encounter another "player" - someone who claims to be trapped like you. They speak quickly, urgently. You must listen carefully to determine if they are a genuine ally or a trap set by the system.',narratorOutro:"You've made your choice about the ally. Tomorrow, the action intensifies.",backgroundImage:"https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=1920&q=80",artifactEmoji:"🤝",artifactName:"The Trust Token",unlockCode:"BELIEVE",codeHint:"To accept something as true (7 letters)",lesson:{title:"Listening: Understanding Intentions",content:"Listen beyond words to understand true intentions.",sections:[{title:"Scene: Meeting the Ally",type:"text",content:`Do you BELIEVE this person? The ally speaks:

roven yourself worthy in Egypt. The time machine flickers - the next era awaits.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=8","🏛️","The Pharaoh's Seal","DYNASTY","A series of rulers from the same family (7 letters)","Ancient Egyptian Vocabulary","Learn the language of the ancient world.",[{title:"The Scribe's Chamber",type:"text",content:`In ancient Egypt, a DYNASTY of pharaohs ruled for centuries. The Royal Scribe speaks:

"Traveler, you must understand: in Egypt, words are sacred. We carve them in stone for eternity. Hieroglyphs are not mere pictures - they are the language of the gods. A dynasty rises and falls on the power of its scribes. Learn these words, prove your knowledge, and the Pharaoh may spare your life."`},{title:"Anachronism Alert",type:"warning",content:"FIND THE ANACHRONISM: The scribe is using a ballpoint pen! Ancient Egyptians used reed pens. Fix the timeline!"}],[{word:"dynasty",translation:"",definition:"A series of rulers from the same family",example:"The 18th Dynasty was powerful.",partOfSpeech:"noun"},{word:"hieroglyph",translation:"",definition:"A picture symbol used in ancient writing",example:"The hieroglyphs told a story.",partOfSpeech:"noun"},{word:"pharaoh",translation:"",definition:"An ancient Egyptian ruler",example:"The pharaoh commanded the army.",partOfSpeech:"noun"},{word:"ancient",translation:"",definition:"Belonging to the distant past",example:"Ancient civilizations built pyramids.",partOfSpeech:"adjective"},{word:"civilization",translation:"",definition:"An advanced society",example:"Egyptian civilization lasted millennia.",partOfSpeech:"noun"},{word:"monument",translation:"",definition:"A structure built to commemorate",example:"The pyramids are monuments to the pharaohs.",partOfSpeech:"noun"}],[{rule:"Irregular Plurals",explanation:"Some nouns have irregular plural forms.",examples:["pharaoh → pharaohs","dynasty → dynasties","hieroglyph → hieroglyphs"],exercises:[{instruction:'Plural of "dynasty"',sentence:"Three ___ ruled Egypt.",answer:"dynasties",options:["dynastys","dynasties","dynasty"]}]}],`The ancient scribe sitted in his chamber, surrounded by scrolls. He was useing a ballpoint pen to write on papyrus - a clear anachronism that the time traveler immediatly noticed. "Wait," she sayed, "ballpoint pens wasn't invented until the 20th century! You should be useing a reed pen." The scribe looked confussed. "What is a 'century'?" he asked. She had forgotted - the concept of centuries was also a future invention.`,[{text:"sitted",isGlitch:!0,correction:"sat"},{text:"useing",isGlitch:!0,correction:"using"},{text:"immediatly",isGlitch:!0,correction:"immediately"},{text:"sayed",isGlitch:!0,correction:"said"},{text:"wasn't",isGlitch:!0,correction:"weren't"},{text:"confussed",isGlitch:!0,correction:"confused"},{text:"forgotted",isGlitch:!0,correction:"forgotten"}],[{question:"What anachronism did the traveler spot?",options:["A computer","A ballpoint pen","A car","A phone"],correct:1,explanation:"Ballpoint pens didn't exist in ancient Egypt."}],[{text:"The dynasty ruled Egypt for three hundred years.",hiddenWord:"dynasty",hint:"A ruling family line (7 letters)"}],{scenario:"You stand before the Pharaoh's court. You must prove your knowledge.",characters:["Pharaoh","You"],turns:[{narrator:"The golden throne gleams. The Pharaoh raises his crook and flail.",character:"Pharaoh",question:'"Stranger from the future, what can you teach my scribes about the power of words?"',options:[{text:'"Great Pharaoh, words outlive dynasties. The hieroglyphs your scribes carve today will be read thousands of years from now."',outcome:"survive",response:'"A wise answer. You shall serve as Royal Consultant. Tell me more of the future of language."',points:25},{text:'"I can teach you to text message."',outcome:"die",response:'"I do not understand these strange words. Guards! Remove this fool!"',points:0},{text:`"I don't know much about Egypt, sorry."`,outcome:"neutral",response:'"Honesty... unusual but not unwelcome. You may observe."',points:10}]}]},[{text:"The ancient dynasty built monuments that lasted for thousands of years",targetAccuracy:70,clueOnSuccess:"The code is about a ruling family line",mode:"normal"}],[{prompt:"Write a letter (30+ words) from a time traveler to the Pharaoh explaining modern writing.",minWords:30,keywords:["dynasty","ancient","civilization"],sampleAnswer:"Great Pharaoh, I come from a future civilization where your dynasty is legendary. Your ancient hieroglyphs inspired all writing that followed. The monuments you build will stand for thousands of years."}],[{text:"The pharaoh ruled the ancient dynasty.",speed:"normal"}],[{question:'"Dynasty" means:',options:["A dinosaur","A ruling family line","A type of food","A building"],correct:1,explanation:"A dynasty is a series of rulers from the same family.",codeFragment:"DYN"},{question:'Plural of "pharaoh":',options:["pharaohs","pharaoes","pharaohen","pharaoh"],correct:0,explanation:"Regular plural: add -s.",codeFragment:"AS"},{question:'"Ancient" means:',options:["Modern","Recent","Very old","New"],correct:2,explanation:'"Ancient" means belonging to the distant past.',codeFragment:"TY"}],10,1800,200),Va(1,"Medieval England: The Knight's Quest","1066 AD. The Norman Conquest. You must navigate the politics of medieval England.","listening","The time machine jumps forward. You arrive in England, 1066. The Battle of Hastings looms. Knights speak in Old English and Norman French. You must listen carefully to understand the strategies and survive the medieval world.","You survived medieval England. The time stream pulls you forward again.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=9","⚔️","The Knight's Sword","KINGDOM","A country ruled by a king or queen (7 letters)","Medieval Listening Skills","Understanding spoken commands in a medieval setting.",[{title:"The Battle Camp",type:"text",content:`Welcome to the KINGDOM of England, 1066. The commander shouts:

"Listen well! The Norman army approaches from the south. Our kingdom depends on every soldier understanding orders perfectly. Miscommunication means death on the battlefield. You must listen to commands, interpret signals, and respond with precision. A kingdom stands or falls on the clarity of its communication."`}],[{word:"kingdom",translation:"",definition:"A country ruled by a king or queen",example:"The kingdom was under threat.",partOfSpeech:"noun"},{word:"siege",translation:"",definition:"Surrounding a place to force surrender",example:"The siege lasted three months.",partOfSpeech:"noun"},{word:"alliance",translation:"",definition:"A union formed for mutual benefit",example:"They formed an alliance against the enemy.",partOfSpeech:"noun"},{word:"conquest",translation:"",definition:"The act of taking control by force",example:"The Norman Conquest changed England.",partOfSpeech:"noun"},{word:"feudal",translation:"",definition:"Relating to the medieval social system",example:"The feudal system defined medieval life.",partOfSpeech:"adjective"}],[{rule:"Would/Used to for Past Habits",explanation:"Used to / Would + infinitive for past habits.",examples:["Knights used to train daily.","They would practice sword fighting."],exercises:[{instruction:"Choose correct form",sentence:"The king ___ hold court every morning.",answer:"would",options:["would","will","can"]}]}],`The medieval camp was alive with activty. Knights was sharpening there swords while archers practised with they're bows. The commander speaked loudly so everyone could heared him: "The enemie approaches! Every soldier must obeyed my commands exactly. If we looses this battle, the kingdom falls." A young squire who didnt understood the orders was sent back to training.`,[{text:"activty",isGlitch:!0,correction:"activity"},{text:"was",isGlitch:!0,correction:"were"},{text:"there",isGlitch:!0,correction:"their"},{text:"they're",isGlitch:!0,correction:"their"},{text:"speaked",isGlitch:!0,correction:"spoke"},{text:"heared",isGlitch:!0,correction:"hear"},{text:"enemie",isGlitch:!0,correction:"enemy"},{text:"obeyed",isGlitch:!0,correction:"obey"},{text:"looses",isGlitch:!0,correction:"lose"},{text:"didnt understood",isGlitch:!0,correction:"didn't understand"}],[{question:"What were the knights doing?",options:["Sleeping","Sharpening swords","Eating","Dancing"],correct:1,explanation:"Knights were sharpening their swords."}],[{text:"The medieval kingdom prepared for battle against the invaders.",hiddenWord:"kingdom",hint:"A country ruled by royalty (7 letters)"}],{scenario:"The commander asks you to relay orders to the troops.",characters:["Commander","You"],turns:[{narrator:"The commander grabs your shoulder.",character:"Commander",question:'"You! Relay my orders to the archers on the hill. Tell them to hold their fire until the enemy is within range. Can you do this?"',options:[{text:'"Yes, Commander. Archers hold fire until the enemy is within range. I will deliver the message exactly."',outcome:"survive",response:'"Good. Clear communication. Go now!" The archers receive the order perfectly.',points:25},{text:'"Uh... shoot the arrows now?"',outcome:"die",response:`"That is NOT what I said! You'll get us all killed!" The arrows fly too early.`,points:0},{text:'"Can you repeat that?"',outcome:"neutral",response:`"There's no time for repetition in war! Pay attention!" He repeats grudgingly.`,points:5}]}]},[{text:"The kingdom stands united against the invading army",targetAccuracy:70,clueOnSuccess:"Think about a royal territory",mode:"shout"}],[{prompt:"Write a battle speech (30+ words) as a medieval commander.",minWords:30,keywords:["kingdom","siege","conquest"],sampleAnswer:"Soldiers of the kingdom! The enemy comes to conquer our land. We will not yield to their siege. This is our home, our kingdom, and we fight for our families. Stand firm and victory shall be ours!"}],[{text:"The kingdom was under siege for three months.",speed:"normal"}],[{question:'"Siege" means:',options:["A chair","Surrounding to force surrender","A type of weapon","A celebration"],correct:1,explanation:"A siege is surrounding a place to force surrender.",codeFragment:"KIN"},{question:'"Used to" expresses:',options:["Future plans","Past habits","Present actions","Conditions"],correct:1,explanation:'"Used to" describes past habits.',codeFragment:"GD"},{question:'"Alliance" means:',options:["Enemy","Union for mutual benefit","A weapon","A castle"],correct:1,explanation:"An alliance is a union for mutual benefit.",codeFragment:"OM"}],15,1800,200),Va(2,"Renaissance Italy: The Artist's Studio","1500s Florence. Leonardo da Vinci needs your help with a coded message.","reading","You arrive in Renaissance Florence. The air smells of paint and possibility. Leonardo da Vinci himself is working on a mysterious manuscript. He needs someone who can read and interpret his coded writings. Your reading skills will be tested like never before.","Leonardo's secrets have been decoded. The time machine activates again.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=10","🎨","The Artist's Palette","MASTERP","Short for masterpiece - a great work of art (7 letters shown)","Reading: Decoding Renaissance Texts","Reading historical and coded texts.",[{title:"Leonardo's Workshop",type:"text",content:`Create your own MASTERPIECE of reading comprehension:

"Welcome to my workshop, traveler. I am Leonardo. I write my notes in mirror script - backwards, so only the worthy can read them. I believe every great work of art is a MASTERPIECE of communication. A painting tells a story. A sculpture speaks without words. And a manuscript, when decoded, reveals the deepest truths of nature."`}],[{word:"masterpiece",translation:"",definition:"An outstanding work of art",example:"The Mona Lisa is a masterpiece.",partOfSpeech:"noun"},{word:"renaissance",translation:"",definition:"A period of cultural rebirth",example:"The Renaissance began in Italy.",partOfSpeech:"noun"},{word:"manuscript",translation:"",definition:"A handwritten document",example:"Da Vinci's manuscripts were coded.",partOfSpeech:"noun"},{word:"interpret",translation:"",definition:"To explain the meaning of",example:"She interpreted the ancient text.",partOfSpeech:"verb"},{word:"patron",translation:"",definition:"A supporter of the arts",example:"The Medici were great patrons.",partOfSpeech:"noun"}],[{rule:"Definite/Indefinite Articles",explanation:'the (specific), a/an (general). "The" for known items.',examples:["The Mona Lisa (specific)","A masterpiece (general)"],exercises:[{instruction:"Choose article",sentence:"___ Renaissance was a period of rebirth.",answer:"The",options:["A","The","An"]}]}],`Leonardo's workshop was a room full of wonder. Paintins covered every surface, and mecanical inventions hanged from the ceiling. The artist hisself sat at a large desk, writting in his famouse mirror script. "Can you readed this?" he asked, holding up a page. The text was writed backwards. The time traveler taked the page and held it up to a mirror. Slowly, the words becomed clear: "The greatest masterpeice is knowledge itself."`,[{text:"Paintins",isGlitch:!0,correction:"Paintings"},{text:"mecanical",isGlitch:!0,correction:"mechanical"},{text:"hanged",isGlitch:!0,correction:"hung"},{text:"hisself",isGlitch:!0,correction:"himself"},{text:"writting",isGlitch:!0,correction:"writing"},{text:"famouse",isGlitch:!0,correction:"famous"},{text:"readed",isGlitch:!0,correction:"read"},{text:"writed",isGlitch:!0,correction:"written"},{text:"taked",isGlitch:!0,correction:"took"},{text:"becomed",isGlitch:!0,correction:"became"},{text:"masterpeice",isGlitch:!0,correction:"masterpiece"}],[{question:"How did Leonardo write?",options:["In code","In mirror script","In invisible ink","In hieroglyphs"],correct:1,explanation:"Leonardo wrote in mirror script (backwards)."}],[{text:"Leonardo created many masterpieces during the Renaissance.",hiddenWord:"masterpiece",hint:"A great work of art (11 letters, code is 7)"}],{scenario:"Leonardo challenges you to decode a message.",characters:["Leonardo","You"],turns:[{narrator:"The great artist peers at you with curious eyes.",character:"Leonardo",question:'"I have hidden a message in this painting. Can you see what others cannot?"',options:[{text:'"The light in the background forms letters. It spells... MASTERPIECE."',outcome:"survive",response:'"Brillante! You have the eye of an artist and the mind of a scholar!"',points:25},{text:'"I see a pretty landscape?"',outcome:"neutral",response:'"You see the surface. Look deeper, traveler."',points:10},{text:'"Paintings are just pictures."',outcome:"die",response:'"Then you are blind to the language of art. Leave my workshop!"',points:0}]}]},[{text:"Every masterpiece tells a story that transcends time itself",targetAccuracy:70,clueOnSuccess:"The code is about a great work of art",mode:"normal"}],[{prompt:"Write a description (30+ words) of a Renaissance artwork as if you are seeing it for the first time.",minWords:30,keywords:["masterpiece","renaissance","interpret"],sampleAnswer:"Before me stands a masterpiece of the Renaissance - a painting that speaks across centuries. The colors are vivid, the detail extraordinary. I interpret every brushstroke as Leonardo's attempt to capture the beauty of nature and the complexity of the human soul."}],[{text:"The Renaissance produced many masterpieces of art.",speed:"normal"}],[{question:'"Renaissance" literally means:',options:["Recycle","Rebirth","Remember","Repair"],correct:1,explanation:"Renaissance means rebirth.",codeFragment:"MAS"},{question:'Article: "___ Mona Lisa is famous."',options:["A","An","The","No article"],correct:2,explanation:'Specific artworks use "the".',codeFragment:"TER"},{question:'"Patron" means:',options:["A pattern","A supporter","A patient","A father"],correct:1,explanation:"A patron supports the arts.",codeFragment:"P"}],15,1800,200),Va(3,"World War II: The Code Breaker","1942. Bletchley Park. You must break an enemy code.","speaking","You arrive at Bletchley Park, 1942. The war rages across Europe. The intelligence team is trying to break the Enigma code. They need someone with exceptional communication skills. Your speaking ability will be tested as you must relay decoded messages under extreme pressure.","The code is broken. Your speaking skills helped change the course of history.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=11","📻","The Enigma Radio","DECODED","Converted from code to readable form (7 letters)","Speaking Under Pressure: Wartime Communication","Clear and precise communication in high-stakes situations.",[{title:"Bletchley Park Briefing",type:"text",content:`Once the message is DECODED, you must relay it:

"Agent, welcome to Bletchley Park. We have intercepted an enemy transmission, but it's coded. Your job is to help decode the message and then relay it verbally to command. Speed and accuracy are critical. A single mispronounced word could change the meaning entirely and cost lives. Speak clearly. Speak accurately. Speak as if lives depend on it - because they do."`}],[{word:"decode",translation:"",definition:"To convert from code to readable form",example:"They decoded the enemy message.",partOfSpeech:"verb"},{word:"intercept",translation:"",definition:"To catch or stop something in transit",example:"We intercepted their radio signal.",partOfSpeech:"verb"},{word:"classified",translation:"",definition:"Officially secret",example:"The information is classified.",partOfSpeech:"adjective"},{word:"transmission",translation:"",definition:"A signal sent by radio",example:"The transmission was intercepted.",partOfSpeech:"noun"},{word:"intelligence",translation:"",definition:"Secret information about enemies",example:"Military intelligence is crucial.",partOfSpeech:"noun"}],[{rule:"Must/Have to for Obligation",explanation:"Must = strong personal obligation. Have to = external requirement.",examples:["You must speak clearly. (I say so)","You have to report to command. (They require it)"],exercises:[{instruction:"Choose correct form",sentence:"Agents ___ keep information classified.",answer:"must",options:["must","can","might"]}]}],`At Bletchley Park, the atmosphere was tense. Code breakers was working around the clock, trying to decifer the enemy's messages. One young woman had managed to decoded a crucial transmision, but she couldnt relay it fast enough. "You must to speak clearly!" the commander shouted. "Lives dependes on your words!" She taked a deep breathe and speaked the decoded message into the radio: "Enemy ships approaching from the north. Prepare defences."`,[{text:"was",isGlitch:!0,correction:"were"},{text:"decifer",isGlitch:!0,correction:"decipher"},{text:"decoded",isGlitch:!0,correction:"decode"},{text:"transmision",isGlitch:!0,correction:"transmission"},{text:"couldnt",isGlitch:!0,correction:"couldn't"},{text:"must to",isGlitch:!0,correction:"must"},{text:"dependes",isGlitch:!0,correction:"depends"},{text:"taked",isGlitch:!0,correction:"took"},{text:"breathe",isGlitch:!0,correction:"breath"},{text:"speaked",isGlitch:!0,correction:"spoke"}],[{question:"What was intercepted?",options:["A letter","An enemy transmission","A newspaper","A book"],correct:1,explanation:"An enemy radio transmission was intercepted."}],[{text:"The message was decoded just in time to save the fleet.",hiddenWord:"decoded",hint:"Converted from code (7 letters)"}],{scenario:"You must relay a decoded message to the admiral.",characters:["Admiral","You"],turns:[{narrator:"The admiral is waiting by the radio. Every second counts.",character:"Admiral",question:'"Agent, what does the decoded message say? Speak clearly - thousands of lives are at stake."',options:[{text:'"Admiral, decoded message reads: Enemy fleet, 200 ships, approaching Portsmouth from the southwest. Estimated arrival: 0600 hours tomorrow. Recommend immediate evacuation of civilians."',outcome:"survive",response:'"Clear and precise. Well done, Agent. You may have just saved thousands of lives." Orders are issued immediately.',points:30},{text:'"Umm, something about ships... coming... somewhere?"',outcome:"die",response:'"That is USELESS! I need specifics!" The fleet is unprepared.',points:0},{text:'"There are enemies coming."',outcome:"neutral",response:'"From where? When? How many? I need DETAILS, Agent!"',points:5}]}]},[{text:"The classified message was decoded and transmitted to headquarters",targetAccuracy:70,clueOnSuccess:"The code means converted from cipher",mode:"normal"}],[{prompt:"Write a decoded military message (30+ words) in formal style.",minWords:30,keywords:["decoded","intelligence","classified"],sampleAnswer:"DECODED MESSAGE - CLASSIFIED: Enemy forces comprising 200 naval vessels detected heading southwest toward Portsmouth. Intelligence suggests full-scale invasion planned for 0600 hours. All units must prepare defensive positions immediately. This transmission is classified TOP SECRET."}],[{text:"The decoded message saved thousands of lives.",speed:"fast"}],[{question:'"Intercept" means:',options:["To send","To catch in transit","To ignore","To delete"],correct:1,explanation:"To intercept means to catch something in transit.",codeFragment:"DEC"},{question:'"Must" vs "Have to":',options:["Same meaning always","Must=personal, Have to=external","Must=future, Have to=past","No difference"],correct:1,explanation:"Must is personal obligation; have to is external.",codeFragment:"OD"},{question:'"Classified" means:',options:["Public","Secret","Old","New"],correct:1,explanation:"Classified means officially secret.",codeFragment:"ED"}],20,1800,200),Va(4,"The Cold War: Spy Games","1960s Berlin. The Wall divides the city. You must smuggle information across.","writing","Cold War Berlin, 1962. The Berlin Wall divides East and West. You are an undercover agent who must write coded messages to smuggle intelligence across the border. Your writing must be precise, coded, and undetectable.","Your written messages crossed the Wall successfully. One more time jump awaits.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=12","🕵️","The Spy's Briefcase","MISSION","A special task or assignment (7 letters)","Writing: Coded Messages","Learn to write clearly and with hidden meaning.",[{title:"Agent Briefing",type:"text",content:`Your MISSION: Write messages that appear innocent but contain hidden intelligence:

"Agent, you will write letters that seem like normal correspondence. But within these letters, every third word of the second paragraph will spell out the real message. This technique is called steganography - hiding messages in plain sight. Your mission is to master this art of hidden writing."`}],[{word:"mission",translation:"",definition:"A special task or assignment",example:"The spy completed the mission.",partOfSpeech:"noun"},{word:"espionage",translation:"",definition:"The practice of spying",example:"Espionage was common during the Cold War.",partOfSpeech:"noun"},{word:"covert",translation:"",definition:"Secret; hidden",example:"The covert operation was successful.",partOfSpeech:"adjective"},{word:"surveillance",translation:"",definition:"Close observation of a person",example:"He was under constant surveillance.",partOfSpeech:"noun"},{word:"defect",translation:"",definition:"To abandon one's country for another",example:"The spy defected to the West.",partOfSpeech:"verb"}],[{rule:"Reported Speech (Advanced)",explanation:"Changing tenses, pronouns, time expressions.",examples:['"I will go" → He said he would go.','"I am here" → She said she was there.'],exercises:[{instruction:"Convert",sentence:'"We must complete the mission." → He said they ___ complete the mission.',answer:"must/had to",options:["must/had to","will","can"]}]}],'The spy sitted in a cold Berlin cafe, writing what appeared to be a innocent letter to his mother. But hidden within the words was a coded message about enemy troop movments. "My dearest mother," it beginned, "I am doing good here in Berlin. The weather has been quite pleasent." Every third word of the next paragraph containd a letter of the secret code. He had to writing carefully - one mistake could costed him his life.',[{text:"sitted",isGlitch:!0,correction:"sat"},{text:"a innocent",isGlitch:!0,correction:"an innocent"},{text:"movments",isGlitch:!0,correction:"movements"},{text:"beginned",isGlitch:!0,correction:"began"},{text:"good",isGlitch:!0,correction:"well"},{text:"pleasent",isGlitch:!0,correction:"pleasant"},{text:"containd",isGlitch:!0,correction:"contained"},{text:"writing",isGlitch:!0,correction:"write"},{text:"costed",isGlitch:!0,correction:"cost"}],[{question:"Where was the spy?",options:["London","Paris","Berlin","Moscow"],correct:2,explanation:"The spy was in a cold Berlin cafe."}],[{text:"The agent completed the covert mission successfully.",hiddenWord:"mission",hint:"A special task (7 letters)"}],{scenario:"You must pass a message to a contact at a checkpoint.",characters:["Border Guard","You"],turns:[{narrator:"You approach the checkpoint. A stern guard examines your papers.",character:"Border Guard",question:'"What is the purpose of your visit to East Berlin?"',options:[{text:'"I am visiting my grandmother for her birthday. I have brought her favorite books as a gift." (The books contain hidden messages)',outcome:"survive",response:"The guard examines the books briefly and waves you through. Mission accomplished!",points:25},{text:`"I'm a spy and I have secret documents."`,outcome:"die",response:`The guard's eyes widen. "HALT! You are under arrest!"`,points:0},{text:'"Just... looking around?"',outcome:"neutral",response:'"Tourism? In East Berlin? Suspicious..." Increased scrutiny.',points:5}]}]},[{text:"The covert mission was completed without detection by the enemy",targetAccuracy:70,clueOnSuccess:"The code is about a special task",mode:"whisper"}],[{prompt:"Write a coded letter (30+ words) that appears innocent but contains a hidden message.",minWords:30,keywords:["mission","covert","espionage"],sampleAnswer:"Dearest Mother, life here in Berlin is quiet. The MISSION to find your recipe book continues. The COVERT garden behind the house blooms beautifully. I practice ESPIONAGE - I mean gardening - every weekend. Please write back soon. Your loving son."}],[{text:"The espionage mission was classified as top secret.",speed:"normal"}],[{question:'"Espionage" means:',options:["Exercise","Spying","Cooking","Reading"],correct:1,explanation:"Espionage is the practice of spying.",codeFragment:"MIS"},{question:'Reported: "I will go" → He said he ___',options:["will go","would go","goes","going"],correct:1,explanation:"will → would in reported speech.",codeFragment:"SI"},{question:'"Covert" means:',options:["Open","Secret","Covered","Obvious"],correct:1,explanation:"Covert means secret or hidden.",codeFragment:"ON"}],15,1800,200),Va(5,"The Future: 2150 AD","You arrive in a future where all knowledge is at risk of being lost.","integration","The time machine leaps forward to 2150 AD. A catastrophic event has wiped most digital records. Humanity is trying to reconstruct knowledge from fragments. You must integrate everything you've learned from every era to help preserve language itself.","The knowledge is preserved. One final time jump remains.","https://loremflickr.com/1920/1080/historical,ancient,history?lock=13","🌐","The Knowledge Sphere","ARCHIVE","A collection of historical records (7 letters)","Integration: Preserving Knowledge","Combining all skills to preserve language across time.",[{title:"The Archive",type:"text",content:`You must rebuild the ARCHIVE:

From Egypt: vocabulary of civilization
From Medieval England: the art of listening to commands
From Renaissance Italy: reading coded masterpieces
