 energy or passion",translation:"fuego / pasión",example:"There is a fire in her eyes when she talks about music.",ccq:"Does fire here mean a real flame or a strong feeling?"}]},{start:9,end:16,text:"Reaching a fever pitch and it's bringing me out the dark",highlights:[{word:"fever pitch",type:"idiom",definition:"A state of extreme excitement or emotional intensity",translation:"estado de máxima tensión",example:"Excitement reached a fever pitch before the concert.",ccq:"Is fever pitch calm and quiet, or highly intense?"},{word:"bringing",type:"phrasal_verb",definition:"Bring out: to reveal or rescue from something",translation:"sacar / revelar",example:"Her advice brought me out of the dark.",ccq:"Was the person happy or sad before being brought out?"}]},{start:17,end:24,text:"Finally, I can see you crystal clear",highlights:[{word:"crystal",type:"vocab",definition:"Extremely transparent, perfectly clear",translation:"cristalino",example:"The instructions are crystal clear.",ccq:"Is there confusion when something is crystal clear?"}]},{start:25,end:32,text:"Go ahead and sell me out and I'll lay your ship bare",highlights:[{word:"sell",type:"phrasal_verb",definition:"Sell out: betray someone for personal gain",translation:"traicionar",example:"He sold us out to the competition.",ccq:"Is selling out an act of loyalty or betrayal?"}]}],miniLessons:[{id:"lesson-1",timeMarker:8,title:"Intensity, Metaphors & Emotion",contentCards:[{heading:"Form & Structure",htmlBody:`<p class="text-fuchsia-500 dark:text-fuchsia-400 font-bold border-l-4 border-fuchsia-500 pl-3 mb-3">FORM</p>
            <p>We use compound nouns like <span class="px-1.5 py-0.5 bg-amber-500/15 text-amber-600 dark:text-amber-300 rounded font-semibold">"fever pitch"</span> and present-continuous metaphors such as <span class="px-1.5 py-0.5 bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 rounded font-semibold">"fire starting"</span> to convey escalation.</p>
            <p class="mt-3">Structurally: noun + adjective for "fever pitch", and gerund-noun for "fire starting".</p>`},{heading:"Meaning & Use",htmlBody:`<p class="text-cyan-500 dark:text-cyan-400 font-bold border-l-4 border-cyan-500 pl-3 mb-3">MEANING</p>
            <p><span class="px-1.5 py-0.5 bg-amber-500/15 text-amber-600 dark:text-amber-300 rounded font-semibold">Fever pitch</span> = intensity so high it feels like a fever.</p>
            <p class="mt-3"><span class="px-1.5 py-0.5 bg-pink-500/15 text-pink-600 dark:text-pink-300 rounded font-semibold">Bring out of the dark</span> = reveal the truth, rescue from ignorance.</p>
            <p class="text-emerald-500 dark:text-emerald-400 font-bold border-l-4 border-emerald-500 pl-3 mt-5 mb-3">USE</p>
            <p>Use these in emotional, artistic, or high-stakes contexts: sports finals, exam stress, public events, romantic intensity.</p>`},{heading:"Personalized Examples",htmlBody:`<p class="text-purple-500 dark:text-purple-400 font-bold border-l-4 border-purple-500 pl-3 mb-3">PERSONALIZED FOR YOU</p>
            <ul class="list-disc list-inside space-y-2">
              <li>"Before my IELTS exam, my anxiety reached a <span class="px-1 bg-amber-500/15 text-amber-600 dark:text-amber-300 rounded font-semibold">fever pitch</span>."</li>
              <li>"Your feedback <span class="px-1 bg-pink-500/15 text-pink-600 dark:text-pink-300 rounded font-semibold">brought me out of the dark</span> about my pronunciation."</li>
              <li>"There's <span class="px-1 bg-emerald-500/15 text-emerald-600 dark:text-emerald-300 rounded font-semibold">a fire starting</span> in my career."</li>
            </ul>`}],ccqs:[{question:"How can you use 'fever pitch' to describe your prep for an English exam?",checklist:["Use 'reached'","Express high intensity","Mention timing","Say 'pitch'"]},{question:"Can 'bringing out of the dark' refer to learning a new grammar feature?",checklist:["Mention 'understanding'","Compare to ignorance","Explain clarity"]},{question:"Describe a moment something 'started a fire' in your heart.",checklist:["Use past tense","Mention emotion","Use 'fire' figuratively"]}],activities:[{type:"gapFill",title:"Gap Fill Mastery",instruction:"Fill in the missing word from each lyric using the context.",cards:[{question:"The anticipation reached a ____ pitch before the release.",instruction:"Choose the word meaning extreme intensity.",options:["fever","hot","high"],answer:"fever",feedbackCorrect:'Excellent! "Fever pitch" is the perfect intensity idiom.',feedbackIncorrect:"Think about a sickness that makes you very hot — that intensity!"},{question:"She finally brought me ____ the dark with her honesty.",instruction:"Pick the correct preposition phrase for revealing truth.",options:["out of","into","from"],answer:"out of",feedbackCorrect:'Spot on! "Bring out of" reveals or rescues.',feedbackIncorrect:"Remember: we come OUT OF the dark, not into it."}]},{type:"scramble",title:"Idiom Word Scramble",instruction:"Unscramble the lyric vocabulary word.",cards:[{question:"Unscramble the word meaning extreme intensity:",instruction:"Five letters, related to high temperature feeling.",scrambled:"refev",answer:"fever"},{question:"Unscramble the word meaning transparent:",instruction:"Seven letters, gem-related.",scrambled:"larstyc",answer:"crystal"}]},{type:"multipleChoice",title:"Meaning Detective",instruction:"Pick the correct meaning of the lyric.",cards:[{question:"What does 'bringing me out the dark' suggest emotionally?",instruction:"Think about light vs darkness as a metaphor.",options:["Falling into despair","Finding clarity / hope","Going to sleep"],answer:"Finding clarity / hope"}]},{type:"trueFalse",title:"Fact Check",instruction:"Decide if the statement matches the song meaning.",cards:[{question:"'Fever pitch' means feeling slightly bored.",instruction:"True or False?",answer:!1}]},{type:"match",title:"Match Idioms to Meanings",instruction:"Pair each idiom on the left with its meaning on the right.",cards:[{question:"Match each phrase to its meaning:",instruction:"Click pairs to connect.",pairs:[{left:"Fever pitch",right:"Extreme intensity"},{left:"Crystal clear",right:"Easy to understand"},{left:"Sell out",right:"Betray for gain"}],answer:"all"}]},{type:"ordering",title:"Lyric Reordering",instruction:"Drag the lyric chunks into the original order.",cards:[{question:"Order the lyric correctly:",instruction:"Drag pieces into the original sequence.",ordering:["fever pitch","and it's bringing me","Reaching a","out the dark"],correctOrder:["Reaching a","fever pitch","and it's bringing me","out the dark"],answer:"order"}]},{type:"dictation",title:"Dictation Drill",instruction:"Listen and type exactly what you hear.",cards:[{question:"Type the lyric you hear:",instruction:"Click play and write the full sentence.",answer:"There's a fire starting in my heart"}]},{type:"errorCorrection",title:"Spot the Error",instruction:"Fix the grammar mistake in the sentence.",cards:[{question:"Correct the sentence:",instruction:"Find one small error and rewrite it.",mistakeText:"There a fire starting in my heart.",correctedText:"There's a fire starting in my heart.",answer:"there's a fire starting in my heart"}]},{type:"sentenceBuilder",title:"Build the Sentence",instruction:"Drag the words to build a meaningful lyric.",cards:[{question:"Build the lyric:",instruction:"Drag tiles into order.",sentenceParts:["Finally","I","can","see","you","crystal","clear"],correctOrder:["Finally","I","can","see","you","crystal","clear"],answer:"order"}]},{type:"findMistake",title:"Find the Mistake",instruction:"Click the wrong word in the lyric.",cards:[{question:"Click the wrong word:",instruction:"There is one swapped word in the lyric.",sentenceParts:["Finally","I","can","hear","you","crystal","clear"],answer:"hear",feedbackCorrect:'Yes! It should be "see" not "hear".',feedbackIncorrect:"Listen again — focus on a sense verb."}]},{type:"dragDrop",title:"Drag & Drop Categories",instruction:"Drop each word into the correct emotion bucket.",cards:[{question:"Categorize: which words show INTENSITY?",instruction:"Drag positive intensity words to the right zone.",options:["fever","crystal","fire","dark"],answer:["fever","fire"]}]},{type:"discussionQuestions",title:"Speaking Discussion",instruction:"Discuss the question out loud — record yourself.",cards:[{question:'When was the last time something "started a fire" in your heart?',instruction:"Speak for 30 seconds.",prompt:"Use past tense, an emotion word, and a metaphor.",answer:"open"}]}],challenge:{type:"karaoke",title:"Karaoke Sync Challenge",instruction:"Sing along — your microphone tracks pronunciation.",data:{lines:["There's a fire starting in my heart","Reaching a fever pitch and it's bringing me out the dark","Finally, I can see you crystal clear"]}},catFeedback:"You are doing incredibly well! Meow-nificent comprehension of these idioms!"},{id:"lesson-2",timeMarker:24,title:"Betrayal, Predictions & Hypothetical Speech",contentCards:[{heading:"Phrasal Verbs of Betrayal",htmlBody:`<p class="text-pink-500 dark:text-pink-400 font-bold border-l-4 border-pink-500 pl-3 mb-3">FORM</p>
            <p><span class="px-1.5 py-0.5 bg-pink-500/15 text-pink-600 dark:text-pink-300 rounded font-semibold">Sell out</span> = phrasal verb (sell + out). Used transitively: "He sold ME out."</p>
            <p class="text-cyan-500 dark:text-cyan-400 font-bold border-l-4 border-cyan-500 pl-3 mt-5 mb-3">MEANING</p>
            <p>To betray someone, often for money or personal advantage.</p>`},{heading:"Use & Personalized Examples",htmlBody:`<p class="text-emerald-500 dark:text-emerald-400 font-bold border-l-4 border-emerald-500 pl-3 mb-3">USE</p>
            <p>Use in trust-related conversations, news headlines, and emotional reflection on past events.</p>
            <ul class="list-disc list-inside space-y-2 mt-3">

            <h4 class="text-xs font-mono uppercase tracking-widest text-zinc-400 font-bold">Interactive Mini-Lessons</h4>
            <span class="text-[10px] text-zinc-500 font-mono">Triggers automatically during playback</span>
          </div>
          <div id="mini-lessons-list" class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar">
            \x3C!-- Rendered dynamically -->
          </div>
        </div>
      </div>
    </section>

    \x3C!-- VIEW 2: STUDIO KARAOKE -->
    <section id="view-karaoke" class="hidden flex-col gap-6">
      <div class="glass-panel rounded-3xl p-6 border border-zinc-800 flex flex-col gap-6 relative overflow-hidden">
        
        \x3C!-- AUDIO SPECTRUM VISUALIZER CANVAS -->
        <div class="h-28 w-full bg-zinc-950/90 rounded-2xl border border-zinc-800/80 relative overflow-hidden flex items-center justify-center">
          <canvas id="karaoke-canvas" class="w-full h-full"></canvas>
          <div class="absolute top-3 left-4 flex items-center gap-2 text-xs font-mono text-fuchsia-400">
            <span class="w-2 h-2 rounded-full bg-fuchsia-500 animate-ping"></span> Live Audio Frequency
          </div>
        </div>

        \x3C!-- SCROLLING KARAOKE LYRICS DISPLAY -->
        <div class="h-[420px] overflow-y-auto custom-scrollbar p-6 rounded-2xl bg-zinc-950/80 border border-zinc-800 flex flex-col gap-4 text-center" id="karaoke-lyrics-container">
          \x3C!-- Lyrics lines rendered dynamically -->
        </div>

        \x3C!-- KARAOKE FOOTER CONTROLS -->
        <div class="flex flex-wrap items-center justify-between gap-4 pt-2 border-t border-zinc-800">
          <div class="flex items-center gap-3">
            <button id="btn-karaoke-play" onclick="togglePlay()" class="px-6 py-3 rounded-2xl bg-gradient-to-r from-fuchsia-600 to-indigo-600 text-white font-black text-xs uppercase tracking-wider shadow-lg shadow-fuchsia-500/20">
              ▶ Start Karaoke
            </button>
            <button onclick="toggleMicrophone()" id="btn-mic" class="px-5 py-3 rounded-2xl bg-zinc-900 border border-zinc-800 text-zinc-300 font-bold text-xs uppercase tracking-wider hover:bg-zinc-800">
              🎙️ Mic Off
            </button>
          </div>

          <div class="flex items-center gap-2 text-xs font-mono text-zinc-400">
            <span>Score Multiplier: <strong class="text-emerald-400 font-bold">2.5x XP</strong></span>
          </div>
        </div>
      </div>
    </section>
  </main>

  \x3C!-- DICTIONARY & HIGHLIGHT MODAL -->
  <div id="dict-modal" class="fixed inset-0 z-[100] hidden items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md">
    <div class="glass-panel max-w-lg w-full rounded-3xl p-6 border border-zinc-700 shadow-2xl relative space-y-4">
      <button onclick="closeDictModal()" class="absolute top-4 right-4 text-zinc-400 hover:text-white text-lg">✕</button>
      <div class="flex items-start justify-between gap-3">
        <div>
          <span id="dict-type" class="text-[10px] font-mono uppercase tracking-widest px-2.5 py-1 rounded-md bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 font-bold">
            Vocabulary
          </span>
          <h3 id="dict-word" class="text-2xl font-black text-white mt-1">Word</h3>
        </div>
        <button onclick="speakCurrentDictWord()" class="p-3 rounded-2xl bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/40 text-indigo-300 text-lg">
          🔊
        </button>
      </div>
      <div class="space-y-3 text-sm">
        <div class="p-3.5 rounded-2xl bg-zinc-900/90 border border-zinc-800">
          <span class="text-xs font-mono uppercase text-zinc-500 font-bold block mb-1">Meaning & Context</span>
          <p id="dict-meaning" class="text-zinc-200 leading-relaxed"></p>
        </div>
        <div class="p-3.5 rounded-2xl bg-zinc-900/90 border border-zinc-800">
          <span class="text-xs font-mono uppercase text-zinc-500 font-bold block mb-1">Native L1 Translation</span>
          <p id="dict-translation" class="text-fuchsia-300 font-medium"></p>
        </div>
        <div class="p-3.5 rounded-2xl bg-zinc-900/90 border border-zinc-800">
          <span class="text-xs font-mono uppercase text-zinc-500 font-bold block mb-1">Example Sentence</span>
          <p id="dict-example" class="text-zinc-300 italic"></p>
        </div>
      </div>
      <button onclick="closeDictModal()" class="w-full py-3 bg-zinc-800 hover:bg-zinc-700 text-white font-bold text-xs uppercase tracking-wider rounded-2xl transition-all">
        Close
      </button>
    </div>
  </div>

  \x3C!-- CHALLENGE / MINI-LESSON MODAL (SECTIONED & COLOR CODED) -->
  <div id="challenge-modal" class="fixed inset-0 z-[110] hidden items-center justify-center p-4 bg-zinc-950/90 backdrop-blur-xl overflow-y-auto">
    <div class="glass-panel max-w-3xl w-full rounded-3xl p-6 border border-zinc-700 shadow-2xl relative space-y-6 max-h-[90vh] overflow-y-auto custom-scrollbar">
      
      \x3C!-- MODAL HEADER -->
      <div class="flex justify-between items-center border-b border-zinc-800 pb-4">
        <div class="flex items-center gap-3">
          <span class="px-3 py-1 rounded-full text-[10px] font-mono uppercase tracking-widest bg-fuchsia-500/20 text-fuchsia-300 border border-fuchsia-500/30 font-bold">
            Interactive Mini-Lesson
          </span>
          <span id="mini-title" class="text-base font-black text-white"></span>
        </div>
        <button onclick="closeChallengeModal()" class="px-4 py-1.5 rounded-full text-xs font-bold bg-amber-500/10 border border-amber-500/30 text-amber-300 hover:bg-amber-500/20">
          Resume Media ⏩
        </button>
      </div>

      \x3C!-- SECTIONED & COLOR-CODED LESSON CARDS -->
      <div id="mini-cards-container" class="space-y-4">
        \x3C!-- Rendered dynamically with clean callout boxes -->
      </div>

      \x3C!-- CCQ / PRACTICE SECTION -->
      <div id="ccq-container" class="p-5 rounded-2xl bg-zinc-900/90 border border-zinc-800 space-y-3">
        <h4 class="text-xs font-mono uppercase tracking-widest text-indigo-400 font-bold flex items-center gap-2">
          <span>🧠</span> Quick Concept Check
        </h4>
        <div id="ccq-questions" class="space-y-2"></div>
      </div>

      \x3C!-- CAT MASCOT FEEDBACK BOX -->
      <div class="p-4 rounded-2xl bg-gradient-to-r from-fuchsia-950/40 to-indigo-950/40 border border-fuchsia-500/30 flex items-center gap-4">
        <span class="text-3xl animate-bounce">😺</span>
        <div class="flex-1">
          <span class="text-[10px] font-mono uppercase tracking-widest text-fuchsia-400 font-bold block">Tutor Feedback</span>
          <p id="cat-feedback-text" class="text-xs text-zinc-200 font-medium">Read through the key concepts above and test your understanding!</p>
        </div>
      </div>

      \x3C!-- ACTION FOOTER -->
      <div class="flex justify-end gap-3 pt-2 border-t border-zinc-800">
        <button onclick="finishMiniLesson()" class="px-8 py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-white font-black text-xs uppercase tracking-wider rounded-2xl shadow-lg shadow-emerald-500/20 hover:scale-105 transition-all">
          Complete & Resume Song (+50 XP)
        </button>
      </div>
    </div>
  </div>

  \x3C!-- STANDALONE JS ENGINE -->
  <script>
    let currentView = 'player';
    let isPlaying = false;
    let score = 0;
    let currentTime = 0;
    let duration = 120;
    let triggeredIds = [];
    let micActive = false;
    let currentDictWordText = '';

    const audioEl = document.getElementById('audio-player');
    const videoEl = document.getElementById('video-player');

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      initSongSelector();
      loadCurrentLesson();
      setupAudioSynth();
      setupVisualizer();
    });

    function getActiveLesson() {
      return window.LESSONS_DATA[window.CURRENT_LESSON_INDEX] || window.LESSONS_DATA[0];
    }

    function initSongSelector() {
      const select = document.getElementById('song-select');
      const container = document.getElementById('song-selector-container');
      if (window.LESSONS_DATA.length > 1) {
        container.classList.remove('hidden');
        container.classList.add('flex');
        select.innerHTML = window.LESSONS_DATA.map((l, i) => \`<option value="\${i}">\${escapeHtmlStr(l.songTitle)} - \${escapeHtmlStr(l.artist)}</option>\`).join('');
      }
    }

    function changeLesson(idx) {
      window.CURRENT_LESSON_INDEX = parseInt(idx, 10);
      loadCurrentLesson();
    }

    function loadCurrentLesson() {
      const l = getActiveLesson();
      document.getElementById('header-title').innerText = l.songTitle;
      document.getElementById('header-artist').innerText = l.artist;
      document.getElementById('header-level').innerText = l.level || 'B2';

      // Profile banner
      if (l.learnerProfile) {
        document.getElementById('prof-name').innerText = l.learnerProfile.name || 'Learner';
        document.getElementById('prof-level').innerText = l.learnerProfile.level || l.level || 'B2';
        document.getElementById('prof-l1').innerText = 'Native: ' + (l.learnerProfile.l1 || 'Spanish');
        document.getElementById('prof-focus-goals').innerText = 'Goals: ' + (l.learnerProfile.goals || 'Fluency') + ' | Focus: ' + (l.learnerProfile.focus || 'Idioms');
      }

      renderMiniLessonMarkers(l);
      renderMiniLessonsList(l);
      renderKaraokeLyrics(l);
      renderSubtitles(0);
    }

    function switchView(mode) {
      currentView = mode;
      const btnPlayer = document.getElementById('tab-btn-player');
      const btnKaraoke = document.getElementById('tab-btn-karaoke');
      const viewPlayer = document.getElementById('view-player');
      const viewKaraoke = document.getElementById('view-karaoke');

      if (mode === 'player') {
        viewPlayer.classList.remove('hidden');
        viewPlayer.classList.add('flex');
        viewKaraoke.classList.add('hidden');
        btnPlayer.className = "px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-gradient-to-r from-fuchsia-600 to-indigo-600 text-white shadow-md";
        btnKaraoke.className = "px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all text-zinc-400 hover:text-white hover:bg-zinc-800";
      } else {
        viewPlayer.classList.add('hidden');
        viewKaraoke.classList.remove('hidden');
        viewKaraoke.classList.add('flex');
        btnKaraoke.className = "px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all bg-gradient-to-r from-fuchsia-600 to-indigo-600 text-white shadow-md";
        btnPlayer.className = "px-5 py-2 rounded-xl text-xs font-black uppercase tracking-wider transition-all text-zinc-400 hover:text-white hover:bg-zinc-800";
      }
    }

    // AUDIO SYNTHESIZER FALLBACK
    let audioCtx = null;
    let synthTimer = null;

    function setupAudioSynth() {
      audioEl.addEventListener('timeupdate', () => onTimeUpdate(audioEl.currentTime));
      audioEl.addEventListener('loadedmetadata', () => { duration = audioEl.duration || 120; document.getElementById('time-duration').innerText = formatTime(duration); });
    }

    function togglePlay() {
      if (audioEl.src) {
        if (isPlaying) { audioEl.pause(); isPlaying = false; }
        else { audioEl.play(); isPlaying = true; }
      } else {
        // Fallback synthetic play mode
        isPlaying = !isPlaying;
        if (isPlaying) startSynthPlayback();
        else stopSynthPlayback();
      }
      updatePlayBtnState();
    }

    function updatePlayBtnState() {
      const pBtn = document.getElementById('btn-play-pause');
      const kBtn = document.getElementById('btn-karaoke-play');
      if (pBtn) pBtn.innerText = isPlaying ? '⏸' : '▶';
      if (kBtn) kBtn.innerText = isPlaying ? '⏸ Pause Karaoke' : '▶ Start Karaoke';
    }

    function startSynthPlayback() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      synthTimer = setInterval(() => {
        currentTime += 0.5;
        if (currentTime > 180) currentTime = 0;
        onTimeUpdate(currentTime);
      }, 500);
    }

    function stopSynthPlayback() {
      if (synthTimer) clearInterval(synthTimer);
    }

    function onTimeUpdate(t) {
      currentTime = t;
      document.getElementById('time-current').innerText = formatTime(t);
      const pct = (t / (duration || 120)) * 100;
      document.getElementById('scrubber-progress').style.width = pct + '%';

      renderSubtitles(t);
      highlightKaraokeLine(t);
      checkMiniLessonTriggers(t);
    }

    function handleSeek(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const targetTime = (clickX / rect.width) * (duration || 120);
      currentTime = targetTime;
      if (audioEl.src) audioEl.currentTime = targetTime;
      onTimeUpdate(targetTime);
    }

    function rewind(s) {
      currentTime = Math.max(0, currentTime - s);
      if (audioEl.src) audioEl.currentTime = currentTime;
      onTimeUpdate(currentTime);
    }

    function forward(s) {
      currentTime = Math.min(duration || 120, currentTime + s);
      if (audioEl.src) audioEl.currentTime = currentTime;
      onTimeUpdate(currentTime);
    }

    function setPlaybackSpeed(s) {
      if (audioEl) audioEl.playbackRate = parseFloat(s);
    }

    function setVolume(v) {
      if (audioEl) audioEl.volume = parseFloat(v);
    }

    function toggleMute() {
      if (audioEl) audioEl.muted = !audioEl.muted;
      document.getElementById('btn-mute').innerText = audioEl.muted ? '🔇' : '🔊';
    }

    function handleAudioUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const url = URL.createObjectURL(file);
        audioEl.src = url;
        audioEl.play();
        isPlaying = true;
        updatePlayBtnState();
      }
    }

    // SUBTITLES & WORD HIGHLIGHTING
    function renderSubtitles(t) {
      const l = getActiveLesson();
      const container = document.getElementById('subtitles-container');
      if (!l.subtitles || l.subtitles.length === 0) {
        container.innerHTML = \`<p class="text-zinc-400 font-bold">No subtitles loaded</p>\`;
        return;
      }

      const activeSub = l.subtitles.find(s => t >= s.start && t <= s.end) || l.subtitles[0];
      if (!activeSub) return;

      const words = activeSub.text.split(' ');
      const html = words.map((w, idx) => {
        const clean = w.replace(/[.,/#!$%^&*;:{}=\\-_'~()?"']/g, '').toLowerCase();
        const matched = activeSub.highlights ? activeSub.highlights.find(h => h.word.toLowerCase() === clean) : null;
        if (matched) {
          const colorCls = matched.type === 'idiom' ? 'bg-amber-500/25 text-amber-300 border-amber-500/40' :
                           matched.type === 'phrasal_verb' ? 'bg-pink-500/25 text-pink-300 border-pink-500/40' :
                           matched.type === 'vocab' ? 'bg-cyan-500/25 text-cyan-300 border-cyan-500/40' : 'bg-emerald-500/25 text-emerald-300 border-emerald-500/40';
          return \`<span onclick='openHighlightModal(\${JSON.stringify(matched).replace(/'/g, "&apos;")})' class="inline-block mx-1 px-2 py-0.5 rounded-lg font-bold border cursor-pointer hover:scale-110 transition-transform \${colorCls}">\${w}</span>\`;
        }
        return \`<span onclick="openWordDict('\${clean}')" class="inline-block mx-1 cursor-pointer hover:text-fuchsia-400 transition-colors font-extrabold text-2xl lg:text-3xl text-white tracking-tight">\${w}</span>\`;
      }).join(' ');

      container.innerHTML = \`
        <div class="space-y-2 animate-pulse-subtle">
          <p class="leading-relaxed">\${html}</p>
          \${activeSub.translation ? \`<p class="text-xs text-zinc-400 font-medium italic">\${activeSub.translation}</p>\` : ''}
        </div>
      \`;
    }

    // MINI-LESSONS & MARKERS
    function renderMiniLessonMarkers(l) {
      const container = document.getElementById('mini-lesson-markers');
      if (!l.miniLessons) return;
      const total = duration || 120;
      container.innerHTML = l.miniLessons.map(ml => {
        const pos = (ml.timeMarker / total) * 100;
        return \`<div onclick="triggerMiniLessonById('\${ml.id}')" style="left:\${pos}%" class="absolute top-0 bottom-0 w-3 -ml-1.5 bg-fuchsia-500 rounded-full cursor-pointer hover:scale-150 transition-transform shadow-lg shadow-fuchsia-500/50" title="\${escapeHtmlStr(ml.title)}"></div>\`;
      }).join('');
    }

    function renderMiniLessonsList(l) {
      const container = document.getElementById('mini-lessons-list');
      if (!l.miniLessons) { container.innerHTML = ''; return; }
      container.innerHTML = l.miniLessons.map(ml => \`
        <div onclick="triggerMiniLessonById('\${ml.id}')" class="min-w-[220px] p-4 rounded-2xl bg-zinc-900/90 border border-zinc-800 hover:border-fuchsia-500/50 cursor-pointer transition-all flex flex-col justify-between">
          <div>
            <span class="text-[9px] font-mono uppercase px-2 py-0.5 rounded bg-fuchsia-500/20 text-fuchsia-300 font-bold">\${formatTime(ml.timeMarker)}</span>
            <h5 class="text-xs font-black text-white mt-1.5 line-clamp-1">\${escapeHtmlStr(ml.title)}</h5>
          </div>
          <span class="text-[10px] text-indigo-400 font-bold mt-2">Start Challenge →</span>
        </div>
      \`).join('');
    }

    function checkMiniLessonTriggers(t) {
      const l = getActiveLesson();
      if (!l.miniLessons) return;
      const ml = l.miniLessons.find(m => Math.abs(m.timeMarker - t) < 0.6 && !triggeredIds.includes(m.id));
      if (ml) {
        if (isPlaying) togglePlay();
        triggeredIds.push(ml.id);
        openChallengeModal(ml);
      }
    }

    function triggerMiniLessonById(id) {
      const l = getActiveLesson();
      const ml = l.miniLessons ? l.miniLessons.find(m => m.id === id) : null;
      if (ml) openChallengeModal(ml);
    }

    // MODAL HANDLERS
    function openHighlightModal(h) {
      currentDictWordText = h.word;
      document.getElementById('dict-type').innerText = h.type.replace('_', ' ').toUpperCase();
      document.getElementById('dict-word').innerText = h.word;
      document.getElementById('dict-meaning').innerText = h.meaning || 'Core language feature in this lyric.';
      document.getElementById('dict-translation').innerText = h.translation || '';
      document.getElementById('dict-example').innerText = h.example || '';
      document.getElementById('dict-modal').classList.remove('hidden');
      document.getElementById('dict-modal').classList.add('flex');
    }

    function openWordDict(w) {
      currentDictWordText = w;
      document.getElementById('dict-type').innerText = 'DICTIONARY';
      document.getElementById('dict-word').innerText = w;
      document.getElementById('dict-meaning').innerText = 'Vocabulary term from song lyric.';
      document.getElementById('dict-translation').innerText = 'Contextual translation available in full lesson.';
      document.getElementById('dict-example').innerText = 'Usage: ' + w;
      document.getElementById('dict-modal').classList.remove('hidden');
      document.getElementById('dict-modal').classList.add('flex');
    }

    function closeDictModal() {
      document.getElementById('dict-modal').classList.add('hidden');
      document.getElementById('dict-modal').classList.remove('flex');
    }

    function speakCurrentDictWord() {
      if ('speechSynthesis' in window && currentDictWordText) {
        const u = new SpeechSynthesisUtterance(currentDictWordText);
        u.rate = 0.9;
        window.speechSynthesis.speak(u);
      }
    }

    // CHALLENGE MODAL (WITH COLOR-CODED & SECTIONED MINI-LESSONS)
    function openChallengeModal(ml) {
      document.getElementById('mini-title').innerText = ml.title;
      
      // Render Content Cards cleanly sectioned
      const container = document.getElementById('mini-cards-container');
      if (ml.contentCards && ml.contentCards.length > 0) {
        container.innerHTML = ml.contentCards.map((c, i) => \`
          <div class="p-5 rounded-2xl bg-zinc-900 border border-zinc-800 space-y-2">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-fuchsia-500"></span>
              <h4 class="text-sm font-black text-fuchsia-300 uppercase tracking-wide">\${escapeHtmlStr(c.heading)}</h4>
            </div>
            <div class="text-xs text-zinc-300 leading-relaxed font-normal space-y-2">
              \${c.htmlBody}
            </div>
          </div>
        \`).join('');
      } else {
        container.innerHTML = \`<div class="p-4 rounded-xl bg-zinc-900 text-xs text-zinc-300">\${escapeHtmlStr(ml.explanation || 'Key concept breakdown')}</div>\`;
      }

      // Render CCQs
      const ccqBox = document.getElementById('ccq-questions');
      if (ml.ccqs && ml.ccqs.length > 0) {
        ccqBox.innerHTML = ml.ccqs.map((q, i) => \`
          <label class="flex items-start gap-3 p-3 rounded-xl bg-zinc-950 border border-zinc-800 cursor-pointer hover:border-indigo-500/50">
            <input type="checkbox" onchange="addScore(15)" class="mt-0.5 accent-indigo-500" />
            <span class="text-xs text-zinc-200 font-medium">\${escapeHtmlStr(q.question || q)}</span>
          </label>
        \`).join('');
      } else {
        ccqBox.innerHTML = \`<p class="text-xs text-zinc-400">Reflect on how this pattern applies to your conversation fluency.</p>\`;
      }

      document.getElementById('challenge-modal').classList.remove('hidden');
      document.getElementById('challenge-modal').classList.add('flex');
    }

    function closeChallengeModal() {
      document.getElementById('challenge-modal').classList.add('hidden');
      document.getElementById('challenge-modal').classList.remove('flex');
    }

    function finishMiniLesson() {
      addScore(50);
      closeChallengeModal();
      if (!isPlaying) togglePlay();
    }

    function addScore(pts) {
      score += pts;
      document.getElementById('score-counter').innerText = score;
    }

    // KARAOKE LYRICS & AUDIO VISUALIZER
    function renderKaraokeLyrics(l) {
      const container = document.getElementById('karaoke-lyrics-container');
      if (!l.subtitles || l.subtitles.length === 0) {
        container.innerHTML = \`<p class="text-zinc-500">No lyrics available</p>\`;
        return;
      }
      container.innerHTML = l.subtitles.map((s, i) => \`
        <div id="k-line-\${i}" onclick="seekToLine(\${s.start})" class="p-3 rounded-2xl transition-all cursor-pointer hover:bg-zinc-900 text-zinc-400 font-bold text-lg lg:text-xl">
          <p class="text-white font-black tracking-tight">\${escapeHtmlStr(s.text)}</p>
          \${s.translation ? \`<p class="text-xs text-zinc-500 font-normal mt-1">\${escapeHtmlStr(s.translation)}</p>\` : ''}
        </div>
      \`).join('');
    }

    function highlightKaraokeLine(t) {
      const l = getActiveLesson();
      if (!l.subtitles) return;
      l.subtitles.forEach((s, i) => {
        const el = document.getElementById(\`k-line-\${i}\`);
        if (!el) return;
        if (t >= s.start && t <= s.end) {
          el.className = "p-4 rounded-2xl transition-all bg-gradient-to-r from-fuchsia-600/30 to-indigo-600/30 border border-fuchsia-500/50 text-white font-black text-2xl scale-105 shadow-xl shadow-fuchsia-500/10";
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        } else {
          el.className = "p-3 rounded-2xl transition-all cursor-pointer hover:bg-zinc-900 text-zinc-400 font-bold text-lg lg:text-xl opacity-60";
        }
      });
    }

    function seekToLine(start) {
      currentTime = start;
      if (audioEl.src) audioEl.currentTime = start;
      onTimeUpdate(start);
    }

    function toggleMicrophone() {
      micActive = !micActive;

      const ctx = canvas.getContext('2d');
      function draw() {
        requestAnimationFrame(draw);
        canvas.width = canvas.clientWidth;
        canvas.height = canvas.clientHeight;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const width = canvas.width / bars;

        }
      }
      draw();
    }

      document.documentElement.classList.toggle('dark');
