te:o=>{i(l=>({completedPages:l.completedPages.includes(o)?l.completedPages:[...l.completedPages,o]}))},toggleSound:()=>i(o=>({soundEnabled:!o.soundEnabled})),setTtsVoice:o=>i({ttsVoice:o}),toggleCatMuted:()=>i(o=>({catMuted:!o.catMuted})),setShowConfetti:o=>i({showConfetti:o}),reset:()=>i({lesson:null,currentPage:0,totalPages:0,showConfetti:!1,...fy})}),{name:"tutorly-learner",partialize:i=>({name:i.name,photo:i.photo,xp:i.xp,level:i.level,badges:i.badges,completedActivities:i.completedActivities,activityAnswers:i.activityAnswers,completedPages:i.completedPages,soundEnabled:i.soundEnabled,ttsVoice:i.ttsVoice,catMuted:i.catMuted,lesson:i.lesson})})),my={id:"lesson-001",title:"The World of Innovation",level:"B2 – Upper Intermediate",topic:"Technology, Society & Human Connection",tutor:"Tutorly",learnerName:"Learner",date:new Date().toLocaleDateString("en-US",{year:"numeric",month:"long",day:"numeric"}),description:"An immersive journey through language, culture, and critical thinking.",coverTagline:"Your personalised English adventure starts here.",sections:[{id:"sec-reading-factual",type:"reading-factual",title:"The Digital Revolution: How Technology Reshaped Humanity",imageQuery:"digital technology innovation future city",content:`The term "digital revolution" is thrown around so often these days that it has almost lost its punch. Yet when you step back and examine the sheer scale of the transformation that has taken place over the last four decades, the word "revolution" seems not just appropriate but perhaps even an understatement.

      Consider this: in 1980, there were fewer than one million personal computers in the entire world. Today, more than five billion people carry a supercomputer in their pocket. The smartphone — a device that would have seemed like pure science fiction to the average person in 1990 — has become as mundane and indispensable as a wristwatch, except far more powerful than any wristwatch ever dreamed of being.

      But the digital revolution is not simply a story about gadgets and convenience. At its core, it is a story about the fundamental restructuring of human society — how we work, how we learn, how we fall in love, how we grieve, how we shop, how we vote, and even how we define ourselves. The ripple effects of digitisation have reached into virtually every corner of human activity, and the pace of change shows no sign of slowing down.

      The internet, first conceived as a military communications network in the late 1960s, began its transformation into a public utility in the early 1990s. By the mid-2000s, social media platforms had emerged, and the way people communicated began to shift dramatically. No longer were we simply consumers of information — we had become producers too. User-generated content, citizen journalism, and viral culture were born almost overnight, fundamentally disrupting traditional media empires that had dominated public discourse for generations.

      In the workplace, automation and artificial intelligence are rewriting the rules of employment. Tasks that once required years of training can now be performed by algorithms in milliseconds. Entire industries — from banking to legal services, from medicine to manufacturing — are being reinvented. While some jobs are disappearing, new categories of work are emerging that we could not have anticipated even a decade ago. The World Economic Forum estimates that by 2030, 85 million jobs may be displaced by a shift in the division of labour between humans and machines, while 97 million new roles may emerge that are more adapted to the new division of labour.

      Education, too, has been upended. The pandemic of 2020 accelerated a shift to online learning that was already underway, compressing what might have been a decade of gradual change into a matter of weeks. Suddenly, teachers who had never used video conferencing tools were hosting virtual classrooms, and students around the world were navigating the peculiar challenges of learning from their bedrooms. The experiment was imperfect, often frustrating, and illuminated stark inequalities in access to technology and reliable internet connections. Yet it also demonstrated the remarkable adaptability of educators and students alike.

      Healthcare stands as perhaps the most promising frontier for digital transformation. Telemedicine, wearable health monitors, AI-assisted diagnostics, and the use of big data to track and predict disease outbreaks are already saving lives. During the COVID-19 pandemic, digital tools proved invaluable for tracking the spread of the virus, coordinating global vaccination campaigns, and enabling remote medical consultations for millions of patients who might otherwise have gone without care.

      Yet for all its promise, the digital revolution also casts a long shadow. Privacy has become an increasingly precious and endangered commodity. Tech giants harvest vast quantities of personal data — our searches, our purchases, our social connections, our physical movements — and deploy this data to target us with advertisements, to influence our behaviour, and in some cases to sell to third parties whose intentions are far from benign. The Cambridge Analytica scandal of 2018 revealed the alarming ease with which personal data could be weaponised to manipulate democratic elections, sending shockwaves through governments and civil society organisations around the world.

      The spread of misinformation online represents another profound challenge. In a media landscape where anyone can publish anything, distinguishing fact from fiction has become genuinely difficult. False information travels faster than true information on social media platforms, a phenomenon that researchers at MIT have documented empirically. The consequences range from the merely embarrassing — viral myths about everyday health — to the genuinely dangerous, as when vaccine misinformation contributed to outbreaks of preventable diseases.

      Perhaps most subtly, the digital revolution has begun to reshape our inner lives in ways we are only beginning to understand. Psychologists have raised concerns about the effects of social media on mental health, particularly among adolescents. The relentless pressure to curate a perfect online persona, the anxiety induced by comparison with the carefully filtered highlights of other people's lives, and the addictive design features built into social platforms by engineers who understand the neuroscience of reward loops — all of these are leaving marks on the psychological landscape of an entire generation.

      And yet, it would be a mistake to fall into the trap of pure technological pessimism. The digital revolution has also been a force for extraordinary liberation. In countries with repressive governments, the internet has given dissidents and activists tools to organise and communicate beyond the reach of censors. In remote communities, it has brought access to medical information, educational resources, and economic opportunities that would otherwise have been entirely out of reach. It has connected diaspora communities, enabled people with rare conditions to find one another, and given voice to stories and perspectives that mainstream media would never have deemed newsworthy.

      The task ahead of us — as individuals, as societies, and as a global community — is not to resist the digital revolution, which would be as futile as trying to hold back the tide, but to shape it. To put in place the ethical frameworks, the regulatory structures, and the cultural norms that will allow us to harness its extraordinary potential while guarding against its very real dangers. That is the defining challenge of our age.`,vocabulary:[{word:"mundane",definition:"Lacking interest or excitement; dull and ordinary",partOfSpeech:"adjective",example:"Checking emails had become a mundane part of the morning routine.",synonyms:["ordinary","commonplace","banal"],difficulty:"intermediate"},{word:"indispensable",definition:"Absolutely necessary; essential",partOfSpeech:"adjective",example:"The smartphone has become indispensable to modern life.",synonyms:["essential","vital","crucial"],difficulty:"intermediate"},{word:"ripple effect",definition:"A situation in which one event produces effects which spread and produce further effects",partOfSpeech:"noun phrase",example:"The factory closure had a ripple effect throughout the local economy.",synonyms:["knock-on effect","chain reaction"],difficulty:"intermediate"},{word:"upended",definition:"Completely changed or turned upside down",partOfSpeech:"verb (past participle)",example:"The pandemic upended traditional working patterns overnight.",synonyms:["disrupted","overturned","revolutionised"],difficulty:"advanced"},{word:"benign",definition:"Gentle and kindly; not harmful",partOfSpeech:"adjective",example:"Not all companies collecting data have benign intentions.",synonyms:["harmless","gentle","innocent"],difficulty:"advanced"},{word:"empirically",definition:"In a way that is based on observation or experiment rather than theory",partOfSpeech:"adverb",example:"The researchers empirically documented that false news spreads faster.",synonyms:["experimentally","observationally"],difficulty:"advanced"},{word:"diaspora",definition:"The dispersion of people from their original homeland",partOfSpeech:"noun",example:"The internet has helped diaspora communities maintain their cultural identity.",synonyms:["dispersion","migration","scattering"],difficulty:"advanced"},{word:"futile",definition:"Incapable of producing any useful result; pointless",partOfSpeech:"adjective",example:"Resisting all digital change would be as futile as fighting the tide.",synonyms:["pointless","useless","hopeless"],difficulty:"intermediate"}],activities:[{id:"act-rf-1",type:"multiple-choice",question:"According to the article, approximately how many personal computers existed in 1980?",options:["Fewer than one million","About five billion","More than ten million","Around fifty thousand"],correctAnswer:"Fewer than one million",xpReward:10},{id:"act-rf-2",type:"true-false",question:"The article states that true information travels faster than false information on social media.",options:["True","False"],correctAnswer:"False",xpReward:10},{id:"act-rf-3",type:"multiple-choice",question:"What does the World Economic Forum estimate about jobs by 2030?",options:["85 million jobs displaced, 97 million new roles may emerge","97 million jobs displaced, 85 million new roles may emerge","All jobs will be automated by machines","No significant job changes will occur"],correctAnswer:"85 million jobs displaced, 97 million new roles may emerge",xpReward:10},{id:"act-rf-4",type:"fill-blanks",question:"Complete the sentences from the article.",blanks:[{id:"b1",sentence:"The internet was first conceived as a _____ communications network in the late 1960s.",answer:"military",hint:"Think about who funded early internet research."},{id:"b2",sentence:"The Cambridge Analytica scandal revealed how personal data could be _____ to manipulate democratic elections.",answer:"weaponised",hint:"It was used as a weapon."}],xpReward:15},{id:"act-rf-5",type:"discussion",question:"Critical Thinking Discussion",discussionPoints:["Do you think the benefits of the digital revolution outweigh its risks? Give specific examples.","How has technology changed your personal daily routine over the past five years?","Should governments have the power to regulate what people post on social media? Why or why not?","What skills do you think will be most valuable in the job market of 2030?"],xpReward:20}]},{id:"sec-reading-fictional",type:"reading-fictional",title:"The Last Signal",imageQuery:"astronaut space station lonely cosmos stars",content:`Commander Elena Vasquez pressed her palm against the cold observation window and stared into the void. Three hundred and seventy-two days. That was how long she had been alone on Station Meridian, orbiting a planet that no longer responded to her signals.

      The evacuation had happened fast — faster than any of them had been prepared for. One moment the crew of fourteen had been conducting routine atmospheric experiments; the next, a cascade of system failures had triggered Protocol Seven, and twelve of them had bundled into the emergency descent pods before Elena could even reach the main airlock. Dr. Okonkwo had stayed behind — briefly — to help her with the malfunctioning navigation array, but when that particular battle had been lost, he had looked at her with eyes full of something she could not quite name and said, "You'll find a way, Commander. You always do."

      She had not told him how terrified she was.

      Earth had gone quiet on day forty-seven. Not gradually — not the slow fading of a radio signal as you drive through a tunnel — but instantaneously, completely, as though someone had thrown a switch. One moment there was Mission Control's familiar chatter, the warmth of Director Chen's measured voice walking her through the power rationing protocols; the next, static. Pure, white, indifferent static.

      She had spent weeks convinced it was a technical fault. She had dismantled the communications array and rebuilt it three times. She had recalibrated every antenna on the station, crawling through maintenance shafts in the dead of the night cycle with a headlamp and a wrench, talking to herself in a steady murmur just to fill the silence. She had sent thousands of messages on every frequency available to her, messages that ranged from the professionally terse to the increasingly desperate to the almost embarrassingly personal.

      No reply ever came.

      By day one hundred, she had begun to construct an alternative psychological reality for herself, one in which the silence was simply a test — an unusually prolonged and cruel test, yes, but a test nonetheless. Mission psychologists had warned them all about the dangers of isolation. She had read the briefings, attended the workshops, practised the mindfulness exercises that now struck her as almost comically inadequate preparation for what she was experiencing. But she clung to the test theory because the alternative — that something had happened to Earth that precluded any possibility of response — was a thought she could only approach from a very great psychological distance.

      Then on day three hundred and twelve, she had seen it.

      At 03:47 station time, during her regular scan of the planet's surface with the long-range optical array, she had picked up a signal. Not from Earth — from the dark side of the moon. A rhythmic pulse, seven beats repeated at precise twelve-second intervals, unlike anything in the natural electromagnetic spectrum. Unlike anything, moreover, in any of the signal databases she had access to — and those databases were comprehensive.

      She had sat for four hours in the observation module, headphones clamped over her ears, recording the signal and checking and rechecking her instruments for faults. There were none. The signal was real, it was artificial, and it was not coming from any human-made installation she knew of.

      Elena Vasquez had always been a scientist first. Scientists form hypotheses and test them. They do not allow fear or hope or longing to contaminate their reasoning. She had told herself this approximately nine hundred times over the past sixty days, with varying degrees of success.

      She pressed her palm flat against the window, feeling the cold radiate into her skin, and watched the slow silver sweep of the moon's limb crossing her field of view.

      Seven beats. Twelve seconds. Then silence. Then seven beats again.

      Someone — something — was calling out into the dark.

      And for the first time in three hundred and seventy-two days, Elena Vasquez found herself reaching back.`,vocabulary:[{word:"cascade",definition:"A large number of things happening rapidly in succession",partOfSpeech:"noun",example:"A cascade of system failures brought the station to its knees.",synonyms:["series","succession","flood"],difficulty:"intermediate"},{word:"terse",definition:"Sparing in the use of words; brief and abrupt",partOfSpeech:"adjective",example:"Her messages ranged from professionally terse to deeply personal.",synonyms:["brief","curt","succinct"],difficulty:"advanced"},{word:"precluded",definition:"Prevented from happening; made impossible",partOfSpeech:"verb (past participle)",example:"The damage precluded any possibility of a normal response.",synonyms:["prevented","excluded","ruled out"],difficulty:"advanced"},{word:"rhythmic",definition:"Having or relating to a strong regular repeated pattern",partOfSpeech:"adjective",example:"A rhythmic pulse repeated at precise intervals.",synonyms:["regular","steady","patterned"],difficulty:"basic"},{word:"contaminate",definition:"Make something impure by exposure to a polluting substance; to spoil or corrupt",partOfSpeech:"verb",example:"She would not allow fear to contaminate her scientific reasoning.",synonyms:["corrupt","taint","pollute"],difficulty:"intermediate"}],activities:[{id:"act-fict-1",type:"multiple-choice",question:"How long has Commander Vasquez been alone on Station Meridian?",options:["47 days","100 days","312 days","372 days"],correctAnswer:"372 days",xpReward:10},{id:"act-fict-2",type:"true-false",question:"Earth's communication went silent gradually over several weeks.",options:["True","False"],correctAnswer:"False",xpReward:10},{id:"act-fict-3",type:"short-answer",question:"What did Commander Vasquez discover on day 312, and why was it significant?",xpReward:15},{id:"act-fict-4",type:"discussion",question:"Literary Discussion",discussionPoints:["How does the author create a sense of isolation and tension throughout the story?","What do you think the seven-beat signal might represent? Build a theory.",'Elena says she is a "scientist first" – how does this shape her response to her situation?',"What would you do if you were in Commander Vasquez's position?"],xpReward:20}]},{id:"sec-grammar",type:"grammar",title:"Perfect Tenses: Connecting Past to Present",imageQuery:"grammar learning education chalkboard classroom",content:`The perfect tenses are among the most important and nuanced structures in English grammar. They create a bridge between two time points — most commonly linking something in the past to its relevance in the present, or establishing the sequence of events in a narrative. Mastering the perfect tenses will dramatically improve both the accuracy and sophistication of your English.

      THE PRESENT PERFECT

      Form: have/has + past participle
      The present perfect is used to describe an action or experience that happened at an unspecified time in the past, or that started in the past and continues into the present.

      Key uses:
      1. Life experience: "I have visited Japan three times." (We don't know or care exactly when.)
      2. Recent events with present relevance: "She has just finished the report." (It's done now — relevant.)
      3. Duration from past to present: "We have lived here for ten years." (Still living here.)
      4. Change over time: "The world has changed dramatically since 1990."

      Signal words: already, yet, just, ever, never, recently, lately, for, since, so far, up to now.

      Common mistakes to avoid:
      ✗ "I have seen him yesterday." — Use simple past with specific time references.
      ✓ "I saw him yesterday." / "I have seen him recently."

      THE PRESENT PERFECT CONTINUOUS

      Form: have/has + been + present participle (-ing)
      This tense emphasises the duration or ongoing nature of an activity that started in the past and continues into the present (or has just stopped and has visible results).

      Examples:
      "She has been working on that project for three weeks." (Still working now.)
      "You've been crying — what happened?" (Visible result: red eyes.)
      "They have been building that bridge since January." (Ongoing.)

      THE PAST PERFECT

      Form: had + past participle
      The past perfect is used to describe an action that was completed before another action or time in the past. It is the "past of the past."

      Examples:
      "By the time she arrived, they had already left."
      "He hadn't eaten since morning, so he was famished."
      "The pilot checked the instruments that the engineer had calibrated the previous day."

      THE FUTURE PERFECT

      Form: will have + past participle
      Used to describe an action that will be completed before a specific time in the future.

      Examples:
      "By next June, I will have completed my degree."
      "They will have been married for twenty years by the time they go on that trip."
      "The construction will have finished before the tourists arrive."`,activities:[{id:"act-gram-1",type:"fill-blanks",question:"Complete the sentences using the correct perfect tense.",blanks:[{id:"bg1",sentence:"She _____ (work) for this company since 2019.",answer:"has been working",hint:"Duration from past to present — continuous."},{id:"bg2",sentence:"By the time he retired, he _____ (teach) for over thirty years.",answer:"had taught",hint:"An action completed before another past point."},{id:"bg3",sentence:"I _____ never _____ (visit) New Zealand, but I really want to go.",answer:"have...visited",hint:"Life experience — present perfect."},{id:"bg4",sentence:"By this time next year, we _____ (finish) the whole project.",answer:"will have finished",hint:"Completed before a future point."}],xpReward:20},{id:"act-gram-2",type:"multiple-choice",question:"Which sentence uses the present perfect correctly?",options:["I have seen her last Tuesday.","She has been to Paris twice.","They have went to the shops.","He have finished his homework."],correctAnswer:"She has been to Paris twice.",xpReward:10},{id:"act-gram-3",type:"true-false",question:"The past perfect (had + past participle) describes an action completed BEFORE another action in the past.",options:["True","False"],correctAnswer:"True",xpReward:10},{id:"act-gram-4",type:"matching",question:"Match each sentence to the correct tense name.",pairs:[{left:"She has just called.",right:"Present Perfect"},{left:"They had left before noon.",right:"Past Perfect"},{left:"He has been reading for hours.",right:"Present Perfect Continuous"},{left:"We will have landed by midnight.",right:"Future Perfect"}],xpReward:15}]},{id:"sec-vocabulary",type:"thematic-vocabulary",title:"The Language of Innovation: Tech & Change",imageQuery:"vocabulary dictionary words language learning",content:`In today's rapidly changing world, the language of technology and innovation permeates every area of life — from business meetings to casual conversations, from news headlines to everyday small talk. Whether you are in a job interview, negotiating a deal, or simply chatting with colleagues, understanding and using these words confidently will mark you out as a sophisticated, contemporary communicator.

      In this section, we explore twenty high-value vocabulary items drawn from the fields of technology, business, and social change. For each word, we provide a clear definition, its grammatical function, example sentences showing it in authentic contexts, and guidance on when and how to use it appropriately.`,vocabulary:[{word:"disruptive",definition:"Causing radical change by introducing a new product or idea that displaces established competitors",partOfSpeech:"adjective",example:`"Uber was a disruptive force in the taxi industry." | "Disruptive innovation doesn't just improve things — it transforms entire markets."`,synonyms:["revolutionary","transformative","game-changing"],difficulty:"intermediate"},{word:"scalable",definition:"Able to be easily expanded or upgraded to handle increased demand or growth",partOfSpeech:"adjective",example:'"We need a scalable solution that will work whether we have 100 or 100,000 customers." | "The cloud makes software infinitely more scalable."',synonyms:["expandable","flexible","adaptable"],difficulty:"advanced"},{word:"pivot",definition:"To change direction or strategy significantly, especially in business",partOfSpeech:"verb / noun",example:'"After losing market share, they decided to pivot from hardware to software services." | "The pivot saved the company."',synonyms:["shift","change course","adapt"],difficulty:"intermediate"},{word:"ecosystem",definition:"A complex network or interconnected system, especially in business or technology",partOfSpeech:"noun",example:'"Apple has built an ecosystem of devices, software, and services that keep customers loyal." | "The startup ecosystem in Berlin is thriving."',synonyms:["network","system","environment"],difficulty:"intermediate"},{word:"bandwidth",definition:"Technically: data transmission capacity; informally: the mental or physical capacity to handle tasks",partOfSpeech:"noun",example:`"I don't have the bandwidth to take on another project right now." | "We need to increase our bandwidth to handle peak traffic."`,synonyms:["capacity","headroom","capability"],difficulty:"intermediate"},{word:"granular",definition:"Dealing with or relating to the individual details of something; fine-grained",partOfSpeech:"adjective",example:`"We need granular data on customer behaviour, not just broad trends." | "Let's get granular about the quarterly targets."`,synonyms:["detailed","specific","precise"],difficulty:"advanced"},{word:"iterate",definition:"To repeat a process, making improvements each time",partOfSpeech:"verb",example:'"The design team iterated rapidly, releasing a new version every two weeks." | "We iterate based on real user feedback."',synonyms:["refine","improve","rework"],difficulty:"advanced"},{word:"frictionless",definition:"Requiring minimal effort; smooth and without obstacles",partOfSpeech:"adjective",example:'"The goal is a frictionless checkout experience that keeps customers coming back." | "Digital payments have made transactions more frictionless."',synonyms:["smooth","seamless","effortless"],difficulty:"advanced"}],activities:[{id:"act-vocab-1",type:"matching",question:"Match the vocabulary word to its correct definition.",pairs:[{left:"disruptive",right:"Causing radical change by displacing established competitors"},{left:"scalable",right:"Able to be expanded to handle increased demand"},{left:"pivot",right:"To change direction or strategy significantly"},{left:"iterate",right:"To repeat a process, making improvements each time"}],xpReward:15},{id:"act-vocab-2",type:"fill-blanks",question:"Complete the sentences with the correct vocabulary word.",blanks:[{id:"bv1",sentence:"The app was designed to provide a _____ shopping experience with one-click payment.",answer:"frictionless",hint:"Smooth and effortless."},{id:"bv2",sentence:"After the initial product failed, the founders decided to _____ and focus on consulting instead.",answer:"pivot",hint:"Change direction."},{id:"bv3",sentence:"We need more _____ analytics — not just total sales but sales by region, age group, and device.",answer:"granular",hint:"Detailed and specific."}],xpReward:15},{id:"act-vocab-3",type:"speaking",question:"Vocabulary in Use – Speaking Practice",speakingPrompts:['Use "disruptive" to describe a company or product that changed your industry or daily life.','Explain the concept of an "ecosystem" using Apple, Google, or another brand you know well.','Tell your tutor about a time when you had to "pivot" — change direction in work, study, or life.','Use "bandwidth" in its informal sense to describe a busy week you have had.'],xpReward:20}]},{id:"sec-business",type:"business-english",title:"The Art of the Negotiation",imageQuery:"business meeting negotiation professional conference",content:`Negotiation is not a battle. The most sophisticated business professionals understand that the best negotiations end with both parties feeling they have achieved something of value — what specialists call a "win-win outcome." Whether you are discussing a salary package, agreeing project terms with a client, or ironing out the details of a partnership agreement, your command of professional English will be one of your most powerful assets.

      OPENING A NEGOTIATION PROFESSIONALLY

      First impressions matter enormously. Opening a negotiation with clear, measured, professional language immediately establishes your credibility.

      Useful phrases:
      • "Thank you for making the time to meet today. I'm looking forward to exploring some mutually beneficial arrangements."
      • "Before we dive into the specifics, I'd like to share our perspective on the overall goals for this project."
      • "We've put together a proposal that we believe works for both parties — shall I walk you through the key points?"
      • "I think we both want the same outcome here — a deal that creates real value on both sides."

      MAKING AND RESPONDING TO PROPOSALS

      Making a proposal clearly and confidently:
      • "We would like to propose a three-month trial period at the rates outlined in our document."
      • "Our position is that the delivery timeline should be extended to accommodate the revised scope."
      • "One option we could explore is a phased payment structure — what are your thoughts?"

      Responding to a proposal professionally:
      • "That's an interesting proposal. We'd need some time to consider the financial implications."
      • "I understand your position, and I appreciate the thought behind it. Could you help me understand the rationale for that particular figure?"
      • "We're not quite there yet on the timeline, but I think there's room to find a middle ground."

      HANDLING DISAGREEMENT AND STALLING

      Not every negotiation flows smoothly. Disagreements are natural and should be handled with professional grace.

      When you disagree:
      • "I hear what you're saying, and I respect your position — however, from our side, the situation looks somewhat different."
      • "We have some concerns about that aspect. Could we put that point aside for now and come back to it once we've aligned on the broader framework?"

      Stalling for time professionally:
      • "That's a significant point. I'd like to take that back to my team before we make any commitments."
      • "Could we schedule a follow-up call to give both sides time to review?"

      REACHING AND CLOSING AN AGREEMENT

      The art of the close:
      • "I think we're very close to something we can both be satisfied with."
      • "If we could just resolve the question of X, I believe we'd have a deal."
      • "I'm pleased to say we have an agreement in principle — let's get the legal team to formalise the details."
      • "Thank you for your flexibility today. I look forward to a very productive partnership."`,dialogue:[{speaker:"Sofia (Buyer)",text:"Good morning, Marcus. Thank you for coming in. I've reviewed your proposal and I have to say, the quality of the work is impressive.",emotion:"professional"},{speaker:"Marcus (Seller)",text:"Thank you, Sofia. We put a lot of thought into it. We really believe this partnership can deliver significant value for your organisation.",emotion:"confident"},{speaker:"Sofia (Buyer)",text:"Absolutely. My concern, however, is around the pricing. The figure you've quoted is somewhat above what we had budgeted for this phase.",emotion:"concerned"},{speaker:"Marcus (Seller)",text:"I understand your concern, and I appreciate your directness. Could you help me understand what the budget ceiling looks like? That would help me see whether there's a structure that could work for both of us.",emotion:"measured"},{speaker:"Sofia (Buyer)",text:"We were hoping to come in at around 15% below your quoted figure for the first phase, with the understanding that we'd revisit the rates if the results justify it.",emotion:"negotiating"},{speaker:"Marcus (Seller)",text:"That's a significant difference from where we are now. However, if we could structure a performance-based element into the second phase, I think there's a conversation to be had. I'd need to take that back to my team — could we reconvene later this week?",emotion:"strategic"},{speaker:"Sofia (Buyer)",text:"That sounds reasonable. Friday morning works on our end. I think there's a deal here — we just need to land on the right structure.",emotion:"positive"},{speaker:"Marcus (Seller)",text:"I agree entirely. I'll come back to you with some revised scenarios. Thank you for your openness today, Sofia — this is exactly the kind of conversation that gets deals done.",emotion:"warm"}],activities:[{id:"act-biz-1",type:"roleplay",question:"Roleplay Scenario: You are the seller. Your client wants a 20% discount on a software package. Practise negotiating using the phrases from this lesson.",xpReward:25},{id:"act-biz-2",type:"multiple-choice",question:"Which phrase is most appropriate when you need time to consider a proposal?",options:[`"No, we can't agree to that."`,`"That's a significant point. I'd like to take that back to my team."`,'"Whatever you think is best."',`"You're asking for too much."`],correctAnswer:`"That's a significant point. I'd like to take that back to my team."`,xpReward:10},{id:"act-biz-3",type:"matching",question:"Match the negotiation situation to the most appropriate response.",pairs:[{left:"You strongly disagree with a proposal",right:`"I hear what you're saying, however from our side the situation looks different."`},{left:"You want to close the deal",right:`"I think we're very close to something we can both be satisfied with."`},{left:"You need time to think",right:'"Could we schedule a follow-up call to give both sides time to review?"'},{left:"Opening the negotiation",right:`"I'm looking forward to exploring some mutually beneficial arrangements."`}],xpReward:15}]},{id:"sec-news",type:"news-story",title:"BREAKING: Scientists Achieve Breakthrough in Quantum Computing",imageQuery:"quantum computer laboratory technology breakthrough science",content:`SAN FRANCISCO, CA — Researchers at a leading technology institute announced yesterday that they have achieved what many in the scientific community are calling a landmark breakthrough in quantum computing: the first demonstration of "quantum advantage" on a problem with real-world commercial applications.

      The team, led by Dr. Yuki Tanaka of the Meridian Institute for Advanced Computing, demonstrated that their 127-qubit quantum processor could solve a class of molecular simulation problems relevant to drug discovery in under four minutes — a task that would take the world's most powerful classical supercomputer approximately 47,000 years to complete.

      "What we have shown today is not just a proof of concept," Dr. Tanaka told reporters at a press conference in San Francisco. "We are demonstrating that quantum computing can already deliver practical advantages in domains that matter enormously for human wellbeing — in this case, the discovery of new medicines."

      The implications for the pharmaceutical industry are potentially enormous. Drug discovery is a notoriously slow and expensive process, with the average new medicine taking more than a decade and billions of dollars to bring from initial research to market. Computational tools that could dramatically accelerate the identification of viable drug candidates could, in theory, transform the pace of medical innovation.

      The announcement has been met with cautious enthusiasm from independent experts. Professor Sarah Goldstein of Imperial College London, who was not involved in the research, described the results as "genuinely exciting" but urged caution. "We need to see the full methodology, and independent replication is essential before we can draw firm conclusions," she said. "Quantum computing is a field where extraordinary claims have sometimes outrun the evidence. But if these results hold up to scrutiny, this is a very significant day."

      Not everyone is cheering, however. Critics point out that the specific problem class chosen by Dr. Tanaka's team, while genuinely relevant, was also one that quantum machines are particularly well-suited to handle — raising questions about how broadly the claimed advantage applies. "It's a genuine achievement, but let's be clear about what it does and does not demonstrate," said Professor Alexei Volkov of MIT. "Real quantum advantage across a wide range of problems remains a work in progress."

      The research was funded in part by three major technology corporations, a fact that some observers have flagged as a potential source of bias, though the institute maintains that the companies had no role in the research design or data analysis.

      Dr. Tanaka's team plans to publish a peer-reviewed paper within the next sixty days and has invited independent research groups to attempt replication using the methodology to be described therein.`,activities:[{id:"act-news-1",type:"true-false",question:"The quantum processor solved the molecular simulation problem in under four minutes.",options:["True","False"],correctAnswer:"True",xpReward:10},{id:"act-news-2",type:"multiple-choice",question:"What concern did Professor Goldstein raise about the research?",options:["The research was entirely fraudulent.","Independent replication is needed before drawing firm conclusions.","Quantum computing can never have practical applications.","The team used an outdated methodology."],correctAnswer:"Independent replication is needed before drawing firm conclusions.",xpReward:10},{id:"act-news-3",type:"discussion",question:"News Analysis Discussion",discussionPoints:['What is "peer review" and why is it important in science?',"Should we be concerned that this research was partly funded by corporations? Why or why not?","How do you evaluate news about scientific breakthroughs? What questions do you ask?","What other fields do you think quantum computing might transform?"],xpReward:20}]},{id:"sec-survival",type:"survival-english",title:"Survival English: At the Doctor's Surgery",imageQuery:"doctor patient consultation medical office healthcare",content:`Going to the doctor in an English-speaking country can be stressful enough without the added challenge of a language barrier. This section gives you the essential vocabulary, phrases, and conversational strategies you need to communicate clearly and confidently in a medical setting — from booking an appointment to describing symptoms and understanding a diagnosis.

      BOOKING AN APPOINTMENT

      On the phone:
      • "Hello, I'd like to make an appointment to see a doctor, please."
      • "Is this the right number for booking appointments at this surgery?"
      • "It's fairly urgent — I've been feeling unwell for a few days."
      • "Is there anything available this week, or do I need to go to the walk-in centre?"

      At the reception desk:
      • "Good morning. I have a 10:30 appointment with Dr. Johnson."
      • "I'm a new patient — could I register with the practice, please?"
      • "I'm afraid I need to rearrange my appointment — is that possible?"

      DESCRIBING SYMPTOMS

      Being precise about your symptoms helps doctors help you. Learn to describe:

      Location: "I have a sharp pain in my lower right abdomen." | "It's a dull ache across my lower back."
      Duration: "It's been going on for about three days." | "It came on suddenly this morning."
      Intensity (1-10 scale): "On a scale of one to ten, I'd say it's about a seven."
      Triggers: "It gets worse when I eat." | "It's most noticeable when I try to lie flat."
      Associated symptoms: "I also feel nauseous and I've had a slight temperature."

      UNDERSTANDING YOUR DOCTOR

      Doctors may use medical terminology. Don't be afraid to ask for clarification:
      • "I'm sorry, could you explain what that means in simpler terms?"
      • "So if I understand correctly, you're saying that...?"
      • "What are my options here, and what would you recommend?"
      • "Are there any side effects I should be aware of?"
      • "When should I expect to see some improvement?"
      • "Under what circumstances should I come back or go to A&E?"

      AT THE PHARMACY

      • "I have a prescription I'd like to collect, please."
      • "How often should I take these, and with or without food?"
      • "Are there any interactions I should know about if I'm already taking another medication?"`,dialogue:[{speaker:"Patient (Maria)",text:"Good morning. I have a 9:15 appointment with Dr. Patel. My name is Maria Santos.",emotion:"polite"},{speaker:"Receptionist",text:"Good morning, Ms. Santos. Yes, I can see you on the system. Please take a seat — Dr. Patel will be with you in about ten minutes.",emotion:"professional"},{speaker:"Dr. Patel",text:"Ms. Santos, good morning. What brings you in today?",emotion:"warm"},{speaker:"Patient (Maria)",text:"I've been having quite a bad headache for about four days now. It's a throbbing pain, mainly on the left side. I've tried paracetamol but it's not really touching it.",emotion:"concerned"},{speaker:"Dr. Patel",text:"I'm sorry to hear that. On a scale of one to ten, how would you rate the pain at its worst?",emotion:"professional"},{speaker:"Patient (Maria)",text:"About a seven or eight when it peaks. It's really affecting my concentration at work.",emotion:"uncomfortable"},{speaker:"Dr. Patel",text:"Have you experienced any nausea, sensitivity to light, or visual disturbances?",emotion:"professional"},{speaker:"Patient (Maria)",text:"Yes, actually — the light does bother me a lot. I've been keeping the curtains closed. What does that suggest?",emotion:"curious"},{speaker:"Dr. Patel",text:"The symptoms you're describing are consistent with migraine. I'd like to prescribe a specific migraine medication for you to try. If there's no improvement in 48 hours, or if you experience any new symptoms, please call us immediately.",emotion:"reassuring"},{speaker:"Patient (Maria)",text:"That's really helpful. Could you explain how I should take the medication? And are there any side effects I should watch for?",emotion:"attentive"}],activities:[{id:"act-surv-1",type:"roleplay",question:"Roleplay: You have a sore throat and mild fever that has lasted 5 days. Practise describing your symptoms to the doctor using at least four different descriptive phrases from this lesson.",xpReward:25},{id:"act-surv-2",type:"fill-blanks",question:"Complete the patient's sentences.",blanks:[{id:"bs1",sentence:"I've been feeling unwell for about _____ days now.",answer:"three",hint:"A specific time duration."},{id:"bs2",sentence:"On a _____ of one to ten, I'd say the pain is about a six.",answer:"scale",hint:"A measurement range."},{id:"bs3",sentence:"Could you explain what that _____ in simpler terms, please?",answer:"means",hint:"Asking for clarification."}],xpReward:15}]},{id:"sec-biography",type:"biography",title:"Marie Curie: The Woman Who Changed Science",imageQuery:"Marie Curie laboratory scientist woman historical portrait",content:`Marie Skłodowska Curie (1867–1934) stands as one of the towering figures in the history of science — a woman whose intellect, determination, and sheer courage against adversity fundamentally transformed our understanding of the physical world, not once but twice. She remains the only person in history to have won Nobel Prizes in two different scientific disciplines: Physics (1903) and Chemistry (1911).

      Born in Warsaw, Poland, then under Russian imperial rule, Maria Skłodowska grew up in a world that offered few opportunities for women in science. Education for women was largely prohibited under Russian occupation; she and her sister Bronisława secretly attended the illegal "Flying University" — an underground educational institution that moved from location to location to avoid detection by the Russian authorities. It was here, moving from apartment to apartment in the dead of night, that the foundations of one of the greatest scientific minds of the twentieth century were quietly being laid.

      The young Maria made an agreement with her sister: she would support Bronisława financially through her medical degree in Paris, and Bronisława would in turn support Maria when the time came for her to study. It was an arrangement that spoke volumes about both the sisters' characters — their pragmatism, their solidarity, and their unshakeable belief that education was worth any sacrifice.

      Maria arrived in Paris in 1891, enrolling at the Sorbonne under the Frenchified version of her name: Marie. She lived in extreme poverty in a sixth-floor attic room with no heating, surviving on chocolate and bread, so cold in winter that the water in her washbasin sometimes froze overnight. Yet she graduated first in her physics degree in 1893, and second in mathematics in 1894 — remarkable achievements for any student, let alone one who had overcome such material hardships.

      It was at the Sorbonne that she met Pierre Curie, a gifted physicist whose quiet brilliance and egalitarian belief in women's intellectual capacity matched her own. Their professional collaboration swiftly became a romantic partnership, and they married in 1895. Their working relationship was a genuine intellectual partnership of equals — rare for its time and in some ways still rare today.

      Together, Marie and Pierre Curie threw themselves into the investigation of uranium's mysterious rays — a phenomenon first noted by Henri Becquerel in 1896. Marie coined the term "radioactivity" to describe the emission of energy from certain elements, and her meticulous experimental work demonstrated that radioactivity was a property of the atom itself — not a product of chemical interaction. This insight fundamentally challenged prevailing scientific orthodoxy.

      Working in a cramped, leaking shed — described by a visiting German chemist as looking "like a cross between a stable and a potato cellar" — and using equipment that we now know was catastrophically exposing them to dangerous levels of radiation, the Curies discovered two new elements: polonium (named for Marie's beloved Poland) and radium. The Nobel Prize in Physics in 1903 honoured this extraordinary work.

      Tragedy struck in 1906 when Pierre was killed in a street accident, struck by a horse-drawn carriage in a Paris rainstorm. Marie was devastated. The grief she carried for the rest of her life is evident in the diaries she left behind — private documents of heartrending emotional depth that reveal the full humanity behind the composed public figure.

      Yet she continued. She took over Pierre's professorship at the Sorbonne, becoming the first woman to hold such a position in the university's history. She won her second Nobel Prize in 1911, for the discovery of polonium and radium — and famously refused to attend the prize ceremony after the Nobel Committee initially suggested she not come, given a personal scandal that had made the French press frantic. She went anyway.

      The personal costs of Marie Curie's scientific life were severe. Her health deteriorated steadily from aplastic anaemia — almost certainly caused by her lifetime of exposure to radiation. She died in 1934, her body worn down by decades of work with materials whose danger she had done more than almost anyone to illuminate, and which her era lacked the tools to fully understand. Her notebooks and personal belongings remain radioactive to this day; to view them in the Bibliothèque nationale de France, researchers must sign a waiver.

      Marie Curie's legacy extends far beyond her specific discoveries. She is a symbol of what sustained, uncompromising intellectual ambition can achieve against the obstacles of prejudice, poverty, and systemic exclusion. Her life is a reminder that science is not merely a body of knowledge, but a practice — one that requires courage as much as brilliance.`,vocabulary:[{word:"adversity",definition:"Difficult or unfavourable circumstances",partOfSpeech:"noun",example:"Marie Curie achieved greatness in the face of enormous adversity.",synonyms:["hardship","difficulty","misfortune"],difficulty:"intermediate"},{word:"pragmatism",definition:"The quality of dealing with problems in a sensible and realistic way",partOfSpeech:"noun",example:"The sisters' arrangement showed remarkable pragmatism.",synonyms:["practicality","realism","common sense"],difficulty:"advanced"},{word:"egalitarian",definition:"Believing in or based on the principle that all people are equal",partOfSpeech:"adjective",example:"Pierre held egalitarian views about women's intellectual capacity.",synonyms:["equal","fair","democratic"],difficulty:"advanced"},{word:"meticulous",definition:"Showing great attention to detail; very careful and precise",partOfSpeech:"adjective",example:"Her meticulous experimental work set new standards in science.",synonyms:["precise","thorough","careful"],difficulty:"intermediate"},{word:"orthodoxy",definition:"Authorised or generally accepted theory, doctrine, or practice",partOfSpeech:"noun",example:"Her discovery challenged prevailing scientific orthodoxy.",synonyms:["convention","doctrine","established view"],difficulty:"advanced"}],activities:[{id:"act-bio-1",type:"multiple-choice",question:"Marie Curie is unique in history because she:",options:["Was the first woman to attend the Sorbonne","Won Nobel Prizes in two different scientific disciplines","Discovered uranium","Was the first female professor anywhere in Europe"],correctAnswer:"Won Nobel Prizes in two different scientific disciplines",xpReward:10},{id:"act-bio-2",type:"true-false",question:"Marie Curie's scientific notebooks are still radioactive today.",options:["True","False"],correctAnswer:"True",xpReward:10},{id:"act-bio-3",type:"discussion",question:"Biographical Reflection",discussionPoints:["What aspects of Marie Curie's character do you most admire? Why?","What obstacles did she face that still exist for women in science today?","How do you think history would have been different if Marie had been denied access to education?","Name someone from your own country who achieved something remarkable against the odds."],xpReward:20}]},{id:"sec-lifestyle",type:"lifestyle",title:"The Art of Slow Living in a Fast World",imageQuery:"slow living mindfulness peaceful morning coffee book",content:`There is a quiet rebellion underway, and it is happening in the most unexpected of places: in people's kitchens, on their morning walks, in the deliberate act of sitting with a cup of coffee and watching the light change. The slow living movement — a cultural and philosophical push-back against the relentless acceleration of modern life — is gaining momentum in a world that seems to reward only those who are always busy, always connected, and always on.

      But what exactly is "slow living"? It is not, as the name might imply, about literally doing everything at a slower pace. It is about intentionality — about choosing how you spend your time, energy, and attention, rather than allowing those precious resources to be hijacked by the algorithm, the notification, the relentless scroll.

      The movement traces some of its intellectual roots back to the "slow food" philosophy pioneered in Italy in the 1980s by Carlo Petrini, who founded the Slow Food movement as a direct protest against the opening of a McDonald's restaurant near the Spanish Steps in Rome. Petrini argued that food should be grown, cooked, and eaten slowly — with attention to provenance, quality, and community — rather than optimised purely for speed and convenience.

      From there, the slow philosophy spread outward, colonising adjacent territory: slow travel, slow fashion, slow parenting, slow work. Each of these movements shares a common premise: that speed and efficiency, while valuable, should not be the primary values organising human life.

      In practical terms, slow living looks different for different people. For some, it means cooking from scratch every day, growing herbs on a windowsill, and sitting down to eat without a screen in sight. For others, it means switching the smartphone off at 7pm, spending Sunday mornings in bed reading physical books, or committing to a weekly walk in nature without headphones. For a growing number of young professionals who have burned out on hustle culture, it means dramatically simplifying their material lives — consuming less, owning less, and investing instead in experiences and relationships that genuinely nourish them.

      The evidence from psychology and neuroscience is increasingly supportive of the slow living ethos. Studies consistently show that chronic busyness — especially when combined with constant digital connectivity — is associated with elevated stress hormones, impaired sleep, reduced creativity, and diminished satisfaction with life. Conversely, practices that encourage presence and intentionality — meditation, time in nature, meaningful conversation, creative pursuits — are reliably associated with increased wellbeing.

      This does not mean that ambition or productivity are wrong. Slow living is not an ideology of laziness. The key insight is about quality versus quantity — about doing fewer things, but doing them more fully and with greater presence. A single deeply focused hour of work, free from distraction, will typically produce more of genuine value than three hours of fragmented, half-distracted labour.

      The philosopher Blaise Pascal wrote in the seventeenth century that "all of humanity's problems stem from man's inability to sit quietly in a room alone." Whether or not you agree with Pascal's diagnosis, there is something worth sitting with in his observation — something that speaks with surprising freshness to the condition of anyone living in the age of the smartphone.`,vocabulary:[{word:"intentionality",definition:"The quality of being deliberate and purposeful about one's choices and actions",partOfSpeech:"noun",example:"Slow living is fundamentally about intentionality.",synonyms:["deliberateness","purpose","mindfulness"],difficulty:"advanced"},{word:"provenance",definition:"The place of origin or earliest known history of something",partOfSpeech:"noun",example:"Slow food advocates care deeply about the provenance of their ingredients.",synonyms:["origin","source","background"],difficulty:"advanced"},{word:"ethos",definition:"The characteristic spirit or attitude of a community or era",partOfSpeech:"noun",example:"The evidence from neuroscience is supportive of the slow living ethos.",synonyms:["spirit","philosophy","values"],difficulty:"advanced"},{word:"hustle culture",definition:"A social attitude that glorifies working extremely hard and being constantly busy",partOfSpeech:"noun phrase",example:"Many young professionals are burning out on hustle culture.",synonyms:["grind culture","overwork mentality"],difficulty:"intermediate"}],activities:[{id:"act-life-1",type:"rating",question:"Rate how much YOU practise slow living principles (1 = never, 5 = always):",ratingCriteria:["I eat meals without screens or distractions.","I spend time in nature at least once a week.","I set boundaries with my phone in the evenings.","I regularly engage in a creative pursuit.","I feel genuinely rested most mornings."],xpReward:10},{id:"act-life-2",type:"discussion",question:"Personal Reflection & Discussion",discussionPoints:['Do you personally relate to "hustle culture"? How has it affected you?',"What would you give up to live more slowly and intentionally?","The article mentions Carlo Petrini protesting a McDonald's opening. Do you think that was a reasonable response? Why?",'Design your perfect "slow Sunday." What would it look like from morning to night?'],xpReward:20}]},{id:"sec-debate",type:"debate",title:"Great Debate: Should Social Media Age Limits Be Raised to 18?",imageQuery:"debate discussion social media teenagers youth",content:`THE MOTION: "This house believes that the minimum age for social media access should be raised to 18 years old."

      THE CONTEXT

      The relationship between social media and young people's mental health has become one of the most hotly contested debates of our time. Several governments, including those of Australia and the United Kingdom, have introduced or are actively considering legislation to restrict children's access to social media platforms. Meanwhile, tech companies argue that such restrictions are unenforceable, counterproductive, and represent an overreach of government power into family life.

      ARGUMENTS IN FAVOUR OF RAISING THE AGE LIMIT

      1. MENTAL HEALTH EVIDENCE
      The psychologist Jonathan Haidt, in his influential book "The Anxious Generation" (2024), argues that the dramatic rise in adolescent anxiety, depression, and self-harm rates that began around 2012 corresponds precisely with the mass adoption of smartphones and social media among teenagers. He contends that the "experience-blocking" effect of social media — replacing real-world social interaction with screen-based connection — is profoundly damaging to the developing adolescent brain.

      2. DESIGN EXPLOITATION
      Social media platforms are designed by teams of engineers and behavioural psychologists specifically to maximise user engagement — which means maximising the amount of time users spend on the platform. These designs exploit the same neurological reward pathways activated by slot machines. Adults, with fully developed prefrontal cortices, have greater capacity to resist; adolescents, whose capacity for impulse control is still developing, are particularly vulnerable.

      3. ONLINE SAFETY
      Children's exposure to cyberbullying, inappropriate content, predatory behaviour, and radicalisation is overwhelmingly facilitated through social media platforms. Age verification requirements could significantly reduce these risks.

      ARGUMENTS AGAINST RAISING THE AGE LIMIT

      1. PRACTICAL ENFORCEMENT
      Age verification is technically difficult and can be easily circumvented. Many young people are more technologically sophisticated than their parents. A blanket ban is likely to drive social media use underground rather than eliminate it — making it less visible to parents and thus potentially more dangerous.

      2. DIGITAL SKILLS & SOCIAL CONNECTION
      Social media is not only about harm. For young people — particularly those from isolated communities, those with disabilities, or LGBTQ+ youth in unsupportive environments — it can be a vital source of community, information, and support that they cannot access elsewhere. Removing that access could cause real harm.

      3. PARENTAL RESPONSIBILITY
      Many argue that regulating children's social media use is fundamentally a matter of parental, not governmental, responsibility. Legislation in this area risks creating a nanny state.

      THE DECISION IS YOURS

      This is not a simple issue with a clear right answer. The best debaters do not simply state their opinions — they engage with the strongest arguments on the opposing side, concede what is reasonable, and build their case with evidence, logic, and nuance.`,activities:[{id:"act-deb-1",type:"speaking",question:"Formal Debate Practice",speakingPrompts:["Prepare a 90-second opening argument either FOR or AGAINST the motion. Include at least two pieces of evidence.","Now argue the OPPOSITE side from the one you chose above. Which arguments did you find harder to make?","Identify the single strongest argument from the side you DISAGREE with. How would you respond to it?","Write and deliver a one-sentence closing statement for whichever side you genuinely believe in."],xpReward:30},{id:"act-deb-2",type:"multiple-choice",question:"What is Jonathan Haidt's main argument about social media and teenagers?",options:["Social media is entirely harmless if used in moderation.","The rise in adolescent mental health problems corresponds with mass smartphone adoption.","Teenagers are more resilient than adults to social media effects.","Only girls are affected by social media use."],correctAnswer:"The rise in adolescent mental health problems corresponds with mass smartphone adoption.",xpReward:10},{id:"act-deb-3",type:"rating",question:"Where do YOU stand? Rate your agreement (1 = strongly disagree, 5 = strongly agree):",ratingCriteria:["Social media is genuinely harmful to teenagers.","Governments should regulate social media access by age.","Parents, not governments, should make these decisions.","The benefits of social media for young people outweigh the risks.","I would support a social media age limit in my country."],xpReward:10}]},{id:"sec-writing-email",type:"writing-email",title:"Professional Email Writing Masterclass",imageQuery:"email writing laptop professional office communication",content:`Email remains the dominant form of professional written communication worldwide, and the quality of your emails sends powerful signals about your competence, professionalism, and cultural literacy. A well-crafted email can open doors; a poorly written one can close them permanently. In this section, we analyse the anatomy of a high-quality professional email and provide model templates for the most common business scenarios.

      THE ANATOMY OF A PROFESSIONAL EMAIL

      1. SUBJECT LINE: Your most important two seconds
      The subject line determines whether your email gets opened. Make it specific, informative, and action-oriented.
      ✗ "Meeting" | ✗ "Follow-up" | ✗ "Quick question"
      ✓ "Request to reschedule Tuesday's project review — new time options below"
      ✓ "Q3 Marketing Report — please review by Friday 15 November"
      ✓ "Introduction: [Your name] — referred by Sarah Mitchell"

      2. SALUTATION: Setting the right tone
      Formal: "Dear Mr. / Ms. / Dr. [Surname],"
      Semi-formal (modern business): "Dear [First name]," | "Hello [First name],"
      When unsure: "Dear [Full name]," (safe and neutral)
      Avoid: "Hey!", "Hi there!", "To whom it may concern" (unless truly unavoidable)

      3. OPENING LINE: Don't waste their time
      Get to the point after one friendly but brief line.
      • "I hope this finds you well." (Classic but slightly overused — consider alternatives)
      • "Thank you for your time during yesterday's call."
      • "Following our conversation at the conference last week..."
      • "I'm writing to follow up on the proposal we sent on [date]."

      4. BODY: Clear, structured, and scannable
      Use short paragraphs (3-4 sentences maximum). If you have multiple points, number them or use bullet points. State any required action clearly and with a deadline.

      5. CLOSING: Professional and warm
      • "Please let me know if you have any questions — I'm happy to discuss further."
      • "I look forward to hearing from you."
      • "Thank you for your time and consideration."
      Signoff: "Kind regards," / "Best regards," / "Warm regards," + your name

      MODEL EMAILS

      MODEL 1: Requesting a Meeting
      Subject: Meeting Request – Digital Transformation Strategy – Week of 18 November

      Dear Dr. Chen,

      I hope you are well. Following your keynote at the Innovation Summit last month, I was very struck by your framework for AI integration in mid-sized enterprises, and I believe your insights could be extremely valuable to a project we are currently scoping.

      Would you be available for a 30-minute call during the week of 18 November? I am flexible on timing and happy to work around your schedule. I have outlined the project briefly below so you can assess whether it aligns with your areas of interest.

      [Brief project summary in 2-3 lines]

      I look forward to your response, and I appreciate your consideration.

      Kind regards,
      [Your name]`,activities:[{id:"act-email-1",type:"fill-blanks",question:"Rewrite the poor subject lines as professional ones.",blanks:[{id:"be1",sentence:'POOR: "Question" → IMPROVED: "_____ about invoice #4521 – clarification needed before Friday"',answer:"Query",hint:'A more formal word for "question".'},{id:"be2",sentence:'POOR: "Hey, can we meet?" → IMPROVED: "Meeting _____ – Project Orion Timeline Review – this week"',answer:"Request",hint:"A noun meaning you want something."}],xpReward:15},{id:"act-email-2",type:"short-answer",question:"Write a complete professional email requesting an extension on a project deadline. Use at least 5 phrases or structures from this lesson. Include: subject line, salutation, reason, proposed new deadline, and closing.",xpReward:30},{id:"act-email-3",type:"multiple-choice",question:"Which subject line is most effective for a professional email?",options:['"Quick question"','"Follow up"','"Q3 Report – please review by Friday 15 November"','"Hi"'],correctAnswer:'"Q3 Report – please review by Friday 15 November"',xpReward:10}]},{id:"sec-how-to",type:"how-to",title:"How to Give a Brilliant Presentation in English",imageQuery:"presentation public speaking conference stage professional",content:`Giving a presentation in your second language is one of the most challenging — and most rewarding — things you can do as a language learner. The good news is that great presentations follow a learnable structure, and the vocabulary and techniques covered in this section will give you a solid, professional framework you can use in any context, from a business meeting to a conference keynote.

      STEP 1: STRUCTURE YOUR PRESENTATION (5–7 minutes recommended)

      The classic three-part structure remains the most effective:
      • Opening (10-15% of total time): Hook your audience, introduce yourself and your topic, preview your main points.
      • Body (70-80% of total time): Develop 2-4 main points with clear transitions between each.
      • Conclusion (10-15% of total time): Summarise key messages, deliver your call to action, invite questions.

      STEP 2: MASTER THE LANGUAGE OF SIGNPOSTING

      Signposting language guides your audience through your presentation, so they always know where you are and where you are going.

      Opening: "Good morning, everyone. I'm [name], and today I'm going to talk about..." | "My presentation is divided into three main sections..."
      Moving forward: "Moving on to my next point..." | "Now that we've covered X, let's turn to Y." | "This brings me neatly to..."
      Emphasising: "The key point here is..." | "What's really important to understand is..." | "I want to make sure this lands clearly..."
      Contrasting: "While it's true that... on the other hand..." | "Despite this, the data shows..."
      Concluding: "To summarise the main points..." | "So, what are the takeaways from today?" | "In conclusion..."
      Questions: "I'm happy to take questions now." | "Please feel free to stop me if anything isn't clear."

      STEP 3: MANAGE NERVES

      Nervous energy is your body's preparation for a challenge. Here is how to work with it:
      • Slow your breathing before you start. Three deep diaphragmatic breaths lower cortisol levels measurably.
      • Rehearse out loud — not in your head. Your mouth needs to know the words, not just your brain.
      • Use pauses deliberately. A two-second pause feels like an eternity to the speaker and a natural dramatic pause to the audience.
      • Make eye contact with friendly faces. Scan the room slowly rather than reading from notes.

      STEP 4: HANDLE QUESTIONS PROFESSIONALLY

      • "That's a great question. My view on that is..."
      • "I'm glad you raised that — it's something we thought carefully about."
      • "I don't have the specific data to hand right now, but I'll make sure to follow up with you directly."
      • "Could you clarify what aspect of X you're most interested in?"`,activities:[{id:"act-howto-1",type:"speaking",question:"Presentation Practice Tasks",speakingPrompts:['Deliver a 2-minute mini-presentation on "The most important thing I have learned in my career" using the three-part structure.',"Practise the opening of a presentation about your hometown. Use at least three signposting phrases.","Your tutor will ask you a difficult question after your presentation. Use one of the question-handling strategies above.","Record yourself presenting for 60 seconds and listen back. Identify one thing to improve."],xpReward:30},{id:"act-howto-2",type:"matching",question:"Match the signposting phrase to its function.",pairs:[{left:'"Moving on to my next point..."',right:"Transitioning between sections"},{left:'"The key point here is..."',right:"Emphasising importance"},{left:'"To summarise the main points..."',right:"Beginning the conclusion"},{left:'"Could you clarify what aspect you mean?"',right:"Handling a vague question"}],xpReward:15}]},{id:"sec-travel",type:"travel",title:"Travel Feature: The Hidden Valleys of Kyoto's Countryside",imageQuery:"Kyoto Japan countryside temple forest bamboo travel",content:`Most travellers who arrive in Kyoto head directly for the obvious icons: Fushimi Inari's ten-thousand vermillion torii gates, the golden pavilion reflected in its mirror lake, the rickshaws threading through Gion's cobblestone lanes. These are magnificent, and they deserve their fame. But those who linger a little longer, who look beyond the tourist footfall and venture into Kyoto's surrounding countryside, discover something that the guidebooks, with their finite word counts, often fail to adequately capture.

      The Ohara Valley, some fifteen kilometres north of the city centre, feels like a different world. The bus from Kyoto Station winds through rice paddies and stands of ancient cedar before depositing you in a village of remarkable quietness. Sanzen-in temple sits at the valley's heart, its moss garden one of the most profoundly beautiful natural spaces in all of Japan — a carpet of luminous green velvet studded with stone lanterns and small Jizo statues half-hidden in the undergrowth, their expressions of serene welcome all the more moving for being unexpected.

      Further east, the Kurama and Kibune valleys offer something different again. Kurama-dera, perched high on the mountain, is reached via a steep forest path lined with cedar trees so tall and straight they seem architectural rather than natural. The mountain has a reputation in Japanese folklore as a place of supernatural power; whether or not you subscribe to such beliefs, there is something undeniably charged about walking through those ancient trees in the early morning, mist still clinging to the undergrowth, the city entirely invisible below.

      Kibune, a fifteen-minute walk over the mountain from Kurama, is famous for its kawadoko restaurants — establishments where, in summer, dining platforms are built directly over the icy mountain stream, allowing diners to eat their kaiseki meals literally above the rushing water. It is one of those experiences that sounds like a gimmick and turns out to be genuinely magical.

      The Wazuka Valley, a full hour from the city by car but worth every minute, is the heart of the region's tea production. Steep hillsides are terraced with neat rows of tea bushes, the vivid green of the new spring flush so intense it almost appears artificial. Visitors can participate in tea picking during the harvest season, and several local families offer farmhouse accommodation — the sort of experience that will outlast any number of five-star hotels in the memory.

      What these places share is a quality that is increasingly rare and correspondingly precious in the modern world: unhurriedness. Life moves at a different tempo here. The rhythms are seasonal, agricultural, contemplative. Coming from cities defined by urgency and noise, it can take a day or two simply to decompress enough to properly receive what is being offered. But those who are patient discover that Kyoto's true heart beats not among the crowds and the selfie sticks, but in these quiet valleys, in the sound of water and wind through bamboo, in the smell of moss and cedar and green tea.

      PRACTICAL INFORMATION:
      Ohara Valley: Bus 17 from Kyoto Station (55 minutes) | Best time: November (foliage) or May (fresh greens)
      Kurama & Kibune: Eizan Railway from Demachiyanagi Station (28 minutes) | Best time: Year-round
      Wazuka Valley: Taxi or car hire essential | Best time: April–May (tea harvest)`,vocabulary:[{word:"vermillion",definition:"A brilliant red or scarlet colour",partOfSpeech:"adjective",example:"The ten thousand vermillion torii gates stretch up the mountainside.",synonyms:["scarlet","crimson","ruby"],difficulty:"advanced"},{word:"luminous",definition:"Full of or shedding light; bright or shining",partOfSpeech:"adjective",example:"The moss garden was a carpet of luminous green.",synonyms:["glowing","radiant","bright"],difficulty:"intermediate"},{word:"kaiseki",definition:"Traditional Japanese multi-course haute cuisine",partOfSpeech:"noun",example:"They enjoyed a kaiseki meal suspended over the mountain stream.",difficulty:"advanced"},{word:"contemplative",definition:"Expressing or involving prolonged thought; meditative",partOfSpeech:"adjective",example:"The valley had a contemplative, unhurried quality.",synonyms:["meditative","reflective","pensive"],difficulty:"intermediate"}],activities:[{id:"act-trav-1",type:"discussion",question:"Travel Talk",discussionPoints:["Describe the most memorable place you have ever visited. What made it special?",'The article talks about "tourist footfall" versus hidden gems. Where do you stand — famous sights or off the beaten track?',"Have you ever been somewhere that required patience to appreciate? Describe that experience.","Design your perfect day in Kyoto using the information in this article."],xpReward:20},{id:"act-trav-2",type:"speaking",question:"Write & Speak: A Postcard from Kyoto",speakingPrompts:["Imagine you have just spent a day in Ohara Valley. Write a postcard (50 words) to a friend describing what you saw and felt.","Read your postcard aloud to your tutor as if you are reading it to your friend.","Use at least three vocabulary words from this section in your postcard."],xpReward:20}]},{id:"sec-horror",type:"horror-story",title:"The House at the End of Whitmore Lane",imageQuery:"haunted house dark night fog mystery horror",content:`Nobody in the village could agree on exactly when the Alderton house had been built. Old Thomas Wickes, who kept the post office and had a reputation for knowing everything worth knowing about Thornwell, said it had been there "longer than memory." The OS map from 1887 showed it: a small rectangle at the foot of the hill, labelled simply "Alderton" in the faded, iron-gall ink of Victorian cartographers.

      What everyone in Thornwell could agree on was that the house had been empty for forty years, and that forty years was not long enough.

      It was my editor who sent me there. I was writing a piece on abandoned rural properties for a magazine — the kind of gently melancholy feature that sells well in late October, pictures of peeling wallpaper and light falling through cracked window panes. Standard material. I had photographed perhaps sixty such properties in two years without incident.

      The Alderton house was different from the moment I turned off the lane onto what had once been its front path. The difference was not visual. Objectively, it looked like any other derelict property: overgrown garden, front door slightly ajar, windows filmed with decades of grime. The difference was purely sensory — a prickling at the back of the neck, the kind of full-body alertness that evolution developed for situations considerably more dangerous than property photography.

      I told myself it was the silence. Rural silence is rarely as quiet as people imagine — there are always birds, insects, wind. The garden around the Alderton house was completely, unnaturally silent. I could not hear a single bird. The afternoon was warm and still, and yet not one insect moved in the long grass around my feet.

      I stepped inside.

      The hallway was as I had expected: a peeling runner of carpet, a hat stand with something still hanging on it (a child's coat, I realised with a tightening of the chest). A smell of damp and old paper and something underneath both of those that I could not quite identify. A grandfather clock against the right wall, stopped — as they always are in these places — at a specific time. 3:17.

      I went through to the kitchen. The table was set for three. Not metaphorically, not approximately — three complete place settings, with plates, cutlery, and glasses, as if the family had simply stepped away from the table and not returned. The food had long since rotted away to nothing, but the impressions it had left on the plates were still faintly, horribly visible.

      I was photographing the plates — professional instinct overriding personal inclination — when I heard it.

      From upstairs. Three knocks. Even, measured, deliberate. Then silence.

      Then — and here is the part that I find most difficult to write, because it is the part I am most afraid people will not believe — a child's voice, perfectly clear and without any of the muffle or echo you would expect in an empty house, said: "Don't go upstairs."

      I went upstairs.

      I wish I could tell you what I found there. But the truth is that I don't remember anything between the third step creaking under my foot and sitting in my car at the bottom of the lane, camera bag in my lap, with ninety minutes of my life completely unaccounted for. My camera had been on continuous shoot. The memory card held 847 photographs, all taken in the upstairs rooms.

      Every single photograph was black.`,activities:[{id:"act-horror-1",type:"discussion",question:"Literary Horror Analysis",discussionPoints:["What techniques does the writer use to create dread without showing anything explicitly scary?",`Why is the phrase "Don't go upstairs" followed by the narrator going upstairs so effective?`,"What do you think happened in those 90 missing minutes? Build your theory.","What is the most frightening story (book, film, or real) you have ever encountered? Why did it affect you?"],xpReward:20},{id:"act-horror-2",type:"short-answer",question:"Analyse: Identify three specific details in the story that create atmosphere. For each, explain exactly WHY it is effective.",xpReward:20}]},{id:"sec-jokes",type:"jokes",title:"Jokes, Wit & the Art of English Humour",imageQuery:"comedy laughter funny jokes stand up performance",content:`English humour is a cultural institution — and one that many learners find perplexing, elusive, and occasionally baffling, even at quite advanced levels of proficiency. Understanding what makes the English laugh, and why, is not merely a party trick: it is a window into the cultural values, historical experiences, and philosophical outlook of English-speaking communities.

      THE PILLARS OF ENGLISH HUMOUR

      1. UNDERSTATEMENT
      The English have elevated understatement to an art form. The technique involves saying far less than the situation warrants, creating humour through the gap between what is said and what is meant.
      "The weather wasn't ideal." (Said of a hurricane.) | "He's not entirely useless." (Meaning: he's actually quite good.) | "I was slightly surprised." (Said after a total shock.)

      2. SELF-DEPRECATION
      The English distrust people who take themselves too seriously. Self-deprecating humour — making jokes at one's own expense — is not only socially acceptable but often required. It signals emotional intelligence, social confidence, and a refusal to be pompous.
      "I'd give you my professional opinion, but my professional opinion has been repeatedly wrong, so perhaps take it with a grain of salt."

      3. WORDPLAY & PUNS
      The English pun has been both celebrated and groaned at for centuries. A good pun works on two levels simultaneously, creating a momentary cognitive "click" when the double meaning registers.
      "I used to hate facial hair, but then it grew on me."
      "The bicycle couldn't stand on its own because it was two-tired."
      "I'm reading a book about anti-gravity. It's impossible to put down."

      JOKES FOR LANGUAGE LEARNERS

      Why did the grammar teacher seem so sad? Because people always walked all over her and took her for granted.

      Student: "Teacher, would you punish me for something I didn't do?"
      Teacher: "Of course not!"
      Student: "Good. I didn't do my homework."

      A linguistics professor says to a class: "In English, a double negative forms a positive. However, in some languages, such as Russian, a double negative is still a negative. But there is no language in which a double positive can form a negative." A voice from the back of the room says, "Yeah, right."

      IDIOMS TO MAKE YOU SOUND NATURALLY FUNNY
      • "It was the last straw." (The final problem that makes a situation intolerable.)
      • "He bit off more than he could chew." (Took on a task too large to manage.)
      • "That went over like a lead balloon." (Something that was supposed to be funny or impressive but completely failed.)
      • "I'm pulling your leg." (I'm joking with you — not being serious.)
      • "She could sell ice to Eskimos." (Someone so persuasive they could convince anyone of anything.)`,activities:[{id:"act-jokes-1",type:"discussion",question:"Humour Discussion",discussionPoints:["Is English humour similar to or different from humour in your culture? Give specific examples.","Tell your tutor your favourite joke in English (or translate one from your language).","Do you think a good sense of humour is important in professional life? Why?","Which of the three pillars of English humour (understatement, self-deprecation, wordplay) comes most naturally to you?"],xpReward:20},{id:"act-jokes-2",type:"matching",question:"Match the idiom to its meaning.",pairs:[{left:`"I'm pulling your leg."`,right:"I'm joking with you."},{left:'"That went over like a lead balloon."',right:"It failed to impress completely."},{left:'"He bit off more than he could chew."',right:"He took on too much."},{left:'"It was the last straw."',right:"It was the final problem that broke the limit."}],xpReward:15}]},{id:"sec-advertisement",type:"advertisement",title:"Advertisement: Tutorly – Learn Smarter, Not Harder",imageQuery:"online learning education platform laptop study",content:`TUTORLY™ — YOUR PERSONAL LANGUAGE COACH, AVAILABLE 24/7
