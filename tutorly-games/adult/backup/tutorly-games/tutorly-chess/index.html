<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Grandmaster Chess Tutor</title>
    <meta name="description" content="Premium interactive chess education platform with AI-powered lessons, grandmaster coaching, and voice-guided tutorials." />
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow-x: hidden; }
      body { font-family: 'Inter', sans-serif; background: #f8f6f0; }
      #root { width: 100%; min-height: 100vh; }
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: #f1f0eb; }
      ::-webkit-scrollbar-thumb { background: #c9b88a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #b8a070; }
      .chess-piece-animate { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 0 0 rgba(201, 184, 138, 0.4); }
        50% { box-shadow: 0 0 0 12px rgba(201, 184, 138, 0); }
      }
      @keyframes coach-bounce {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-8px) scale(1.05); }
      }
      @keyframes float-in {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes shimmer {
        0% { background-position: -200% center; }
        100% { background-position: 200% center; }
      }
      @keyframes arrow-draw {
        from { stroke-dashoffset: 100; opacity: 0; }
        to { stroke-dashoffset: 0; opacity: 1; }
      }
      .animate-float-in { animation: float-in 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
      .animate-coach-bounce { animation: coach-bounce 2s ease-in-out infinite; }
      .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }
      .shimmer-text {
        background: linear-gradient(90deg, #8B6914, #D4AF37, #F5D98B, #D4AF37, #8B6914);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 3s linear infinite;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
      .board-shadow {
        filter: drop-shadow(0 25px 50px rgba(0,0,0,0.35));
      }
    </style>

tack!'",highlightSquares:["f4","e5"],arrowsGreen:[["f2","f4"]],arrowsRed:[["e5","f4"]],conceptTag:"King's Gambit",annotation:"!",isKeyMoment:!0,hint:"What does White gain by sacrificing the f4 pawn? Think about the e5 pawn and center control."},{moveNumber:2,color:"b",san:"exf4",from:"e5",to:"f4",fenAfter:"rnbqkbnr/pppp1ppp/8/8/4Pp2/8/PPPP2PP/RNBQKBNR w KQkq - 0 3",narration:"Kieseritzky accepts the gambit! Now White has a powerful pawn on e4 controlling the center, while Black has an extra pawn but lags in development. The question is: can Black hold the extra pawn while developing normally?",highlightSquares:["f4","e4"]},{moveNumber:3,color:"w",san:"Bc4",from:"f1",to:"c4",fenAfter:"rnbqkbnr/pppp1ppp/8/8/2B1Pp2/8/PPPP2PP/RNBQKBNR b KQkq - 1 3",narration:"The bishop springs to c4 — the most dangerous diagonal in chess, pointing directly at the vulnerable f7 square! This is the 'Italian Eye' — the bishop stares deep into Black's position. Every move Anderssen makes develops a piece toward the enemy king.",highlightSquares:["c4","f7"],arrowsGreen:[["f1","c4"],["c4","f7"]],conceptTag:"Development",annotation:"!"},{moveNumber:3,color:"b",san:"Qh4+",from:"d8",to:"h4",fenAfter:"rnb1kbnr/pppp1ppp/8/8/2B1Ppq1/8/PPPP2PP/RNBQKBNR w KQkq - 2 4",narration:"Check! Kieseritzky brings his queen out aggressively to h4, attacking the e4 pawn and giving check. But notice — the queen has come out too early without support from other pieces. A classic beginner mistake, even from a strong player!",highlightSquares:["h4","e1"],arrowsRed:[["h4","e1"]],conceptTag:"Early Queen Development",branches:[{triggerMove:"Nf6",from:"g8",to:"f6",narration:"Nf6 is solid but misses the spirit of the position. The knight defends but doesn't create immediate threats. Anderssen would continue with Nc3 and d4, building a powerful center.",fenAfter:"rnb1kb1r/pppp1ppp/5n2/8/2B1Ppq1/8/PPPP2PP/RNBQKBNR w KQkq - 0 4",refutation:"Nc3! d4! and White has a steamroller."}]},{moveNumber:4,color:"w",san:"Kf1",from:"e1",to:"f1",fenAfter:"rnb1kbnr/pppp1ppp/8/8/2B1Ppq1/8/PPPP2PP/RNBQK1NR b kq - 3 4",narration:"A brilliant move! Anderssen moves his king to f1 — not out of fear, but as a strategic decision. By giving up castling rights on the kingside, he keeps the h1 rook protected and plans to use it actively. The king will find safety later. In the 1800s, castling was seen as less important than attacking!",highlightSquares:["f1"],conceptTag:"King Safety vs Activity",annotation:"!"},{moveNumber:4,color:"b",san:"b5",from:"b7",to:"b5",fenAfter:"rnb1kbnr/p1pp1ppp/8/1p6/2B1Ppq1/8/PPPP2PP/RNBQK1NR w kq - 0 5",narration:"Kieseritzky attacks the bishop with b5! A bold counter-attack. He wants to drive away White's dangerous bishop before it can do more damage. But this loses more time...",highlightSquares:["b5","c4"],arrowsRed:[["b5","c4"]]},{moveNumber:5,color:"w",san:"Bxb5",from:"c4",to:"b5",fenAfter:"rnb1kbnr/p1pp1ppp/8/1B6/4Ppq1/8/PPPP2PP/RNBQK1NR b kq - 0 5",narration:"Anderssen calmly captures! Now White is actually UP in material — he has an extra pawn. But more importantly, the bishop moves to b5, still active and now eyeing d7. Anderssen isn't just attacking — he's conducting the entire game like a symphony!",highlightSquares:["b5"],arrowsGreen:[["c4","b5"]]},{moveNumber:5,color:"b",san:"Nf6",from:"g8",to:"f6",fenAfter:"rnb1kb1r/p1pp1ppp/5n2/1B6/4Ppq1/8/PPPP2PP/RNBQK1NR w kq - 1 6",narration:"Finally Kieseritzky develops a piece! The knight comes to f6, attacking the e4 pawn and developing simultaneously. But he's three moves behind in development — a serious deficit when the position is so open.",highlightSquares:["f6","e4"]},{moveNumber:6,color:"w",san:"Nf3",from:"g1",to:"f3",fenAfter:"rnb1kb1r/p1pp1ppp/5n2/1B6/4Ppq1/5N2/PPPP2PP/RNBQK2R b kq - 2 6",narration:"The knight develops with tempo, attacking the queen on h4! Every White move has a threat. Anderssen builds his attack like a master craftsman — each piece placed with purpose and precision.",highlightSquares:["f3","h4"],arrowsGreen:[["g1","f3"]]},{moveNumber:6,color:"b",san:"Nh5",from:"f6",to:"h5",fenAfter:"rnb1kb1r/p1pp1ppp/8/1B5n/4Ppq1/5N2/PPPP2PP/RNBQK2R w kq - 3 7",narration:"The knight retreats to h5 — an awkward square! Kieseritzky is running out of good moves. The queen was in the way, so the knight goes to h5 where it does very little. White is completely dominating the center and development.",highlightSquares:["h5"],arrowsRed:[["f6","h5"]]},{moveNumber:7,color:"w",san:"d3",from:"d2",to:"d3",fenAfter:"rnb1kb1r/p1pp1ppp/8/1B5n/4Ppq1/3P1N2/PPP3PP/RNBQK2R b kq - 0 7",narration:"A quiet but powerful move. Anderssen plays d3, supporting the e4 pawn and preparing to open more diagonals. Notice how he's not rushing — he's completing his development systematically before launching the decisive attack.",highlightSquares:["d3","e4"]},{moveNumber:7,color:"b",san:"Nc6",from:"b8",to:"c6",fenAfter:"r1b1kb1r/p1pp1ppp/2n5/1B5n/4Ppq1/3P1N2/PPP3PP/RNBQK2R w kq - 1 8",narration:"Kieseritzky develops the queen's knight. A natural move, but he's still scrambling to catch up in development while White prepares the decisive blow.",highlightSquares:["c6"]},{moveNumber:8,color:"w",san:"Bxc6",from:"b5",to:"c6",fenAfter:"r1b1kb1r/p1pp1ppp/2B5/7n/4Ppq1/3P1N2/PPP3PP/RNBQK2R b kq - 0 8",narration:"The bishop captures the knight! This creates a weakness in Black's pawn structure and opens the d-file. Anderssen methodically destroys Black's defensive resources one by one.",highlightSquares:["c6","d7"],arrowsGreen:[["b5","c6"]]},{moveNumber:8,color:"b",san:"dxc6",from:"d7",to:"c6",fenAfter:"r1b1kb1r/p1p2ppp/2p5/7n/4Ppq1/3P1N2/PPP3PP/RNBQK2R w kq - 0 9",narration:"Black recaptures. The position is now ripe for Anderssen's combination. White has sacrificed a bishop but gained crucial open lines toward the Black king. Look at the position carefully — can you see the winning idea?",highlightSquares:["c6"],isKeyMoment:!0,hint:"White is about to sacrifice massively. What would justify giving up a rook?"},{moveNumber:9,color:"w",san:"Rg1",from:"h1",to:"g1",fenAfter:"r1b1kb1r/p1p2ppp/2p5/7n/4Ppq1/3P1N2/PPP3PP/RNBQK1R1 b kq - 1 9",narration:"The rook moves to g1! A mysterious-looking move that sets up one of the greatest sacrifices in chess history. Anderssen is preparing to sacrifice this very rook to open the g-file. Meanwhile, Black's queen on h4 will be trapped!",highlightSquares:["g1"],arrowsGreen:[["h1","g1"]],annotation:"!!",isKeyMoment:!0},{moveNumber:9,color:"b",san:"Qxg2+",from:"h4",to:"g2",fenAfter:"r1b1kb1r/p1p2ppp/2p5/7n/4Pp2/3P1N2/PPP3qP/RNBQK1R1 w kq - 0 10",narration:"Black captures on g2 with check — seemingly winning material! But this is exactly what Anderssen planned. The queen is now deep in White's position but completely out of play when it matters most.",highlightSquares:["g2"]},{moveNumber:10,color:"w",san:"Rxg7+",from:"g1",to:"g7",fenAfter:"r1b1kb1r/p1p2Rpp/2p5/7n/4Pp2/3P1N2/PPP3qP/RNBQK3 b kq - 0 10",narration:"SACRIFICE! The rook captures on g7 with check — a thunderbolt! Anderssen gives away his rook to expose the Black king! Now begins one of the most famous attacking sequences in the history of chess.",highlightSquares:["g7","e8"],arrowsRed:[["g1","g7"]],annotation:"!!",isKeyMoment:!0},{moveNumber:10,color:"b",san:"Kd8",from:"e8",to:"d8",fenAfter:"r1b1k2r/p1p2Rpp/2p5/7n/4Pp2/3P1N2/PPP3qP/RNBQK3 w - - 1 11",narration:"The king must move. Kd8 is the only option. The Black king is now in the center of the board, dangerously exposed. This is why king safety is so crucial in chess!",highlightSquares:["d8"]},{moveNumber:11,color:"w",san:"Qf3+",from:"d1",to:"f3",fenAfter:"r1b1k2r/p1p2Rpp/2p5/7n/4Pp2/3P1Q2/PPP3qP/RNB1K3 b - - 2 11",narration:"The queen comes to f3 with check! Another piece joins the attack. White now threatens Qxf4 or Bg5+ winning the game. Notice how ALL of White's pieces are participating in the attack — this is the essence of good attacking chess!",highlightSquares:["f3","d8"],arrowsGreen:[["d1","f3"]]},{moveNumber:11,color:"b",san:"Ng7",from:"h5",to:"g7",fenAfter:"r1b1k2r/p1p2Rnp/2p5/8/4Pp2/3P1Q2/PPP3qP/RNB1K3 w - - 3 12",narration:"The knight desperately blocks! Ng7 tries to parry the threats, but Black's position is beyond saving. The knight is pinned and cannot escape the coming storm.",highlightSquares:["g7"]},{moveNumber:12,color:"w",san:"Bg5+",from:"c1",to:"g5",fenAfter:"r1b1k2r/p1p2Rnp/2p5/6B1/4Pp2/3P1Q2/PPP3qP/RN2K3 b - - 4 12",narration:"Another piece enters the attack! Bg5+ — every White piece is now aimed at the Black king. The bishop joins the choir of attackers. Can you feel the relentless pressure? This is what a coordinated attack looks like!",highlightSquares:["g5","d8"],arrowsGreen:[["c1","g5"]],annotation:"!"},{moveNumber:12,color:"b",san:"Nf5",from:"g7",to:"f5",fenAfter:"r1b1k2r/p1p2R1p/2p5/5nB1/4Pp2/3P1Q2/PPP3qP/RN2K3 w - - 5 13",narration:"The knight tries to block on f5. Desperate measures! But Anderssen has seen everything.",highlightSquares:["f5"]},{moveNumber:13,color:"w",san:"Rxf7+",from:"g7",to:"f7",fenAfter:"r1b1k2r/p1p2R1p/2p5/5nB1/4Pp2/3P1Q2/PPP3qP/RN2K3 w - - 0 13",narration:"ANOTHER sacrifice! The rook captures on f7! Anderssen pours fuel on the fire. He has now sacrificed a bishop, two rooks — and the queen is still not in the game! This is absolute chess genius.",highlightSquares:["f7"],arrowsRed:[["g7","f7"]],annotation:"!!",isKeyMoment:!0},{moveNumber:13,color:"b",san:"Ke8",from:"d8",to:"e8",fenAfter:"r1b1k2r/p1p2R1p/2p5/5nB1/4Pp2/3P1Q2/PPP3qP/RN2K3 b - - 0 13",narration:"The king retreats — there is no escape.",highlightSquares:["e8"]},{moveNumber:14,color:"w",san:"Qxf5+",from:"f3",to:"f5",fenAfter:"r1b1k2r/p1p2R1p/2p5/5QB1/4Pp2/3P4/PPP3qP/RN2K3 b - - 0 14",narration:"The queen captures the knight with check! White has given up enormous material, but look at Black's exposed king — completely defenseless.",highlightSquares:["f5","e8"]},{moveNumber:14,color:"b",san:"Kd7",from:"e8",to:"d7",fenAfter:"r1b4r/p1pR1k1p/2p5/5QB1/4Pp2/3P4/PPP3qP/RN2K3 w - - 1 15",narration:"The king moves to d7. The position is hopeless for Black, but let's see how Anderssen delivers the final blow.",highlightSquares:["d7"]},{moveNumber:15,color:"w",san:"Qf7#",from:"f5",to:"f7",fenAfter:"r1b4r/p1pQ1k1p/2p5/6B1/4Pp2/3P4/PPP3qP/RN2K3 b - - 2 15",narration:"CHECKMATE! Queen to f7 — and it's all over! Anderssen delivers checkmate with just his queen and bishop, having sacrificed his queen-side rook, king-side rook, and bishop for this brilliant attack. This game, played in 1851, is still studied today as one of the most beautiful chess games ever played. The Immortal Game!",highlightSquares:["f7","d7"],arrowsGreen:[["f5","f7"]],annotation:"!!",isKeyMoment:!0}],summary:"The Immortal Game demonstrates the power of piece activity, development, and coordinated attacking play over material considerations. Anderssen's willingness to sacrifice material to maintain the initiative and attack the exposed enemy king remains an inspiration for all chess players.",keyPoints:["Development is more valuable than material in open positions","All pieces must participate in the attack","An exposed king in the center is a decisive weakness","Sacrifices are justified when they create decisive threats","King's Gambit creates open lines and rapid development"]},{metadata:{id:"lesson-002",title:"The Sicilian Dragon",subtitle:"Yugoslav Attack — Sharp & Aggressive",difficulty:"Intermediate",category:"Opening",estimatedMinutes:15,tags:["sicilian","dragon","king attack","opposite castling","pawn storm"],coachEmoji:"🐉",coachName:"Coach Tactical",description:"Learn the explosive Sicilian Dragon — one of the sharpest openings in all of chess. Both sides attack the opponent's king with full force!",objectives:["Understand the Dragon pawn structure","Learn the key attacking plans for both sides","Recognize typical piece placements and maneuvers"],rating:1400},initialFen:"rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1",initialOrientation:"w",moves:[{moveNumber:1,color:"w",san:"e4",from:"e2",to:"e4",fenAfter:"rnbqkbnr/pppppppp/8/8/4P3/8/PPPP1PPP/RNBQKBNR b KQkq e3 0 1",narration:"1. e4 — the King's Pawn opening. White immediately fights for the center and aims for open, tactical play.",arrowsGreen:[["e2","e4"]],conceptTag:"Center Control"},{moveNumber:1,color:"b",san:"c5",from:"c7",to:"c5",fenAfter:"rnbqkbnr/pp1ppppp/8/2p5/4P3/8/PPPP1PPP/RNBQKBNR w KQkq c6 0 2",narration:"1...c5! The Sicilian Defense — the most popular chess opening at the highest level! Instead of mirroring e5, Black fights asymmetrically. This creates imbalanced positions where both sides can play for a win. Welcome to the world's most dynamic opening!",highlightSquares:["c5","d4"],arrowsGreen:[["c7","c5"]],conceptTag:"Asymmetrical Play",annotation:"!"},{moveNumber:2,color:"w",san:"Nf3",from:"g1",to:"f3",fenAfter:"rnbqkbnr/pp1ppppp/8/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R b KQkq - 1 2",narration:"Nf3 — White develops the knight, attacks the e5 square, and prepares d4. This is the standard path to the Open Sicilian — the most theoretically rich territory in all of chess.",highlightSquares:["f3"],conceptTag:"Development"},{moveNumber:2,color:"b",san:"d6",from:"d7",to:"d6",fenAfter:"rnbqkbnr/pp2pppp/3p4/2p5/4P3/5N2/PPPP1PPP/RNBQKB1R w KQkq - 0 3",narration:"d6 — preparing to play Nf6 without allowing e5. This is the starting point for the Dragon, Scheveningen, and Najdorf variations. Black is building a solid foundation.",highlightSquares:["d6"]},{moveNumber:3,color:"w",san:"d4",from:"d2",to:"d4",fenAfter:"rnbqkbnr/pp2pppp/3p4/2p5/3PP3/5N2/PPP2PPP/RNBQKB1R b KQkq d3 0 3",narration:"d4! White strikes in the center — this is the critical moment of the Open Sicilian. White offers to exchange pawns and gain a center majority. Black can now capture and create the 'Open c-file' which will become a major weapon!",highlightSquares:["d4","c5"],arrowsGreen:[["d2","d4"]],isKeyMoment:!0},{moveNumber:3,color:"b",san:"cxd4",from:"c5",to:"d4",fenAfter:"rnbqkbnr/pp2pppp/3p4/8/3pP3/5N2/PPP2PPP/RNBQKB1R w KQkq - 0 4",narration:"cxd4 — Black captures, giving White a central pawn majority but gaining the open c-file. This is the fundamental trade-off of the Sicilian: White gets the center, Black gets counterplay on the queenside. The game is balanced but VERY different for both sides!",highlightSquares:["d4","c1"],conceptTag:"Pawn Structure"},{moveNumber:4,color:"w",san:"Nxd4",from:"f3",to:"d4",fenAfter:"rnbqkbnr/pp2pppp/3p4/8/3NP3/8/PPP2PPP/RNBQKB1R b KQkq - 0 4",narration:"Nxd4 — the knight recaptures in the center. White has a strong knight on d4 and a central pawn on e4. Now it's time for Black to show the Dragon setup!",highlightSquares:["d4"]},{moveNumber:4,color:"b",san:"Nf6",from:"g8",to:"f6",fenAfter:"rnbqkb1r/pp2pppp/3p1n2/8/3NP3/8/PPP2PPP/RNBQKB1R w KQkq - 1 5",narration:"Nf6! The knight attacks the e4 pawn and develops powerfully. Black is building up piece by piece. Next will come g6 — and then we'll see the famous Dragon bishop emerge!",highlightSquares:["f6","e4"]},{moveNumber:5,color:"w",san:"Nc3",from:"b1",to:"c3",fenAfter:"rnbqkb1r/pp2pppp/3p1n2/8/3NP3/2N5/PPP2PPP/R1BQKB1R b KQkq - 2 5",narration:"Nc3 — White develops the queen's knight, defending e4 and preparing to castle. This is perfect development — every piece is going to its ideal square.",highlightSquares:["c3"]},{moveNumber:5,color:"b",san:"g6",from:"g7",to:"g6",fenAfter:"rnbqkb1r/pp2pp1p/3p1np1/8/3NP3/2N5/PPP2PPP/R1BQKB1R w KQkq - 0 6",narration:"g6! This is the Dragon move! Black prepares to fianchetto the bishop to g7, where it will become a fearsome 'Dragon bishop' controlling the long diagonal. This bishop is often the most powerful piece in the entire Dragon variation!",highlightSquares:["g6","g7","h8","a1"],conceptTag:"Fianchetto",annotation:"!",isKeyMoment:!0,hint:"Where will the bishop go after g6? What diagonal will it control?"},{moveNumber:6,color:"w",san:"Be3",from:"c1",to:"e3",fenAfter:"rnbqkb1r/pp2pp1p/3p1np1/8/3NP3/2N1B3/PPP2PPP/R1BQKB1R b KQkq - 1 6",narration:"Be3 — White develops the bishop and prepares for the Yugoslav Attack. The plan involves f3, Qd2, O-O-O — queenside castling! White will then launch a pawn storm on the kingside with h4-h5-g4-g5. RACE TO THE KILL!",highlightSquares:["e3"],conceptTag:"Yugoslav Attack"},{moveNumber:6,color:"b",san:"Bg7",from:"f8",to:"g7",fenAfter:"rnbqk2r/pp2ppbp/3p1np1/8/3NP3/2N1B3/PPP2PPP/R1BQKB1R w KQkq - 2 7",narration:"Bg7! The Dragon bishop arrives! This bishop on g7 is absolutely magnificent — it controls the entire long diagonal from h8 to a1. In many Dragon games, Black sacrifices material just to keep this bishop alive. It's the heart and soul of the Dragon!",highlightSquares:["g7","a1","b2","c3"],arrowsGreen:[["g7","a1"]],annotation:"!"},{moveNumber:7,color:"w",san:"f3",from:"f2",to:"f3",fenAfter:"rnbqk2r/pp2ppbp/3p1np1/8/3NP3/2N1BP2/PPP3PP/R1BQKB1R b KQkq - 0 7",narration:"f3! The Yugoslav Attack begins in earnest. This move shores up the center and prevents Ng4 attacking the bishop. But more importantly, it prepares the g4-g5 pawn storm. Both sides must now race to attack the opponent's king before the other!",highlightSquares:["f3"],conceptTag:"Pawn Storm"},{moveNumber:7,color:"b",san:"O-O",from:"e8",to:"g8",fenAfter:"rnbq1rk1/pp2ppbp/3p1np1/8/3NP3/2N1BP2/PPP3PP/R1BQKB1R w KQ - 1 8",narration:"O-O! Black castles kingside. The king finds safety... for now! But White is about to castle queenside and begin a ferocious kingside pawn storm. The classic Dragon battle is about to begin — two armies racing to attack each other's king!",highlightSquares:["g8","f8"]},{moveNumber:8,color:"w",san:"Qd2",from:"d1",to:"d2",fenAfter:"rnbq1rk1/pp2ppbp/3p1np1/8/3NP3/2N1BP2/PPPQ2PP/R3KB1R b KQ - 2 8",narration:"Qd2! The queen eyes the d6 pawn and prepares to swing to h6 — a key attacking square in the Dragon. After queenside castling, White will open the h-file and try to pry open the Dragon king's castle. The tension is building!",highlightSquares:["d2"],arrowsGreen:[["d2","h6"]]},{moveNumber:8,color:"b",san:"Nc6",from:"b8",to:"c6",fenAfter:"r1bq1rk1/pp2ppbp/2np1np1/8/3NP3/2N1BP2/PPPQ2PP/R3KB1R w KQ - 3 9",narration:"Nc6! Black develops the knight, putting pressure on d4. In the Dragon, Black often plays for the exchange of the d4 knight to open the position for the Dragon bishop. Every piece has a role in the counterattack!",highlightSquares:["c6","d4"]},{moveNumber:9,color:"w",san:"O-O-O",from:"e1",to:"c1",fenAfter:"r1bq1rk1/pp2ppbp/2np1np1/8/3NP3/2N1BP2/PPPQ2PP/2KR1B1R b - - 4 9",narration:"O-O-O! White castles queenside — the gauntlet is thrown! Now the position is completely electric. White will push h4-h5 to attack the Dragon kingside, while Black will open the c-file and push a5-b5-a4 to attack the queenside king. BOTH KINGS ARE UNDER ATTACK — who gets there first?!",highlightSquares:["c1"],annotation:"!",isKeyMoment:!0}],summary:"The Sicilian Dragon is one of the most dynamic and theoretically rich openings in chess. The key ideas are: White attacks on the kingside with a pawn storm (h4-h5-g4), while Black counterattacks on the queenside (c-file pressure, ...b5-b4). The Dragon bishop on g7 is Black's most powerful piece.",keyPoints:["The Dragon bishop on g7 is the key piece for Black","Both sides castle on opposite wings and race to attack","White uses h4-h5 pawn storm to crack open the kingside","Black uses the c-file and ...b5-b4 for queenside counterplay","The Yugoslav Attack (f3, Qd2, O-O-O) is the most aggressive White system"]},{metadata:{id:"lesson-003",title:"Rook Endgame Mastery",subtitle:"Lucena & Philidor — Two Essential Positions",difficulty:"Beginner",category:"Endgame",estimatedMinutes:12,tags:["rook endgame","lucena","philidor","king and pawn","technique"],coachEmoji:"♜",coachName:"Coach Technique",description:"Master the two most important rook endgame positions: the Lucena (winning technique) and the Philidor (drawing technique). Every chess player MUST know these!",objectives:["Learn the Lucena position and the bridge-building technique","Learn the Philidor position and the drawing method","Apply these techniques in practical rook endgames"],rating:1200},initialFen:"1K1k4/1P6/8/8/8/8/8/R3r3 w - - 0 1",initialOrientation:"w",moves:[{moveNumber:1,color:"w",san:"Rd1+",from:"a1",to:"d1",fenAfter:"1K1k4/1P6/8/8/8/8/8/3Rr3 b - - 1 1",narration:"Welcome to the Lucena Position — the most important winning technique in rook endgames! White has a pawn on the 7th rank with the king in front. The black rook is on the 1st rank giving annoying checks. The winning method is called 'Building the Bridge!' Watch carefully...",highlightSquares:["d1"],arrowsGreen:[["a1","d1"]],conceptTag:"Lucena Position",isKeyMoment:!0},{moveNumber:1,color:"b",san:"Re4",from:"e1",to:"e4",fenAfter:"1K1k4/1P6/8/8/4r3/8/8/3R4 w - - 2 2",narration:"Black moves the rook to e4 — waiting to give checks when White's king tries to come out. The black plan is to keep giving checks to prevent the white king from escaping.",highlightSquares:["e4"]},{moveNumber:2,color:"w",san:"Kc7",from:"b8",to:"c7",fenAfter:"8/1PK5/3k4/8/4r3/8/8/3R4 b - - 3 2",narration:"The king advances! Now it's closer to the pawn and ready to support promotion. But Black will now give checks from the side. The key insight: White needs to block the checks by 'building a bridge' with the rook.",highlightSquares:["c7"]},{moveNumber:2,color:"b",san:"Rc4+",from:"e4",to:"c4",fenAfter:"8/1PK5/3k4/8/2r5/8/8/3R4 w - - 4 3",narration:"Check from the c-file! This is the typical defensive technique — Black gives sideways checks to keep the white king from escaping the rook. White must now demonstrate the brilliant 'bridge-building' technique!",highlightSquares:["c4","c7"]},{moveNumber:3,color:"w",san:"Rd4",from:"d1",to:"d4",fenAfter:"8/1PK5/3k4/8/2rR4/8/8/8 b - - 5 3",narration:"Rd4! — THE BRIDGE! This is the key move! The rook moves to d4, blocking the check AND creating a 'bridge' that will shield the white king from further checks. Once the black rook retreats, the white king will walk around the d4 rook to safety. BRILLIANT technique!",highlightSquares:["d4"],arrowsGreen:[["d1","d4"]],annotation:"!!",isKeyMoment:!0,hint:"The rook creates a 'bridge' — a shield for the king. Which square does the rook need to go to?"},{moveNumber:3,color:"b",san:"Rxd4",from:"c4",to:"d4",fenAfter:"8/1PK5/3k4/8/3r4/8/8/8 w - - 0 4",narration:"If Black captures the rook, White simply promotes! This is a losing try for Black. The pawn queens, and the game is over.",highlightSquares:["d4"]},{moveNumber:4,color:"w",san:"b8=Q",from:"b7",to:"b8",fenAfter:"1Q6/8/3k4/8/3r4/8/8/8 b - - 0 4",narration:"Queen! The pawn promotes and White wins easily. This is why the Lucena technique is so important — once you know it, rook endgames with a passed pawn become much more manageable. The queen and king will easily overpower the lone rook.",highlightSquares:["b8"],arrowsGreen:[["b7","b8"]],annotation:"!"}],summary:"The Lucena Position is the fundamental winning technique in rook endgames with a passed pawn. The key method — 'Building the Bridge' — uses the rook to shield the king from sideways checks, allowing the pawn to promote. Every chess player must know this technique!",keyPoints:["Lucena Position: king in front of pawn on 7th rank = WIN","Build the Bridge: use the rook to shield the king from checks","The bridge move (Rd4 in this case) is the key insight","If Black captures the bridge rook, the pawn promotes","Study Philidor too: the drawing technique for the defender"]},{metadata:{id:"lesson-004",title:"Fork Tactics Masterclass",subtitle:"Knight Forks & Double Attacks",difficulty:"Beginner",category:"Tactics",estimatedMinutes:10,tags:["fork","knight","double attack","tactics","winning material"],coachEmoji:"⚔️",coachName:"Coach Sharp",description:"Master the knight fork — the most spectacular tactical weapon in chess! Learn how to set up and execute double attacks that win material.",objectives:["Understand what a fork is and why it wins material","Recognize ideal knight fork squares","Learn how to set up knight forks"],rating:1e3},initialFen:"r1bqkb1r/pppp1ppp/2n2n2/4p3/2B1P3/5N2/PPPP1PPP/RNBQK2R w KQkq - 4 4",initialOrientation:"w",moves:[{moveNumber:4,color:"w",san:"Ng5",from:"f3",to:"g5",fenAfter:"r1bqkb1r/pppp1ppp/2n2n2/4p1N1/2B1P3/8/PPPP1PPP/RNBQK2R b KQkq - 5 4",narration:"Ng5! The knight leaps to g5, attacking the f7 square! This is a direct threat — the knight and bishop both eye f7, and if White can play Nxf7 forking the queen on d8 and the rook on h8, it wins material immediately. How should Black respond?",highlightSquares:["g5","f7"],arrowsGreen:[["f3","g5"]],arrowsRed:[["g5","f7"],["c4","f7"]],isKeyMoment:!0,hint:"White threatens Nxf7! Where does the fork attack? Queen AND Rook!"},{moveNumber:4,color:"b",san:"d5",from:"d7",to:"d5",fenAfter:"r1bqkb1r/ppp2ppp/2n2n2/3pp1N1/2B1P3/8/PPPP1PPP/RNBQK2R w KQkq d6 0 5",narration:"d5! The best response! Black attacks the bishop AND gains center space. If White plays exd5 or Bxd5, Black loses a pawn but blocks the fork. This counterattack is the key defensive idea against Ng5.",highlightSquares:["d5","c4"]},{moveNumber:5,color:"w",san:"exd5",from:"e4",to:"d5",fenAfter:"r1bqkb1r/ppp2ppp/2n2n2/3Pp1N1/2B5/8/PPPP1PPP/RNBQK2R b KQkq - 0 5",narration:"White captures on d5. Now Black's knight on c6 is attacked, and the position is becoming complex. Let's see how the fork theme develops after Black's response.",highlightSquares:["d5","c6"]},{moveNumber:5,color:"b",san:"Na5",from:"c6",to:"a5",fenAfter:"r1bqkb1r/ppp2ppp/5n2/n2Pp1N1/2B5/8/PPPP1PPP/RNBQK2R w KQkq - 1 6",narration:"Na5! Black attacks the bishop on c4. Now White faces a critical decision — the bishop is attacked and must move. Meanwhile, Black is setting up a counter-fork threat of his own! Can you see it?",highlightSquares:["a5","c4"],arrowsRed:[["a5","c4"]],isKeyMoment:!0,hint:"If the bishop moves to b3, what happens? Think about the knight on a5 and where it could go next to attack two pieces at once!"},{moveNumb
