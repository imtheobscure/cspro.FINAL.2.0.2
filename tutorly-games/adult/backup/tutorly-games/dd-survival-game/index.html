 Then another. You recover quickly — but blood has already been paid to the dungeon.",riskLevel:"risky"},{id:"c1c",label:"Scavenge the entrance for gear",emoji:"🔍",description:"If others died here, let their mistakes feed your survival.",outcome:"jackpot",applyTo:"party",hpChange:0,goldChange:20,xpChange:60,staminaChange:0,grantsItem:bl("heal-potion"),outcomeNarration:`You find a dead adventurer's pack. A healing potion. 20 gold. And a note: "DON'T TRUST THE MIRROR." Wonderful. That is definitely not terrifying.`,riskLevel:"safe"},{id:"c1d",label:"Offer a prayer for protection",emoji:"🙏",description:"Ask whatever gods still listen to this place for mercy.",outcome:"neutral",applyTo:"party",hpChange:0,goldChange:0,xpChange:35,staminaChange:5,outcomeNarration:"You whisper prayers into the dark. The air warms slightly. Perhaps something heard you. Perhaps something laughed.",riskLevel:"safe"}]},{id:"ev02",kind:"trap",chapter:1,title:"The Corridor of Clicking Stones",imageKey:"trap-room",narration:"A corridor of pressure tiles. Arrow holes line the walls like hungry mouths. A skeleton lies mid-sprint — still trying to run centuries later.",dmReaction:{onEnter:"Traps don't hate you. They don't fear you. They're simply honest about what they do.",onGoodOutcome:"Elegant. Precise. Almost beautiful.",onBadOutcome:"Arrows fly. Blood follows.",onDeath:"The corridor adds another skeleton to its collection."},timeLimitSec:50,trap:{name:"Arrow Storm",description:"A volley of bolts fires from both walls.",damage:45,avoidStat:"dex",avoidDC:14,imageKey:"trap-room"},choices:[{id:"c2a",label:"Disarm it with patience",emoji:"🔧",description:"Find the mechanism and kill it before it kills you.",outcome:"good",applyTo:"active",hpChange:0,goldChange:0,xpChange:70,staminaChange:-10,skillCheck:{stat:"int",dc:13},outcomeNarration:"You pry loose a stone panel. A rusted lever. You pull. The tiles relax with a final defeated click. The dungeon sighs.",riskLevel:"risky"},{id:"c2b",label:"Rogue-style dash between tiles",emoji:"🗡️",description:"Precision footwork. Fast. Dangerous.",outcome:"neutral",applyTo:"active",hpChange:-12,goldChange:0,xpChange:55,staminaChange:-15,skillCheck:{stat:"dex",dc:12},outcomeNarration:"You move like smoke — until a tile dips. A bolt grazes your arm. You make it through, breathing hard.",riskLevel:"risky"},{id:"c2c",label:"Sprint as a group. Pray.",emoji:"⚡",description:"Everyone runs. The dungeon chooses who it hits.",outcome:"bad",applyTo:"party",hpChange:-30,goldChange:0,xpChange:35,staminaChange:-25,outcomeNarration:"The corridor erupts in violence. Bolts slam into stone. Someone screams. You escape, but the dungeon collects its toll.",riskLevel:"deadly"},{id:"c2d",label:"Send a shield-bearer first",emoji:"🛡️",description:"Let the toughest take the storm while others follow.",outcome:"good",applyTo:"active",hpChange:-10,goldChange:0,xpChange:60,staminaChange:-10,outcomeNarration:"You raise your shield and advance. Bolts hammer into it like rain. Painful, but controlled. The party follows your safe trail.",riskLevel:"risky"}]},{id:"ev03",kind:"npc",chapter:1,title:"A Pet in the Dark",imageKey:"potion-herbs",narration:"Behind a cracked pillar, a tiny creature shivers — a wolf pup, black as ash, eyes like moonlight. It's hungry. Afraid. But it doesn't run when you approach. It watches your hands.",dmReaction:{onEnter:"Not everything down here wants to kill you. Not immediately.",onGoodOutcome:"A new bond is forged. Companions matter when death corners you.",onBadOutcome:"You had a chance at loyalty. You traded it for convenience.",onDeath:"Even the pup turns away from the body. The ruins have rules."},timeLimitSec:55,choices:[{id:"c3a",label:"Feed it and adopt it",emoji:"🐺",description:"Spend some gold to earn loyalty.",outcome:"good",applyTo:"party",hpChange:0,goldChange:-10,xpChange:80,staminaChange:0,addCompanion:mo("pet-wolf"),outcomeNarration:"You offer food. The pup approaches, sniffs, then devours it. After a moment it presses its head against your leg. Congratulations — you now have a wolf pup. Also: a moral obligation.",riskLevel:"safe"},{id:"c3b",label:"Ignore it. Focus on survival",emoji:"🚶",description:"You can't carry attachments in a place like this.",outcome:"neutral",applyTo:"party",hpChange:0,goldChange:0,xpChange:30,staminaChange:5,outcomeNarration:"You walk away. The pup does not follow. Behind you, you hear a quiet whine — or perhaps the dungeon mimicking it.",riskLevel:"safe"},{id:"c3c",label:"Try to scare it away",emoji:"😠",description:"No distractions. No weak links.",outcome:"bad",applyTo:"party",hpChange:-10,goldChange:0,xpChange:20,staminaChange:-5,outcomeNarration:"You shout. The pup bolts — and triggers a hidden nail trap. A spike catches someone's boot. The pup disappears, but the dungeon remembers your cruelty.",riskLevel:"risky"}]},{id:"ev04",kind:"monster",chapter:2,title:"The Troll Under the Bridge",imageKey:"monster-encounter",narration:'A bridge spans a chasm. A troll sits beneath it, picking teeth with a femur. It looks up. "Toll," it rumbles. "Or blood."',dmReaction:{onEnter:"A troll. Classic. Dangerous. Annoyingly confident.",onGoodOutcome:"Well played. You made a monster blink.",onBadOutcome:"It hits like a landslide.",onDeath:"The troll adds another bone to the collection."},timeLimitSec:45,monster:{name:"Grothak the Bridge Troll",description:"Regenerating brute. It loves easy meals and hard bargains.",hp:140,attackDamage:40,lootGold:60,lootXP:110,weaknessHint:"Fire stops regeneration. Confidence stops breathing.",imageKey:"monster-encounter",loot:bl("iron-shield")},partyTwist:{canSideWithEnemy:!0},choices:[{id:"c4a",label:"Pay the toll (50 gold)",emoji:"💰",description:"You value life more than coins.",outcome:"neutral",applyTo:"party",hpChange:0,goldChange:-50,xpChange:30,staminaChange:0,outcomeNarration:'The troll counts coins with surprising skill. "Smart meat," it says, and lets you pass. You hate that sentence.',riskLevel:"safe"},{id:"c4b",label:"Fight it head-on",emoji:"⚔️",description:"End the threat. Earn the bridge.",outcome:"bad",applyTo:"active",hpChange:-40,goldChange:60,xpChange:120,staminaChange:-25,skillCheck:{stat:"str",dc:15},outcomeNarration:"Steel meets stone-flesh. The troll slams you into the bridge, cracking ribs. But you keep swinging. It finally topples into the abyss, roaring all the way down. You loot 60 gold from its nest.",riskLevel:"deadly"},{id:"c4c",label:'Lie: "We serve the Lich King"',emoji:"🎭",description:"Fear is cheaper than steel.",outcome:"good",applyTo:"active",hpChange:0,goldChange:0,xpChange:90,staminaChange:0,skillCheck:{stat:"cha",dc:14},outcomeNarration:`Your voice becomes a weapon. The troll's eyes widen. It shuffles aside, bowing. "No dust! No curse! Go!" It trembles. You pass — victorious without blood.`,riskLevel:"risky"},{id:"c4d",label:"Side with the troll (betray another party)",emoji:"🩸",description:"Offer the troll a different meal: someone else.",outcome:"death",applyTo:"target",requiresTargetPlayer:!0,hpChange:-999,goldChange:0,xpChange:150,staminaChange:0,stealGoldFromTarget:20,outcomeNarration:"The troll grins. You point at a party member. The troll lunges. This is not a bluff. Someone's story ends here — and the rest of you will never forget who chose it.",riskLevel:"deadly"}]},{id:"ev05",kind:"jumpscare",chapter:2,title:"The Whispering Gallery",imageKey:"dungeon-bg",narration:"A circular chamber. Carved faces. Your footsteps echo as if something follows one step behind you. The air is suddenly cold. A whisper touches the back of your neck.",dmReaction:{onEnter:"Shhh. Don't move. Something is in here with you.",onGoodOutcome:"You kept your head. In this dungeon, that is rare.",onBadOutcome:"Fear makes fools of everyone eventually.",onDeath:"The last sound you hear is your own heartbeat stopping."},timeLimitSec:40,jumpscare:{name:"Banshee Echo",description:"A spectral remnant of a queen who died screaming.",damage:25,imageKey:"monster-encounter",scare:"💀 A face materialises inches from you — screaming without sound. Then the scream hits your bones."},choices:[{id:"c5a",label:"Stand perfectly still",emoji:"🧊",description:"No movement. No breathing. No mistakes.",outcome:"good",applyTo:"party",hpChange:0,goldChange:0,xpChange:75,staminaChange:-10,skillCheck:{stat:"wis",dc:12},outcomeNarration:"You freeze. The presence drifts past. Cold air. Ancient grief. Then it fades. You exhale together like survivors.",riskLevel:"risky"},{id:"c5b",label:"Run for the exit",emoji:"🏃",description:"Flight is a decision too.",outcome:"bad",applyTo:"party",hpChange:-25,goldChange:0,xpChange:35,staminaChange:-20,outcomeNarration:"You bolt. The chamber punishes the noise. The scream hits you like a fist. You escape — shaken, alive, and slightly deaf.",riskLevel:"deadly"},{id:"c5c",label:"Speak to it with respect",emoji:"🗣️",description:"Some monsters are just pain that never ended.",outcome:"jackpot",applyTo:"party",hpChange:15,goldChange:0,xpChange:120,staminaChange:10,skillCheck:{stat:"cha",dc:15},grantsItem:bl("archmage-tome"),outcomeNarration:"You speak gently. The presence pauses. The grief softens. The queen's echo gifts you a fragment of ancient knowledge — and spares your hearts.",riskLevel:"risky"}]},{id:"ev06",kind:"merchant",chapter:2,title:"Grimshaw's Black Market",imageKey:"potion-herbs",narration:'A hidden chamber, warm fire, shelves of potions and weapons. Grimshaw looks up and smiles like a man selling exits. "Gold buys survival," he says.',dmReaction:{onEnter:"A merchant. Rare mercy. Rarer honesty. Spend wisely.",onGoodOutcome:"Now you look like a party that might actually survive.",onBadOutcome:"Leaving underprepared is a choice. A loud one.",onDeath:'Grimshaw shrugs. "Another donation to my stock," he mutters.'},timeLimitSec:90,merchant:{name:"Grimshaw the Fence",greeting:"I've outlived heroes, monsters, and curses. Buy something useful, or leave me in peace.",items:[],imageKey:"potion-herbs",canSell:!0},choices:[{id:"c6a",label:"Shop for gear",emoji:"🛒",description:"Open the shop UI and buy items.",outcome:"neutral",applyTo:"party",hpChange:0,goldChange:0,xpChange:20,staminaChange:15,outcomeNarration:'You browse grim tools of survival. Grimshaw watches, amused. "Everything has a price," he says. "Including your trust."',riskLevel:"safe"},{id:"c6b",label:"Ask for rumors (twists ahead)",emoji:"🗣️",description:"Learn what the dungeon won't tell you.",outcome:"good",applyTo:"party",hpChange:0,goldChange:0,xpChange:60,staminaChange:5,outcomeNarration:`Grimshaw leans in. "Sometimes the dungeon offers survival... by making you fight each other. Don't assume your party stays a party."`,riskLevel:"safe"},{id:"c6c",label:"Try to steal from Grimshaw",emoji:"🤫",description:"Risk it. He looks distracted.",outcome:"bad",applyTo:"active",hpChange:-20,goldChange:0,xpChange:15,staminaChange:0,skillCheck:{stat:"dex",dc:18},outcomeNarration:`A hidden blade snaps out. You bleed. Grimshaw doesn't even blink. "Try that again and you won't leave," he says pleasantly.`,riskLevel:"deadly"}]},{id:"ev07",kind:"betrayal",chapter:3,title:"The Hunger Contract",imageKey:"monster-encounter",narration:'A demon-scribe crawls out of a crack in the wall, carrying parchment made of skin. It looks at each of you for far too long, like it can taste secrets. "Sign," it whispers. "One of you dies. The rest receive a legendary artifact. Refuse... and I summon the Hunter." Its smile widens. "Love, jealousy, admiration, resentment... your hearts are loud. I can hear who would die for whom. I can also hear who would kill for whom." This is not a bluff. The dungeon is offering you a shortcut made of cruelty.',dmReaction:{onEnter:"Here it is. The dungeon's favorite game: turning friends into resources.",onGoodOutcome:"You refused the easy evil. The dungeon is... displeased.",onBadOutcome:"You made a dark choice. The reward is real. The consequences will be too.",onDeath:"The contract is satisfied. The dead do not argue."},t ve you, you've outplayed a demon. If not... you've just volunteered for oblivion.",riskLevel:"deadly"}]},{id:"ev08",kind:"rest",chapter:3,title:"The Underground Spring",imageKey:"potion-herbs",narration:"A hidden cavern glows with fungi like stars. A clear spring bubbles from the rock. For a moment, the dungeon feels like it might forgive you. For a moment.",dmReaction:{onEnter:"Rest. Breathe. The dungeon allows it — briefly.",onGoodOutcome:"Recovered. Stronger. Still doomed, but later.",onBadOutcome:"Even rest can carry a price down here.",onDeath:"You drowned in peace. That is almost poetic."},timeLimitSec:70,choices:[{id:"c8a",label:"Drink and recover",emoji:"💧",description:"Heal as a party.",outcome:"good",applyTo:"party",hpChange:35,goldChange:0,xpChange:40,staminaChange:25,outcomeNarration:"The water tastes like clean air. Wounds close. Muscles relax. You leave the spring stronger than you arrived.",riskLevel:"safe"},{id:"c8b",label:"Harvest glowing fungi to sell",emoji:"🍄",description:"Trade beauty for profit.",outcome:"neutral",applyTo:"party",hpChange:10,goldChange:25,xpChange:45,staminaChange:10,outcomeNarration:"You collect the fungi carefully. Alchemists would pay for this. The spring watches silently.",riskLevel:"safe"},{id:"c8c",label:"Offer the spring a gift, gain a companion",emoji:"🧝‍♀️",description:"Some places reward respect.",outcome:"jackpot",applyTo:"party",hpChange:20,goldChange:-10,xpChange:120,staminaChange:15,addCompanion:mo("comp-healer"),outcomeNarration:`You leave coins by the water and whisper thanks. A healer steps from the shadows, as if summoned by your humility. "I've been waiting," she says. "This dungeon needs someone who refuses to let people die."`,riskLevel:"risky"}]},{id:"ev09",kind:"treasure",chapter:3,title:"The Vault of Teeth",imageKey:"treasure",narration:"A door opens into a vault filled with gold, gems, and weapons. But the gold is mixed with teeth — hundreds of human teeth. The chest at the center is locked with a smili
