"#333333",utility:"#888888",none:"transparent"},gl=[{id:"q1",type:"mcq",cefrLevel:"B1",text:"Which phrase is the most professional way to start a business email?",options:["Hey there!","Dear Mr. Johnson,","Yo Johnson,","Hi dude,"],correctAnswer:"Dear Mr. Johnson,",explanation:'Business emails should start with a formal salutation like "Dear [Name],".'},{id:"q2",type:"mcq",cefrLevel:"B1",text:'What does "quarterly report" mean?',options:["A report made every quarter of an hour","A report made every three months","A report made once a year","A report made every week"],correctAnswer:"A report made every three months",explanation:'A "quarter" in business means a three-month period, so quarterly = every 3 months.'},{id:"q3",type:"mcq",cefrLevel:"B1",text:'Choose the correct form: "The meeting _____ at 9 AM tomorrow."',options:["will starting","starts","is start","starting"],correctAnswer:"starts",explanation:"We use present simple for scheduled future events."},{id:"q4",type:"mcq",cefrLevel:"B1",text:'What is a "deadline" in a work context?',options:["A phone line that is disconnected","The latest time something must be finished","A line on a sports field","A dangerous electrical cable"],correctAnswer:"The latest time something must be finished",explanation:'"Deadline" = the final date/time by which something must be completed.'},{id:"q5",type:"mcq",cefrLevel:"B1",text:"Which word means to officially end a business?",options:["Liquidate","Negotiate","Collaborate","Delegate"],correctAnswer:"Liquidate",explanation:'To "liquidate" a company means to close it down and sell its assets.'},{id:"q6",type:"mcq",cefrLevel:"B1",text:'Choose the correct preposition: "She is responsible ___ managing the team."',options:["to","for","of","at"],correctAnswer:"for",explanation:'"Responsible for" is the correct collocation in English.'},{id:"q7",type:"mcq",cefrLevel:"B1",text:'What does "ROI" stand for in business?',options:["Rate of Interest","Return on Investment","Revenue of Income","Risk of Inflation"],correctAnswer:"Return on Investment",explanation:"ROI = Return on Investment – a measure of profitability."},{id:"q8",type:"mcq",cefrLevel:"B1",text:"Which sentence uses the passive voice correctly?",options:["The report written by Sarah.","The report was written by Sarah.","Sarah been writing the report.","The report have written by Sarah."],correctAnswer:"The report was written by Sarah.",explanation:'Passive voice: "was + past participle (written)".'},{id:"q9",type:"mcq",cefrLevel:"B1",text:'"To negotiate" means…',options:["To argue aggressively","To discuss terms to reach an agreement","To refuse an offer","To sign a contract"],correctAnswer:"To discuss terms to reach an agreement",explanation:"Negotiation involves discussion aimed at reaching a mutually beneficial agreement."},{id:"q10",type:"mcq",cefrLevel:"B1",text:"Which modal verb expresses a polite request in a business email?",options:["You must send me the file.","Could you please send me the file?","Send me the file now.","I need the file!"],correctAnswer:"Could you please send me the file?",explanation:'"Could you please…?" is a polite way to make a request.'},{id:"q11",type:"true_false",cefrLevel:"B1",text:'"Brainstorming" means carefully evaluating ideas one by one.',options:["True","False"],correctAnswer:"False",explanation:"Brainstorming means generating many ideas quickly without judging them."},{id:"q12",type:"true_false",cefrLevel:"B1",text:'The phrase "touch base" means to briefly make contact or check in with someone.',options:["True","False"],correctAnswer:"True",explanation:'"Touch base" is a common business idiom meaning to briefly communicate.'},{id:"q13",type:"true_false",cefrLevel:"B1",text:'A "profit" occurs when expenses exceed revenue.',options:["True","False"],correctAnswer:"False",explanation:`Profit = Revenue minus Expenses. When expenses exceed revenue, that's a "loss".`},{id:"q14",type:"true_false",cefrLevel:"B1",text:'"Due diligence" refers to careful research and analysis before a business decision.',options:["True","False"],correctAnswer:"True",explanation:"Due diligence means thorough investigation, especially before signing contracts."},{id:"q15",type:"true_false",cefrLevel:"B1",text:'The word "agenda" in a meeting context means the list of topics to be discussed.',options:["True","False"],correctAnswer:"True",explanation:"A meeting agenda is a list of items to be discussed during a meeting."},{id:"q16",type:"fill_gap",cefrLevel:"B1",text:"We need to _____ a decision before the end of the meeting. (make / do / take / have)",correctAnswer:"make",explanation:'"Make a decision" is the correct collocation.'},{id:"q17",type:"fill_gap",cefrLevel:"B1",text:"The CEO will _____ a speech at the annual conference. (give / tell / say / speak)",correctAnswer:"give",explanation:'"Give a speech" – we "give" talks, presentations, and speeches.'},{id:"q18",type:"fill_gap",cefrLevel:"B1",text:"Please _____ me informed about any changes to the project. (keep / let / make / hold)",correctAnswer:"keep",explanation:'"Keep someone informed" = regularly update them about developments.'},{id:"q19",type:"fill_gap",cefrLevel:"B1",text:"The company decided to _____ into new markets in Asia. (expand / expend / express / export)",correctAnswer:"expand",explanation:'"Expand into" = to grow your business into new areas or markets.'},{id:"q20",type:"fill_gap",cefrLevel:"B1",text:"She submitted her _____ for the marketing manager position. (application / apply / applicable / applicant)",correctAnswer:"application",explanation:'You "submit an application" when applying for a job.'},{id:"q21",type:"listening",cefrLevel:"B1",text:"Listen carefully and answer: What is the speaker apologizing for?",audioText:"I sincerely apologize for the delay in delivering your order. We experienced unexpected supply chain disruptions last week, but I can assure you the package will arrive by Friday.",options:["Delivering the wrong product","Delaying the delivery","Over
