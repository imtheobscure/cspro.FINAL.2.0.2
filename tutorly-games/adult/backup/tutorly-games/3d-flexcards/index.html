rand names (Serendipity Ice Cream NYC). Perfect in essays about fate vs. coincidence.",song:"♫ You and me could write a bad romance... or was it serendipity? Every playlist that finds you perfectly — that's serendipity. ♫",movie:'"I believe in destiny. Some call it God, I call it serendipity." — Serendipity (2001, John Cusack)',joke:"I accidentally made the perfect coffee this morning. Serendip-a-tea! ☕",challenge:"PHYSICAL DARE: Stand up! Draw 'serendipity' on paper using only pictures — no words! Show the class in 60 seconds!",register:{slang:"lucky break / stumbled on it",casual:"a happy accident",informal:"stumbled upon by luck",neutral:"fortuitous discovery",formal:"serendipitous occurrence"},registerSlider:3,collocations:["pure serendipity","serendipitous discovery","by serendipity","a moment of serendipity"],nativeEquivalents:{Spanish:"serendipia",French:"sérendipité",German:"Serendipität",Japanese:"セレンディピティ"},tags:["abstract","literary","rare"],videoQuery:"serendipity movie scene",image:"https://images.unsplash.com/photo-1518621736915-f3b1c41bfd00?w=800&q=80"},{id:"2",front:"Resilience",back:"The ability to recover quickly from difficulties",pronunciation:"re·ZIL·ience",phoneticIPA:"/rɪˈzɪl.i.əns/",partOfSpeech:"noun",difficulty:"B2",emoji:"💪",example:"Her resilience after losing her job inspired the whole team.",ccq:"If someone cries and gives up — resilience? (No). If they bounce back stronger? (Yes!)",definition:"The capacity to withstand or to recover quickly from difficulties; toughness. In materials science, the ability to spring back into shape.",synonyms:["toughness","hardiness","adaptability","fortitude","grit","bounce-back"],antonyms:["fragility","vulnerability","weakness"],culturalFact:"The word comes from Latin 'resilire' (to spring back). In Japan, the concept of 'Nana korobi ya oki' (fall seven times, stand up eight) is the cultural equivalent.",commonErrors:["❌ 'She has a lot of resilience' is OK but ❌ 'She is very resilience' → ✅ 'She is very resilient'","❌ 'resillience' (spelling) → ✅ 'resilience'"],wouldYou:"Would you rather have superhuman physical resilience (never get tired) or emotional resilience (nothing can break your spirit)?",truthOrDare:{truth:"Share a time when you showed incredible resilience. What kept you going?",dare:"Do 10 jumping jacks RIGHT NOW while saying 'I am resilient!' after each one!"},usage:"High-frequency word in psychology, business, HR, and education. Very common in job interviews: 'Tell me about your resilience'. Also used in climate/environmental contexts.",song:"♫ What doesn't kill you makes you stronger, stand a little taller — that's resilience in every corner! ♫",movie:`"It's not about how hard you hit. It's about how hard you can get hit and keep moving forward." — Rocky Balboa`,joke:"I told my gym trainer I have resilience. He said 'Great, now do 50 more push-ups.' 😅",challenge:"PHYSICAL DARE: Stand up! Show the class what resilience LOOKS like — mime being knocked down 3 times and bouncing back each time, getting stronger!",register:{slang:"thick-skinned / bounce back",casual:"tough as nails",informal:"keeps going no matter what",neutral:"ability to recover",formal:"psychological resilience / adaptive capacity"},registerSlider:2,collocations:["build resilience","show resilience","emotional resilience","resilience in the face of adversity"],nativeEquivalents:{Spanish:"resiliencia",French:"résilience",German:"Resilienz",Japanese:"回復力"},tags:["psychology","business","positive"],videoQuery:"resilience motivation speech",image:"https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=800&q=80"},{id:"3",front:"Ephemeral",back:"Lasting for a very short time; transitory",pronunciation:"e·FEM·er·al",phoneticIPA:"/ɪˈfem.ər.əl/",partOfSpeech:"adjective",difficulty:"C1",emoji:"🌸",example:"The ephemeral beauty of cherry blossoms makes them all the more precious.",ccq:"Is a rainbow ephemeral? (Yes!) Is a mountain ephemeral? (No, it lasts millions of years)",definition:"Lasting for a very short time. From Greek 'ephemeros' — epi (on) + hemera (day) — literally 'lasting only a day'.",synonyms:["fleeting","transient","momentary","short-lived","transitory","evanescent"],antonyms:["permanent","eternal","everlasting","enduring"],culturalFact:"Japanese concept of 'mono no aware' (物の哀れ) captures this perfectly — the bittersweet beauty of impermanence. Cherry blossoms (sakura) are the ultimate symbol.",commonErrors:["❌ 'ephemerous' → ✅ 'ephemeral'","❌ 'The ephemerality of it' is rare; use 'its fleeting nature' in speech"],wouldYou:"Would you rather experience something extraordinarily beautiful but ephemeral (lasts 1 second), or something ordinary that lasts forever?",truthOrDare:{truth:"What's the most ephemeral beautiful thing you've ever witnessed? Describe it.",dare:"Draw a picture of something ephemeral in 30 seconds and show everyone!"},usage:"Literary, poetic, and academic usage. Common in philosophy, art criticism, social media (Snapchat/Instagram Stories are literally ephemeral!). Great for essays.",song:"♫ Like a flower in the rain, you were ephemeral — beautiful and fleeting, never meant to stay... ♫",movie:'"Everything is temporary. Emotions, thoughts, people and scenery." — Inception vibes. "We accept the love we think we deserve... but every moment is ephemeral."',joke:"My attention span is so ephemeral that I forgot the punchline of this joke. 🤷",challenge:"ARTISTIC DARE: You have 45 seconds! Draw something that represents 'ephemeral' — a sunset? a bubble? Show everyone before time runs out!",register:{slang:"here today gone tomorrow",casual:"doesn't last long",informal:"short-lived / fades fast",neutral:"temporary / brief",formal:"ephemeral / transient / evanescent"},registerSlider:4,collocations:["ephemeral beauty","ephemeral pleasure","ephemeral content","ephemeral nature of"],nativeEquivalents:{Spanish:"efímero/a",French:"éphémère",German:"flüchtig / ephemer",Japanese:"はかない (hakanai)"},tags:["literary","adjective","philosophy"],videoQuery:"cherry blossom ephemeral beauty timelapse",image:"https://images.unsplash.com/photo-1522383225653-ed111181a951?w=800&q=80"},{id:"4",front:"Ubiquitous",back:"Present, appearing, or found everywhere",pronunciation:"yoo·BIK·wi·tus",phoneticIPA:"/juːˈbɪk.wɪ.təs/",partOfSpeech:"adjective",difficulty:"B2",emoji:"🌍",example:"Smartphones have become ubiquitous in modern society.",ccq:"If something is only in one place, is it ubiquitous? (No) If it's everywhere you look? (Yes!)",definition:"Present, appearing, or found everywhere. From Latin 'ubique' meaning 'everywhere'.",synonyms:["omnipresent","pervasive","everywhere","universal","widespread"],antonyms:["rare","scarce","uncommon","limited"],culturalFact:"The word gained popularity in tech contexts — 'ubiquitous computing' was coined by Mark Weiser at Xerox PARC in 1988 to describe technology that becomes invisible through integration.",commonErrors:["❌ 'ubiquitious' → ✅ 'ubiquitous'","❌ Using it for things that are just 'common' — ubiquitous means EVERYWHERE"],wouldYou:"Would you rather be ubiquitous (everywhere at once) but invisible, or visible but stuck in one place forever?",truthOrDare:{truth:"What's something ubiquitous in your life that you couldn't live without?",dare:"Name 10 ubiquitous things in this room in 30 seconds!"},usage:"Common in academic, technical, and journalistic writing. Often used to describe technology, trends, or phenomena that have become inescapable.",song:"♫ You're ubiquitous, everywhere I go — in my dreams, my thoughts, my soul... ♫",movie:`"Coffee shops are ubiquitous in this city. You can't walk two blocks without finding one."`,joke:"Wi-Fi is supposed to be ubiquitous, but it always disappears when I need it most! 📶❌",challenge:"SPEED ROUND: Point to 5 ubiquitous things around you in 10 seconds!",register:{slang:"it's everywhere man",casual:"you see it everywhere",informal:"all over the place",neutral:"commonly found",formal:"ubiquitous / omnipresent"},registerSlider:3,c
