r:"formal",mood:"supportive",isLearner:!1,verified:!0},{id:"u_mrs_pemberton",username:"mrs_pemberton",displayName:"Mrs Pemberton",avatar:"👩‍🏫",job:"Retired English Teacher, Cambridge",level:"native",register:"formal",mood:"supportive",isLearner:!1,verified:!0},{id:"u_jake_nyc",username:"jake_nyc",displayName:"Jake from NYC",avatar:"🗽",job:"Barista & aspiring comedian",level:"native",register:"informal",mood:"excited",isLearner:!1},{id:"u_yuki_osaka",username:"yuki_osaka",displayName:"Yuki 🌸",avatar:"🌸",job:"Software engineer, learning English",level:"B1",register:"neutral",mood:"curious",isLearner:!0,native:"Japanese"},{id:"u_carlos_bogota",username:"carlos_bogota",displayName:"Carlos 🇨🇴",avatar:"🇨🇴",job:"Medical student",level:"B2",register:"neutral",mood:"skeptical",isLearner:!0,native:"Spanish"},{id:"u_fatima_cairo",username:"fatima_cairo",displayName:"Fatima ✨",avatar:"✨",job:"Journalist & travel blogger",level:"A2",register:"informal",mood:"dramatic",isLearner:!0,native:"Arabic"},{id:"u_drama_queen",username:"theaterkid_london",displayName:"Oliver 🎭",avatar:"🎭",job:"Drama student, UCL",level:"native",register:"informal",mood:"dramatic",isLearner:!1},{id:"u_prof_linguist",username:"dr_langley",displayName:"Dr. Langley",avatar:"🔬",job:"Sociolinguist & podcast host",level:"native",register:"formal",mood:"curious",isLearner:!1,verified:!0}],posts:[{id:"post_001",author:{id:"u_mrs_pemberton",username:"mrs_pemberton",displayName:"Mrs Pemberton",avatar:"👩‍🏫",job:"Retired English Teacher, Cambridge",level:"native",register:"formal",mood:"supportive",isLearner:!1,verified:!0},image:"https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?w=900&q=80",imageAlt:"London Tower Bridge at sunset with warm golden light",location:"London, United Kingdom 🇬🇧",time:"3 hours ago",likes:4821,tags:["BritishEnglish","SmallTalk","Politeness"],level:"B1",caption:"A **quintessential** English afternoon — grey skies, a warm **cuppa**, and the unspoken rule that you must comment on the weather at least three times before any real conversation begins. 🌧️☕ The British art of **understatement** is truly one of the most **nuanced** aspects of the language. When a Brit says 'not bad at all', they almost certainly mean 'absolutely brilliant'! Understanding this **subtext** is the key to unlocking authentic communication.",captionVocab:[{word:"quintessential",definition:"representing the most perfect example of a quality",partOfSpeech:"adj",translation:"la quinta esencia / 典型的な",example:"This is quintessential British culture."},{word:"cuppa",definition:"informal British word for a cup of tea",partOfSpeech:"noun (informal)",translation:"una taza de té / お茶一杯",example:"Fancy a cuppa?"},{word:"understatement",definition:"saying less than the truth about something to create irony or politeness",partOfSpeech:"noun",translation:"eufemismo / 控えめな表現",example:"'It's a bit chilly' = it's freezing cold"},{word:"nuanced",definition:"having very small but important differences in meaning",partOfSpeech:"adj",translation:"matizado / 微妙な",example:"Her nuanced understanding impressed everyone."},{word:"subtext",definition:"the hidden or unstated meaning beneath spoken or written communication",partOfSpeech:"noun",translation:"subtexto / 行間の意味",example:"The subtext was clear — she wasn't happy."}],fact:"Studies show that 82% of British conversations involve the weather as an opener. It's not really about the weather — it's a social lubricant that signals 'I'm friendly and open to talking.'",culturalNotes:"In British culture, directness can be seen as rude. Saying 'That's quite interesting' might actually mean the speaker finds it boring — context and tone are everything. This is called 'face-saving' politeness.",translation:"'Not bad at all' = Absolutely brilliant! 🌟",pronunciation:"/ˌʌn.də.ˈsteɪt.mənt/",challenge:"🎯 Try this: Next time you speak English, instead of saying 'I really like this', try 'I must say, I'm rather fond of this.' Notice how it changes the feel of the sentence entirely!",stories:[{id:"s1_1",template:"grammar",title:"The Grammar of Politeness",subtitle:"Modals for Soft Requests",icon:"🎩",body:"In British English, **modal verbs** make requests sound polite and indirect. This is the secret weapon of English politeness!",bodyHtml:`<div class='space-y-4'>
            <div class='text-2xl font-black mb-2'>Modal Verbs = Polite Power 🎩</div>
            <div class='grid grid-cols-2 gap-3'>
              <div class='bg-white/20 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>❌ DIRECT (rude)</div><div class='font-bold'>Give me the menu.</div></div>
              <div class='bg-white/30 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>✅ POLITE</div><div class='font-bold'>Could I possibly have the menu?</div></div>
              <div class='bg-white/20 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>❌ DIRECT</div><div class='font-bold'>Open the window.</div></div>
              <div class='bg-white/30 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>✅ POLITE</div><div class='font-bold'>Would you mind terribly opening the window?</div></div>
            </div>
            <div class='bg-white/15 rounded-xl p-3 border border-white/30'><div class='font-bold text-sm'>🔑 Formula: <span class="opacity-70">Could/Would/Might + subject + verb + please?</span></div></div>
          </div>`,vocab:[{word:"modal verb",definition:"auxiliary verb expressing possibility, permission, obligation",example:"could, would, might, shall"},{word:"indirect request",definition:"asking for something in a non-confrontational way",example:"Could you possibly...?"}],tip:"The more words you add, the MORE polite it sounds in English — opposite to many languages!",audioText:"Modal verbs make requests sound polite and indirect. Instead of saying give me the menu, say Could I possibly have the menu?",duration:8,quiz:{id:"q_s1_1",type:"mc",question:"Which sentence is the MOST polite?",points:50,explanation:"In English, longer, more indirect requests using modals are MORE polite, not less!",options:[{text:"Give me water.",correct:!1,feedback:"Too direct! This sounds demanding in English.",userComment:{userId:"u_mrs_pemberton",text:"Oh dear, this would raise quite a few eyebrows in a restaurant! 😅"}},{text:"I want water.",correct:!1,feedback:"Still too direct. 'I want' is fine casually but not very polite.",userComment:{userId:"u_jake_nyc",text:"Haha yeah even in New York this sounds kinda rude lol"}},{text:"Could I possibly have some water, please?",correct:!0,feedback:"Perfect! Modal + adverb 'possibly' + 'please' = very polite! 🎉",userComment:{userId:"u_mrs_pemberton",text:"Absolutely splendid! That's exactly the kind of phrasing that would impress any British host. Well done, indeed! 🌟"}},{text:"Water, please.",correct:!1,feedback:"This is acceptable but quite minimal. Adding a modal makes it much warmer.",userComment:{userId:"u_jake_nyc",text:"Ngl this works in a busy London pub but fancy places want more polish 😂"}}]}},{id:"s1_2",template:"phrase",title:"Small Talk Survival Kit",subtitle:"5 openers that work ANYWHERE",icon:"💬",body:"These phrases are your **social passport** to British conversation. Memorise them!",bodyHtml:`<div class='space-y-3'>
            <div class='text-xl font-black mb-3'>Your Small Talk Toolkit 💬</div>
            ${["Lovely weather we're having, isn't it? ☀️","I couldn't help but notice... 👀","Have you been waiting long? ⏰","What brings you here today? 🤔","It's a bit manic in here, isn't it? 😅"].map((v,d)=>`<div class='flex items-start gap-3 bg-white/20 rounded-xl p-3'><div class='w-7 h-7 rounded-full bg-white/30 flex items-center justify-center font-black text-sm shrink-0'>${d+1}</div><div class='font-semibold text-sm leading-snug'>${v}</div></div>`).join("")}
            <div class='bg-white/15 rounded-xl p-3 text-xs font-bold border border-white/30'>💡 Tag questions like "isn't it?" invite the other person to agree and continue chatting!</div>
          </div>`,vocab:[{word:"manic",definition:"British informal: extremely busy or chaotic",example:"It's manic in here today!"},{word:"tag question",definition:"a question added to the end of a statement to invite agreement",example:"Nice day, isn't it?"}],tip:"Tag questions ('isn't it?', 'don't you think?') are the secret ingredient that turns a statement into an INVITATION to chat.",audioText:"Here are five small talk phrases: Lovely weather we're having, isn't it? I couldn't help but notice. Have you been waiting long? What brings you here today? It's a bit manic in here, isn't it?",duration:7}],albumSlides:[{id:"a1",skill:"reading",theme:"cyan",icon:"📖",title:"Reading: Small Talk in the Wild",subtitle:"Read a realistic mini-scene and notice polite indirect language",audioText:"Reading passage: Two strangers use small talk about the weather, then make a polite request. Notice indirect phrasing and softeners.",bodyHtml:`
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="font-size:20px;font-weight:900">Scene: Bus Stop Conversation (B1–B2)</div>
              <div style="padding:16px;border-radius:18px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22)">
                <div style="font-weight:900;margin-bottom:10px">Text</div>
                <div style="opacity:0.95"><b>A:</b> “Bit of a surprise, isn’t it? It looked sunny five minutes ago.”</div>
                <div style="opacity:0.95;margin-top:8px"><b>B:</b> “Oh, honestly… classic. I should’ve brought an umbrella.”</div>
                <div style="opacity:0.95;margin-top:8px"><b>A:</b> “I don’t suppose you’d mind if I stood a little closer? I’m getting absolutely soaked.”</div>
                <div style="opacity:0.95;margin-top:8px"><b>B:</b> “Not at all! Go ahead. It’s miserable, isn’t it?”</div>
              </div>
              <div style="padding:16px;border-radius:18px;background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.18)">
                <div style="font-weight:900;margin-bottom:10px">Tasks</div>
                <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px">
                  <li><b>Underline</b> the polite request.</li>
                  <li>Circle softeners (e.g., <b>I don’t suppose…</b>, <b>would you mind…</b>).</li>
                  <li>Rewrite the request in a direct style. Then rewrite it again politely.</li>
                </ol>
              </div>
            </div>
          `,checklist:["softener phrase","polite request","tag question"],prompt:"Rewrite: ‘Move. I’m wet.’ → make it politely indirect like the scene."},{id:"a2",skill:"listening",theme:"purple",icon:"🎧",title:"Listening: Tone + Intention",subtitle:"Listen (or use Read) and decide what they REALLY mean",audioText:"Listening transcript: A colleague uses a phrase that sounds positive but is actually hesitant. Decide the intention.",bodyHtml:`
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="font-size:20px;font-weight:900">Transcript</div>
              <div style="padding:16px;border-radius:18px;background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.22)">
                <div style="font-weight:900">Dialogue</div>
                <div style="opacity:0.95;margin-top:8px"><b>1:</b> “So… your presentation is tomorrow?”</div>
                <div style="opacity:0.95;margin-top:8px"><b>2:</b> “Yep. I’m a bit nervous.”</div>
                <div style="opacity:0.95;margin-top:8px"><b>1:</b> “Well, I’m sure it’ll be <b>quite</b> interesting.”</div>
              </div>
              <div style="padding:16px;border-radius:18px;background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.18)">
                <div style="font-weight:900;margin-bottom:10px">Comprehension</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                  <div>1) Is “quite interesting” enthusiastic praise, polite uncertainty, or criticism?</div>
                  <div>2) What intonation would make it supportive vs doubtful?</div>
                  <div>3) Rewrite it as a clearer supportive sentence (still polite).</div>
                </div>
              </div>
            </div>
          `,checklist:["intonation","context","supportive alternative"],prompt:"Say 2 versions: ‘That’s quite interesting.’ (genuine vs doubtful)."},{id:"a3",skill:"grammar",theme:"emerald",icon:"🧩",title:"Grammar: Indirect Requests Toolkit",subtitle:"Build polite requests with modals + distancing language",bodyHtml:`
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="font-size:20px;font-weight:900">Politeness Builder</div>
              <div style="padding:16px;border-radius:18px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22)">
                <div style="font-weight:900;margin-bottom:10px">Formula</div>
                <div style="display:flex;flex-direction:column;gap:10px">
                  <div><b>Could</b> you <b>possibly</b> + verb…?</div>
                  <div><b>Would</b> you <b>mind</b> + verb-ing…?</div>
                  <div>I was <b>wondering</b> if you <b>could</b>…</div>
                </div>
              </div>
              <div style="padding:16px;border-radius:18px;background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.18)">
                <div style="font-weight:900;margin-bottom:10px">Mini-drill (rewrite)</div>
                <div>1) “Send me the link.” → polite</div>
                <div>2) “Move your bag.” → polite</div>
                <div>3) “Tell me your last name.” → polite</div>
              </div>
            </div>
          `,checklist:["modal","softener","please"],prompt:"Create one very polite request to borrow a charger for 10 minutes."}],comments:[{id:"c1",userId:"u_fatima_cairo",text:"Oh my god I am SO confusing by this!! 😭 In Arabic we say exactly what we think, but my British teacher always say 'that's quite interesting' and I think she is agree with me but she is NOT!! Why the English people not just say what they mean?? I am study English for 2 year and I still don't understand this thing!",timestamp:"2h ago",likes:89,hasError:!0,errorNote:"Several errors: 'SO confusing' → 'SO confused'; 'she is agree' → 'she agrees'; 'the English people' → 'English people' (no article); 'I am study' → 'I've been studying'; '2 year' → '2 years'",correction:"Oh my god, I am SO confused by this!! 😭 In Arabic, we say exactly what we think, but my British teacher always says 'that's quite interesting' and I think she agrees with me, but she does NOT!! Why don't English people just say what they mean?? I've been studying English for 2 years and I still don't understand this!"}],dmFollowUp:[{id:"dm1",sender:"tutorly",text:"Great work! Ready for follow-up questions?",isQuestion:!1},{id:"dm2",sender:"tutorly",text:"Rewrite politely: 'Tell me your email address.'",isQuestion:!0,checklist:["Could/Would","possibly","please"]}],liveDialogue:{id:"live_001",character1:{id:"u_jake_nyc",username:"jake_nyc",displayName:"Jake (American)",avatar:"🧑‍🦱",job:"Barista & aspiring comedian",level:"native",register:"informal",mood:"excited",isLearner:!1},character2:{id:"u_mrs_pemberton",username:"mrs_pemberton",displayName:"Mrs Pemberton (British)",avatar:"👩‍🦳",job:"Retired English Teacher, Cambridge",level:"native",register:"formal",mood:"supportive",isLearner:!1},voiceChar1:"Google US English",voiceChar2:"Google UK English Female",audienceTask:"Type 🚨 when you hear direct language. Type 💡 when you hear understatement.",lines:[{speaker:"character1",text:"Hey! Can I get your WiFi password? I need it right now."},{speaker:"character2",text:"Oh, I'm afraid I don't have it to hand at the moment. I'll see what I can do!"},{speaker:"character1",text:"Wait, are you saying you don't know it? That's kinda annoying."},{speaker:"character2",text:"Ha, well, it is perhaps a slight inconvenience, yes..."},{speaker:"character1",text:"I just really need the internet. My work depends on it."},{speaker:"character2",text:"Of course. I wonder if you might try the café next door? They're rather good, actually."},{speaker:"character1",text:"Oh! Good idea. Sorry, I didn't mean to be rude earlier."},{speaker:"character2",text:"Not at all. Can I offer you a cup of tea while you wait?"}]},poll:{question:"How do you feel about British understatement?",options:[{text:"😍 Love it — it's charming!",votes:234},{text:"😕 Confusing — just say what you mean!",votes:456},{text:"🤔 Interesting — still figuring it out",votes:312},{text:"😂 Hilarious — I've made mistakes",votes:567}]}},{id:"post_002",author:{id:"u_prof_linguist",username:"dr_langley",displayName:"Dr. Langley",avatar:"🔬",job:"Sociolinguist & Podcast Host",level:"native",register:"formal",mood:"curious",isLearner:!1,verified:!0},image:"https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=900&q=80",imageAlt:"Person writing in notebook with coffee and laptop",location:"Oxford, United Kingdom 🎓",time:"5 hours ago",likes:2847,tags:["EmailEtiquette","FormalEnglish","BusinessWriting"],level:"B2",caption:"The **minefield** of English email etiquette! 📧 Did you know that starting an email with 'Dear Sir/Madam' is now considered **archaic** in most contexts? And 'Kind regards' vs 'Best regards' vs 'Warm regards' — they all carry **subtle** implications about your relationship with the recipient. Today we're diving into the **nuances** of professional correspondence.",captionVocab:[{word:"minefield",definition:"a situation full of hidden dangers or difficulties",partOfSpeech:"noun",translation:"campo minado / 地雷原",example:"Office politics can be a minefield."},{word:"archaic",definition:"very old-fashioned, no longer in common use",partOfSpeech:"adj",translation:"arcaico / 古風な",example:"'Thee' and 'thou' are archaic forms."},{word:"subtle",definition:"not immediately obvious; delicate",partOfSpeech:"adj",translation:"sutil / 微妙な",example:"A subtle change in tone can alter meaning."},{word:"nuances",definition:"small but important differences in meaning or expression",partOfSpeech:"noun",translation:"matices / ニュアンス",example:"Professional language has many nuances."}],fact:"Email tone is a top source of misunderstanding for advanced learners. Directness can be read as rudeness, especially in UK professional contexts.",culturalNotes:"British email politeness relies heavily on softeners and modal verbs. 'Send me the report' can sound demanding; 'Could you possibly…' is safer.",challenge:"Rewrite politely: 'Send me the Q3 sales data by Friday.' Use a modal + a softener.",stories:[{id:"s2_1",template:"writing",title:"Email Openings",subtitle:"From formal to friendly",icon:"📧",body:"The way you open an email sets the **tone** for everything that follows.",bodyHtml:`<div class='space-y-3'>
            <div class='text-xl font-black mb-3'>📧 Email Opening Formulas</div>
            <div class='space-y-2'>
              <div class='bg-white/15 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>🔴 TOO FORMAL</div><div class='font-bold'>"Dear Sir/Madam"</div></div>
              <div class='bg-white/20 rounded-xl p-3'><div class='text-xs font-bold opacity-60 mb-1'>🟢 MOST COMMON</div><div class='font-bold'>"Hi [Name],"</div></div>
            </div>
          </div>`,tip:"Mirror the other person's style.",duration:8}],albumSlides:[{id:"b1",skill:"reading",theme:"amber",icon:"📨",title:"Reading: A Professional Email (Tone Diagnosis)",subtitle:"Read and identify tone problems + upgrades",bodyHtml:`
            <div style="display:flex;flex-direction:column;gap:14px">
              <div style="font-size:20px;font-weight:900">Email Draft (needs improvement)</div>
              <div style="padding:16px;border-radius:18px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.22)">
                <div style="font-weight:900">Subject:</div>
                <div style="opacity:0.95">Budget approval</div>
                <div style="height:10px"></div>
                <div style="opacity:0.95">Hi Anna,</div>
                <div style="height:8px"></div>
                <div style="opacity:0.95">I need you to approve the budget today. Send me the final numbers ASAP. If you can’t, tell me when you will do it.</div>
                <div style="height:8px"></div>
                <div style="opacity:0.95">Regards,</div>
                <div style="opacity:0.95;font-weight:800">Carlos</div>
              </div>
              <div style="padding:16px;border-radius:18px;background:rgba(0,0,0,0.18);border:1px solid rgba(255,255,255,0.18)">
                <div style="font-weight:900;margin-bottom:10px">Tasks</div>
                <ol style="margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px">
                  <li>Underline phrases that sound <b>demanding</b>.</li>
                  <li>Rewrite using <b>one modal</b> + <b>one softener</b>.</li>
                  <li>Choose a better sign-off and explain why.</li>
                </ol>

{ "id","author" (full user object),"image" (real Unsplash URL ending ?w=900&q=80),

═══ Comment rules (CRITICAL for pedagogy) ═══
{ "id","userId","text" (150–300 words),"timestamp","likes",
