<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexCards — multi-sided cards for text, audio and video</title>
    <meta name="description" content="A twelve-section language lesson built around one word, with spaced repetition and live word lookups." />
    <!--
      Matches the light stage so mobile browsers tint their chrome to the page rather than
      drawing a dark bar above a light app.
    -->
    <meta name="theme-color" content="#f5f8fd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a14" media="(prefers-color-scheme: dark)" />
    <script>
      /*
       * Set the theme before the first paint.
       *
       * This runs synchronously in `<head>`, ahead of the stylesheet being applied to the
       * document, so a learner who chose dark never sees a frame of the light stage. It is
       * four lines rather than imported from `lib/theme.ts` because a module import is
       * asynchronous and would be exactly the flash this exists to prevent.
       */
      (function () {
        try {
          var stored = localStorage.getItem("flexcards_theme");
          if (stored === "dark" || stored === "light") {
            document.documentElement.dataset.theme = stored;
          }
        } catch (error) {
          /* Storage blocked: the light default in the html tag stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
