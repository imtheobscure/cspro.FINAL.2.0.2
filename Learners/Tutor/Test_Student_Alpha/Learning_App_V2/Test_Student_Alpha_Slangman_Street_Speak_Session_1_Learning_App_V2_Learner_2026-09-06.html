.html5-zone button{font-family:inherit;cursor:pointer}
.html5-zone img{max-width:100%;border-radius:12px}
.html5-zone table{width:100%;border-collapse:collapse}
.html5-zone td,.html5-zone th{border:1px solid #e5e7eb;padding:8px;text-align:left}
/* pronunciation */
.pro-box{background:#faf5ff;border:2px solid #e9d5ff;border-radius:16px;padding:16px;text-align:center}
.pro-sent{font-size:17px;font-weight:900;line-height:1.5;margin-bottom:8px}
.pro-sent{font-size:17px}
.pro-phon{color:#9333ea;font-family:monospace;font-size:13px;font-weight:700}
.pro-phon{color:#9333ea;font-family:monospace;font-size:13px;font-weight:700}
.pro-tip{margin-top:8px;font-size:12px;color:#6b7280}
.pro-tip{margin-top:8px;font-size:12px;color:#6b7280}
.pro-rec{background:#ef4444;color:#fff;font-weight:900;padding:14px;border-radius:14px;text-align:center;font-size:15px;animation:pulse 1s infinite}
.pro-rec{background:#ef4444;color:#fff;font-weight:900;padding:14px;border-radius:14px;text-align:center;font-size:15px;animation:pulse 1s infinite}
.pro-rec{background:#ef4444;color:#fff;font-weight:900;padding:14px;border-radius:14px;text-align:center;font-size:15px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
.self-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* xp float + modals */
.xp-float{position:fixed;top:90px;left:50%;transform:translateX(-50%);background:#58CC02;color:#fff;font-weight:900;font-size:18px;padding:10px 18px;border-radius:99px;box-shadow:0 8px 24px rgba(88,204,2,.4);z-index:60;pointer-events:none;animation:floatUp 1.3s ease-out forwards}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,0) scale(.8)}15%{opacity:1;transform:translate(-50%,-12px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-70px) scale(1)}}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:24px;padding:24px 20px;max-width:400px;width:100%;max-height:88vh;overflow-y:auto;text-align:center;animation:modalIn .25s cubic-bezier(.2,1.4,.4,1)}
@keyframes modalIn{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.modal h3{font-size:22px;font-weight:900;margin-bottom:6px}
.modal p{color:#6b7280;font-size:13px;font-weight:600}
.big-emoji{font-size:64px;margin:8px 0}
.big-emoji.bounce{animation:catBounce .5s ease infinite alternate}
@keyframes catBounce{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.reward-box{background:#fefce8;border:2px solid #fde68a;border-radius:14px;padding:12px;margin:14px 0}
.reward-box b{font-size:20px;color:#a16207}
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stat{padding:10px;background:#f0fdf4;border:2px solid #bbf7d0;border-radius:14px}
.stat.red{background:#fef2f2;border-color:#fecaca}
.stat.blue{background:#eff6ff;border-color:#dbeafe}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:#6b7280}
/* panels */
.panel-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge-cell{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:10px 6px;text-align:center}
.badge-cell.got{border-color:#fde047;background:#fffbeb}
.badge-cell .bc-ico{font-size:24px;filter:grayscale(1);opacity:.4}
.badge-cell.got .bc-ico{filter:none;opacity:1}
.badge-cell .bc-lbl{font-size:9px;font-weight:800;margin-top:4px;color:#6b7280;line-height:1.2}
.panel-title{font-size:15px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px;color:#1f2937}
.lb-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;margin-bottom:6px;background:#f9fafb;font-size:13px;border:2px solid transparent}
.lb-row.me{background:#f0fdf4;border-color:#bbf7d0}
.lb-row .lb-xp{margin-left:auto;font-weight:900;color:#58CC02}
.access-row{display:flex;align-items:center;gap:10px;padding:8px;border:2px solid #e5e7eb;border-radius:12px;margin-bottom:8px}
.access-row button{padding:6px 12px;border-radius:99px;font-weight:900;font-size:12px;background:#1CB0F6;color:#fff;margin-left:auto}
.access-row .eq{font-size:22px}
.season-track{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:10px 0}
.season-fill{height:100%;background:linear-gradient(90deg,#FFC800,#FF9600);border-radius:99px}
/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #f3f4f6;text-align:left}
.set-row .st{font-size:14px;font-weight:800}
.set-row .sd{font-size:11px;color:#9ca3af}
.switch{width:48px;height:26px;border-radius:99px;background:#d1d5db;position:relative;transition:background .2s;flex-shrink:0}
.switch.on{background:#58CC02}
.switch:before{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on:before{left:25px}
.settings label{font-size:12px;font-weight:800;color:#6b7280;display:block;margin:8px 0 4px}
.settings select,.settings input[type=range]{width:100%}
.settings select{padding:10px;border:2px solid #e5e7eb;border-radius:12px;font-size:13px;background:#fff}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
/* settings btn */
.set-btn{display:flex;align-items:center;gap:10px;width:100%;padding:12px;border-radius:14px;background:#e6f6ff;border:2px solid #bae6fd;color:#0284c7;font-weight:800;font-size:13px;justify-content:center;margin-top:14px}

}

  .chips{padding:8px 10px}

  .modal{padding:18px 14px;border-radius:18px}
  .panel-grid{grid-template-columns:repeat(3,1fr);gap:6px}
  .stat-grid{gap:6px}
  .stat b{font-size:17px}
  .slide-nav{padding:12px 14px;padding-bottom:72px}

.fb{font-size:15.5px}
.fb-box{font-size:15.5px;padding:14px 18px}

body{background:
  radial-gradient(1100px 520px at 85% -8%,rgba(178,238,190,.85) 0%,transparent 60%),
  radial-gradient(900px 640px at -12% 108%,rgba(190,224,255,.9) 0%,transparent 55%),
  radial-gradient(700px 500px at 105% 55%,rgba(231,210,255,.55) 0%,transparent 60%),
  linear-gradient(160deg,#f4fcf1 0%,#eef8ff 46%,#f8f1ff 100%);background-attachment:fixed}
#lav2-root{max-width:none;margin:0;background:transparent;min-height:100vh}
.main-content{scrollbar-width:none}
/* larger, more readable text */
.act-title{font-size:clamp(20px,4.5vw,24px);line-height:1.3;letter-spacing:-.01em}

.btn:active{transform:scale(.97)}
.card{border-radius:28px;box-shadow:0 8px 30px rgba(35,60,25,.07)}
.fb{font-size:14px;padding:14px 16px;border-radius:16px;line-height:1.65}
.ctx{font-size:14px;line-height:1.7}
.cloze-box{font-size:16px;line-height:2.4}
.gap-input{font-size:16px;width:130px}
.chunk-block,.chunk-avail{font-size:14px;padding:12px 16px;border-radius:14px}
.dict-ta{font-size:15px;min-height:90px}
.mitem{font-size:14px;padding:13px;border-radius:15px;min-height:56px}
.slides-body{font-size:15.5px}
.slide-body{font-size:16px;line-height:1.75}
.hud{box-shadow:0 3px 18px rgba(0,0,0,.07)}
/* ✦ Duolingo-home map pieces */
.unit-header{position:sticky;top:0;z-index:20;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 12px rgba(0,0,0,.12)}
.unit-header .uh-title{font-weight:900;font-size:21px}
.unit-header .uh-sub{font-size:13.5px;font-weight:700;opacity:.92}
.unit-header .uh-guide{margin-left:auto;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);border-radius:14px;font-size:21px;padding:8px 12px;color:#fff}
.path-ring.coin{background:radial-gradient(circle at 32% 30%,#ffe87a,#f7c400 62%,#d99e00);border:none;box-shadow:inset 0 -4px 8px rgba(0,0,0,.18),0 8px 18px rgba(247,196,0,.4)}
.path-ring.coin:before{content:'';position:absolute;inset:12px;border-radius:50%;border:3px solid rgba(255,255,255,.5)}
.path-ring.star{background:radial-gradient(circle at 32% 30%,#7ede3a,#58CC02 60%,#3d9a00);border:none;color:#fff;font-size:44px;font-weight:900;box-shadow:inset 0 -5px 10px rgba(0,0,0,.2),0 10px 22px rgba(88,204,2,.45)}
.path-ring.star:before{content:'';position:absolute;inset:11px;border-radius:50%;border:3px solid rgba(255,255,255,.4)}
.path-ring.lock{background:radial-gradient(circle at 32% 30%,#e7ebf0,#c9d1d9 62%,#aeb7c2);border:none;box-shadow:inset 0 -4px 8px rgba(0,0,0,.14)}
.path-ring{position:relative}
.start-bubble{position:absolute;top:-16px;left:50%;transform:translate(-50%,-100%);background:#fff;color:#58CC02;font-weight:900;font-size:13.5px;letter-spacing:.05em;border:2px solid #e8ecf1;border-radius:14px;padding:6px 14px;box-shadow:0 4px 12px rgba(0,0,0,.1);animation:ringPulse 1.6s ease-in-out infinite;white-space:nowrap}
.start-bubble:after{content:'';position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:none}
.path-mascot{position:absolute;top:44%;right:9%;z-index:2;animation:catBounce 1.1s ease infinite alternate;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}
/* ✦ in-lesson slim bar (Duolingo style) */
.ilbar{display:flex;align-items:center;gap:12px;background:#fff;border-bottom:2px solid #eef1f4;padding:10px 14px;position:sticky;top:0;z-index:30}
.il-x{width:42px;height:42px;border-radius:99px;background:#f3f5f7;color:#8a919c;font-size:18px;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.il-x:hover{background:#e8ebef;color:#3c3c3c}
.il-prog{flex:1;height:12px;background:#eef1f4;border-radius:99px;overflow:hidden}
.il-prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#58CC02,#7ee03a);transition:width .4s}
.il-hearts{font-size:17px;white-space:nowrap;font-weight:800}
/* ✦ winding path map */
.path-wrap{position:relative;max-width:560px;margin:0 auto;padding:26px 14px 40px;min-height:70vh}
.path-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.path-node{position:absolute;transform:translate(-50%,-50%);width:118px;text-align:center;z-index:2;cursor:pointer}
.path-ring{width:88px;height:88px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:38px;background:#fff;border:5px solid #e3e8ee;box-shadow:0 6px 16px rgba(0,0,0,.08);transition:transform .18s,box-shadow .18s}
.path-node:hover .path-ring{transform:scale(1.07);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.path-node.done .path-ring{background:#eaffdd;border-color:#58CC02}
.path-node.cur .path-ring{background:#58CC02;border-color:#3d9a00;box-shadow:0 10px 26px rgba(88,204,2,.45);animation:ringPulse 2.2s ease-in-out infinite}
.path-node.locked .path-ring{background:#f3f5f7;border-color:#e3e8ee;filter:grayscale(.9);opacity:.75}
@keyframes ringPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.path-label{background:#fff;border:2px solid #eef1f4;border-radius:14px;padding:7px 8px;margin-top:8px;font-weight:900;font-size:12.5px;color:#4a525e;box-shadow:0 3px 10px rgba(0,0,0,.06);line-height:1.25}
.path-node.cur .path-label{border-color:#58CC02;color:#2e7d00}
.path-node.locked .path-label{color:#aab2bd}
.path-xp{font-size:10.5px;font-weight:800;color:#8a919c;margin-top:3px}
.path-sub{position:absolute;top:50%;left:calc(50% + 88px);transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:3;min-width:170px}
.path-sub.on-left{left:auto;right:calc(50% + 88px)}
.path-sub.sub-below{top:calc(100% + 10px);transform:none}
.path-sub.sub-above{top:auto;bottom:calc(100% + 10px);transform:none}
.path-subbtn{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid #eef1f4;border-radius:13px;padding:8px 12px;font-size:12.5px;font-weight:800;color:#4a525e;box-shadow:0 3px 10px rgba(0,0,0,.05);transition:all .15s;text-align:left}
.path-subbtn:hover{border-color:#58CC02;color:#2e7d00;transform:translateX(3px)}
.path-subbtn .ps-ico{font-size:17px}
.path-subbtn .ps-n{color:#9aa3ad;font-size:10px;font-weight:900;margin-left:auto}
.path-subbtn.done{border-color:#d7f5c2;background:#f4ffe9;color:#6b7280}
.path-subbtn.cur{border-color:#58CC02;background:#58CC02;color:#fff}
.path-subbtn.cur .ps-n{color:#d9f7c4}
.path-start{margin-top:10px;font-size:12px;font-weight:900;color:#fff;background:#58CC02;border-radius:11px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 3px 0 #3d9a00}
.path-start:hover{filter:brightness(1.06)}
.path-hint{text-align:center;color:#9aa3ad;font-size:12.5px;font-weight:700;padding:6px 0 2px}
/* ✦ duel bar */
.duel-bar{background:linear-gradient(90deg,#fff7e6,#ffeef0);border:2px solid #ffd9a8;border-radius:18px;padding:10px 14px;margin-bottom:14px;box-shadow:0 4px 14px rgba(255,150,0,.12)}
.duel-title{display:flex;align-items:center;justify-content:space-between;font-weight:900;font-size:13px;color:#b45309;margin-bottom:8px}
.duel-track{position:relative;height:34px;background:#fff;border-radius:99px;border:2px solid #ffe3b8;overflow:hidden}
.duel-racer{position:absolute;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:3px;transition:left .5s cubic-bezier(.2,1.2,.4,1);z-index:2}
.duel-racer .dr-ava{font-size:22px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.duel-racer .dr-name{font-size:10px;font-weight:900;color:#fff;background:#58CC02;border-radius:99px;padding:2px 7px;white-space:nowrap}
.duel-racer.them .dr-name{background:#1CB0F6}
.duel-finish{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:18px}
/* ✦ powerups */
.pw-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pw-chip{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid #e5eaf0;border-radius:99px;padding:7px 12px;font-weight:900;font-size:12.5px;color:#4a525e;transition:all .15s}
.pw-chip:disabled{opacity:.35;cursor:default}
.pw-chip:hover:not(:disabled){border-color:#1CB0F6;color:#0284c7;transform:translateY(-1px)}
.pw-chip .pw-n{color:#1CB0F6}
/* ✦ rich feedback mini-lesson panel */
.fb-panel{animation:popIn .3s;margin-top:12px;border-radius:20px;overflow:hidden;border:2px solid #eef1f4;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.05)}
.fb-panel .fbp-head{display:flex;align-items:center;gap:10px;padding:14px 16px;font-weight:900;font-size:16px}
.fb-panel.ok .fbp-head{background:#f0fdf4;color:#166534;border-bottom:2px solid #bbf7d0}
.fb-panel.bad .fbp-head{background:#fef2f2;color:#b91c1c;border-bottom:2px solid #fecaca}
.fb-box{padding:12px 16px;border-bottom:1px solid #f1f3f5;line-height:1.6;font-size:14px;color:#374151}
.fb-box:last-child{border-bottom:none}
.fb-box .fbt{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.fb-green{background:#f7fdf4}.fb-green .fbt{color:#16a34a}
.fb-red{background:#fdf5f5}.fb-red .fbt{color:#dc2626}
.fb-blue{background:#f2f8ff}.fb-blue .fbt{color:#2563eb}
.fb-purple{background:#faf5ff}.fb-purple .fbt{color:#9333ea}
.fb-orange{background:#fffaf0}.fb-orange .fbt{color:#d97706}
.kw-chip{display:inline-block;background:#eef2ff;border:1.5px solid #c7d2fe;color:#3730a3;border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:800;margin:3px 4px 0 0}
.spk-cta{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #ffd9a8;border-radius:14px;padding:11px 13px;margin-top:8px;font-weight:800;font-size:13.5px;color:#92400e;cursor:pointer;width:100%;text-align:left}
.spk-cta:hover{background:#fff7ed}
/* ✦ radio / duo-radio */
.radio-card{background:linear-gradient(180deg,#fff 0%,#f7fbff 100%);border-radius:22px;overflow:hidden;border:2px solid #e2ecf7;box-shadow:0 8px 26px rgba(28,176,246,.12)}
.radio-head{background:linear-gradient(135deg,#1CB0F6,#0e8fd4);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px}
.radio-head .rwave{display:flex;gap:3px;align-items:flex-end;height:18px}
.radio-head .rwave i{width:4px;background:#fff;border-radius:99px;animation:wave 1s ease-in-out infinite}
.radio-head .rwave i:nth-child(2){animation-delay:.15s}.radio-head .rwave i:nth-child(3){animation-delay:.3s}.radio-head .rwave i:nth-child(4){animation-delay:.45s}.radio-head .rwave i:nth-child(5){animation-delay:.6s}
@keyframes wave{0%,100%{height:6px}50%{height:16px}}
.radio-lines{max-height:280px;overflow-y:auto;padding:12px;scrollbar-width:thin}
.radio-line{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border-radius:15px;cursor:pointer;transition:background .15s}
.radio-line:hover{background:#eef7ff}
.radio-line.on{background:#e3f3ff;box-shadow:inset 0 0 0 2px #7dd3fc}
.r-avatar{font-size:26px;width:40px;height:40px;background:#eef7ff;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.r-name{font-size:11px;font-weight:900;color:#1CB0F6;text-transform:uppercase;letter-spacing:.04em}
.r-text{font-size:14.5px;font-weight:600;color:#374151;line-height:1.5;margin-top:2px}
.radio-cta{width:100%;margin-top:12px}
/* ✦ story */
.story-card{background:#fff;border-radius:22px;overflow:hidden;border:2px solid #f1e7ff;box-shadow:0 8px 26px rgba(147,51,234,.1)}
.story-head{background:linear-gradient(135deg,#9333ea,#6d28d9);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:15px}
.story-book{padding:16px;max-height:300px;overflow-y:auto;background:linear-gradient(180deg,#fdfbff,#faf5ff);scrollbar-width:thin}
.story-para{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:14px;cursor:pointer;font-size:15px;line-height:1.7;color:#3d3550;font-weight:600}
.story-para:hover{background:#f6efff}
.story-para.on{background:#f3e8ff;box-shadow:inset 0 0 0 2px #d8b4fe}
.story-para .sp-emo{font-size:24px}
.story-cta{width:100%;margin-top:12px}
/* ✦ final review slide */
.review{position:fixed;inset:0;background:linear-gradient(165deg,#f4fcf1 0%,#eef8ff 46%,#f8f1ff 100%);z-index:70;overflow-y:auto;padding:0 0 40px}
.review-in{max-width:760px;margin:0 auto;padding:22px 16px}
.review-hero{background:linear-gradient(135deg,#58CC02,#3d9a00);border-radius:28px;color:#fff;padding:26px 20px;text-align:center;box-shadow:0 14px 34px rgba(88,204,2,.35);position:relative;overflow:hidden}
.review-hero:after{content:'';position:absolute;inset:0;background:radial-gradient(400px 160px at 80% -30%,rgba(255,255,255,.35),transparent)}
.review-hero h2{font-size:clamp(22px,6vw,30px);font-weight:900;letter-spacing:-.01em;margin:4px 0 6px}
.review-hero .rh-sub{font-size:14px;font-weight:700;opacity:.92}
.review-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.review-sec{background:#fff;border-radius:22px;border:2px solid #eef1f4;padding:18px;margin-top:14px;box-shadow:0 6px 22px rgba(0,0,0,.05)}
.review-sec h3{font-size:16.5px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.skill-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.skill-row .sk-name{width:104px;font-size:13px;font-weight:800;color:#4a525e;flex-shrink:0}
.skill-track{flex:1;height:14px;background:#eef1f4;border-radius:99px;overflow:hidden}
.skill-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#58CC02,#7ee03a);transition:width .6s}
.skill-row .sk-pct{width:40px;text-align:right;font-size:12.5px;font-weight:900;color:#6b7280}
.rv-word{display:inline-flex;align-items:center;gap:5px;background:#f0fdf4;border:1.5px solid #bbf7d0;color:#166534;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;margin:3px 4px 0 0}
.rv-miss{display:block;background:#fef2f2;border:1.5px solid #fecaca;color:#b91c1c;border-radius:13px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:8px;line-height:1.5}
.rv-miss b{color:#dc2626}
.review-btns{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.review-btns .btn{flex:1;min-width:150px}
/* ✦ cat mascot (SVG, animated) */
.catface{width:100%;height:100%;display:block}
.hud-cat{width:42px;height:42px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.14))}
.cat-eyes .pupil{animation:catBlink 4.6s infinite}
.cat-eyes .lid{animation:catLid 4.6s infinite;transform-origin:center}
@keyframes catBlink{0%,93%,100%{opacity:1;transform:scaleY(1)}95%,97%{opacity:0;transform:scaleY(.1)}}
@keyframes catLid{0%,93%,100%{transform:scaleY(0)}95%,97%{transform:scaleY(1)}}
.cat-sleepy .pupil{animation:none;opacity:.25;transform:scaleY(.4)}
.cat-sleepy .cat-zzz{animation:zzzFloat 1.6s ease-in-out infinite}
@keyframes zzzFloat{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-16px)}}
.cat-excited .catface{animation:catBounce .5s ease infinite alternate}
.cat-excited .pupil{animation:none}
.cat-sad .cat-ears{animation:none}
.cat-ears{animation:earTwitch 5s infinite}
@keyframes earTwitch{0%,88%,100%{transform:rotate(0)}90%,93%{transform:rotate(-5deg)}}
.cat-wink{animation:catWink 3.4s infinite}
@keyframes catWink{0%,90%,100%{transform:scaleY(1)}93%,96%{transform:scaleY(.15)}}
.option.hintglow{border-color:#1CB0F6;background:#e6f6ff;box-shadow:0 0 0 4px rgba(28,176,246,.16);animation:ringPulse 1s ease-in-out infinite}
/* ✦ chest two-step */
.chest-pop{font-size:74px;animation:chestShake .9s ease-in-out infinite}
@keyframes chestShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
.chest-glow{font-size:84px;animation:glowPop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes glowPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
/* ✦ mobile: sub-panel drops below the node instead of beside it */
@media (max-width:640px){
  .path-sub{position:absolute;left:50%;top:calc(100% + 6px);transform:translateX(-50%);right:auto;min-width:0;width:max-content;max-width:calc(100vw - 44px)}
  .path-sub.sub-below,.path-sub.sub-above{transform:translateX(-50%)}
  .path-sub.on-left{right:auto;left:50%}
  .path-subbtn{max-width:calc(100vw - 60px)}
  .path-subbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .path-start{margin-top:6px}
}
/* ✦ 390px mobile refinements */
@media (max-width:390px){
  .hud{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .hud-title{max-width:96px}
  .xp-wrap{min-width:70px;max-width:120px}
  .hud-pill{padding:3px 7px;font-size:11.5px}
  .path-wrap{padding:22px 8px 60px}
  .path-node{width:104px}
  .path-ring{width:78px;height:78px;font-size:32px}
  .path-subbtn{font-size:11.5px;padding:7px 10px}
  .fb-box{padding:11px 13px}
  .review-stats{grid-template-columns:repeat(3,1fr);gap:7px}
  .review-sec{padding:14px}
  .skill-row .sk-name{width:86px;font-size:12px}
  .radio-lines{max-height:230px}
  .story-book{max-height:240px}
  .slide-mode{flex-direction:column}
}
/* ✦ premium lesson/test overview cards (home page — replaces winding path) */
.lhome{padding:6px 0 30px}
.lhome-hero{display:flex;align-items:center;gap:14px;background:linear-gradient(120deg,#1a1446 0%,#3b2f8f 55%,#5b4bc4 100%);border-radius:22px;padding:18px 20px;color:#fff;box-shadow:0 14px 34px rgba(59,47,143,.35);margin:14px 0 18px;position:relative;overflow:hidden}
.lhome-hero:after{content:'';position:absolute;right:-34px;top:-34px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.08)}
.lhome-hero:before{content:'';position:absolute;right:16px;bottom:-46px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.06)}
.lhome-hero .lh-cat{width:76px;height:76px;flex:none;filter:drop-shadow(0 6px 14px rgba(0,0,0,.3));animation:lhBob 3.4s ease-in-out infinite}
@keyframes lhBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.lhome-hero .lh-t{font-size:23px;font-weight:900;letter-spacing:-.01em;line-height:1.15}
.lhome-hero .lh-s{font-size:13.5px;font-weight:700;opacity:.85;margin-top:3px}
.lhome-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.lvl-card{position:relative;background:#fff;border:2.5px solid #eef1f4;border-radius:20px;padding:16px 16px 14px;cursor:pointer;transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s,border-color .18s;box-shadow:0 4px 14px rgba(15,23,42,.06);text-align:left;overflow:hidden}
.lvl-card:hover{transform:translateY(-4px) scale(1.015);box-shadow:0 14px 30px rgba(15,23,42,.13);border-color:var(--lc,#58CC02)}
.lvl-card:active{transform:scale(.98)}
.lvl-card .lc-band{position:absolute;left:0;top:0;right:0;height:7px;background:var(--lc,#58CC02)}
.lvl-card .lc-ico{width:58px;height:58px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:29px;background:color-mix(in srgb,var(--lc,#58CC02) 14%,#fff);margin-bottom:10px;box-shadow:inset 0 0 0 2.5px color-mix(in srgb,var(--lc,#58CC02) 35%,#fff)}
.lvl-card .lc-name{font-weight:900;font-size:15.5px;color:#1f2937;letter-spacing:-.01em}
.lvl-card .lc-desc{font-size:12px;font-weight:700;color:#8a919c;margin-top:2px;line-height:1.35}
.lvl-card .lc-meta{display:flex;align-items:center;gap:7px;margin-top:11px;flex-wrap:wrap}
.lvl-card .lc-chip{font-size:10.5px;font-weight:900;padding:3px 8px;border-radius:999px;background:#f1f5f9;color:#64748b;letter-spacing:.02em}
.lvl-card .lc-chip.xp{background:color-mix(in srgb,var(--lc,#58CC02) 15%,#fff);color:color-mix(in srgb,var(--lc,#58CC02) 70%,#1f2937)}
.lvl-card .lc-bar{height:8px;border-radius:999px;background:#eef1f4;overflow:hidden;margin-top:10px}
.lvl-card .lc-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--lc,#58CC02) 65%,#fff),var(--lc,#58CC02));transition:width .6s cubic-bezier(.22,1,.36,1)}
.lvl-card .lc-check{position:absolute;right:13px;top:15px;width:26px;height:26px;border-radius:50%;background:var(--lc,#58CC02);color:#fff;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 10px color-mix(in srgb,var(--lc,#58CC02) 45%,transparent);animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0)}60%{transform:scale(1.25)}to{transform:scale(1)}}
.lvl-card.locked{opacity:.62;filter:saturate(.35)}
.lvl-card.locked .lc-ico{filter:grayscale(1)}
.lvl-card.test-card{background:linear-gradient(135deg,#141e3c,#27408f);border-color:#27408f;color:#fff}
.lvl-card.test-card .lc-name{color:#fff}
.lvl-card.test-card .lc-desc{color:#b7c4ee}
.lvl-card.test-card .lc-ico{background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 2.5px rgba(255,255,255,.22)}
.lvl-card.test-card .lc-chip{background:rgba(255,255,255,.14);color:#dbe4ff}
.lvl-card.test-card .lc-chip.xp{background:rgba(255,255,255,.2);color:#fff}
.lvl-card.test-card:after{content:'🏁';position:absolute;right:-12px;bottom:-16px;font-size:74px;opacity:.16;transform:rotate(-12deg)}
/* ✦ alive right sidebar */
.sidebar{animation:sbIn .4s cubic-bezier(.22,1,.36,1)}
@keyframes sbIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.sb-live{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:#16a34a;letter-spacing:.06em;text-transform:uppercase}
.sb-live i{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:sbBlink 1.6s ease-in-out infinite}
@keyframes sbBlink{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(34,197,94,.5)}50%{opacity:.55;box-shadow:0 0 0 5px rgba(34,197,94,0)}}
.lb-row{transition:transform .2s,background .2s}
.lb-row:hover{transform:translateX(4px)}
.lb-row.me{animation:meRow 2.6s ease-in-out infinite}
@keyframes meRow{0%,100%{background:#f0fdf4}50%{background:#dcfce7}}
.badge-cell{transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
.badge-cell:hover{transform:scale(1.08) rotate(-2deg)}
.badge-cell .bc-ico{transition:transform .18s}
.badge-cell:hover .bc-ico{transform:scale(1.2)}
.stat{transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
/* ✦ confetti + celebration */
.confetti{position:fixed;inset:0;pointer-events:none;z-index:400;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;opacity:.95;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(105vh) rotate(680deg);opacity:.9}}
@keyframes confSway{0%{margin-left:0}25%{margin-left:14px}50%{margin-left:-12px}75%{margin-left:8px}100%{margin-left:0}}
/* ✦ league promotion ceremony */
.promo-modal{text-align:center;position:relative;overflow:hidden}
.promo-modal:before{content:'';position:absolute;inset:-40%;background:conic-gradient(from 0deg,rgba(250,204,21,.16),transparent 25%,rgba(250,204,21,.16) 50%,transparent 75%,rgba(250,204,21,.16));animation:promoSpin 9s linear infinite}
@keyframes promoSpin{to{transform:rotate(360deg)}}
.promo-trophy{font-size:78px;animation:trophyPop .9s cubic-bezier(.34,1.56,.64,1),trophyGlow 2.2s ease-in-out .9s infinite}
@keyframes trophyPop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1) rotate(0)}}
@keyframes trophyGlow{0%,100%{filter:drop-shadow(0 0 6px rgba(250,204,21,.5))}50%{filter:drop-shadow(0 0 26px rgba(250,204,21,.95))}}
.promo-league{font-size:30px;font-weight:900;letter-spacing:-.02em;margin:4px 0;animation:popIn .6s cubic-bezier(.34,1.56,.64,1) .25s backwards}
/* ✦ DET exam-pressure timer bar */
.t-timerwrap{width:min(340px,42vw);height:10px;border-radius:999px;background:#e2e8f0;overflow:hidden;position:relative}
.t-timerwrap i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#22c55e,#84cc16);transition:width .95s linear}
.t-timerwrap.warn i{background:linear-gradient(90deg,#f59e0b,#f97316)}
.t-timerwrap.crit i{background:linear-gradient(90deg,#ef4444,#dc2626);animation:critPulse .7s ease-in-out infinite}
@keyframes critPulse{0%,100%{opacity:1}50%{opacity:.55}}
.t-timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:13.5px;color:#475569;min-width:46px;text-align:right}
.t-timerwrap.crit + .t-timer{color:#dc2626;animation:critPulse .7s ease-in-out infinite}
/* ✦ sound toggle in HUD */
.hud-snd{width:34px;height:34px;border-radius:50%;border:2px solid #e2e8f0;background:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;transition:transform .15s}
.hud-snd:hover{transform:scale(1.08)}
/* ✦ DET recording pulse */
.rec-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ef4444;animation:sbBlink 1.2s ease-in-out infinite;margin-right:6px;vertical-align:middle}
@media (max-width:1023px){.sidebar{display:none!important}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="application/json" id="lav2-data">{"title":"Around Town — Directions & Places","description":"Help the cat explore the city: places, directions, and polite questions! 🐱🗺️ Prepared for Test Student Alpha.","sections":[{"title":"🗺️ City Sights","colour":"#1CB0F6","xpReward":100,"slides":[{"heading":"Welcome to the City!","body":"Today you are a traveler exploring a new city. You will learn the names of places and how to ask for help. 🧳","example":"Excuse me, where is the museum?","colour":"#1CB0F6"},{"heading":"Places in Town","body":"Supermarket, bank, park, museum, hospital, train station — these are the places you need every day.","example":"The bank is next to the park.","colour":"#1CB0F6"},{"heading":"Your Mission","body":"Help the cat find its way to the museum! Answer every question to earn XP. 🐱🗺️","example":"","colour":"#1CB0F6"}],"activities":[{"type":"multiple_choice","title":"Vocabulary: Places Around Town","skillLabel":"Vocabulary","skillIcon":"📚","mode":"in-class","content":"[{\"question\":\"Where can you buy food and milk?\",\"l1\":\"¿Dónde puedes comprar comida y leche?\",\"options\":[\"Supermarket\",\"Museum\",\"Library\"],\"answer\":\"Supermarket\",\"feedback\":\"You nailed it, traveler! A supermarket is the big shop for food and drinks. 🛒\",\"miniLesson\":\"RULE: 'a/an' before jobs and places: 'a supermarket' (one of many). Picture the shelves of milk — that's your supermarket.\",\"keywords\":[\"supermarket\",\"food\",\"milk\"],\"speakingPrompt\":\"Say out loud: describe where you buy food in your own town using the word \\\"supermarket\\\".\",\"context\":\"You are hungry after your trip.\",\"contextTitle\":\"Story\",\"audioScript\":\"Where can you buy food and milk?\",\"audioLabel\":\"🔊 Listen\"},{\"question\":\"Where do sick people go to see a doctor?\",\"l1\":\"¿A dónde van las personas enfermas para ver a un médico?\",\"options\":[\"Bank\",\"Hospital\",\"Park\"],\"answer\":\"Hospital\",\"feedback\":\"Exactly! You remembered that doctors and nurses help people at the hospital. 🏥\",\"miniLesson\":\"WORD FAMILY: hospital → doctor → nurse → medicine. Learn the four together and they reinforce each other.\",\"keywords\":[\"hospital\",\"doctor\",\"medicine\"],\"speakingPrompt\":\"Say out loud: \\\"If I am sick, I go to the hospital to see a doctor.\\\"\",\"audioScript\":\"Where do sick people go to see a doctor?\"},{\"question\":\"Where can you see old paintings and history?\",\"options\":[\"Museum\",\"Train station\",\"Supermarket\"],\"answer\":\"Museum\",\"feedback\":\"Right! A museum is a building where you see art and history. 🖼️\",\"audioScript\":\"Where can you see old paintings and history?\"},{\"question\":\"Where do trains arrive and leave?\",\"options\":[\"Library\",\"Train station\",\"Café\"],\"answer\":\"Train station\",\"feedback\":\"Perfect! Trains arrive at and leave from a train station. 🚉\",\"audioScript\":\"Where do trains arrive and leave?\"}]"},{"type":"audio_matching","title":"Listening: Words & Sounds","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"A shop that sells bread and cakes\",\"l1\":\"panadería\",\"audioScript\":\"A bakery sells fresh bread and cakes.\"},{\"word\":\"bookshop\",\"definition\":\"A shop that sells books\",\"l1\":\"librería\",\"audioScript\":\"A bookshop is full of stories.\"},{\"word\":\"pharmacy\",\"definition\":\"A shop where you buy medicine\",\"l1\":\"farmacia\",\"audioScript\":\"You buy medicine at a pharmacy.\"},{\"word\":\"café\",\"definition\":\"A small restaurant for coffee and snacks\",\"l1\":\"cafetería\",\"audioScript\":\"Let's get a coffee at the café.\"}]"},{"type":"true_false","title":"Reading: A City Day","skillLabel":"Reading","skillIcon":"📖","mode":"homework","content":"[{\"statement\":\"Lily goes to the bakery to buy fresh bread.\",\"isTrue\":true,\"feedback\":\"Correct! You read carefully — Lily’s first stop IS the bakery. 🥖\",\"miniLesson\":\"READING SKILL: true/false questions test details. The story says 'bakery → supermarket → pharmacy → park' — the bakery comes FIRST.\",\"keywords\":[\"bakery\",\"fresh bread\"],\"speakingPrompt\":\"Say out loud: \\\"I go to the bakery to buy fresh bread.\\\"\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily goes to the bakery to buy fresh bread.\"},{\"statement\":\"The pharmacy sells apples and milk.\",\"isTrue\":false,\"feedback\":\"No — the pharmacy sells medicine. The supermarket sells apples and milk. 🛒\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"The pharmacy sells apples and milk.\"},{\"statement\":\"Lily relaxes in the park at the end of her day.\",\"isTrue\":true,\"feedback\":\"Correct! After shopping, Lily relaxes in the park. 🌳\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"Lily relaxes in the park at the end of her day.\"}]"}]},{"title":"📍 Getting There","colour":"#58CC02","xpReward":120,"slides":[{"heading":"Ask for Directions","body":"Politely ask: \"Excuse me, how do I get to...?\" — then listen carefully!","example":"Excuse me, how do I get to the station?","colour":"#58CC02"},{"heading":"Direction Words","body":"Go straight, turn left, turn right, cross the street, it’s on your right.","example":"Turn left at the bank, then go straight.","colour":"#58CC02"},{"heading":"Mini-Mission","body":"Help the cat cross the city! Use the direction words to reach the museum. 🐱","example":"","colour":"#58CC02"}],"activities":[{"type":"cloze","title":"Grammar: Giving Directions","skillLabel":"Grammar","skillIcon":"📐","mode":"in-class","content":"[{\"sentence\":\"Go straight ahead, then ___ left at the bank.\",\"l1\":\"Sigue recto y luego gira a la izquierda en el banco.\",\"blanks\":[\"turn\"],\"feedback\":\"Great! 'Turn left' means change direction to your left. ↩️\",\"miniLesson\":\"VERB POWER: 'turn' + 'left/right' is a fixed pair — never 'go left' in directions. 'Turn left at the bank' = change direction when you reach the bank.\",\"keywords\":[\"turn left\",\"go straight\"],\"speakingPrompt\":\"Say out loud: give directions to your door using \\\"turn left\\\" and \\\"go straight\\\".\",\"audioScript\":\"Go straight ahead, then turn left at the bank.\"},{\"sentence\":\"The museum is ___ the right, next to the park.\",\"blanks\":[\"on\"],\"feedback\":\"Exactly! We say 'on the right' or 'on the left'. 👉\",\"audioScript\":\"The museum is on the right, next to the park.\"},{\"sentence\":\"Excuse me, ___ do I get to the train station?\",\"blanks\":[\"how\"],\"feedback\":\"Perfect! 'How do I get to...?' is the classic way to ask for directions. 🗺️\",\"audioScript\":\"Excuse me, how do I get to the train station?\"}]"},{"type":"scramble","title":"Sentence Builder","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Turn\",\"left\",\"at\",\"the\",\"hospital.\"],\"answer\":\"Turn left at the hospital.\",\"feedback\":\"Great sentence! You rebuilt it perfectly — Turn left at the hospital. 🏥\",\"miniLesson\":\"SENTENCE PATTERN: Turn left/right + AT + place. The preposition 'at' marks the exact spot where you change direction.\",\"keywords\":[\"turn left at\",\"hospital\"],\"speakingPrompt\":\"Say out loud: \\\"Turn left at the hospital\\\" — then give your own example.\"},{\"chunks\":[\"The\",\"park\",\"is\",\"on\",\"your\",\"right.\"],\"answer\":\"The park is on your right.\",\"feedback\":\"Exactly — the park is on your right! 🌳\"},{\"chunks\":[\"How\",\"do\",\"I\",\"get\",\"to\",\"the\",\"museum?\"],\"answer\":\"How do I get to the museum?\",\"feedback\":\"Perfect question! How do I get to the museum? 🖼️\"}]"},{"type":"dictation","title":"Listening: Dictation","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Go straight and turn right at the café.\",\"answer\":\"Go straight and turn right at the café.\",\"feedback\":\"Beautiful listening! You caught every direction word — straight, turn, right, café. 👏\",\"miniLesson\":\"LISTENING TIP: direction sentences follow a beat: [action] + [place]. Hear the action word first, then relax — the place comes last.\",\"keywords\":[\"go straight\",\"turn right\",\"café\"],\"speakingPrompt\":\"Say out loud: \\\"Go straight and turn right at the café.\\\"\"},{\"audioScript\":\"The bank is across the street from the park.\",\"answer\":\"The bank is across the street from the park.\",\"feedback\":\"Superb! 'Across the street from' — that's a great phrase. 🌟\"}]"},{"type":"translate","title":"Translate: Street Talk","skillLabel":"Writing","skillIcon":"🖋️","mode":"homework","content":"[{\"prompt\":\"Gira a la izquierda en el banco.\",\"answer\":\"Turn left at the bank.\",\"l1\":\"Gira a la izquierda en el banco.\",\"feedback\":\"Beautiful! 'Turn left at the bank' — you just gave directions in English. 🏦\",\"miniLesson\":\"RULE: 'turn left/right at + place' — the place marks the spot where you change direction. 'At' pinpoints it.\",\"keywords\":[\"turn left at\",\"bank\"],\"speakingPrompt\":\"Say out loud: give directions to your favorite café using \\\"turn left\\\" and \\\"go straight\\\".\",\"audioScript\":\"Turn left at the bank.\"},{\"prompt\":\"El museo está a la derecha, junto al parque.\",\"answer\":\"The museum is on the right, next to the park.\",\"feedback\":\"Great job! 'On the right' + 'next to' — a perfect location sentence. 🌳\",\"miniLesson\":\"RULE: 'on the right/left' says the side, 'next to' says the neighbor. Chain them: The X is on the right, next to the Y.\",\"keywords\":[\"on the right\",\"next to\"],\"speakingPrompt\":\"Say out loud: describe your school using \\\"on the left\\\" and \\\"next to\\\".\",\"audioScript\":\"The museum is on the right, next to the park.\"}]"},{"type":"tap_word","title":"Listen & Tap: Direction Words","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"answer\":\"straight\",\"words\":[\"straight\",\"street\",\"strong\",\"stripe\"],\"audioScript\":\"straight\",\"feedback\":\"Perfect ear! 'Straight' is the sound-alike trap — you heard the real one. 👂\",\"miniLesson\":\"SOUND TIP: 'straight' (/streɪt/) rhymes with 'late'; 'street' (/striːt/) rhymes with 'meet'. One sound separates them!\",\"keywords\":[\"straight\",\"street\"],\"speakingPrompt\":\"Say both out loud: straight... street... — can you hear the difference?\"},{\"answer\":\"left\",\"words\":[\"left\",\"lift\",\"loft\",\"let\"],\"audioScript\":\"left\",\"feedback\":\"Nailed it! Left is the direction your heart is on. ❤️\",\"miniLesson\":\"MEMORY HOOK: your heart is on your LEFT side — that is how you never mix up left and right.\",\"keywords\":[\"left\",\"right\"],\"speakingPrompt\":\"Point to your left and say: \\\"This is my left.\\\"\"},{\"answer\":\"corner\",\"words\":[\"corner\",\"camera\",\"corn\",\"carrot\"],\"audioScript\":\"corner\",\"feedback\":\"You caught 'corner' — the word that turns sentences! 🔄\",\"miniLesson\":\"WORD POWER: 'corner' = where two streets meet. 'Around the corner' = very close by.\",\"keywords\":[\"corner\",\"around the corner\"],\"speakingPrompt\":\"Say: \\\"The café is around the corner.\\\"\"},{\"answer\":\"cross\",\"words\":[\"cross\",\"cost\",\"course\",\"crow\"],\"audioScript\":\"cross\",\"feedback\":\"Yes! 'Cross the street' means go from one side to the other. 🚸\",\"miniLesson\":\"VERB POWER: 'to cross' = to go across. Always cross at the zebra crossing!\",\"keywords\":[\"cross\",\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I cross the street at the zebra crossing.\\\"\"}]"},{"type":"html5","title":"Flip Cards: Direction Phrases","skillLabel":"Vocabulary","skillIcon":"🃏","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.fc{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}\\n.fcard{flex:1 1 45%;min-height:130px;perspective:800px;cursor:pointer}\\n.fcard-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}\\n.fcard.flip .fcard-in{transform:rotateY(180deg)}\\n.fcard-f,.fcard-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;font-size:14px;line-height:1.4}\\n.fcard-f{background:#e6f6ff;border:2px solid #7dd3fc;color:#0284c7}\\n.fcard-b{background:#1CB0F6;color:#fff;transform:rotateY(180deg)}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">👆 Tap each card to flip it — English on the front, your language on the back!\u003c/div>\\n\u003cdiv class=\\\"fc\\\" id=\\\"fdeck\\\">\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚶 go straight\u003c/div>\u003cdiv class=\\\"fcard-b\\\">seguir recto\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Go straight to the end of the street.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↩️ turn left\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la izquierda\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn left at the bank.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↪️ turn right\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la derecha\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn right at the traffic lights.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚸 cross the street\u003c/div>\u003cdiv class=\\\"fcard-b\\\">cruzar la calle\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Cross the street at the zebra crossing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n\u003c/div>\",\"feedback\":\"Great flipping! You now know the four key direction phrases. 🗺️\"}]"}],"test":{"tasks":[{"type":"read_select","words":["bakery","florbnik","hospital","smorble","museum","drimble","pharmacy","vexlite","library","plonket","café","blimber"],"real":["bakery","hospital","museum","pharmacy","library","café"]},{"type":"fill_blanks","items":["The {{bak:bakery}} sells fresh bread.","Where is the {{mus:museum}}?","The park is {{on:on}} the left.","You buy medicine at the {{pha:pharmacy}}."]},{"type":"write_photo","image":"https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800","alt":"A city street with shops","prompt":"Write about the photo. What places can you see? What do people do there?","minWords":30,"sample":"This is a busy city street. There is a bakery on the left — the bread smells amazing. Next to the bakery, there is a small café where people drink coffee. Across the street, I can see a museum and a train station. People cross the street at the zebra crossing."}]}},{"title":"🎪 City Adventure","colour":"#FF9600","xpReward":150,"slides":[{"heading":"The Grand Finale","body":"Now you’re ready for the City Adventure! Use everything you learned: places, directions, and polite questions.","example":"Excuse me, is the zoo near the museum?","colour":"#FF9600"},{"heading":"Polite Phrases","body":"\"Excuse me\", \"thank you\", \"you’re welcome\" — politeness opens every door.","example":"Thank you so much for your help!","colour":"#FF9600"},{"heading":"Boss Challenge","body":"The cat must reach the zoo before sunset! Complete every activity to win. 🏆","example":"","colour":"#FF9600"}],"activities":[{"type":"matching","title":"Vocabulary Review","skillLabel":"Vocabulary","skillIcon":"📚","mode":"homework","content":"[{\"word\":\"zoo\",\"definition\":\"a place where you see animals\"},{\"word\":\"library\",\"definition\":\"a quiet place with books to read\"},{\"word\":\"market\",\"definition\":\"an outdoor place with many small shops\"},{\"word\":\"bus stop\",\"definition\":\"a place where buses pick up people\"},{\"word\":\"parking lot\",\"definition\":\"a place where you leave your car\"}]"},{"type":"multiple_choice","title":"Boss Challenge: City Quiz","skillLabel":"Grammar","skillIcon":"🧠","mode":"in-class","content":"[{\"question\":\"Excuse me, ___ is the nearest bus stop?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"Perfect! We ask 'where is...' for places. 📍\",\"audioScript\":\"Excuse me, where is the nearest bus stop?\"},{\"question\":\"The zoo is ___ the left, next to the museum.\",\"options\":[\"at\",\"on\",\"in\"],\"answer\":\"on\",\"feedback\":\"Correct! 'On the left' / 'on the right' are fixed phrases. 👈\",\"audioScript\":\"The zoo is on the left, next to the museum.\"},{\"question\":\"You want to read quietly for an hour. Where do you go?\",\"options\":[\"The library\",\"The market\",\"The parking lot\"],\"answer\":\"The library\",\"feedback\":\"Right! A library is quiet and full of books. 📚\",\"context\":\"The cat wants a quiet afternoon.\",\"contextTitle\":\"Story\",\"audioScript\":\"You want to read quietly for an hour. Where do you go?\"}]"},{"type":"audio_matching","title":"Listening: Voices of the City","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"You smell fresh bread and hear the oven here.\",\"audioScript\":\"You smell fresh bread and hear the oven here.\"},{\"word\":\"train station\",\"definition\":\"You hear announcements and trains arriving here.\",\"audioScript\":\"You hear announcements and trains arriving here.\"},{\"word\":\"library\",\"definition\":\"It is so quiet here that you can hear a page turn.\",\"audioScript\":\"It is so quiet here that you can hear a page turn.\"},{\"word\":\"park\",\"definition\":\"You hear birds and children playing here.\",\"audioScript\":\"You hear birds and children playing here.\"}]"},{"type":"pronunciation","title":"Speak Like a Local","skillLabel":"Speaking","skillIcon":"🎤","mode":"in-class","content":"[{\"sentence\":\"Excuse me, how do I get to the zoo?\",\"phonetic\":\"/ɪkˈskjuːz miː, haʊ daɪ ɡet tə ðə zuː/\",\"tip\":\"Stress the words 'get' and 'zoo' — and keep 'Excuse me' soft and polite.\",\"feedback\":\"Lovely intonation! Your question sounds super natural. 🎙️\"},{\"sentence\":\"Turn right at the traffic lights.\",\"phonetic\":\"/tɜːn raɪt æt ðə ˈtræfɪk laɪts/\",\"tip\":\"Link 'turn' and 'right' together: 'turn-right'.\",\"feedback\":\"Beautiful rhythm! The lights are green for you. 🚦\"}]"},{"type":"speaking","title":"Speaking: Ask Like a Local","skillLabel":"Speaking","skillIcon":"🎤","mode":"in-class","content":"[{\"sentence\":\"Excuse me, where is the nearest bank?\",\"phonetic\":\"/ɪkˈskjuːz miː, weər ɪz ðə ˈnɪərɪst bæŋk/\",\"tip\":\"Stress 'WHERE' and 'NEAR-est' — and keep 'Excuse me' soft and polite.\",\"feedback\":\"Wonderful! You sound like a friendly local already. 🏦\",\"miniLesson\":\"PRONUNCIATION: 'nearest' = /ˈnɪərɪst/ — the 'ea' sounds like 'ear'. Compare: near → nearest.\",\"keywords\":[\"nearest\",\"Excuse me\"],\"speakingPrompt\":\"Now ask about the nearest café using the same pattern.\"},{\"sentence\":\"Is it far from here?\",\"phonetic\":\"/ɪz ɪt fɑː frəm hɪər/\",\"tip\":\"Make it a question: rise your voice on 'here'. 'Far' rhymes with 'car'.\",\"feedback\":\"Perfect question melody! Your intonation went up at the end. 🎵\",\"miniLesson\":\"QUESTION RHYTHM: yes/no questions rise at the end: 'Is it far from HERE?' — the voice lifts on the last word.\",\"keywords\":[\"far\",\"Is it ... from here?\"],\"speakingPrompt\":\"Ask a friend: \\\"Is the museum far from here?\\\"\"}]"},{"type":"story","title":"Story: The Cat’s Lost Keys","skillLabel":"Reading","skillIcon":"📖","mode":"homework","content":"[{\"paragraphs\":[{\"emoji\":\"🐱\",\"text\":\"Momo the cat woke up early and hungry. He wanted a croissant from the bakery — but his keys were gone!\"},{\"emoji\":\"🔑\",\"text\":\"\\\"Excuse me,\\\" Momo said to the baker, \\\"have you seen my keys? I need to get home.\\\" The baker smiled. \\\"Check the supermarket — I saw you there this morning.\\\"\"},{\"emoji\":\"🛒\",\"text\":\"Momo crossed the street at the zebra crossing and turned left at the bank. The supermarket was on the right, next to the pharmacy.\"},{\"emoji\":\"💊\",\"text\":\"In the supermarket, the manager shook her head. \\\"No keys here. Try the park — you always relax there after shopping.\\\"\"},{\"emoji\":\"🌳\",\"text\":\"Momo went straight ahead, past the museum, and into the park. And there, under the big tree on the left, his keys were shining in the sun!\"},{\"emoji\":\"🥐\",\"text\":\"\\\"Thank you, city!\\\" Momo purred. He bought two croissants from the bakery and walked home — on the right side, of course.\"}],\"feedback\":\"A sweet ending! You read a whole story in English — that is a real milestone. 📚\",\"miniLesson\":\"STORY RECAP: the story recycled 'excuse me', 'turn left at', 'on the right', 'next to', 'go straight ahead', 'cross the street', 'pharmacy', 'bakery', 'supermarket', 'park' — all your city words in one adventure.\",\"keywords\":[\"cross the street\",\"turn left at\",\"on the right\",\"next to\"],\"speakingPrompt\":\"Retell the story in 3 sentences: where did Momo find his keys?\"},{\"question\":\"What did Momo want from the bakery?\",\"options\":[\"A croissant\",\"A key\",\"Medicine\"],\"answer\":\"A croissant\",\"feedback\":\"Exactly — he was hungry for a croissant! 🥐\",\"miniLesson\":\"Remember: the bakery sells bread and cakes — and croissants!\",\"keywords\":[\"croissant\",\"bakery\"],\"speakingPrompt\":\"Say: \\\"The bakery sells fresh bread.\\\"\",\"audioScript\":\"What did Momo want from the bakery?\"},{\"question\":\"Where did Momo find his keys?\",\"options\":[\"Under a tree in the park\",\"At the pharmacy\",\"In the museum\"],\"answer\":\"Under a tree in the park\",\"feedback\":\"Yes! Under the big tree, on the left of the park. 🌳\",\"miniLesson\":\"Position words: 'under' (below), 'on the left' (left side), 'past' (beyond) — small words, big meaning.\",\"keywords\":[\"under\",\"on the left\",\"past\"],\"speakingPrompt\":\"Say: \\\"The keys were under the tree on the left.\\\"\",\"audioScript\":\"Where did Momo find his keys?\"},{\"statement\":\"Momo crossed the street at the zebra crossing.\",\"isTrue\":true,\"feedback\":\"Right! Safety first — always at the zebra crossing. 🚸\",\"miniLesson\":\"Reminder: 'cross the street' + 'at the zebra crossing' — a complete, safe sentence.\",\"keywords\":[\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I cross the street at the zebra crossing.\\\"\",\"audioScript\":\"Momo crossed the street at the zebra crossing.\"}]"},{"type":"html5","title":"Mini-Game: Memory Match","skillLabel":"Game","skillIcon":"🎮","mode":"homework","content":"[{\"html\":\"\u003cstyle>\\n.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}\\n.mcard{min-height:64px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;font-size:26px;transition:all .15s}\\n.mcard.on{background:#fff7ed;border-color:#FF9600}\\n.mcard.ok{background:#f0fdf4;border-color:#58CC02}\\n.mcard span{pointer-events:none}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">🧠 Find all the animal pairs! Tap two cards at a time.\u003c/div>\\n\u003cdiv class=\\\"mg\\\" id=\\\"mg\\\">\u003c/div>\\n\u003cdiv id=\\\"mg-msg\\\" style=\\\"text-align:center;font-weight:900;margin-top:12px;color:#9ca3af\\\">Pairs found: 0 / 6\u003c/div>\\n\u003cscript>\\n(function(){\\n  var em=['🐶','🐱','🐵','🦊','🐻','🐼'], cards=[];\\n  em.forEach(function(e){ cards.push(e,e); });\\n  for(var i=cards.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=cards[i]; cards[i]=cards[j]; cards[j]=t; }\\n  var open=[], lock=false, done=0;\\n  var box=document.getElementById('mg');\\n  box.innerHTML=cards.map(function(c,i){ return '\u003cbutton class=\\\"mcard\\\" data-i=\\\"'+i+'\\\">\u003cspan style=\\\"opacity:0\\\">'+c+'\u003c/span>\u003c/button>'; }).join('');\\n  box.onclick=function(ev){\\n    var b=ev.target.closest('.mcard');\\n    if(!b||lock||b.classList.contains('on')||b.classList.contains('ok')) return;\\n    b.classList.add('on'); open.push(b);\\n    if(open.length===2){\\n      lock=true;\\n      if(open[0].textContent===open[1].textContent){\\n        done++; open.forEach(function(o){ o.classList.add('ok'); });\\n        var msg=document.getElementById('mg-msg');\\n        if(msg){ msg.textContent=done===6?'🎉 You found all 6 pairs! Perfect memory!':'Pairs found: '+done+' / 6'; }\\n        open=[]; lock=false;\\n      } else {\\n        setTimeout(function(){ open.forEach(function(o){ o.classList.remove('on'); }); open=[]; lock=false; }, 700);\\n      }\\n    }\\n  };\\n})();\\n\u003c/script>\",\"feedback\":\"Amazing memory! You matched every pair like a champion. 🧠\"}]"}]},{"title":"🏆 Mastery Review","colour":"#A855F7","xpReward":200,"slides":[{"heading":"The Mastery Gauntlet","body":"One final arena to prove you can handle the whole city: places, directions, listening, and speaking — all together. 🏆","example":"You know more English than you think!","colour":"#A855F7"},{"heading":"Your Weak Spots","body":"The game remembers your mistakes. Turn them into wins and walk out stronger!","example":"Open ⚙️ Settings → Self-Study Mode to redo only your incorrect answers.","colour":"#A855F7"},{"heading":"Final Boss","body":"Complete every review round to earn the Mastery crown. The cat is counting on you! 🐱👑","example":"","colour":"#A855F7"}],"activities":[{"type":"multiple_choice","title":"Weak-Spot Review: Tricky Choices","skillLabel":"Review","skillIcon":"🧠","mode":"homework","content":"[{\"question\":\"You have a headache. Where do you go?\",\"options\":[\"Pharmacy\",\"Supermarket\",\"Café\"],\"answer\":\"Pharmacy\",\"feedback\":\"Exactly! Medicine comes from the pharmacy — not the supermarket. 💊\",\"context\":\"Your head hurts after the long walk.\",\"contextTitle\":\"Story\",\"audioScript\":\"You have a headache. Where do you go?\"},{\"question\":\"The museum is ___ the left, next to the train station.\",\"options\":[\"on\",\"at\",\"in\"],\"answer\":\"on\",\"feedback\":\"Correct! It's always 'on the left' or 'on the right'. 👈\",\"miniLesson\":\"RULE: 'on the left/right' are fixed phrases — we say ON, never AT or IN. Think of the page: the picture is ON the left side.\",\"keywords\":[\"on the left\",\"on the right\"],\"speakingPrompt\":\"Say out loud: \\\"The museum is on the left, next to the train station.\\\"\",\"audioScript\":\"The museum is on the left, next to the train station.\"},{\"question\":\"Excuse me, ___ can I buy a bus ticket?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"'Where' asks for a place — the ticket office! 🎫\",\"audioScript\":\"Excuse me, where can I buy a bus ticket?\"},{\"question\":\"Lily's first stop was the bakery. What did she buy there?\",\"options\":[\"Fresh bread\",\"Medicine\",\"A book\"],\"answer\":\"Fresh bread\",\"feedback\":\"Right! The bakery sells fresh bread — that was her first stop. 🥖\",\"context\":\"Lily's day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily's first stop was the bakery. What did she buy there?\"}]"},{"type":"matching","title":"Boss Round: The Whole City","skillLabel":"Vocabulary","skillIcon":"🗺️","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"a shop that sells bread and cakes\"},{\"word\":\"bookshop\",\"definition\":\"a shop that sells books\"},{\"word\":\"pharmacy\",\"definition\":\"a shop where you buy medicine\"},{\"word\":\"café\",\"definition\":\"a small restaurant for coffee and snacks\"},{\"word\":\"museum\",\"definition\":\"a building where you see art and history\"},{\"word\":\"hospital\",\"definition\":\"a place where doctors help sick people\"},{\"word\":\"train station\",\"definition\":\"a place where trains arrive and leave\"},{\"word\":\"park\",\"definition\":\"a green place to relax outside\"}]"},{"type":"scramble","title":"Boss Sentences","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Excuse\",\"me,\",\"where\",\"is\",\"the\",\"nearest\",\"pharmacy?\"],\"answer\":\"Excuse me, where is the nearest pharmacy?\",\"feedback\":\"Perfect polite question! The nearest pharmacy is just around the corner. 💊\",\"miniLesson\":\"POLITE QUESTION FORMULA: 'Excuse me' (attention) + 'where is' (question) + 'the nearest' (superlative) + place. Order matters!\",\"keywords\":[\"Excuse me\",\"where is\",\"nearest\"],\"speakingPrompt\":\"Ask out loud for the nearest bookshop using the same formula.\"},{\"chunks\":[\"Cross\",\"the\",\"street\",\"at\",\"the\",\"zebra\",\"crossing.\"],\"answer\":\"Cross the street at the zebra crossing.\",\"feedback\":\"Safety first — always cross at the zebra crossing! 🚸\"}]"},{"type":"dictation","title":"Final Listening Boss","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Turn left at the museum and go straight to the park.\",\"answer\":\"Turn left at the museum and go straight to the park.\",\"feedback\":\"Flawless! You followed the whole route in English. 🗺️\"},{\"audioScript\":\"The best café in town is next to the bookshop.\",\"answer\":\"The best café in town is next to the bookshop.\",\"feedback\":\"Superb! You caught 'next to' perfectly — that's the key phrase. ☕\"}]"},{"type":"radio","title":"DuoRadio: The Lost Tourist","skillLabel":"Listening","skillIcon":"📻","mode":"in-class","content":"[{\"lines\":[{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"Welcome back to DuoRadio! I am Maya, and today we follow Leo the tourist.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Excuse me! Excuse me! I need help. Where is the train station?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"Leo, you need a map. Look — go straight ahead, then turn left at the bank.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Turn left at the bank... got it! And what about the museum?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"The museum is on the right, next to the park. You cannot miss it.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Is it far from here? My feet are tired!\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"No, it is around the corner! Cross the street at the zebra crossing and you are there.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Perfect! Thank you so much. And where can I buy a coffee?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"The best café in town is next to the bookshop — they sell croissants too!\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"A croissant after the museum... now that is a plan. See you, Maya!\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"See you, Leo! And remember: always cross at the zebra crossing. Stay safe!\"}],\"feedback\":\"You listened to the whole episode — and every word was your city vocabulary. 📻\",\"miniLesson\":\"EPISODE RECAP: 'go straight ahead', 'turn left at the bank', 'on the right, next to the park', 'around the corner', 'cross the street at the zebra crossing' — the full direction toolkit in one conversation.\",\"keywords\":[\"go straight\",\"turn left at\",\"around the corner\",\"next to\"],\"speakingPrompt\":\"Act out the episode: be Leo and ask Maya for directions to the café.\"},{\"question\":\"What does Leo want to find first?\",\"options\":[\"The train station\",\"The museum\",\"A café\"],\"answer\":\"The train station\",\"feedback\":\"Right! First stop: the train station. 🚉\",\"miniLesson\":\"Question focus: 'Where is...?' — Leo’s first words were 'Excuse me! Where is the train station?'\",\"keywords\":[\"train station\"],\"speakingPrompt\":\"Say: \\\"Excuse me, where is the train station?\\\"\",\"audioScript\":\"What does Leo want to find first?\"},{\"question\":\"Where is the museum?\",\"options\":[\"On the right, next to the park\",\"Turn left at the bank\",\"Next to the bookshop\"],\"answer\":\"On the right, next to the park\",\"feedback\":\"Exactly — on the right, next to the park. 🖼️\",\"miniLesson\":\"Position chain: 'on the right' (side) + 'next to the park' (neighbor) — one sentence, two clues.\",\"keywords\":[\"on the right\",\"next to\"],\"speakingPrompt\":\"Say: \\\"The museum is on the right, next to the park.\\\"\",\"audioScript\":\"Where is the museum?\"},{\"question\":\"What does Maya say about crossing the street?\",\"options\":[\"Always cross at the zebra crossing\",\"Never cross the street\",\"Cross anywhere you like\"],\"answer\":\"Always cross at the zebra crossing\",\"feedback\":\"Safe and correct — the zebra crossing is the safe spot! 🚸\",\"miniLesson\":\"Safety language: 'always' + imperative: 'Always cross at the zebra crossing.'\",\"keywords\":[\"always\",\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I always cross at the zebra crossing.\\\"\",\"audioScript\":\"What does Maya say about crossing the street?\"}]"},{"type":"html5","title":"Boss Arena: Quiz Showdown","skillLabel":"Game","skillIcon":"⚔️","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.qz{margin-top:10px}\\n.qz-q{font-weight:900;color:#374151;margin-bottom:10px}\\n.qz-opt{display:block;width:100%;text-align:left;padding:12px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-weight:700;font-size:14px;color:#374151;margin-bottom:8px;cursor:pointer}\\n.qz-opt.ok{background:#f0fdf4;border-color:#58CC02;color:#166534}\\n.qz-opt.bad{background:#fef2f2;border-color:#f87171;color:#b91c1c}\\n.qz-opt:disabled{opacity:.75;cursor:default}\\n.qz-score{font-weight:900;color:#6b7280;margin:10px 0}\\n.qz-done{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:12px;text-align:center;font-weight:900;color:#a16207;margin-top:10px}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">⚔️ Five questions. No mercy. Answer them all!\u003c/div>\\n\u003cdiv class=\\\"qz\\\" id=\\\"qz\\\">\u003c/div>\\n\u003cdiv class=\\\"qz-score\\\" id=\\\"qz-score\\\">Score: 0 / 5\u003c/div>\\n\u003cscript>\\n(function(){\\n  var QS=[\\n    {q:\\\"1. Which word means to travel to work or school?\\\",o:[\\\"commute\\\",\\\"sleep\\\",\\\"eat\\\"],a:0},\\n    {q:\\\"2. Choose the polite question:\\\",o:[\\\"Where museum?\\\",\\\"Excuse me, where is the museum?\\\",\\\"Museum where?\\\"],a:1},\\n    {q:\\\"3. She ___ up at 6 AM every day.\\\",o:[\\\"wake\\\",\\\"wakes\\\",\\\"waking\\\"],a:1},\\n    {q:\\\"4. On the left means:\\\",o:[\\\"your left side\\\",\\\"your right side\\\",\\\"straight ahead\\\"],a:0},\\n    {q:\\\"5. The train station is ___ the right.\\\",o:[\\\"at\\\",\\\"in\\\",\\\"on\\\"],a:2}\\n  ];\\n  var qz=document.getElementById('qz'), sc=document.getElementById('qz-score'), qi=0, score=0, locked=false;\\n  function render(){\\n    if(qi>=QS.length){ qz.innerHTML='\u003cdiv class=\\\"qz-done\\\">'+(score===QS.length?'👑 PERFECT! You aced the Boss Arena!':'🎉 Boss defeated! Score: '+score+'/'+QS.length)+'\u003c/div>'; sc.textContent='Final score: '+score+' / '+QS.length; return; }\\n    var it=QS[qi];\\n    var html='\u003cdiv class=\\\"qz-q\\\">'+it.q+'\u003c/div>';\\n    it.o.forEach(function(o,i){ html+='\u003cbutton class=\\\"qz-opt\\\" data-i=\\\"'+i+'\\\">'+String.fromCharCode(65+i)+'. '+o+'\u003c/button>'; });\\n    qz.innerHTML=html;\\n  }\\n  qz.onclick=function(ev){\\n    if(locked) return;\\n    var b=ev.target.closest('.qz-opt'); if(!b) return;\\n    var i=+b.getAttribute('data-i'), it=QS[qi];\\n    locked=true;\\n    if(i===it.a){ score++; b.classList.add('ok'); }\\n    else { b.classList.add('bad'); qz.querySelectorAll('.qz-opt')[it.a].classList.add('ok'); }\\n    sc.textContent='Score: '+score+' / '+QS.length;\\n    setTimeout(function(){ qi++; locked=false; render(); }, 900);\\n  };\\n  render();\\n})();\\n\u003c/script>\",\"feedback\":\"Boss defeated! You cleared the whole city challenge. 👑\"}]"}],"test":{"tasks":[{"type":"fill_blanks","items":["The {{bak:bakery}} sells fresh bread.","Where is the {{mus:museum}}?","Turn {{lef:left}} at the bank.","The park is {{on:on}} the right."]},{"type":"listen_type","audio":"The museum is on the left, next to the park.","answer":"The museum is on the left, next to the park."},{"type":"read_complete","passage":"Welcome to Greenfield! The {{bak:bakery}} on Main Street sells fresh bread every morning. If you need medicine, the {{pha:pharmacy}} is {{ac:across}} the street. The {{mus:museum}} is my favorite place — it is {{ne:next}} to the park, so you can read under a tree after your visit."},{"type":"interactive_reading","passage":"Lily loves her neighborhood. Every morning she buys fresh bread at the bakery on Main Street. The bakery is next to a small café where her brother works. After breakfast, she walks past the museum and reads in the park. The park is on the left, across from the train station.","steps":[{"kind":"highlight","prompt":"Click the sentence that tells where Lily buys bread.","answer":"Every morning she buys fresh bread at the bakery on Main Street."},{"kind":"title","prompt":"Choose the best title.","options":["Lily’s Morning Walk","A Day at the Museum","The Train Station"],"answer":"Lily’s Morning Walk"},{"kind":"complete","prompt":"The café is next to ___.","options":["the bakery","the train station","the park"],"answer":"the bakery"},{"kind":"complete","prompt":"The park is ___ the train station.","options":["across from","inside","behind"],"answer":"across from"}]},{"type":"interactive_listening","lines":[{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Leo! You look lost. Do you need help?"},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Yes! Where is the pharmacy? I need medicine for my headache."},{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Go straight ahead. The pharmacy is across the street from the bakery."},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Across from the bakery — and then?"},{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Then turn left at the museum. It is the building with the red door!"},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Thank you, Maya. You are a great city guide!"}],"questions":[{"question":"What does Leo need?","options":["Medicine","Bread","A book"],"answer":"Medicine"},{"question":"Where is the pharmacy?","options":["Across from the bakery","Next to the museum","In the park"],"answer":"Across from the bakery"},{"question":"What color is the museum door?","options":["Red","Blue","Green"],"answer":"Red"}],"summary":"Leo needs {{med:medicine}}. The pharmacy is across from the {{bak:bakery}}, and he must turn {{lef:left}} at the {{mus:museum}}."},{"type":"speak_photo","image":"https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800","alt":"A busy city corner","prompt":"Describe this city photo aloud for 30–90 seconds. What places and people do you see?","sample":"In this photo I can see a busy city corner. There are shops on the right, and many people cross the street at the crossing. I think there is a café on the corner because people are drinking coffee outside."},{"type":"interactive_writing","prompt":"A new student is coming to your town. Write directions from the train station to your favorite place (40+ words).","minWords":40,"followUp":"Now warn the new student about one thing to avoid in your town. Write 2-3 sentences.","sample":"Welcome! From the train station, go straight ahead for two minutes. Turn left at the bank — there is only one bank. My favorite place is the museum: it is on the right, next to the park. You cannot miss it!"},{"type":"read_speak","prompt":"Describe the neighborhood where you live. Where is the nearest bakery, café or park? Speak for 30–90 seconds.","sample":"I live near a small park. The nearest bakery is around the corner — it is on the left, next to a bookshop. There is also a café across the street from the park. I go there every morning."},{"type":"interactive_speaking","turns":[{"character":"Maya","emoji":"🦊","text":"Hi! Where do you live — describe your street!"},{"character":"Leo","emoji":"🐻","text":"What is the most important place in your neighborhood, and where is it?"},{"character":"Maya","emoji":"🦊","text":"How do I get from the train station to your home? Give me directions!"},{"character":"Leo","emoji":"🐻","text":"Last one: what can someone buy around the corner from you?"}],"sample":"I live on a quiet street. There is a bakery on the corner and a pharmacy across the street. To get to my home: go straight, turn right at the museum, and it is on your left. Around the corner you can buy fresh bread and coffee."},{"type":"speaking_sample","topic":"Speak for 1–3 minutes: \"A perfect day in my town.\" Where do you go, what do you do, and who do you meet?","sample":"A perfect day in my town starts at the bakery — I buy fresh bread. Then I walk to the park and read under a tree. In the afternoon, I visit the museum with a friend. We finish the day at the café next to the bookshop."}]}}],"coachVoiceURI":"You are an expert ESL/EFL content creator for language tutors, creating highly personalized and pedagogically sound learning materials.","l1":"Spanish"}</script>
