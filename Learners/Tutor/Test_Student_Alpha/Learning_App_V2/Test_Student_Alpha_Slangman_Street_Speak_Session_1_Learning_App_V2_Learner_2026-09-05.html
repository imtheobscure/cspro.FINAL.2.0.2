<script type="application/json" id="lav2-data">{"title":"Around Town — Directions & Places","description":"Help the cat explore the city: places, directions, and polite questions! 🐱🗺️ Prepared for Test Student Alpha.","sections":[{"title":"🗺️ City Sights","colour":"#1CB0F6","xpReward":100,"slides":[{"heading":"Welcome to the City!","body":"Today you are a traveler exploring a new city. You will learn the names of places and how to ask for help. 🧳","example":"Excuse me, where is the museum?","colour":"#1CB0F6"},{"heading":"Places in Town","body":"Supermarket, bank, park, museum, hospital, train station — these are the places you need every day.","example":"The bank is next to the park.","colour":"#1CB0F6"},{"heading":"Your Mission","body":"Help the cat find its way to the museum! Answer every question to earn XP. 🐱🗺️","example":"","colour":"#1CB0F6"}],"activities":[{"type":"multiple_choice","title":"Vocabulary: Places Around Town","skillLabel":"Vocabulary","skillIcon":"📚","mode":"in-class","content":"[{\"question\":\"Where can you buy food and milk?\",\"options\":[\"Supermarket\",\"Museum\",\"Library\"],\"answer\":\"Supermarket\",\"feedback\":\"Yes! A supermarket is a big shop for food and drinks. 🛒\",\"context\":\"You are hungry after your trip.\",\"contextTitle\":\"Story\",\"audioScript\":\"Where can you buy food and milk?\",\"audioLabel\":\"🔊 Listen\"},{\"question\":\"Where do sick people go to see a doctor?\",\"options\":[\"Bank\",\"Hospital\",\"Park\"],\"answer\":\"Hospital\",\"feedback\":\"Exactly! A hospital is where doctors and nurses help sick people. 🏥\",\"audioScript\":\"Where do sick people go to see a doctor?\"},{\"question\":\"Where can you see old paintings and history?\",\"options\":[\"Museum\",\"Train station\",\"Supermarket\"],\"answer\":\"Museum\",\"feedback\":\"Right! A museum is a building where you see art and history. 🖼️\",\"audioScript\":\"Where can you see old paintings and history?\"},{\"question\":\"Where do trains arrive and leave?\",\"options\":[\"Library\",\"Train station\",\"Café\"],\"answer\":\"Train station\",\"feedback\":\"Perfect! Trains arrive at and leave from a train station. 🚉\",\"audioScript\":\"Where do trains arrive and leave?\"}]"},{"type":"audio_matching","title":"Listening: Words & Sounds","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"A shop that sells bread and cakes\",\"audioScript\":\"A bakery sells fresh bread and cakes.\"},{\"word\":\"bookshop\",\"definition\":\"A shop that sells books\",\"audioScript\":\"A bookshop is full of stories.\"},{\"word\":\"pharmacy\",\"definition\":\"A shop where you buy medicine\",\"audioScript\":\"You buy medicine at a pharmacy.\"},{\"word\":\"café\",\"definition\":\"A small restaurant for coffee and snacks\",\"audioScript\":\"Let's get a coffee at the café.\"}]"},{"type":"true_false","title":"Reading: A City Day","skillLabel":"Reading","skillIcon":"📖","mode":"homework","content":"[{\"statement\":\"Lily goes to the bakery to buy fresh bread.\",\"isTrue\":true,\"feedback\":\"Correct! Lily’s first stop is the bakery for fresh bread. 🥖\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily goes to the bakery to buy fresh bread.\"},{\"statement\":\"The pharmacy sells apples and milk.\",\"isTrue\":false,\"feedback\":\"No — the pharmacy sells medicine. The supermarket sells apples and milk. 🛒\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"The pharmacy sells apples and milk.\"},{\"statement\":\"Lily relaxes in the park at the end of her day.\",\"isTrue\":true,\"feedback\":\"Correct! After shopping, Lily relaxes in the park. 🌳\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"Lily relaxes in the park at the end of her day.\"}]"}]},{"title":"📍 Getting There","colour":"#58CC02","xpReward":120,"slides":[{"heading":"Ask for Directions","body":"Politely ask: \"Excuse me, how do I get to...?\" — then listen carefully!","example":"Excuse me, how do I get to the station?","colour":"#58CC02"},{"heading":"Direction Words","body":"Go straight, turn left, turn right, cross the street, it’s on your right.","example":"Turn left at the bank, then go straight.","colour":"#58CC02"},{"heading":"Mini-Mission","body":"Help the cat cross the city! Use the direction words to reach the museum. 🐱","example":"","colour":"#58CC02"}],"activities":[{"type":"cloze","title":"Grammar: Giving Directions","skillLabel":"Grammar","skillIcon":"📐","mode":"in-class","content":"[{\"sentence\":\"Go straight ahead, then ___ left at the bank.\",\"blanks\":[\"turn\"],\"feedback\":\"Great! 'Turn left' means change direction to your left. ↩️\",\"audioScript\":\"Go straight ahead, then turn left at the bank.\"},{\"sentence\":\"The museum is ___ the right, next to the park.\",\"blanks\":[\"on\"],\"feedback\":\"Exactly! We say 'on the right' or 'on the left'. 👉\",\"audioScript\":\"The museum is on the right, next to the park.\"},{\"sentence\":\"Excuse me, ___ do I get to the train station?\",\"blanks\":[\"how\"],\"feedback\":\"Perfect! 'How do I get to...?' is the classic way to ask for directions. 🗺️\",\"audioScript\":\"Excuse me, how do I get to the train station?\"}]"},{"type":"scramble","title":"Sentence Builder","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Turn\",\"left\",\"at\",\"the\",\"hospital.\"],\"answer\":\"Turn left at the hospital.\",\"feedback\":\"Great sentence! Turn left at the hospital. 🏥\"},{\"chunks\":[\"The\",\"park\",\"is\",\"on\",\"your\",\"right.\"],\"answer\":\"The park is on your right.\",\"feedback\":\"Exactly — the park is on your right! 🌳\"},{\"chunks\":[\"How\",\"do\",\"I\",\"get\",\"to\",\"the\",\"museum?\"],\"answer\":\"How do I get to the museum?\",\"feedback\":\"Perfect question! How do I get to the museum? 🖼️\"}]"},{"type":"dictation","title":"Listening: Dictation","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Go straight and turn right at the café.\",\"answer\":\"Go straight and turn right at the café.\",\"feedback\":\"Beautiful listening! You caught every direction word. 👏\"},{\"audioScript\":\"The bank is across the street from the park.\",\"answer\":\"The bank is across the street from the park.\",\"feedback\":\"Superb! 'Across the street from' — that's a great phrase. 🌟\"}]"},{"type":"html5","title":"Flip Cards: Direction Phrases","skillLabel":"Vocabulary","skillIcon":"🃏","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.fc{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}\\n.fcard{flex:1 1 45%;min-height:130px;perspective:800px;cursor:pointer}\\n.fcard-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}\\n.fcard.flip .fcard-in{transform:rotateY(180deg)}\\n.fcard-f,.fcard-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;font-size:14px;line-height:1.4}\\n.fcard-f{background:#e6f6ff;border:2px solid #7dd3fc;color:#0284c7}\\n.fcard-b{background:#1CB0F6;color:#fff;transform:rotateY(180deg)}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">👆 Tap each card to flip it — English on the front, your language on the back!\u003c/div>\\n\u003cdiv class=\\\"fc\\\" id=\\\"fdeck\\\">\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚶 go straight\u003c/div>\u003cdiv class=\\\"fcard-b\\\">seguir recto\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Go straight to the end of the street.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↩️ turn left\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la izquierda\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn left at the bank.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↪️ turn right\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la derecha\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn right at the traffic lights.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚸 cross the street\u003c/div>\u003cdiv class=\\\"fcard-b\\\">cruzar la calle\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Cross the street at the zebra crossing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n\u003c/div>\",\"feedback\":\"Great flipping! You now know the four key direction phrases. 🗺️\"}]"}]},{"title":"🎪 City Adventure","colour":"#FF9600","xpReward":150,"slides":[{"heading":"The Grand Finale","body":"Now you’re ready for the City Adventure! Use everything you learned: places, directions, and polite questions.","example":"Excuse me, is the zoo near the museum?","colour":"#FF9600"},{"heading":"Polite Phrases","body":"\"Excuse me\", \"thank you\", \"you’re welcome\" — politeness opens every door.","example":"Thank you so much for your help!","colour":"#FF9600"},{"heading":"Boss Challenge","body":"The cat must reach the zoo before sunset! Complete every activity to win. 🏆","example":"","colour":"#FF9600"}],"activities":[{"type":"matching","title":"Vocabulary Review","skillLabel":"Vocabulary","skillIcon":"📚","mode":"homework","content":"[{\"word\":\"zoo\",\"definition\":\"a place where you see animals\"},{\"word\":\"library\",\"definition\":\"a quiet place with books to read\"},{\"word\":\"market\",\"definition\":\"an outdoor place with many small shops\"},{\"word\":\"bus stop\",\"definition\":\"a place where buses pick up people\"},{\"word\":\"parking lot\",\"definition\":\"a place where you leave your car\"}]"},{"type":"multiple_choice","title":"Boss Challenge: City Quiz","skillLabel":"Grammar","skillIcon":"🧠","mode":"in-class","content":"[{\"question\":\"Excuse me, ___ is the nearest bus stop?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"Perfect! We ask 'where is...' for places. 📍\",\"audioScript\":\"Excuse me, where is the nearest bus stop?\"},{\"question\":\"The zoo is ___ the left, next to the museum.\",\"options\":[\"at\",\"on\",\"in\"],\"answer\":\"on\",\"feedback\":\"Correct! 'On the left' / 'on the right' are fixed phrases. 👈\",\"audioScript\":\"The zoo is on the left, next to the museum.\"},{\"question\":\"You want to read quietly for an hour. Where do you go?\",\"options\":[\"The library\",\"The market\",\"The parking lot\"],\"answer\":\"The library\",\"feedback\":\"Right! A library is quiet and full of books. 📚\",\"context\":\"The cat wants a quiet afternoon.\",\"contextTitle\":\"Story\",\"audioScript\":\"You want to read quietly for an hour. Where do you go?\"}]"},{"type":"pronunciation","title":"Speak Like a Local","skillLabel":"Speaking","skillIcon":"🎤","mode":"in-class","content":"[{\"sentence\":\"Excuse me, how do I get to the zoo?\",\"phonetic\":\"/ɪkˈskjuːz miː, haʊ daɪ ɡet tə ðə zuː/\",\"tip\":\"Stress the words 'get' and 'zoo' — and keep 'Excuse me' soft and polite.\",\"feedback\":\"Lovely intonation! Your question sounds super natural. 🎙️\"},{\"sentence\":\"Turn right at the traffic lights.\",\"phonetic\":\"/tɜːn raɪt æt ðə ˈtræfɪk laɪts/\",\"tip\":\"Link 'turn' and 'right' together: 'turn-right'.\",\"feedback\":\"Beautiful rhythm! The lights are green for you. 🚦\"}]"},{"type":"html5","title":"Mini-Game: Memory Match","skillLabel":"Game","skillIcon":"🎮","mode":"homework","content":"[{\"html\":\"\u003cstyle>\\n.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}\\n.mcard{min-height:64px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;font-size:26px;transition:all .15s}\\n.mcard.on{background:#fff7ed;border-color:#FF9600}\\n.mcard.ok{background:#f0fdf4;border-color:#58CC02}\\n.mcard span{pointer-events:none}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">🧠 Find all the animal pairs! Tap two cards at a time.\u003c/div>\\n\u003cdiv class=\\\"mg\\\" id=\\\"mg\\\">\u003c/div>\\n\u003cdiv id=\\\"mg-msg\\\" style=\\\"text-align:center;font-weight:900;margin-top:12px;color:#9ca3af\\\">Pairs found: 0 / 6\u003c/div>\\n\u003cscript>\\n(function(){\\n  var em=['🐶','🐱','🐵','🦊','🐻','🐼'], cards=[];\\n  em.forEach(function(e){ cards.push(e,e); });\\n  for(var i=cards.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=cards[i]; cards[i]=cards[j]; cards[j]=t; }\\n  var open=[], lock=false, done=0;\\n  var box=document.getElementById('mg');\\n  box.innerHTML=cards.map(function(c,i){ return '\u003cbutton class=\\\"mcard\\\" data-i=\\\"'+i+'\\\">\u003cspan style=\\\"opacity:0\\\">'+c+'\u003c/span>\u003c/button>'; }).join('');\\n  box.onclick=function(ev){\\n    var b=ev.target.closest('.mcard');\\n    if(!b||lock||b.classList.contains('on')||b.classList.contains('ok')) return;\\n    b.classList.add('on'); open.push(b);\\n    if(open.length===2){\\n      lock=true;\\n      if(open[0].textContent===open[1].textContent){\\n        done++; open.forEach(function(o){ o.classList.add('ok'); });\\n        var msg=document.getElementById('mg-msg');\\n        if(msg){ msg.textContent=done===6?'🎉 You found all 6 pairs! Perfect memory!':'Pairs found: '+done+' / 6'; }\\n        open=[]; lock=false;\\n      } else {\\n        setTimeout(function(){ open.forEach(function(o){ o.classList.remove('on'); }); open=[]; lock=false; }, 700);\\n      }\\n    }\\n  };\\n})();\\n\u003c/script>\",\"feedback\":\"Amazing memory! You matched every pair like a champion. 🧠\"}]"}]},{"title":"🏆 Mastery Review","colour":"#A855F7","xpReward":200,"slides":[{"heading":"The Mastery Gauntlet","body":"One final arena to prove you can handle the whole city: places, directions, listening, and speaking — all together. 🏆","example":"You know more English than you think!","colour":"#A855F7"},{"heading":"Your Weak Spots","body":"The game remembers your mistakes. Turn them into wins and walk out stronger!","example":"Open ⚙️ Settings → Self-Study Mode to redo only your incorrect answers.","colour":"#A855F7"},{"heading":"Final Boss","body":"Complete every review round to earn the Mastery crown. The cat is counting on you! 🐱👑","example":"","colour":"#A855F7"}],"activities":[{"type":"multiple_choice","title":"Weak-Spot Review: Tricky Choices","skillLabel":"Review","skillIcon":"🧠","mode":"homework","content":"[{\"question\":\"You have a headache. Where do you go?\",\"options\":[\"Pharmacy\",\"Supermarket\",\"Café\"],\"answer\":\"Pharmacy\",\"feedback\":\"Exactly! Medicine comes from the pharmacy — not the supermarket. 💊\",\"context\":\"Your head hurts after the long walk.\",\"contextTitle\":\"Story\",\"audioScript\":\"You have a headache. Where do you go?\"},{\"question\":\"The museum is ___ the left, next to the train station.\",\"options\":[\"on\",\"at\",\"in\"],\"answer\":\"on\",\"feedback\":\"Correct! It's always 'on the left' or 'on the right'. 👈\",\"audioScript\":\"The museum is on the left, next to the train station.\"},{\"question\":\"Excuse me, ___ can I buy a bus ticket?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"'Where' asks for a place — the ticket office! 🎫\",\"audioScript\":\"Excuse me, where can I buy a bus ticket?\"},{\"question\":\"Lily's first stop was the bakery. What did she buy there?\",\"options\":[\"Fresh bread\",\"Medicine\",\"A book\"],\"answer\":\"Fresh bread\",\"feedback\":\"Right! The bakery sells fresh bread — that was her first stop. 🥖\",\"context\":\"Lily's day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily's first stop was the bakery. What did she buy there?\"}]"},{"type":"matching","title":"Boss Round: The Whole City","skillLabel":"Vocabulary","skillIcon":"🗺️","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"a shop that sells bread and cakes\"},{\"word\":\"bookshop\",\"definition\":\"a shop that sells books\"},{\"word\":\"pharmacy\",\"definition\":\"a shop where you buy medicine\"},{\"word\":\"café\",\"definition\":\"a small restaurant for coffee and snacks\"},{\"word\":\"museum\",\"definition\":\"a building where you see art and history\"},{\"word\":\"hospital\",\"definition\":\"a place where doctors help sick people\"},{\"word\":\"train station\",\"definition\":\"a place where trains arrive and leave\"},{\"word\":\"park\",\"definition\":\"a green place to relax outside\"}]"},{"type":"scramble","title":"Boss Sentences","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Excuse\",\"me,\",\"where\",\"is\",\"the\",\"nearest\",\"pharmacy?\"],\"answer\":\"Excuse me, where is the nearest pharmacy?\",\"feedback\":\"Perfect polite question! The nearest pharmacy is just around the corner. 💊\"},{\"chunks\":[\"Cross\",\"the\",\"street\",\"at\",\"the\",\"zebra\",\"crossing.\"],\"answer\":\"Cross the street at the zebra crossing.\",\"feedback\":\"Safety first — always cross at the zebra crossing! 🚸\"}]"},{"type":"dictation","title":"Final Listening Boss","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Turn left at the museum and go straight to the park.\",\"answer\":\"Turn left at the museum and go straight to the park.\",\"feedback\":\"Flawless! You followed the whole route in English. 🗺️\"},{\"audioScript\":\"The best café in town is next to the bookshop.\",\"answer\":\"The best café in town is next to the bookshop.\",\"feedback\":\"Superb! You caught 'next to' perfectly — that's the key phrase. ☕\"}]"},{"type":"html5","title":"Boss Arena: Quiz Showdown","skillLabel":"Game","skillIcon":"⚔️","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.qz{margin-top:10px}\\n.qz-q{font-weight:900;color:#374151;margin-bottom:10px}\\n.qz-opt{display:block;width:100%;text-align:left;padding:12px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-weight:700;font-size:14px;color:#374151;margin-bottom:8px;cursor:pointer}\\n.qz-opt.ok{background:#f0fdf4;border-color:#58CC02;color:#166534}\\n.qz-opt.bad{background:#fef2f2;border-color:#f87171;color:#b91c1c}\\n.qz-opt:disabled{opacity:.75;cursor:default}\\n.qz-score{font-weight:900;color:#6b7280;margin:10px 0}\\n.qz-done{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:12px;text-align:center;font-weight:900;color:#a16207;margin-top:10px}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">⚔️ Five questions. No mercy. Answer them all!\u003c/div>\\n\u003cdiv class=\\\"qz\\\" id=\\\"qz\\\">\u003c/div>\\n\u003cdiv class=\\\"qz-score\\\" id=\\\"qz-score\\\">Score: 0 / 5\u003c/div>\\n\u003cscript>\\n(function(){\\n  var QS=[\\n    {q:\\\"1. Which word means to travel to work or school?\\\",o:[\\\"commute\\\",\\\"sleep\\\",\\\"eat\\\"],a:0},\\n    {q:\\\"2. Choose the polite question:\\\",o:[\\\"Where museum?\\\",\\\"Excuse me, where is the museum?\\\",\\\"Museum where?\\\"],a:1},\\n    {q:\\\"3. She ___ up at 6 AM every day.\\\",o:[\\\"wake\\\",\\\"wakes\\\",\\\"waking\\\"],a:1},\\n    {q:\\\"4. On the left means:\\\",o:[\\\"your left side\\\",\\\"your right side\\\",\\\"straight ahead\\\"],a:0},\\n    {q:\\\"5. The train station is ___ the right.\\\",o:[\\\"at\\\",\\\"in\\\",\\\"on\\\"],a:2}\\n  ];\\n  var qz=document.getElementById('qz'), sc=document.getElementById('qz-score'), qi=0, score=0, locked=false;\\n  function render(){\\n    if(qi>=QS.length){ qz.innerHTML='\u003cdiv class=\\\"qz-done\\\">'+(score===QS.length?'👑 PERFECT! You aced the Boss Arena!':'🎉 Boss defeated! Score: '+score+'/'+QS.length)+'\u003c/div>'; sc.textContent='Final score: '+score+' / '+QS.length; return; }\\n    var it=QS[qi];\\n    var html='\u003cdiv class=\\\"qz-q\\\">'+it.q+'\u003c/div>';\\n    it.o.forEach(function(o,i){ html+='\u003cbutton class=\\\"qz-opt\\\" data-i=\\\"'+i+'\\\">'+String.fromCharCode(65+i)+'. '+o+'\u003c/button>'; });\\n    qz.innerHTML=html;\\n  }\\n  qz.onclick=function(ev){\\n    if(locked) return;\\n    var b=ev.target.closest('.qz-opt'); if(!b) return;\\n    var i=+b.getAttribute('data-i'), it=QS[qi];\\n    locked=true;\\n    if(i===it.a){ score++; b.classList.add('ok'); }\\n    else { b.classList.add('bad'); qz.querySelectorAll('.qz-opt')[it.a].classList.add('ok'); }\\n    sc.textContent='Score: '+score+' / '+QS.length;\\n    setTimeout(function(){ qi++; locked=false; render(); }, 900);\\n  };\\n  render();\\n})();\\n\u003c/script>\",\"feedback\":\"Boss defeated! You cleared the whole city challenge. 👑\"}]"}]}]}</script>

  // ── wiring ──
  function wireAct(){
    var root = $('act-slot');
    if(!root || root.__wired) return;
    root.__wired = true;
    root.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-act]'); if(!b) return;
      var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
      if(act==='next') { advanceActivity(); return; }
      if(act==='aplay' || act==='dplay' || act==='dslow' || act==='pplay'){
        var it = item();
        if(act==='aplay') speak(it.audioScript, S.rate*0.9);
        else if(act==='dplay'){ S._dictPlayed=S.q; speak(it.audioScript, S.rate*0.85); save(); render(); }
        else if(act==='dslow'){ speak(it.audioScript, S.rate*0.6); }
        else speak(it.sentence, S.rate*0.85);
        return;
      }
      if(act==='nextq'){ advanceQ(); return; }
      if(act==='hnext'){
        var hIt=item();
        S.catMsg = 'Awesome exploration! 😸';
        say(hIt.feedback);
        handleCorrect();
        setTimeout(function(){ advanceQ(); }, 900);
        return;
      }
      if(act==='maudio'){ var mi=items()[i]; if(mi.audioScript) speak(mi.audioScript, S.rate*0.9); ev.stopPropagation(); return; }
      if(act==='mc'){
        var mcIt=item(), sel=+b.getAttribute('data-i'), ok = mcIt.options[sel]===mcIt.answer;
        S.fb = {ok:ok, text:'<b>'+(ok?'🎉 Correct!':'❌ Not quite!')+'</b><br>'+esc(mcIt.feedback||'')};
        say(mcIt.feedback);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='tf'){
        var tfIt=item(), val=+b.getAttribute('data-v')===1, ok = val===tfIt.isTrue;
        S.fb = {ok:ok, text:'<b>'+(ok?'🎉 Correct!':'❌ Not quite!')+'</b> The statement is <b>'+(tfIt.isTrue?'TRUE':'FALSE')+'</b>.<br>'+esc(tfIt.feedback||'')};
        say(tfIt.feedback);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='cloze-check'){
        var cIt=item(), blanks=cIt.blanks||[], okCount=0;
        [].forEach.call(root.querySelectorAll('.gap-input'), function(inp, idx){
          var ok = norm(inp.value)===norm(blanks[idx]||'');
          inp.classList.add(ok?'ok':'bad'); inp.disabled=true;
          if(ok) okCount++;
          else if(blanks[idx]){ var sp=document.createElement('span'); sp.className='gap-correct'; sp.innerHTML=' → '+esc(blanks[idx]); inp.parentNode.appendChild(sp); }
        });
        var allOk = okCount===blanks.length && blanks.length>0;
        S.fb = {ok:allOk, text:'<b>'+(allOk?'🎉 All correct!':'✏️ '+okCount+'/'+blanks.length+' correct')+'</b><br>'+esc(cIt.feedback||'')};
        say(cIt.feedback);
        if(allOk) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='scram-push'){
        var sk = scramKey(); if(!sk) return; var st=scramState[sk];
        st.arr.push(st.avail.splice(+b.getAttribute('data-i'),1)[0]); renderActivity(); return;
      }
      if(act==='scram-pop'){
        var sk2 = scramKey(); if(!sk2) return; var st2=scramState[sk2];
        st2.avail.push(st2.arr.splice(+b.getAttribute('data-i'),1)[0]); renderActivity(); return;
      }
      if(act==='scram-check'){
        var sk3 = scramKey(); if(!sk3) return; var st3=scramState[sk3], sIt=item();
        var ok = st3.arr.join(' ').trim() === String(sIt.answer||'').trim();
        st3.revealed=true; st3.isOk=ok; if(!ok) st3.misses=(st3.misses||0)+1;
        say(sIt.feedback);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='dcheck'){
        var dIt=item(); var ta=$('dict-ta');
        if(S._dictPlayed !== S.q){ speak(dIt.audioScript, S.rate*0.85); S._dictPlayed=S.q; render(); return; }
        var typed=ta.value;
        var ok = norm(typed)===norm(dIt.answer);
        S._dictState={q:S.q,typed:typed,ok:ok};
        say(dIt.feedback);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='prec'){
        S._proRec=S.q; save(); render();
        setTimeout(function(){ S._proRec=null; S._proSelf=S.q; save(); render(); }, 3000);
        return;
      }
      if(act==='pself'){
        var pIt=item(), ok=+b.getAttribute('data-v')===1;
        S.fb = {ok:ok, text:'<b>'+(ok?'🎉 Great job!':'💪 Keep practicing!')+'</b><br>'+esc(pIt.feedback||'')};
        say(pIt.feedback);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
    });
  }
  function scramKey(){ return S.phase+'/'+S.activity+'/'+S.q; }
  function buildTimer(){
    if(!S.timeAttack || isWholeSet() || S.phase!=='activity') return;
    var t=10;
    var iv=setInterval(function(){
      t--;
      var f=$('timer-fill'), n=$('timer-num');
      if(f){ f.style.width=(t/10*100)+'%'; f.style.background=t>6?'#58CC02':(t>3?'#FF9600':'#FF4B4B'); }
      if(n) n.textContent=t+'s';
      if(t<=0){ clearInterval(iv); S.fb={ok:false,text:'<b>⏱️ Time up!</b><br>Don\'t worry — speed comes with practice!'}; handleIncorrect(); }
    },1000);
  }

  function wireGlobal(){
    var root=$('lav2-root');
    root.addEventListener('click', function(ev){
      var b=ev.target.closest('[data-gact]'); if(!b) return;
      var g=b.getAttribute('data-gact');
      if(g==='sread'){ var sec=section(); var sl=(sec.slides||[])[S.slideIdx]; if(sl) speak(sl.heading+'. '+sl.body+(sl.example?'. Example: '+sl.example:''), S.rate*0.95); }
      else if(g==='sprev'){ S.slideIdx--; renderSlides(); }
      else if(g==='snext'){ if(S.slideIdx >= ((section().slides||[]).length-1)) { S.phase='activity'; S.slideIdx=0; render(); } else { S.slideIdx++; renderSlides(); } }
      else if(g==='goto'){ var si=+b.getAttribute('data-i'); if(si<=S.section){ S.section=si; S.activity=0; S.q=0; S.phase='slides'; S.perfectRun=true; S.slideIdx=0; render(); } }
      else if(g==='next'){ advanceQ(); }
      else if(g==='settings'){ S.showSettings=true; render(); }
      else if(g==='close-settings'){ S.showSettings=false; render(); }
      else if(g==='panel'){ var p=b.getAttribute('data-p'); S.panel = S.panel===p?'none':p; render(); }
      else if(g==='close-panel'){ S.panel='none'; render(); }

      else if(g==='sec-next'){ advanceSection(); }

      else if(g==='hm-gems'){ if(S.gems>=5){ S.gems-=5; S.hearts=S.maxHearts; S.heartsModal=false; render(); } }
      else if(g==='hm-practice'){ S.hearts=S.maxHearts; S.heartsModal=false; render(); }
      else if(g==='hm-close'){ S.heartsModal=false; render(); }
      else if(g==='tts'){ S.tts=!S.tts; if(!S.tts) try{speechSynthesis.cancel()}catch(e){} save(); render(); }

      else if(g==='selfstudy'){ S.selfStudy=!S.selfStudy; save(); render(); }
      else if(g==='voice'){ S.voice=b.value; save(); }
      else if(g==='pitch'){ S.pitch=+b.value; save(); }
      else if(g==='rate'){ S.rate=+b.value; save(); }
      else if(g==='buy'){ var ai=+b.getAttribute('data-i'); var acc=ACCS[ai]; if(!acc) return; if(S.gems>=acc[3]){ S.gems-=acc[3]; unlocked[acc[0]]=true; equipped[acc[0]]=true; save(); render(); } }
    });
  }

      h += '<div class="overlay"><div class="modal settings"><div class="act-meta"><h3 style="margin:0">⚙️ Settings</h3><button class="hud-gear" data-gact="close-settings" style="font-size:22px">✕</button></div>'+
        '<div class="set-row"><div><p class="st">🔊 Text-to-Speech</p><p class="sd">Cat reads feedback aloud</p></div><button class="switch'+(S.tts?' on':'')+'" data-gact="tts"></button></div>'+
        (S.tts?'<div><label>🎙️ Voice</label><select data-gact="voice"><option value="">— Default Voice —</option>'+voices.map(function(v){return '<option value="'+esc(v.name)+'"'+(S.voice===v.name?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>';}).join('')+'</select></div>':'')+
        (S.tts?'<div><label>Pitch — '+S.pitch.toFixed(1)+'</label><input type="range" min="0.5" max="2" step="0.1" value="'+S.pitch+'" data-gact="pitch"></div>':'')+
        (S.tts?'<div><label>Speed — '+S.rate.toFixed(1)+'x</label><input type="range" min="0.5" max="2" step="0.1" value="'+S.rate+'" data-gact="rate"></div>':'')+
        '<div class="set-row"><div><p class="st">⏱️ Time Attack Mode</p><p class="sd">10 seconds per question, 2x XP</p></div><button class="switch'+(S.timeAttack?' on':'')+'" data-gact="timeattack"></button></div>'+
        '<div class="set-row"><div><p class="st">📚 Self-Study Mode</p><p class="sd">Practice your incorrect answers</p></div><button class="switch'+(S.selfStudy?' on':'')+'" data-gact="selfstudy"></button></div>'+
        '</div></div>';
    }
    return h;
  }
  function resetGame(){
    S.section=0; S.activity=0; S.q=0; S.phase='slides'; S.slideIdx=0;
    S.completed=[]; S.incorrect=[]; S.hearts=S.maxHearts; S.perfectRun=true;
    S.sessionXp=0; S.xp=0; S.totalXp=0; S.correctStreak=0; S.chestCount=0; S.showAllDone=false;
    earnedBadges={};
  }

  // ── main render ──
  function render(){
    var root=$('lav2-root'); if(!root) return;
    var mainInner;
    if(S.phase==='slides'){
      mainInner = '<div id="main-slot"></div>';
    } else {
      mainInner = '<div class="act-wrap" id="act-slot"></div>';
    }
    root.innerHTML = hudHTML()+chipsHTML()+
      '<div class="main"><div class="main-content">'+mainInner+'</div>'+sidePanels()+'</div>'+
      navHTML()+overlayHTML();
    if(S.phase==='slides') renderSlides(); else renderActivity();
  }

  // ── boot ──
  load();
  if(!sections.length){
    document.getElementById('lav2-root').innerHTML =
      '<div class="act-wrap"><div class="card" style="text-align:center;padding:40px 20px"><div style="font-size:56px">😿</div>'+
      '<h2 style="font-weight:900;margin:12px 0 8px">No lesson loaded</h2>'+
      '<p style="color:#6b7280;font-size:14px;line-height:1.6">Open <b>Lessons → Lesson Creator</b>, choose <b>🎮 Learning App V2</b>, hit <b>Load Mock Data</b> (or paste AI-generated JSON), then generate this lesson.</p></div></div>';
    return;
  }
  S.slideIdx = 0;
  render();
  wireGlobal();
})();
</script>
</body>
</html>
