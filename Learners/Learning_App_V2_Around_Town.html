<script type="application/json" id="lav2-data">{"title":"Around Town — Directions & Places","description":"Help the cat explore the city: places, directions, and polite questions! 🐱🗺️ Prepared for Demo Learner.","sections":[{"title":"🗺️ City Sights","colour":"#1CB0F6","xpReward":100,"slides":[{"heading":"Welcome to the City!","body":"Today you are a traveler exploring a new city. You will learn the names of places and how to ask for help. 🧳","example":"Excuse me, where is the museum?","colour":"#1CB0F6"},{"heading":"Places in Town","body":"Supermarket, bank, park, museum, hospital, train station — these are the places you need every day.","example":"The bank is next to the park.","colour":"#1CB0F6"},{"heading":"Your Mission","body":"Help the cat find its way to the museum! Answer every question to earn XP. 🐱🗺️","example":"","colour":"#1CB0F6"}],"activities":[{"type":"multiple_choice","title":"Vocabulary: Places Around Town","skillLabel":"Vocabulary","skillIcon":"📚","mode":"in-class","content":"[{\"question\":\"Where can you buy food and milk?\",\"l1\":\"¿Dónde puedes comprar comida y leche?\",\"options\":[\"Supermarket\",\"Market\",\"Bookshop\"],\"answer\":\"Supermarket\",\"feedback\":\"A supermarket is that big indoor shop with shelves of food — the market outside sells food too, so look for the building. 🛒\",\"miniLesson\":\"Here is the trick: a **supermarket** is an indoor shop, but an open-air street **market** sells food too — so read the details. Both sell food, which is why this one was a trap. Picture the shelves of milk inside the big building — that is your supermarket. We say *a* supermarket (one of many), like *a* bank or *a* park.\",\"keywords\":[\"supermarket\",\"market\",\"food\"],\"speakingPrompt\":\"Say out loud: describe where you buy food in your own town using the word \\\"supermarket\\\".\",\"context\":\"You are hungry after your trip.\",\"contextTitle\":\"Story\",\"audioScript\":\"Where can you buy food and milk?\",\"audioLabel\":\"🔊 Listen\"},{\"question\":\"Where do sick people go to see a doctor?\",\"l1\":\"¿A dónde van las personas enfermas para ver a un médico?\",\"options\":[\"Hospital\",\"Pharmacy\",\"Bank\"],\"answer\":\"Hospital\",\"feedback\":\"Exactly — doctors and nurses work at the hospital. 🏥\",\"miniLesson\":\"Watch the trap: a **pharmacy** also helps sick people, but there you buy medicine from a pharmacist — you do not see a *doctor* there. The hospital is the big building with doctors, nurses, and rooms for patients. Remember the family together: **hospital → doctor → nurse → medicine** — learn the four as one picture and they reinforce each other.\",\"keywords\":[\"hospital\",\"pharmacy\",\"doctor\"],\"speakingPrompt\":\"Say out loud: \\\"If I am sick, I go to the hospital to see a doctor.\\\"\",\"audioScript\":\"Where do sick people go to see a doctor?\"},{\"question\":\"Where can you see old paintings and history?\",\"l1\":\"¿Dónde puedes ver pinturas antiguas e historia?\",\"options\":[\"Museum\",\"Gallery\",\"Library\"],\"answer\":\"Museum\",\"feedback\":\"Right! A museum is a building where you see art and history. 🖼️\",\"miniLesson\":\"Here is the difference: a **gallery** shows paintings too, but usually modern art by living artists. A **museum** shows old things — history, ancient objects, classic paintings. And a **library** is for books you borrow. So: old + historical + paintings together = *museum*.\",\"keywords\":[\"museum\",\"gallery\",\"history\"],\"speakingPrompt\":\"Say out loud: \\\"My favorite museum has old paintings from 1900.\\\"\",\"audioScript\":\"Where can you see old paintings and history?\"},{\"question\":\"Where do trains arrive and leave?\",\"l1\":\"¿Dónde llegan y salen los trenes?\",\"options\":[\"Train station\",\"Bus stop\",\"Airport\"],\"answer\":\"Train station\",\"feedback\":\"Perfect! Trains arrive at and leave from a train station. 🚉\",\"miniLesson\":\"All three are travel places, so read the key word in the question: **trains**. Buses stop at a *bus stop*, planes land at an *airport*, and trains arrive at a **train station** — say it with a long *sss* sound at the start: *sss-train station*.\",\"keywords\":[\"train station\",\"bus stop\",\"airport\"],\"speakingPrompt\":\"Say out loud: \\\"I take the train — I go to the train station every morning.\\\"\",\"audioScript\":\"Where do trains arrive and leave?\"}]"},{"type":"audio_matching","title":"Listening: Words & Sounds","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"A shop that sells bread and cakes\",\"l1\":\"panadería\",\"audioScript\":\"A bakery sells fresh bread and cakes.\"},{\"word\":\"bookshop\",\"definition\":\"A shop that sells books\",\"l1\":\"librería\",\"audioScript\":\"A bookshop is full of stories.\"},{\"word\":\"pharmacy\",\"definition\":\"A shop where you buy medicine\",\"l1\":\"farmacia\",\"audioScript\":\"You buy medicine at a pharmacy.\"},{\"word\":\"café\",\"definition\":\"A small restaurant for coffee and snacks\",\"l1\":\"cafetería\",\"audioScript\":\"Let's get a coffee at the café.\"}]"},{"type":"true_false","title":"Reading: A City Day","skillLabel":"Reading","skillIcon":"📖","mode":"homework","content":"[{\"statement\":\"Lily goes to the bakery to buy fresh bread.\",\"isTrue\":true,\"feedback\":\"Correct! You read carefully — Lily’s first stop IS the bakery. 🥖\",\"miniLesson\":\"READING SKILL: true/false questions test details. The story says 'bakery → supermarket → pharmacy → park' — the bakery comes FIRST.\",\"keywords\":[\"bakery\",\"fresh bread\"],\"speakingPrompt\":\"Say out loud: \\\"I go to the bakery to buy fresh bread.\\\"\",\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily goes to the bakery to buy fresh bread.\"},{\"statement\":\"The pharmacy sells apples and milk.\",\"isTrue\":false,\"feedback\":\"No — the pharmacy sells medicine. The supermarket sells apples and milk. 🛒\",\"miniLesson\":\"Shop logic: a **pharmacy** sells medicine; a **supermarket** sells food like apples and milk. Read what each shop really sells before you answer TRUE or FALSE.\",\"keywords\":[\"pharmacy\",\"supermarket\"],\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"The pharmacy sells apples and milk.\"},{\"statement\":\"Lily relaxes in the park at the end of her day.\",\"isTrue\":true,\"feedback\":\"After shopping, Lily relaxes in the park — the story ends there. 🌳\",\"miniLesson\":\"Reading for detail: the story order was **bakery → supermarket → pharmacy → park** — the park comes *last*, so that is where she relaxes at the end of her day.\",\"keywords\":[\"at the end\"],\"context\":\"Lily’s day: bakery → supermarket → pharmacy → park.\",\"audioScript\":\"Lily relaxes in the park at the end of her day.\"}]"}]},{"title":"📍 Getting There","colour":"#58CC02","xpReward":120,"slides":[{"heading":"Ask for Directions","body":"Politely ask: \"Excuse me, how do I get to...?\" — then listen carefully!","example":"Excuse me, how do I get to the station?","colour":"#58CC02"},{"heading":"Direction Words","body":"Go straight, turn left, turn right, cross the street, it’s on your right.","example":"Turn left at the bank, then go straight.","colour":"#58CC02"},{"heading":"Mini-Mission","body":"Help the cat cross the city! Use the direction words to reach the museum. 🐱","example":"","colour":"#58CC02"}],"activities":[{"type":"cloze","title":"Grammar: Giving Directions","skillLabel":"Grammar","skillIcon":"📐","mode":"in-class","content":"[{\"sentence\":\"Go straight ahead, then ___ left at the bank.\",\"l1\":\"Sigue recto y luego gira a la izquierda en el banco.\",\"blanks\":[\"turn\"],\"feedback\":\"Great! 'Turn left' means change direction to your left. ↩️\",\"miniLesson\":\"VERB POWER: 'turn' + 'left/right' is a fixed pair — never 'go left' in directions. 'Turn left at the bank' = change direction when you reach the bank.\",\"keywords\":[\"turn left\",\"go straight\"],\"speakingPrompt\":\"Say out loud: give directions to your door using \\\"turn left\\\" and \\\"go straight\\\".\",\"audioScript\":\"Go straight ahead, then turn left at the bank.\"},{\"sentence\":\"The museum is ___ the right, next to the park.\",\"blanks\":[\"on\"],\"feedback\":\"We say 'on the right' or 'on the left' — 'on' + a side. 👉\",\"miniLesson\":\"Remember the pair: **on the right** and **on the left** — the preposition *on* always goes with a side. The museum is on the right, *next to* the park — two location phrases in one sentence.\",\"keywords\":[\"on the right\",\"next to\"],\"audioScript\":\"The museum is on the right, next to the park.\"},{\"sentence\":\"Excuse me, ___ do I get to the train station?\",\"blanks\":[\"how\"],\"feedback\":\"'How do I get to...?' is the classic way to ask for directions. 🗺️\",\"miniLesson\":\"Question pattern: **How do I get to...?** — the question word *how* asks for the way. Excuse me, how do I get to the train station? Remember the order: how + do + I + get + to + place.\",\"keywords\":[\"how do I get to\"],\"audioScript\":\"Excuse me, how do I get to the train station?\"}]"},{"type":"scramble","title":"Sentence Builder","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Turn\",\"left\",\"at\",\"the\",\"hospital.\"],\"answer\":\"Turn left at the hospital.\",\"feedback\":\"Great sentence! You rebuilt it perfectly — Turn left at the hospital. 🏥\",\"miniLesson\":\"SENTENCE PATTERN: Turn left/right + AT + place. The preposition 'at' marks the exact spot where you change direction.\",\"keywords\":[\"turn left at\",\"hospital\"],\"speakingPrompt\":\"Say out loud: \\\"Turn left at the hospital\\\" — then give your own example.\"},{\"chunks\":[\"The\",\"park\",\"is\",\"on\",\"your\",\"right.\"],\"answer\":\"The park is on your right.\",\"feedback\":\"The park is on your right — \\\"on\\\" + \\\"your\\\" + a side. 🌳\",\"miniLesson\":\"Sentence pattern: **The [place] is on your [side]** — the park is *on your right*. When you give directions, the place comes first, then *on your left* or *on your right*.\",\"keywords\":[\"on your right\"]},{\"chunks\":[\"How\",\"do\",\"I\",\"get\",\"to\",\"the\",\"museum?\"],\"answer\":\"How do I get to the museum?\",\"feedback\":\"How do I get to the museum? — the order matters. 🖼️\",\"miniLesson\":\"Question word order: **How + do + I + get + to + place?** The question word *how* goes first, then *do I*, then the verb *get*. Never say *How I get to the museum* in a question.\",\"keywords\":[\"how do I get to\"]}]"},{"type":"dictation","title":"Listening: Dictation","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Go straight and turn right at the café.\",\"answer\":\"Go straight and turn right at the café.\",\"feedback\":\"Beautiful listening! You caught every direction word — straight, turn, right, café. 👏\",\"miniLesson\":\"LISTENING TIP: direction sentences follow a beat: [action] + [place]. Hear the action word first, then relax — the place comes last.\",\"keywords\":[\"go straight\",\"turn right\",\"café\"],\"speakingPrompt\":\"Say out loud: \\\"Go straight and turn right at the café.\\\"\"},{\"audioScript\":\"The bank is across the street from the park.\",\"answer\":\"The bank is across the street from the park.\",\"feedback\":\"'Across the street from' — one place facing another. 🌟\",\"miniLesson\":\"Key phrase: **across the street from** — the bank is *across the street from* the park, one on each side of the road. Hear the rhythm: the + place + is + across the street from + the + place.\",\"keywords\":[\"across the street from\"]}]"},{"type":"translate","title":"Translate: Street Talk","skillLabel":"Writing","skillIcon":"🖋️","mode":"homework","content":"[{\"prompt\":\"Gira a la izquierda en el banco.\",\"answer\":\"Turn left at the bank.\",\"l1\":\"Gira a la izquierda en el banco.\",\"feedback\":\"Beautiful! 'Turn left at the bank' — you just gave directions in English. 🏦\",\"miniLesson\":\"RULE: 'turn left/right at + place' — the place marks the spot where you change direction. 'At' pinpoints it.\",\"keywords\":[\"turn left at\",\"bank\"],\"speakingPrompt\":\"Say out loud: give directions to your favorite café using \\\"turn left\\\" and \\\"go straight\\\".\",\"audioScript\":\"Turn left at the bank.\"},{\"prompt\":\"El museo está a la derecha, junto al parque.\",\"answer\":\"The museum is on the right, next to the park.\",\"feedback\":\"Great job! 'On the right' + 'next to' — a perfect location sentence. 🌳\",\"miniLesson\":\"RULE: 'on the right/left' says the side, 'next to' says the neighbor. Chain them: The X is on the right, next to the Y.\",\"keywords\":[\"on the right\",\"next to\"],\"speakingPrompt\":\"Say out loud: describe your school using \\\"on the left\\\" and \\\"next to\\\".\",\"audioScript\":\"The museum is on the right, next to the park.\"}]"},{"type":"tap_word","title":"Listen & Tap: Direction Words","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"answer\":\"straight\",\"words\":[\"straight\",\"street\",\"strong\",\"stripe\"],\"audioScript\":\"straight\",\"feedback\":\"Perfect ear! 'Straight' is the sound-alike trap — you heard the real one. 👂\",\"miniLesson\":\"SOUND TIP: 'straight' (/streɪt/) rhymes with 'late'; 'street' (/striːt/) rhymes with 'meet'. One sound separates them!\",\"keywords\":[\"straight\",\"street\"],\"speakingPrompt\":\"Say both out loud: straight... street... — can you hear the difference?\"},{\"answer\":\"left\",\"words\":[\"left\",\"lift\",\"loft\",\"let\"],\"audioScript\":\"left\",\"feedback\":\"Nailed it! Left is the direction your heart is on. ❤️\",\"miniLesson\":\"MEMORY HOOK: your heart is on your LEFT side — that is how you never mix up left and right.\",\"keywords\":[\"left\",\"right\"],\"speakingPrompt\":\"Point to your left and say: \\\"This is my left.\\\"\"},{\"answer\":\"corner\",\"words\":[\"corner\",\"camera\",\"corn\",\"carrot\"],\"audioScript\":\"corner\",\"feedback\":\"You caught 'corner' — the word that turns sentences! 🔄\",\"miniLesson\":\"WORD POWER: 'corner' = where two streets meet. 'Around the corner' = very close by.\",\"keywords\":[\"corner\",\"around the corner\"],\"speakingPrompt\":\"Say: \\\"The café is around the corner.\\\"\"},{\"answer\":\"cross\",\"words\":[\"cross\",\"cost\",\"course\",\"crow\"],\"audioScript\":\"cross\",\"feedback\":\"Yes! 'Cross the street' means go from one side to the other. 🚸\",\"miniLesson\":\"VERB POWER: 'to cross' = to go across. Always cross at the zebra crossing!\",\"keywords\":[\"cross\",\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I cross the street at the zebra crossing.\\\"\"}]"},{"type":"html5","title":"Flip Cards: Direction Phrases","skillLabel":"Vocabulary","skillIcon":"🃏","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.fc{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}\\n.fcard{flex:1 1 45%;min-height:130px;perspective:800px;cursor:pointer}\\n.fcard-in{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}\\n.fcard.flip .fcard-in{transform:rotateY(180deg)}\\n.fcard-f,.fcard-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-weight:800;font-size:14px;line-height:1.4}\\n.fcard-f{background:#e6f6ff;border:2px solid #7dd3fc;color:#0284c7}\\n.fcard-b{background:#1CB0F6;color:#fff;transform:rotateY(180deg)}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">👆 Tap each card to flip it — English on the front, your language on the back!\u003c/div>\\n\u003cdiv class=\\\"fc\\\" id=\\\"fdeck\\\">\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚶 go straight\u003c/div>\u003cdiv class=\\\"fcard-b\\\">seguir recto\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Go straight to the end of the street.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↩️ turn left\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la izquierda\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn left at the bank.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">↪️ turn right\u003c/div>\u003cdiv class=\\\"fcard-b\\\">girar a la derecha\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Turn right at the traffic lights.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n  \u003cdiv class=\\\"fcard\\\" onclick=\\\"this.classList.toggle('flip')\\\">\u003cdiv class=\\\"fcard-in\\\">\u003cdiv class=\\\"fcard-f\\\">🚸 cross the street\u003c/div>\u003cdiv class=\\\"fcard-b\\\">cruzar la calle\u003cbr>\u003cspan style=\\\"font-size:11px;opacity:.9\\\">Cross the street at the zebra crossing.\u003c/span>\u003c/div>\u003c/div>\u003c/div>\\n\u003c/div>\",\"feedback\":\"Great flipping! You now know the four key direction phrases. 🗺️\"}]"}],"test":{"tasks":[{"type":"read_select","words":["bakery","florbnik","hospital","smorble","museum","drimble","pharmacy","vexlite","library","plonket","café","blimber"],"real":["bakery","hospital","museum","pharmacy","library","café"]},{"type":"fill_blanks","items":["The {{bak:bakery}} sells fresh bread.","Where is the {{mus:museum}}?","The park is {{on:on}} the left.","You buy medicine at the {{pha:pharmacy}}."]},{"type":"write_photo","image":"https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=800","alt":"A city street with shops","prompt":"Write about the photo. What places can you see? What do people do there?","minWords":30,"sample":"This is a busy city street. There is a bakery on the left — the bread smells amazing. Next to the bakery, there is a small café where people drink coffee. Across the street, I can see a museum and a train station. People cross the street at the zebra crossing."}]}},{"title":"🎪 City Adventure","colour":"#FF9600","xpReward":150,"slides":[{"heading":"The Grand Finale","body":"Now you’re ready for the City Adventure! Use everything you learned: places, directions, and polite questions.","example":"Excuse me, is the zoo near the museum?","colour":"#FF9600"},{"heading":"Polite Phrases","body":"\"Excuse me\", \"thank you\", \"you’re welcome\" — politeness opens every door.","example":"Thank you so much for your help!","colour":"#FF9600"},{"heading":"Boss Challenge","body":"The cat must reach the zoo before sunset! Complete every activity to win. 🏆","example":"","colour":"#FF9600"}],"activities":[{"type":"matching","title":"Vocabulary Review","skillLabel":"Vocabulary","skillIcon":"📚","mode":"homework","content":"[{\"word\":\"zoo\",\"definition\":\"a place where you see animals\"},{\"word\":\"library\",\"definition\":\"a quiet place with books to read\"},{\"word\":\"market\",\"definition\":\"an outdoor place with many small shops\"},{\"word\":\"bus stop\",\"definition\":\"a place where buses pick up people\"},{\"word\":\"parking lot\",\"definition\":\"a place where you leave your car\"}]"},{"type":"multiple_choice","title":"Boss Challenge: City Quiz","skillLabel":"Grammar","skillIcon":"🧠","mode":"in-class","content":"[{\"question\":\"Excuse me, ___ is the nearest bus stop?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"We ask 'where is...' for places. 📍\",\"miniLesson\":\"Question word: **where** asks for a *place*. What asks for a thing, who asks for a person — so for the bus stop you need **where is...**.\",\"keywords\":[\"where is\"],\"audioScript\":\"Excuse me, where is the nearest bus stop?\"},{\"question\":\"The zoo is ___ the left, next to the museum.\",\"options\":[\"at\",\"on\",\"in\"],\"answer\":\"on\",\"feedback\":\"'On the left' / 'on the right' are fixed phrases. 👈\",\"miniLesson\":\"Fixed phrase: **on the left** and **on the right** always use *on* — never at or in. Picture the map: the zoo sits ON the left side, next to the museum.\",\"keywords\":[\"on the left\"],\"audioScript\":\"The zoo is on the left, next to the museum.\"},{\"question\":\"You want to read quietly for an hour. Where do you go?\",\"options\":[\"The library\",\"The market\",\"The parking lot\"],\"answer\":\"The library\",\"feedback\":\"A library is quiet and full of books. 📚\",\"miniLesson\":\"Read the mood words: **quiet** and **read** point to the library — markets are loud and parking lots are empty. Match the activity to the place.\",\"keywords\":[\"library\",\"quiet\"],\"context\":\"The cat wants a quiet afternoon.\",\"contextTitle\":\"Story\",\"audioScript\":\"You want to read quietly for an hour. Where do you go?\"}]"},{"type":"audio_matching","title":"Listening: Voices of the City","skillLabel":"Listening","skillIcon":"👂","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"You smell fresh bread and hear the oven here.\",\"audioScript\":\"You smell fresh bread and hear the oven here.\"},{\"word\":\"train station\",\"definition\":\"You hear announcements and trains arriving here.\",\"audioScript\":\"You hear announcements and trains arriving here.\"},{\"word\":\"library\",\"definition\":\"It is so quiet here that you can hear a page turn.\",\"audioScript\":\"It is so quiet here that you can hear a page turn.\"},{\"word\":\"park\",\"definition\":\"You hear birds and children playing here.\",\"audioScript\":\"You hear birds and children playing here.\"}]"},{"type":"pronunciation","title":"Speak Like a Local","skillLabel":"Speaking","skillIcon":"🎤","mode":"in-class","content":"[{\"sentence\":\"Excuse me, how do I get to the zoo?\",\"phonetic\":\"/ɪkˈskjuːz miː, haʊ daɪ ɡet tə ðə zuː/\",\"tip\":\"Stress the words 'get' and 'zoo' — and keep 'Excuse me' soft and polite.\",\"feedback\":\"Lovely intonation! Your question sounds super natural. 🎙️\"},{\"sentence\":\"Turn right at the traffic lights.\",\"phonetic\":\"/tɜːn raɪt æt ðə ˈtræfɪk laɪts/\",\"tip\":\"Link 'turn' and 'right' together: 'turn-right'.\",\"feedback\":\"Beautiful rhythm! The lights are green for you. 🚦\"}]"},{"type":"speaking","title":"Speaking: Ask Like a Local","skillLabel":"Speaking","skillIcon":"🎤","mode":"in-class","content":"[{\"sentence\":\"Excuse me, where is the nearest bank?\",\"phonetic\":\"/ɪkˈskjuːz miː, weər ɪz ðə ˈnɪərɪst bæŋk/\",\"tip\":\"Stress 'WHERE' and 'NEAR-est' — and keep 'Excuse me' soft and polite.\",\"feedback\":\"Wonderful! You sound like a friendly local already. 🏦\",\"miniLesson\":\"PRONUNCIATION: 'nearest' = /ˈnɪərɪst/ — the 'ea' sounds like 'ear'. Compare: near → nearest.\",\"keywords\":[\"nearest\",\"Excuse me\"],\"speakingPrompt\":\"Now ask about the nearest café using the same pattern.\"},{\"sentence\":\"Is it far from here?\",\"phonetic\":\"/ɪz ɪt fɑː frəm hɪər/\",\"tip\":\"Make it a question: rise your voice on 'here'. 'Far' rhymes with 'car'.\",\"feedback\":\"Perfect question melody! Your intonation went up at the end. 🎵\",\"miniLesson\":\"QUESTION RHYTHM: yes/no questions rise at the end: 'Is it far from HERE?' — the voice lifts on the last word.\",\"keywords\":[\"far\",\"Is it ... from here?\"],\"speakingPrompt\":\"Ask a friend: \\\"Is the museum far from here?\\\"\"}]"},{"type":"story","title":"Story: The Cat’s Lost Keys","skillLabel":"Reading","skillIcon":"📖","mode":"homework","content":"[{\"paragraphs\":[{\"emoji\":\"🐱\",\"text\":\"Momo the cat woke up early and hungry. He wanted a croissant from the bakery — but his keys were gone!\"},{\"emoji\":\"🔑\",\"text\":\"\\\"Excuse me,\\\" Momo said to the baker, \\\"have you seen my keys? I need to get home.\\\" The baker smiled. \\\"Check the supermarket — I saw you there this morning.\\\"\"},{\"emoji\":\"🛒\",\"text\":\"Momo crossed the street at the zebra crossing and turned left at the bank. The supermarket was on the right, next to the pharmacy.\"},{\"emoji\":\"💊\",\"text\":\"In the supermarket, the manager shook her head. \\\"No keys here. Try the park — you always relax there after shopping.\\\"\"},{\"emoji\":\"🌳\",\"text\":\"Momo went straight ahead, past the museum, and into the park. And there, under the big tree on the left, his keys were shining in the sun!\"},{\"emoji\":\"🥐\",\"text\":\"\\\"Thank you, city!\\\" Momo purred. He bought two croissants from the bakery and walked home — on the right side, of course.\"}],\"feedback\":\"A sweet ending! You read a whole story in English — that is a real milestone. 📚\",\"miniLesson\":\"STORY RECAP: the story recycled 'excuse me', 'turn left at', 'on the right', 'next to', 'go straight ahead', 'cross the street', 'pharmacy', 'bakery', 'supermarket', 'park' — all your city words in one adventure.\",\"keywords\":[\"cross the street\",\"turn left at\",\"on the right\",\"next to\"],\"speakingPrompt\":\"Retell the story in 3 sentences: where did Momo find his keys?\"},{\"question\":\"What did Momo want from the bakery?\",\"options\":[\"A croissant\",\"A key\",\"Medicine\"],\"answer\":\"A croissant\",\"feedback\":\"Exactly — he was hungry for a croissant! 🥐\",\"miniLesson\":\"Remember: the bakery sells bread and cakes — and croissants!\",\"keywords\":[\"croissant\",\"bakery\"],\"speakingPrompt\":\"Say: \\\"The bakery sells fresh bread.\\\"\",\"audioScript\":\"What did Momo want from the bakery?\"},{\"question\":\"Where did Momo find his keys?\",\"options\":[\"Under a tree in the park\",\"At the pharmacy\",\"In the museum\"],\"answer\":\"Under a tree in the park\",\"feedback\":\"Yes! Under the big tree, on the left of the park. 🌳\",\"miniLesson\":\"Position words: 'under' (below), 'on the left' (left side), 'past' (beyond) — small words, big meaning.\",\"keywords\":[\"under\",\"on the left\",\"past\"],\"speakingPrompt\":\"Say: \\\"The keys were under the tree on the left.\\\"\",\"audioScript\":\"Where did Momo find his keys?\"},{\"statement\":\"Momo crossed the street at the zebra crossing.\",\"isTrue\":true,\"feedback\":\"Right! Safety first — always at the zebra crossing. 🚸\",\"miniLesson\":\"Reminder: 'cross the street' + 'at the zebra crossing' — a complete, safe sentence.\",\"keywords\":[\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I cross the street at the zebra crossing.\\\"\",\"audioScript\":\"Momo crossed the street at the zebra crossing.\"}]"},{"type":"html5","title":"Mini-Game: Memory Match","skillLabel":"Game","skillIcon":"🎮","mode":"homework","content":"[{\"html\":\"\u003cstyle>\\n.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}\\n.mcard{min-height:64px;background:#fff;border:2px solid #e5e7eb;border-radius:14px;font-size:26px;transition:all .15s}\\n.mcard.on{background:#fff7ed;border-color:#FF9600}\\n.mcard.ok{background:#f0fdf4;border-color:#58CC02}\\n.mcard span{pointer-events:none}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">🧠 Find all the animal pairs! Tap two cards at a time.\u003c/div>\\n\u003cdiv class=\\\"mg\\\" id=\\\"mg\\\">\u003c/div>\\n\u003cdiv id=\\\"mg-msg\\\" style=\\\"text-align:center;font-weight:900;margin-top:12px;color:#9ca3af\\\">Pairs found: 0 / 6\u003c/div>\\n\u003cscript>\\n(function(){\\n  var em=['🐶','🐱','🐵','🦊','🐻','🐼'], cards=[];\\n  em.forEach(function(e){ cards.push(e,e); });\\n  for(var i=cards.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=cards[i]; cards[i]=cards[j]; cards[j]=t; }\\n  var open=[], lock=false, done=0;\\n  var box=document.getElementById('mg');\\n  box.innerHTML=cards.map(function(c,i){ return '\u003cbutton class=\\\"mcard\\\" data-i=\\\"'+i+'\\\">\u003cspan style=\\\"opacity:0\\\">'+c+'\u003c/span>\u003c/button>'; }).join('');\\n  box.onclick=function(ev){\\n    var b=ev.target.closest('.mcard');\\n    if(!b||lock||b.classList.contains('on')||b.classList.contains('ok')) return;\\n    b.classList.add('on'); open.push(b);\\n    if(open.length===2){\\n      lock=true;\\n      if(open[0].textContent===open[1].textContent){\\n        done++; open.forEach(function(o){ o.classList.add('ok'); });\\n        var msg=document.getElementById('mg-msg');\\n        if(msg){ msg.textContent=done===6?'🎉 You found all 6 pairs! Perfect memory!':'Pairs found: '+done+' / 6'; }\\n        open=[]; lock=false;\\n      } else {\\n        setTimeout(function(){ open.forEach(function(o){ o.classList.remove('on'); }); open=[]; lock=false; }, 700);\\n      }\\n    }\\n  };\\n})();\\n\u003c/script>\",\"feedback\":\"Amazing memory! You matched every pair like a champion. 🧠\"}]"}]},{"title":"🏆 Mastery Review","colour":"#A855F7","xpReward":200,"slides":[{"heading":"The Mastery Gauntlet","body":"One final arena to prove you can handle the whole city: places, directions, listening, and speaking — all together. 🏆","example":"You know more English than you think!","colour":"#A855F7"},{"heading":"Your Weak Spots","body":"The game remembers your mistakes. Turn them into wins and walk out stronger!","example":"Open ⚙️ Settings → Self-Study Mode to redo only your incorrect answers.","colour":"#A855F7"},{"heading":"Final Boss","body":"Complete every review round to earn the Mastery crown. The cat is counting on you! 🐱👑","example":"","colour":"#A855F7"}],"activities":[{"type":"multiple_choice","title":"Weak-Spot Review: Tricky Choices","skillLabel":"Review","skillIcon":"🧠","mode":"homework","content":"[{\"question\":\"You have a headache. Where do you go?\",\"options\":[\"Pharmacy\",\"Supermarket\",\"Café\"],\"answer\":\"Pharmacy\",\"feedback\":\"Medicine comes from the pharmacy — not the supermarket. 💊\",\"miniLesson\":\"Pain = pharmacy: for a **headache** you buy medicine, and medicine lives at the **pharmacy**. The supermarket sells food, the café sells coffee — read the symptom first.\",\"keywords\":[\"pharmacy\",\"medicine\"],\"context\":\"Your head hurts after the long walk.\",\"contextTitle\":\"Story\",\"audioScript\":\"You have a headache. Where do you go?\"},{\"question\":\"The museum is ___ the left, next to the train station.\",\"options\":[\"on\",\"at\",\"in\"],\"answer\":\"on\",\"feedback\":\"Correct! It's always 'on the left' or 'on the right'. 👈\",\"miniLesson\":\"RULE: 'on the left/right' are fixed phrases — we say ON, never AT or IN. Think of the page: the picture is ON the left side.\",\"keywords\":[\"on the left\",\"on the right\"],\"speakingPrompt\":\"Say out loud: \\\"The museum is on the left, next to the train station.\\\"\",\"audioScript\":\"The museum is on the left, next to the train station.\"},{\"question\":\"Excuse me, ___ can I buy a bus ticket?\",\"options\":[\"where\",\"what\",\"who\"],\"answer\":\"where\",\"feedback\":\"'Where' asks for a place — the ticket office. 🎫\",\"miniLesson\":\"Same rule, new sentence: **where** + can + I + verb — *where can I buy a bus ticket?* You buy things AT a place, so the question is where.\",\"keywords\":[\"where can I\"],\"audioScript\":\"Excuse me, where can I buy a bus ticket?\"},{\"question\":\"Lily's first stop was the bakery. What did she buy there?\",\"options\":[\"Fresh bread\",\"Medicine\",\"A book\"],\"answer\":\"Fresh bread\",\"feedback\":\"The bakery sells fresh bread — that was her first stop. 🥖\",\"miniLesson\":\"Story detail: the order was **bakery → supermarket → pharmacy → park**, and the bakery is famous for *fresh bread* — medicine and books live in other shops.\",\"keywords\":[\"bakery\",\"fresh bread\"],\"context\":\"Lily's day: bakery → supermarket → pharmacy → park.\",\"contextTitle\":\"Story\",\"audioScript\":\"Lily's first stop was the bakery. What did she buy there?\"}]"},{"type":"matching","title":"Boss Round: The Whole City","skillLabel":"Vocabulary","skillIcon":"🗺️","mode":"in-class","content":"[{\"word\":\"bakery\",\"definition\":\"a shop that sells bread and cakes\"},{\"word\":\"bookshop\",\"definition\":\"a shop that sells books\"},{\"word\":\"pharmacy\",\"definition\":\"a shop where you buy medicine\"},{\"word\":\"café\",\"definition\":\"a small restaurant for coffee and snacks\"},{\"word\":\"museum\",\"definition\":\"a building where you see art and history\"},{\"word\":\"hospital\",\"definition\":\"a place where doctors help sick people\"},{\"word\":\"train station\",\"definition\":\"a place where trains arrive and leave\"},{\"word\":\"park\",\"definition\":\"a green place to relax outside\"}]"},{"type":"scramble","title":"Boss Sentences","skillLabel":"Writing","skillIcon":"✍️","mode":"in-class","content":"[{\"chunks\":[\"Excuse\",\"me,\",\"where\",\"is\",\"the\",\"nearest\",\"pharmacy?\"],\"answer\":\"Excuse me, where is the nearest pharmacy?\",\"feedback\":\"Perfect polite question! The nearest pharmacy is just around the corner. 💊\",\"miniLesson\":\"POLITE QUESTION FORMULA: 'Excuse me' (attention) + 'where is' (question) + 'the nearest' (superlative) + place. Order matters!\",\"keywords\":[\"Excuse me\",\"where is\",\"nearest\"],\"speakingPrompt\":\"Ask out loud for the nearest bookshop using the same formula.\"},{\"chunks\":[\"Cross\",\"the\",\"street\",\"at\",\"the\",\"zebra\",\"crossing.\"],\"answer\":\"Cross the street at the zebra crossing.\",\"feedback\":\"Always cross at the zebra crossing — the safe spot. 🚸\",\"miniLesson\":\"Safety rule: **cross + the street + at + the zebra crossing** — the crossing is the *safe* place with white stripes. Verb first: Cross the street.\",\"keywords\":[\"zebra crossing\",\"cross the street\"]}]"},{"type":"dictation","title":"Final Listening Boss","skillLabel":"Listening","skillIcon":"👂","mode":"homework","content":"[{\"audioScript\":\"Turn left at the museum and go straight to the park.\",\"answer\":\"Turn left at the museum and go straight to the park.\",\"feedback\":\"The route: turn left at the museum, then go straight to the park. 🗺️\",\"miniLesson\":\"Chained directions: **turn left AT a place**, then **go straight TO a place** — at marks the turning point, to marks the destination.\",\"keywords\":[\"turn left at\",\"go straight to\"]},{\"audioScript\":\"The best café in town is next to the bookshop.\",\"answer\":\"The best café in town is next to the bookshop.\",\"feedback\":\"'Next to' — the café is beside the bookshop. ☕\",\"miniLesson\":\"Position word: **next to** means *beside* — the best café in town is next to the bookshop. Hear the superlative too: *the best* = number one.\",\"keywords\":[\"next to\",\"the best\"]}]"},{"type":"radio","title":"DuoRadio: The Lost Tourist","skillLabel":"Listening","skillIcon":"📻","mode":"in-class","content":"[{\"lines\":[{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"Welcome back to DuoRadio! I am Maya, and today we follow Leo the tourist.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Excuse me! Excuse me! I need help. Where is the train station?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"Leo, you need a map. Look — go straight ahead, then turn left at the bank.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Turn left at the bank... got it! And what about the museum?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"The museum is on the right, next to the park. You cannot miss it.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Is it far from here? My feet are tired!\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"No, it is around the corner! Cross the street at the zebra crossing and you are there.\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"Perfect! Thank you so much. And where can I buy a coffee?\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"The best café in town is next to the bookshop — they sell croissants too!\"},{\"character\":\"Leo\",\"emoji\":\"🐻\",\"voiceHint\":\"male\",\"text\":\"A croissant after the museum... now that is a plan. See you, Maya!\"},{\"character\":\"Maya\",\"emoji\":\"🦊\",\"voiceHint\":\"female\",\"text\":\"See you, Leo! And remember: always cross at the zebra crossing. Stay safe!\"}],\"feedback\":\"You listened to the whole episode — and every word was your city vocabulary. 📻\",\"miniLesson\":\"EPISODE RECAP: 'go straight ahead', 'turn left at the bank', 'on the right, next to the park', 'around the corner', 'cross the street at the zebra crossing' — the full direction toolkit in one conversation.\",\"keywords\":[\"go straight\",\"turn left at\",\"around the corner\",\"next to\"],\"speakingPrompt\":\"Act out the episode: be Leo and ask Maya for directions to the café.\"},{\"question\":\"What does Leo want to find first?\",\"options\":[\"The train station\",\"The museum\",\"A café\"],\"answer\":\"The train station\",\"feedback\":\"Right! First stop: the train station. 🚉\",\"miniLesson\":\"Question focus: 'Where is...?' — Leo’s first words were 'Excuse me! Where is the train station?'\",\"keywords\":[\"train station\"],\"speakingPrompt\":\"Say: \\\"Excuse me, where is the train station?\\\"\",\"audioScript\":\"What does Leo want to find first?\"},{\"question\":\"Where is the museum?\",\"options\":[\"On the right, next to the park\",\"Turn left at the bank\",\"Next to the bookshop\"],\"answer\":\"On the right, next to the park\",\"feedback\":\"Exactly — on the right, next to the park. 🖼️\",\"miniLesson\":\"Position chain: 'on the right' (side) + 'next to the park' (neighbor) — one sentence, two clues.\",\"keywords\":[\"on the right\",\"next to\"],\"speakingPrompt\":\"Say: \\\"The museum is on the right, next to the park.\\\"\",\"audioScript\":\"Where is the museum?\"},{\"question\":\"What does Maya say about crossing the street?\",\"options\":[\"Always cross at the zebra crossing\",\"Never cross the street\",\"Cross anywhere you like\"],\"answer\":\"Always cross at the zebra crossing\",\"feedback\":\"Safe and correct — the zebra crossing is the safe spot! 🚸\",\"miniLesson\":\"Safety language: 'always' + imperative: 'Always cross at the zebra crossing.'\",\"keywords\":[\"always\",\"zebra crossing\"],\"speakingPrompt\":\"Say: \\\"I always cross at the zebra crossing.\\\"\",\"audioScript\":\"What does Maya say about crossing the street?\"}]"},{"type":"html5","title":"Boss Arena: Quiz Showdown","skillLabel":"Game","skillIcon":"⚔️","mode":"in-class","content":"[{\"html\":\"\u003cstyle>\\n.qz{margin-top:10px}\\n.qz-q{font-weight:900;color:#374151;margin-bottom:10px}\\n.qz-opt{display:block;width:100%;text-align:left;padding:12px;border:2px solid #e5e7eb;border-radius:12px;background:#fff;font-weight:700;font-size:14px;color:#374151;margin-bottom:8px;cursor:pointer}\\n.qz-opt.ok{background:#f0fdf4;border-color:#58CC02;color:#166534}\\n.qz-opt.bad{background:#fef2f2;border-color:#f87171;color:#b91c1c}\\n.qz-opt:disabled{opacity:.75;cursor:default}\\n.qz-score{font-weight:900;color:#6b7280;margin:10px 0}\\n.qz-done{background:#fffbeb;border:2px solid #fde68a;border-radius:14px;padding:12px;text-align:center;font-weight:900;color:#a16207;margin-top:10px}\\n\u003c/style>\\n\u003cdiv style=\\\"font-weight:900;color:#374151\\\">⚔️ Five questions. No mercy. Answer them all!\u003c/div>\\n\u003cdiv class=\\\"qz\\\" id=\\\"qz\\\">\u003c/div>\\n\u003cdiv class=\\\"qz-score\\\" id=\\\"qz-score\\\">Score: 0 / 5\u003c/div>\\n\u003cscript>\\n(function(){\\n  var QS=[\\n    {q:\\\"1. Which word means to travel to work or school?\\\",o:[\\\"commute\\\",\\\"sleep\\\",\\\"eat\\\"],a:0},\\n    {q:\\\"2. Choose the polite question:\\\",o:[\\\"Where museum?\\\",\\\"Excuse me, where is the museum?\\\",\\\"Museum where?\\\"],a:1},\\n    {q:\\\"3. She ___ up at 6 AM every day.\\\",o:[\\\"wake\\\",\\\"wakes\\\",\\\"waking\\\"],a:1},\\n    {q:\\\"4. On the left means:\\\",o:[\\\"your left side\\\",\\\"your right side\\\",\\\"straight ahead\\\"],a:0},\\n    {q:\\\"5. The train station is ___ the right.\\\",o:[\\\"at\\\",\\\"in\\\",\\\"on\\\"],a:2}\\n  ];\\n  var qz=document.getElementById('qz'), sc=document.getElementById('qz-score'), qi=0, score=0, locked=false;\\n  function render(){\\n    if(qi>=QS.length){ qz.innerHTML='\u003cdiv class=\\\"qz-done\\\">'+(score===QS.length?'👑 PERFECT! You aced the Boss Arena!':'🎉 Boss defeated! Score: '+score+'/'+QS.length)+'\u003c/div>'; sc.textContent='Final score: '+score+' / '+QS.length; return; }\\n    var it=QS[qi];\\n    var html='\u003cdiv class=\\\"qz-q\\\">'+it.q+'\u003c/div>';\\n    it.o.forEach(function(o,i){ html+='\u003cbutton class=\\\"qz-opt\\\" data-i=\\\"'+i+'\\\">'+String.fromCharCode(65+i)+'. '+o+'\u003c/button>'; });\\n    qz.innerHTML=html;\\n  }\\n  qz.onclick=function(ev){\\n    if(locked) return;\\n    var b=ev.target.closest('.qz-opt'); if(!b) return;\\n    var i=+b.getAttribute('data-i'), it=QS[qi];\\n    locked=true;\\n    if(i===it.a){ score++; b.classList.add('ok'); }\\n    else { b.classList.add('bad'); qz.querySelectorAll('.qz-opt')[it.a].classList.add('ok'); }\\n    sc.textContent='Score: '+score+' / '+QS.length;\\n    setTimeout(function(){ qi++; locked=false; render(); }, 900);\\n  };\\n  render();\\n})();\\n\u003c/script>\",\"feedback\":\"Boss defeated! You cleared the whole city challenge. 👑\"}]"}],"test":{"tasks":[{"type":"fill_blanks","items":["The {{bak:bakery}} sells fresh bread.","Where is the {{mus:museum}}?","Turn {{lef:left}} at the bank.","The park is {{on:on}} the right."]},{"type":"listen_type","audio":"The museum is on the left, next to the park.","answer":"The museum is on the left, next to the park."},{"type":"read_complete","passage":"Welcome to Greenfield! The {{bak:bakery}} on Main Street sells fresh bread every morning. If you need medicine, the {{pha:pharmacy}} is {{ac:across}} the street. The {{mus:museum}} is my favorite place — it is {{ne:next}} to the park, so you can read under a tree after your visit."},{"type":"interactive_reading","passage":"Lily loves her neighborhood. Every morning she buys fresh bread at the bakery on Main Street. The bakery is next to a small café where her brother works. After breakfast, she walks past the museum and reads in the park. The park is on the left, across from the train station.","steps":[{"kind":"highlight","prompt":"Click the sentence that tells where Lily buys bread.","answer":"Every morning she buys fresh bread at the bakery on Main Street."},{"kind":"title","prompt":"Choose the best title.","options":["Lily’s Morning Walk","A Day at the Museum","The Train Station"],"answer":"Lily’s Morning Walk"},{"kind":"complete","prompt":"The café is next to ___.","options":["the bakery","the train station","the park"],"answer":"the bakery"},{"kind":"complete","prompt":"The park is ___ the train station.","options":["across from","inside","behind"],"answer":"across from"}]},{"type":"interactive_listening","lines":[{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Leo! You look lost. Do you need help?"},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Yes! Where is the pharmacy? I need medicine for my headache."},{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Go straight ahead. The pharmacy is across the street from the bakery."},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Across from the bakery — and then?"},{"character":"Maya","emoji":"🦊","voiceHint":"female","text":"Then turn left at the museum. It is the building with the red door!"},{"character":"Leo","emoji":"🐻","voiceHint":"male","text":"Thank you, Maya. You are a great city guide!"}],"questions":[{"question":"What does Leo need?","options":["Medicine","Bread","A book"],"answer":"Medicine"},{"question":"Where is the pharmacy?","options":["Across from the bakery","Next to the museum","In the park"],"answer":"Across from the bakery"},{"question":"What color is the museum door?","options":["Red","Blue","Green"],"answer":"Red"}],"summary":"Leo needs {{med:medicine}}. The pharmacy is across from the {{bak:bakery}}, and he must turn {{lef:left}} at the {{mus:museum}}."},{"type":"speak_photo","image":"https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=800","alt":"A busy city corner","prompt":"Describe this city photo aloud for 30–90 seconds. What places and people do you see?","sample":"In this photo I can see a busy city corner. There are shops on the right, and many people cross the street at the crossing. I think there is a café on the corner because people are drinking coffee outside."},{"type":"interactive_writing","prompt":"A new student is coming to your town. Write directions from the train station to your favorite place (40+ words).","minWords":40,"followUp":"Now warn the new student about one thing to avoid in your town. Write 2-3 sentences.","sample":"Welcome! From the train station, go straight ahead for two minutes. Turn left at the bank — there is only one bank. My favorite place is the museum: it is on the right, next to the park. You cannot miss it!"},{"type":"read_speak","prompt":"Describe the neighborhood where you live. Where is the nearest bakery, café or park? Speak for 30–90 seconds.","sample":"I live near a small park. The nearest bakery is around the corner — it is on the left, next to a bookshop. There is also a café across the street from the park. I go there every morning."},{"type":"interactive_speaking","turns":[{"character":"Maya","emoji":"🦊","text":"Hi! Where do you live — describe your street!"},{"character":"Leo","emoji":"🐻","text":"What is the most important place in your neighborhood, and where is it?"},{"character":"Maya","emoji":"🦊","text":"How do I get from the train station to your home? Give me directions!"},{"character":"Leo","emoji":"🐻","text":"Last one: what can someone buy around the corner from you?"}],"sample":"I live on a quiet street. There is a bakery on the corner and a pharmacy across the street. To get to my home: go straight, turn right at the museum, and it is on your left. Around the corner you can buy fresh bread and coffee."},{"type":"speaking_sample","topic":"Speak for 1–3 minutes: \"A perfect day in my town.\" Where do you go, what do you do, and who do you meet?","sample":"A perfect day in my town starts at the bakery — I buy fresh bread. Then I walk to the park and read under a tree. In the afternoon, I visit the museum with a friend. We finish the day at the café next to the bookshop."}]}}]}</script>

  var BADGES = [

  // ── persistence ──
  function save(){ try{ localStorage.setItem('linguacat-v2', JSON.stringify({xp:S.xp,totalXp:S.totalXp,hearts:S.hearts,gems:S.gems,streak:S.streak,completed:S.completed,incorrect:S.incorrect,tts:S.tts,sfxOn:S.sfxOn,voice:S.voice,pitch:S.pitch,rate:S.rate,badges:earnedBadges,unlocked:unlocked,equipped:equipped,league:S.league,seasonProg:S.seasonProg,initialSkills:S._initialSkills||null,detLog:S.detLog||[],detLastPct:S._detLastPct||0})); }catch(e){} }
  function load(){
    try{
      var raw = localStorage.getItem('linguacat-v2'); if(!raw) return;
      var d = JSON.parse(raw);
      S.xp=d.xp||0; S.totalXp=d.totalXp||0; S.hearts=d.hearts||5; S.gems=d.gems||0; S.streak=d.streak||0;
      S.completed=d.completed||[]; S.incorrect=d.incorrect||[];
      S.tts=d.tts!==false; S.sfxOn=d.sfxOn!==false; S.voice=d.voice||''; S.pitch=d.pitch||1; S.rate=d.rate||1;
      S.league=d.league||'Bronze'; S.seasonProg=d.seasonProg||0;
      if(d.detLog) S.detLog=d.detLog; if(d.detLastPct) S._detLastPct=d.detLastPct;
      if(d.initialSkills) S._initialSkills=d.initialSkills;
      if(d.badges) earnedBadges = d.badges; if(d.unlocked) unlocked = d.unlocked; if(d.equipped) equipped = d.equipped;
    }catch(e){}
  }

  // ── helpers ──
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  /* remove every emoji/pictograph so TTS never speaks "smiling face" — display text keeps them */
  function stripEmoji(s){
    var r = String(s==null?'':s);
    try{
      r = r
        .replace(/[🀀-🫿]/gu,'')
        .replace(/[🇦-🇿]/gu,'')
        .replace(/[☀-➿]/gu,'')
        .replace(/[⬀-⯿]/gu,'')
        .replace(/[︀-️]/gu,'')
        .replace(/[✀-➿]/gu,'')
        .replace(/[←-⇿]/gu,'');
    }catch(e){ r = r.replace(/[�-�]/g,''); }
    /* strip markdown markers (**bold**, *em*, and backtick code) so TTS never reads them */
    r = r.replace(/[*]{1,2}/g,'').split(String.fromCharCode(96)).join('');
    return r.replace(/\s+/g,' ').trim();
  }
  function norm(s){ return String(s||'').toLowerCase().replace(/[.,!?;:'"\-]/g,'').replace(/\s+/g,' ').trim(); }
  function shuffle(a){ var b=a.slice(); for(var i=b.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=b[i];b[i]=b[j];b[j]=t; } return b; }
  function section(){ return sections[S.section] || {title:'',colour:'#58CC02',xpReward:100,activities:[]}; }
  function activities(){ return section().activities || []; }
  function activity(){ return activities()[S.activity] || {type:'',title:'',parsedContent:[]}; }
  function parseItems(act){ try{ var inner = JSON.parse(act.content || '[]'); return Array.isArray(inner)?inner:(inner.items||inner.pairs||[]); }catch(e){ return []; } }
  function isWholeSet(){ var t=activity().type; return t==='matching' || t==='audio_matching'; }
  function items(){ return activity()._items || (activity()._items = parseItems(activity())); }
  function effectiveItems(){ if(!S.selfStudy) return items(); return items().filter(function(_,i){ return S.incorrect.indexOf(S.section+'-'+S.activity+'-'+i)>=0; }); }
  function item(){ return effectiveItems()[S.q]; }
  /* ── VOICE ENGINE ── the learner-profile voice (Step 2 · Lesson Structure) is the LAW.
     Microsoft David / Zira / robotic SAPI defaults are NEVER used: if the profile voice is
     missing we fall back through Azure Natural multilingual voices (Ava/Andrew/Emma/Brian,
     Aria/Jenny/Guy/Ana…) and only then to any Natural/Online/premium engine voice. */
  var TUTOR_VOICE = DATA.tutorVoice || DATA.readAloudVoice || '';
  var COACH_VOICE2 = DATA.coachVoiceURI || '';
  var L1 = DATA.l1 || '';
  function pickVoice(name){
    try{
      var vs = speechSynthesis.getVoices() || [];
      for(var i=0;i<vs.length;i++){ if(vs[i].name===name || vs[i].voiceURI===name) return vs[i]; }
    }catch(e){}
    return null;
  }
  var ROBOT_PAT = /david|zira|mark\b|hazel|george|susan|fred|ralph|junior|kathy|alsa|espeak|sapi/i;
  function isNatural(v){ return !!v && /natural|neural|online|premium|enhanced/i.test(v.name) && !ROBOT_PAT.test(v.name); }
  function resolveBase(){
    if(TUTOR_VOICE){
      var tv = pickVoice(TUTOR_VOICE);
      /* never allow a robotic voice even if saved in the profile */
      if(tv && !ROBOT_PAT.test(tv.name)) return tv;
      if(tv){ try{ console && console.warn && console.warn('[LAV2] Profile voice "'+tv.name+'" is robotic — using a natural voice instead.'); }catch(e){} }
    }
    try{
      var vs = speechSynthesis.getVoices() || [];
      var order = [/avas*multilingual/i,/andrews*multilingual/i,/emmas*multilingual/i,/brians*multilingual/i,/ava/i,/aria/i,/jenny/i,/ana/i,/emma/i,/guy/i,/sonia/i,/libby/i,/michelle/i,/natural.*english/i,/google us english/i,/google uk english/i,/samantha/i];
      for(var p=0;p<order.length;p++){
        for(var i=0;i<vs.length;i++){ if(order[p].test(vs[i].name) && !ROBOT_PAT.test(vs[i].name)) return vs[i]; }
      }
      for(i=0;i<vs.length;i++){ if(isNatural(vs[i]) && /^en/i.test(vs[i].lang||'')) return vs[i]; }
      for(i=0;i<vs.length;i++){ if(/^en/i.test(vs[i].lang||'') && !ROBOT_PAT.test(vs[i].name)) return vs[i]; }
    }catch(e){}
    return null;
  }
  var ALT_FEMALE_PATS = [/ava/i,/jenny/i,/aria/i,/emma/i,/ana/i,/michelle/i,/libby/i,/sonia/i,/natural/i];
  var ALT_MALE_PATS = [/andrew/i,/guy/i,/christopher/i,/eric/i,/brian/i,/james/i,/natural/i];
  function findVoice(pats, excludeURI){
    try{
      var vs = speechSynthesis.getVoices() || [];
      for(var p=0;p<pats.length;p++){
        for(var i=0;i<vs.length;i++){
          if(excludeURI && vs[i].voiceURI===excludeURI) continue;
          if(pats[p].test(vs[i].name) && !ROBOT_PAT.test(vs[i].name) && /^en/i.test(vs[i].lang||'')) return vs[i];
        }
      }
    }catch(e){}
    return null;
  }
  function altVoice(excludeURI, wantMale){
    var v = findVoice(wantMale?ALT_MALE_PATS:ALT_FEMALE_PATS, excludeURI);
    if(!v) v = findVoice(wantMale?ALT_FEMALE_PATS:ALT_MALE_PATS, excludeURI);
    if(!v) v = findVoice([/natural/i,/online/i,/english/i], excludeURI);
    return v;
  }
  function coachVoice(second){
    var base = resolveBase();
    if(second && COACH_VOICE2){ var cv = pickVoice(COACH_VOICE2); if(cv) return cv; }
    var alt = altVoice(base?base.voiceURI:'', !!second);
    if(alt && isNatural(alt)) return alt;
    return base;
  }
  /* THE /s/ BUG: Chrome's speech bridge clips the FIRST phoneme of an utterance
     ("shop" → "op", "street" → "treet") whenever speak() fires while the engine is
     still winding down from a cancel(). A fixed short delay is not enough — instead
     we cancel and then WAIT until the engine reports fully idle (speaking AND pending
     both false) before building the next utterance, with a safety timeout. This keeps
     every leading consonant — especially /s/ — intact. */
  function idleSpeak(build){
    try{
      if(!speechSynthesis.speaking && !speechSynthesis.pending){ build(); return; }
      try{ speechSynthesis.cancel(); }catch(e){}
      var waited = 0;
      var tryIt = function(){
        try{
          if(!speechSynthesis.speaking && !speechSynthesis.pending){ build(); return; }

      if(S.fb) fb = fbPanelHTML(S.fb);

  /* html5 / rich_html — the AI authors a RAW HTML5 fragment (its own inline

  function isAnswered(){

    /* ── rich feedback: ONE flowing self-study mini-lesson chunk ──
     No titled boxes, no raw HTML/code in the copy: the whole feedback is a single
     block of 2nd-person prose that explains the vocabulary, grammar, ideas, culture
     and content — with important info color-coded INLINE: **double stars** = key
     point (green), *single stars* = nuance (blue), and code-ticks = term chip
     (purple, built via RegExp at runtime so it survives this template). Keywords
     and the speaking prompt are woven into the same chunk. */
  function fmtLesson(txt){
    if(!txt) return '';
    var s = String(txt)
      .replace(/<[^>]*>/g, '')            // never render AI HTML/code like </b> — strip tags
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    var BT = String.fromCharCode(96);     // backtick, built at runtime (safe inside template)
    s = s
      .replace(/\*\*([^*]+)\*\*/g, '<span class="fb-hl">$1</span>')
      .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<span class="fb-em">$2</span>')
      .replace(new RegExp(BT+'([^'+BT+']+)'+BT,'g'), '<span class="fb-chip">$1</span>');
    return s.split(/\n{2,}/).map(function(p){ return '<p>'+p.replace(/\n/g,'<br>')+'</p>'; }).join('');
  }
  /* CCQ speaking questions that recycle the mini-lesson: easy, step-by-step,
     2nd person, each one ASKED and ANSWERED (the model speaks the answer), so the
     learner solidifies the mini lesson by speaking. */
  function buildCCQs(it){
    var qs = [];
    var correct = String(it.answer||it.word||(it.isTrue!=null?(it.isTrue?'TRUE':'FALSE'):(it.blanks&&it.blanks.length?it.blanks.join(', '):''))||'');
    /* prefer AI-authored CCQs when provided */
    if(Array.isArray(it.ccq) && it.ccq.length){
      return it.ccq.slice(0,3).map(function(q){ return {q:String(q), a:correct||'Think about the mini lesson you just read — say your answer out loud.'}; });
    }
    var kws = (it.keywords||[]).filter(function(k){ return k && String(k).trim(); }).slice(0,3);
    var mini = String(it.miniLesson||it.tip||'').trim();
    var fullSent = '';
    if(it.sentence && it.blanks && it.blanks.length){
      var bi = 0;
      fullSent = String(it.sentence).replace(/_{3,}/g, function(){ return String(it.blanks[bi++]); });
    }
    if(it.isTrue!=null){
      qs.push({q:'Say it out loud: was the statement TRUE or FALSE? Use a full sentence — "It was true" or "It was false".', a:'It was '+correct+'.'});
    } else if(fullSent){
      qs.push({q:'Say the full sentence out loud twice: "'+fullSent+'" — then say it one more time without looking.', a:fullSent});
    } else if(correct){
      qs.push({q:'Say it like the model, twice: "'+correct+'" — then say it one more time in your own rhythm.', a:correct});
    }
    if(kws.length){
      qs.push({q:'Quick check: what does "'+kws[0]+'" mean? Answer in one short sentence out loud, then compare with the model.', a:(mini?mini:'"'+kws[0]+'" is the key word from this question — use it in a sentence of your own.')});
      if(kws[1]) qs.push({q:'Your turn: say a TRUE sentence about your own life using "'+kws[1]+'". Start with I or My.', a:'For example: "My ... '+kws[1]+' ..." — now say your own version out loud.'});
    }
    var spk = it.speakingPrompt;
    if(spk) qs.push({q:spk, a:correct});
    return qs.slice(0,3);
  }
  function buildRichFb(ok, it, extraHead){
    var head = ok ? '🎉 Correct! Nice work!' : '❌ Not quite — let\'s fix it together!';
    if(extraHead) head = extraHead;
    var parts = [];
    var correct = String(it.answer||it.word||(it.isTrue!=null?(it.isTrue?'TRUE':'FALSE'):(it.blanks&&it.blanks.length?it.blanks.join(', '):''))||'');
    var mini = String(it.miniLesson||it.context||it.tip||'').trim();
    if(ok) parts.push('<p>You got this one right on target. '+fmtLesson(it.feedback)+'</p>');
    else {
      /* never show praise copy on a wrong answer — go straight to the fix */
      if(mini) parts.push('<p>'+fmtLesson(mini)+'</p>');
      else if(it.feedback) parts.push('<p>'+fmtLesson(it.feedback)+'</p>');
      if(correct) parts.push('<p>The correct answer is <span class="fb-ans">'+esc(correct)+'</span> — take a second to compare it with what you chose.</p>');
    }
    if(ok && mini) parts.push(fmtLesson(mini));
    else if(ok) parts.push('<p>You\'ve got the hang of this one. Keep using it in real conversations — repetition makes it stick!</p>');
    if(it.keywords && it.keywords.length){
      parts.push('<p style="line-height:2.2">'+it.keywords.map(function(k){ return '<span class="kw-chip">'+esc(k)+'</span>'; }).join(' ')+'</p>');
    }
    var ccq = buildCCQs(it);
    if(ccq.length){
      parts.push('<div class="ccq-box"><div class="ccq-head">🗣️ Quick check — say each answer out loud, then tap 🔊 to hear the model.</div>'+
        ccq.map(function(q, i){
          return '<div class="ccq-row"><span class="ccq-n">'+(i+1)+'</span><span class="ccq-q">'+esc(q.q)+'</span>'+
            '<button class="ccq-spk" data-act="spk" data-t="'+esc('Question '+(i+1)+': '+q.q+' Model answer: '+q.a)+'" title="Hear the model">🔊</button></div>';
        }).join('')+'</div>');
    }
    return {ok:ok, q:S.q, head:head, body:parts.join('')};
  }

  /* ── powerups bar ── */

    var any = defs.some(function(d){ return (S.powerups[d[0]]||0)>0 || (d[0]==='x2'&&S.x2Left>0) || (d[0]==='freeze'&&S.freeze>0); });

  function ctxHTML(it){ return it.context ? '<div class="ctx"><b>📖 '+(it.contextTitle||'Context')+'</b><br>'+esc(it.context)+'</div>' : ''; }

  var scramState = {};

    var arr = st.arr.length ? st.arr.map(function(c,i){ return '<button class="chunk-block" data-act="scram-pop" data-i="'+i+'">'+esc(c)+'</button>'; }).join('') : '<span class="scram-ndata">Tap chunks below to build the sentence...</span>';
    var avail = st.avail.length ? st.avail.map(function(c,i){ return '<button class="chunk-avail" data-act="scram-push" data-i="'+i+'">'+esc(c)+'</button>'; }).join('') : '<span class="scram-ndata">All used!</span>';

  function dictHL(typed, correct){
    var tw = norm(typed).split(' '), cw = norm(correct).split(' '), cWords = String(correct).split(' ');

  var matchState = null;
  function matchHTML(audio){
    var it = items();
    if(!matchState || matchState.audio!==audio || matchState.key!==S.section+'-'+S.activity){
      matchState = { audio:audio, key:S.section+'-'+S.activity, sel:null, matched:{}, wrong:null, right: shuffle(it) };
    }
    var st = matchState;
    if(audio){
      /* LISTEN-ONLY MODE: NO word on the left — big speaker buttons that PLAY the audio.
         Tap a speaker (it plays, no text shown), then match the definition you heard. */
      var left = it.map(function(x,i){
        var done = st.matched[i]!=null;
        var cls = 'mitem speaker-btn'+(done?' done':(st.sel===i?' sel':''));
        return '<button class="'+cls+'" data-act="msel" data-i="'+i+'" title="Tap to listen">'+
          '<span style="font-size:26px">'+(done?'✅':'🔊')+'</span><span style="font-weight:900;font-size:13px">'+(done?'Heard':('Voice '+(i+1)))+'</span></button>';
      }).join('');
      var right = st.right.map(function(x,i){
        var done = Object.keys(st.matched).some(function(k){ return st.matched[k]===i; });
        var cls = 'mitem'+(done?' done':(st.wrong&&st.wrong[1]===i?' wrong':''));
        return '<button class="'+cls+'" data-act="mright" data-i="'+i+'">'+esc(x.definition||'')+'</button>';
      }).join('');
      var allDone = Object.keys(st.matched).length === it.length;
      return '<p class="dict-note">🎧 Tap a voice button to LISTEN — no words shown! Then tap the definition you heard. Tap again to replay.</p>'+
        '<div class="match-grid"><div class="mcol">'+left+'</div><div class="mcol">'+right+'</div></div>'+
        (st.fb?'<div class="fb '+(st.fbOk?'fb-ok':'fb-bad')+'" style="margin-top:10px">'+(st.fbOk?'<b>✅ Matched!</b><br>':'')+esc(st.fb)+'</div>':'')+
        (allDone?'<div class="fb fb-ok" style="margin-top:10px;text-align:center"><b>🎊 All matched! Brilliant listening!</b></div>':'');
    }
    var left2 = it.map(function(x,i){
      var done = st.matched[i]!=null;
      var cls = 'mitem'+(done?' done':(st.sel===i?' sel':''));
      var l1n = x.l1 ? '<span class="l1-chip">'+esc(x.l1)+'</span>' : '';
      return '<button class="'+cls+'" data-act="msel" data-i="'+i+'">'+(done?'✅ ':'')+esc(x.word)+l1n+'</button>';
    }).join('');
    var right2 = st.right.map(function(x,i){
      var done = Object.keys(st.matched).some(function(k){ return st.matched[k]===i; });
      var cls = 'mitem'+(done?' done':(st.wrong&&st.wrong[1]===i?' wrong':''));
      var l1d = x.l1 ? '<span class="l1-chip">'+esc(x.l1)+'</span>' : '';
      return '<button class="'+cls+'" data-act="mright" data-i="'+i+'">'+esc(x.definition||'')+l1d+'</button>';
    }).join('');
    var allDone2 = Object.keys(st.matched).length === it.length;
    return '<p class="dict-note">Tap a word on the left, then its definition on the right</p>'+
      '<div class="match-grid"><div class="mcol">'+left2+'</div><div class="mcol">'+right2+'</div></div>'+
      (st.fb?'<div class="fb '+(st.fbOk?'fb-ok':'fb-bad')+'" style="margin-top:10px">'+(st.fbOk?'<b>✅ Matched!</b><br>':'')+esc(st.fb)+'</div>':'')+
      (allDone2?'<div class="fb fb-ok" style="margin-top:10px;text-align:center"><b>🎊 All matched! Brilliant work!</b></div>':'');
  }

  // ── wiring ──
  function wireAct(){
    var root = $('act-slot');
    if(!root || root.__wired) return;
    root.__wired = true;
    root.addEventListener('click', function(ev){
      var b = ev.target.closest('[data-act]'); if(!b) return;
      var act = b.getAttribute('data-act'), i = +b.getAttribute('data-i');
      if(act==='next') { advanceActivity(); return; }
      if(act==='aplay' || act==='dplay' || act==='dslow' || act==='pplay'){
        var it = item();
        if(act==='aplay') speak(it.audioScript, S.rate*0.9);
        else if(act==='dplay'){ S._dictPlayed=S.q; speak(it.audioScript, S.rate*0.85); save(); render(); }
        else if(act==='dslow'){ speak(it.audioScript, S.rate*0.6); }
        else speak(it.sentence, S.rate*0.85);
        return;
      }
      if(act==='nextq'){ advanceQ(); return; }
      if(act==='hnext'){
        var hIt=item();
        /* HTML5 widgets can report their own result: __lav2Html5Ok = true/false
           (or window.__lav2Html5(ok)). Undefined = exploratory widget (flip cards,
           mini-games) which still counts as done. */
        var wOk = window.__lav2Html5Ok;
        window.__lav2Html5Ok = undefined;
        if(wOk===true){ S.catMsg='Awesome exploration! 🦉'; sayFeedback(true, hIt); handleCorrect(); }
        else if(wOk===false){
          S.catMsg='Look at the feedback inside the activity and try again! 💪';
          sayFeedback(false, hIt);
          S.fb = buildRichFb(false, hIt, '❌ The activity reported a wrong answer — check the hints and try again!');
          return;
        } else { S.catMsg='Awesome exploration! 🦉'; sayFeedback(true, hIt); handleCorrect(); }
        setTimeout(function(){ advanceQ(); }, 900);
        return;
      }
      if(act==='maudio'){ var mi=items()[i]; if(mi.audioScript) speak(mi.audioScript, S.rate*0.9); ev.stopPropagation(); return; }
      if(act==='msel'){
        var msi=+b.getAttribute('data-i');
        matchState.sel = matchState.sel===msi ? null : msi;
        matchState.wrong=null; matchState.fb=null;
        renderActivity();
        if(matchState.audio){ var mm=items()[msi]; if(mm && mm.audioScript) speak(mm.audioScript, (S.rate||1)*0.92); }
        return;
      }
      if(act==='mright'){
        var mrj=+b.getAttribute('data-i'), mIt=items();
        if(!matchState.sel){ matchState.wrong=[null,mrj]; renderActivity(); return; }
        var mli=matchState.sel, rj=matchState.right[mrj];
        var mok = rj && rj.word===mIt[mli].word;
        if(mok){
          matchState.matched[mli]=mrj; matchState.sel=null; matchState.wrong=null;
          matchState.fb='You matched <b>'+esc(mIt[mli].word)+'</b> with its definition — nice connecting!'; matchState.fbOk=true;
        } else {
          matchState.wrong=[mli,mrj]; matchState.sel=null;
          matchState.fb='Not quite — that pair does not belong together. Listen to the word again and look for the best meaning!'; matchState.fbOk=false;
        }
        renderActivity(); return;
      }
      if(act==='mc'){
        if(S.fb && S.fb.q===S.q) return;
        var mcIt=item(), sel=+b.getAttribute('data-i'), ok = mcIt.options[sel]===mcIt.answer;
        S._hintOpt=null;
        S.fb = buildRichFb(ok, mcIt);
        sayFeedback(ok, mcIt);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='tf'){
        if(S.fb && S.fb.q===S.q) return;
        var tfIt=item(), val=+b.getAttribute('data-v')===1, ok = val===tfIt.isTrue;
        S.fb = buildRichFb(ok, tfIt);
        sayFeedback(ok, tfIt);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='cloze-check'){
        var cIt=item(), blanks=cIt.blanks||[], okCount=0;
        [].forEach.call(root.querySelectorAll('.gap-input'), function(inp, idx){
          var ok = norm(inp.value)===norm(blanks[idx]||'');
          inp.classList.add(ok?'ok':'bad'); inp.disabled=true;
          if(ok) okCount++;
          else if(blanks[idx]){ var sp=document.createElement('span'); sp.className='gap-correct'; sp.innerHTML=' → '+esc(blanks[idx]); inp.parentNode.appendChild(sp); }
        });
        S._hintBlank=false;
        var allOk = okCount===blanks.length && blanks.length>0;
        S.fb = buildRichFb(allOk, cIt, allOk?'🎉 All blanks filled perfectly!':'✏️ You filled '+okCount+' of '+blanks.length+' blanks correctly');
        sayFeedback(allOk, cIt);
        if(allOk) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='scram-push'){
        var sk = scramKey(); if(!sk) return; var st=scramState[sk];
        st.arr.push(st.avail.splice(+b.getAttribute('data-i'),1)[0]); renderActivity(); return;
      }
      if(act==='scram-pop'){
        var sk2 = scramKey(); if(!sk2) return; var st2=scramState[sk2];
        st2.avail.push(st2.arr.splice(+b.getAttribute('data-i'),1)[0]); renderActivity(); return;
      }
      if(act==='scram-check'){
        var sk3 = scramKey(); if(!sk3) return; var st3=scramState[sk3], sIt=item();
        var ok = st3.arr.join(' ').trim() === String(sIt.answer||'').trim();
        st3.revealed=true; st3.isOk=ok; if(!ok) st3.misses=(st3.misses||0)+1;
        sayFeedback(ok, sIt);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='dcheck'){
        var dIt=item(); var ta=$('dict-ta');
        if(S._dictPlayed !== S.q){ speak(dIt.audioScript, S.rate*0.85); S._dictPlayed=S.q; render(); return; }
        var typed=ta.value;
        var ok = norm(typed)===norm(dIt.answer);
        S._dictState={q:S.q,typed:typed,ok:ok};
        sayFeedback(ok, dIt);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='prec'){
        S._proRec=S.q; save(); render();
        setTimeout(function(){ S._proRec=null; S._proSelf=S.q; save(); render(); }, 3000);
        return;
      }
      if(act==='pself'){
        if(S.fb && S.fb.q===S.q) return;
        var pIt=item(), ok=+b.getAttribute('data-v')===1;
        S.fb = buildRichFb(ok, pIt, ok?'🎉 Great job! You said it with confidence!':'💪 Nice try — keep practicing and you\'ll nail it!');
        sayFeedback(ok, pIt);
        if(ok) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='pw'){ usePowerup(b.getAttribute('data-p')); return; }
      if(act==='tapsel'){
        if(S.fb && S.fb.q===S.q) return;
        var tpIt=item(), sel2=+b.getAttribute('data-i'), picked=S._tapOrder[sel2], ok2 = picked===tpIt.answer;
        S._hintTap=false; S._tapOrder=null;
        S.fb = buildRichFb(ok2, tpIt);
        sayFeedback(ok2, tpIt);
        if(ok2) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='tcheck'){
        var trIt=item(), tta=$('trans-ta');
        var typed=tta?tta.value:''; S._typed=typed;
        var ok3 = norm(typed)===norm(trIt.answer);
        S.fb = buildRichFb(ok3, trIt);
        sayFeedback(ok3, trIt);
        if(ok3) handleCorrect(); else handleIncorrect();
        return;
      }
      if(act==='rnext'){
        var rIt=item();
        S.catMsg='Great episode! 🦉'; say(rIt.feedback||'You finished the episode!');
        handleCorrect();
        setTimeout(function(){ advanceQ(); }, 900);
        return;
      }
      if(act==='rline'){
        var li=+b.getAttribute('data-i'), l2=(item().lines||[])[li];
        if(l2){ S._radioLine=li; if(S.tts) speakChar(l2.text, l2.voiceHint, S.rate*0.95); save(); render(); }
        return;
      }
      if(act==='rplay'){ playRadio(true); return; }
      if(act==='rplay-slow'){ playRadio(false); return; }
      if(act==='sline'){
        var si2=+b.getAttribute('data-i'), pp=(item().paragraphs||[])[si2];
        if(pp){ S._storyLine=si2; speak(pp.text, S.rate*0.95); save(); render(); }
        return;
      }
      if(act==='splay'){ playStory(true); return; }
      if(act==='spk'){ var txt=b.getAttribute('data-t'); if(S.tts) speak(txt, S.rate*0.92); return; }
    });
  }
  /* sequential multi-character episode playback (DuoRadio) */
  function playRadio(slow){
    if(!S.tts) return;
    var lines=(item().lines||[]); var rate=slow?0.65:0.95; var i=0;
    function next(){
      if(i>=lines.length){ speakChar('That was DuoRadio! See you next episode!', 'female', rate); return; }
      var l=lines[i]; S._radioLine=i; save(); render();
      var u=new SpeechSynthesisUtterance(l.text); u.rate=rate; u.pitch=S.pitch||1; u.lang='en-US';
      var v=charVoice(l.voiceHint); if(v) u.voice=v; else u.voice=naturalVoice();
      u.onend=function(){ i++; setTimeout(next, 380); };
      idleSpeak(function(){ speechSynthesis.speak(u); });
    }
    next();
  }
  /* sequential story narration */
  function playStory(slow){
    if(!S.tts) return;
    var paras=(item().paragraphs||[]); var rate=slow?0.65:0.95; var i=0;
    function next(){
      if(i>=paras.length){ speak('The end! Now let\'s check what you understood.', S.rate*0.95); return; }
      var p=paras[i]; S._storyLine=i; save(); render();
      var u=new SpeechSynthesisUtterance(p.text); u.rate=rate; u.pitch=S.pitch||1; u.lang='en-US';
      var v=naturalVoice(); if(v) u.voice=v;
      u.onend=function(){ i++; setTimeout(next, 320); };
      idleSpeak(function(){ speechSynthesis.speak(u); });
    }
    next();
  }
  function scramKey(){ return S.phase+'/'+S.activity+'/'+S.q; }
  function buildTimer(){
    if(!S.timeAttack || isWholeSet() || S.phase!=='activity') return;
    var t=10;
    var iv=setInterval(function(){
      if(S.freeze>0){
        S.freeze--;
        var ff=$('timer-fill'), nn=$('timer-num');
        if(ff){ ff.style.width='100%'; ff.style.background='#7dd3fc'; }
        if(nn) nn.textContent='❄️ '+(S.freeze+1)+'s';
        return;
      }
      t--;
      var f=$('timer-fill'), n=$('timer-num');
      if(f){ f.style.width=(t/10*100)+'%'; f.style.background=t>6?'#58CC02':(t>3?'#FF9600':'#FF4B4B'); }
      if(n) n.textContent=t+'s';
      if(t<=0){ clearInterval(iv); S.fb={ok:false,head:'⏱️ Time up!',body:'<p>Don\'t worry — speed comes with practice. Take a breath and go again!</p>'}; handleIncorrect(); }
    },1000);
  }

  // ── slides viewer ──
  function renderSlides(){

    if(S.slideIdx==null) S.slideIdx=0;
    if(S.slideIdx>=slides.length) S.slideIdx=0;
    var sl = slides[S.slideIdx];
    var dots = slides.map(function(_,i){ return '<div class="slide-dot '+(i===S.slideIdx?'on':'')+'"></div>'; }).join('');
    var mode = '<div class="slide-mode"><div><b>🏫 In-Class</b><br>Activities 1-3</div><div><b>📋 Homework</b><br>Activities 4-6</div></div>';
    $('main-slot').innerHTML =
      '<div class="slides-head" style="background:'+esc(sec.colour||'#58CC02')+'">🎯 '+esc(sec.title)+' — Lesson Slides</div>'+
      '<div class="slide-dots">'+dots+'</div>'+
      '<div class="slides-body" style="--sect:'+esc(sec.colour||'#58CC02')+';--sect2:'+esc(sec.colour||'#58cc02')+'cc">'+
        '<div class="slide-top"><span class="slide-num" style="background:'+esc(sec.colour||'#58CC02')+'">'+(S.slideIdx+1)+' / '+slides.length+'</span>'+

        mode+
      '</div>'+

      '<button class="btn btn-primary" data-gact="snext" style="flex:1;background:'+esc(sec.colour||'#58CC02')+';box-shadow:0 4px 0 '+esc(sec.colour||'#58cc02')+'99">'+(S.slideIdx===slides.length-1?'🎮 Start Activities!':'Next →')+'</button></div>';

  function wireGlobal(){
    var root=$('lav2-root');
    root.addEventListener('click', function(ev){
      var b=ev.target.closest('[data-gact]'); if(!b) return;
      var g=b.getAttribute('data-gact');
      if(g==='sread'){ var sec=section(); var sl=(sec.slides||[])[S.slideIdx]; if(sl) speak(sl.heading+'. '+sl.body+(sl.example?'. Example: '+sl.example:''), S.rate*0.95); }
      else if(g==='sprev'){ S.slideIdx--; renderSlides(); }
      else if(g==='snext'){ if(S.slideIdx >= ((section().slides||[]).length-1)) { S.phase='activity'; S.slideIdx=0; render(); } else { S.slideIdx++; renderSlides(); } }
      else      if(g==='goto'){ var si=+b.getAttribute('data-i'); if(si<=S.section){ S.section=si; S.activity=0; S.q=0; S.phase='slides'; S.perfectRun=true; S.slideIdx=0; S.duel=null; S.duelResult=null; render(); } }
      else if(g==='close'){ S.phase='map'; S.showSettings=false; S.fb=null; S.catMsg=''; render(); }
      else if(g==='pw'){ usePowerup(b.getAttribute('data-p')); return; }
      else if(g==='badge'){ S.badgeInfo = b.getAttribute('data-b'); render(); return; }
      else if(g==='badge-close'){ S.badgeInfo = null; render(); return; }
      else if(g==='path-sec'){ var ps=+b.getAttribute('data-i'); if(secUnlocked(ps)){ S.section=ps; S.expandedSection = S.expandedSection===ps ? null : ps; render(); } }
      else if(g==='start-test'){ S.showTest=true; render(); }
      else if(g==='test-exit'){ S.showTest=false; render(); }
      else if(g==='path-start'){ var ps2=+b.getAttribute('data-i'); S.section=ps2; S.activity=0; S.q=0; S.phase='slides'; S.perfectRun=true; S.slideIdx=0; S.duel=null; S.duelResult=null; S.expandedSection=null; render(); }
      else if(g==='path-act'){ var ps3=+b.getAttribute('data-i'), pa=+b.getAttribute('data-a'); if(secUnlocked(ps3)){ S.section=ps3; S.activity=pa; S.q=0; S.phase='activity'; S.perfectRun=true; S.duel=null; S.duelResult=null; S.expandedSection=null; render(); } }
      else if(g==='rev-spk'){ if(S.tts) speak(b.getAttribute('data-t'), S.rate*0.92); }
      else if(g==='next'){ advanceQ(); }
      else if(g==='settings'){ S.showSettings=true; render(); }
      else if(g==='close-settings'){ S.showSettings=false; render(); }

      else if(g==='all-restart'){ S.showAllDone=false; resetGame(); render(); }
      else if(g==='hm-gems'){ if(S.gems>=5){ S.gems-=5; S.hearts=S.maxHearts; S.heartsModal=false; render(); } }
      else if(g==='hm-practice'){ S.hearts=S.maxHearts; S.heartsModal=false; render(); }
      else if(g==='hm-close'){ S.heartsModal=false; render(); }
      else if(g==='tts'){ S.tts=!S.tts; if(!S.tts) try{speechSynthesis.cancel()}catch(e){} save(); render(); }
      else if(g==='sfx'){ S.sfxOn=!S.sfxOn; sfx('tap'); save(); render(); }
      else if(g==='tts-toggle'){ S.tts=!S.tts; if(!S.tts) try{speechSynthesis.cancel()}catch(e){} sfx('tap'); save(); render(); }
      else if(g==='noop'){ sfx('tap'); }
      else if(g==='promo-claim'){ S.gems+=5; S.league=S.promoPending; S.promoPending=null; sfx('promo'); confetti(130); save(); render(); }
      else if(g==='timeattack'){ S.timeAttack=!S.timeAttack; save(); render(); }
      else if(g==='selfstudy'){ S.selfStudy=!S.selfStudy; save(); render(); }
      else if(g==='voice'){ S.voice=b.value; save(); }
      else if(g==='pitch'){ S.pitch=+b.value; save(); }
      else if(g==='rate'){ S.rate=+b.value; save(); }
      else if(g==='buy'){ var ai=+b.getAttribute('data-i'); var acc=ACCS[ai]; if(!acc) return; if(S.gems>=acc[3]){ S.gems-=acc[3]; unlocked[acc[0]]=true; equipped[acc[0]]=true; save(); render(); } }
    });

  function heartsStr(){ var h=''; for(var i=0;i<S.maxHearts;i++) h += i<S.hearts?'❤️':'🖤'; return h; }
  function hudHTML(){
    if(S.phase!=='map'){
      return '<div class="ilbar"><button class="il-x" data-gact="close">✕</button>'+
        '<div class="il-prog"><div class="il-prog-fill" style="width:'+lessonProgPct()+'%"></div></div>'+

  /* parse "She {{w:oke}} up early." → segments for gap inputs */
  function detGaps(text){
    var parts=[], re=/{{([^:}]+):([^}]*)}}/g, last=0, m;

  /* word-level accuracy between spoken transcript and the model answer */
  function asrScore(transcript, model){
    var tw=String(transcript||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/s+/).filter(Boolean);
    var mw=String(model||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').split(/s+/).filter(Boolean);
    if(!mw.length) return null;
    var used={}, hit=0;
    for(var i=0;i<tw.length;i++){ for(var j=0;j<mw.length;j++){ if(!used[j] && tw[i]===mw[j]){ used[j]=1; hit++; break; } } }
    return Math.round(hit/mw.length*100);
  }
