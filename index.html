    <script>

            document.body && document.body.classList.remove('dark');

    <script type="text/javascript">
      window.googleTranslateElementInit = function() {
        new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
      };
      
      // Dynamically load the Google Translate script to prevent blocking page load
      (function() {
        var gtScript = document.createElement('script');
        gtScript.type = 'text/javascript';
        gtScript.src = '//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit';
        gtScript.async = true;
        
        var timeoutId = setTimeout(function() {
          // If the script fails to load within 3 seconds, hide the widget
          var widget = document.getElementById('google_translate_widget');
          if (widget) {
            widget.style.display = 'none';
          }
        }, 3000);

        gtScript.onload = function() {
          clearTimeout(timeoutId);
        };
        
        gtScript.onerror = function() {
          clearTimeout(timeoutId);
          var widget = document.getElementById('google_translate_widget');
          if (widget) {
            widget.style.display = 'none';
          }
        };

        document.head.appendChild(gtScript);
      })();
    </script>
    <script type="text/javascript">
      // Suppress benign WebSocket or Vite HMR connection errors and unhandled rejections
      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason) {
          const msg = event.reason.message || event.reason.toString();
          if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('vite') || msg.includes('connection')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      });
      window.addEventListener('error', function(event) {
        if (event.message) {
          if (event.message.includes('WebSocket') || event.message.includes('websocket') || event.message.includes('vite')) {
            event.preventDefault();
            event.stopPropagation();
          }
        }
      }, true);
    </script>
